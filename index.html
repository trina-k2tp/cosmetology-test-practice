mắt)"], "c": 3, "raw": "Câu 405: Dùng thuốc nhuộm trên chân mày:\nA. Đẹp hơn\nB. Sáng hơn\nC. Mềm mại\nD. Bị mù (Nguy hiểm cho mắt)\nĐáp án đúng: D\n\n", "cat": "lash_brow", "sec": "8. Lông mi và lông mày"}, {"n": 406, "q": "Sau khi dùng thuốc duỗi thẳng tóc và trước khi bỏ thuốc dập, tóc phải được hoàn tất:", "o": ["Chải tóc", "Bỏ thuốc xả", "Xả nước", "Gội đầu"], "c": 2, "raw": "Câu 406: Sau khi dùng thuốc duỗi thẳng tóc và trước khi bỏ thuốc dập, tóc phải được hoàn tất:\nA. Chải tóc\nB. Bỏ thuốc xả\nC. Xả nước\nD. Gội đầu\nĐáp án đúng: C\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 407, "q": "Thời gian tối đa KTV sử dụng máy tần số cao (High frequency) trên da khách sẽ là:", "o": ["3 phút", "5 phút", "10 phút", "15 phút"], "c": 1, "raw": "Câu 407: Thời gian tối đa KTV sử dụng máy tần số cao (High frequency) trên da khách sẽ là:\nA. 3 phút\nB. 5 phút\nC. 10 phút\nD. 15 phút\nĐáp án đúng: B\n\n", "cat": "skincare", "sec": "7. Chăm sóc da"}, {"n": 408, "q": "Việc đầu tiên trong dịch vụ móng tay cơ bản:", "o": ["Làm định hình móng", "Làm mềm da tay", "Làm sạch dưới đầu móng", "Chùi nước sơn cũ"], "c": 3, "raw": "Câu 408: Việc đầu tiên trong dịch vụ móng tay cơ bản:\nA. Làm định hình móng\nB. Làm mềm da tay\nC. Làm sạch dưới đầu móng\nD. Chùi nước sơn cũ\nĐáp án đúng: D\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 409, "q": "Cục đá mài trong dịch vụ móng tay được biết là:", "o": ["1 lần sử dụng (dùng một lần rồi bỏ)", "Nhiều lần sử dụng", "Tùy theo luật salon"], "c": 0, "raw": "Câu 409: Cục đá mài trong dịch vụ móng tay được biết là:\nA. 1 lần sử dụng (dùng một lần rồi bỏ)\nB. Nhiều lần sử dụng\nC. Tùy theo luật salon\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 410, "q": "Cái gì xác định tính di động ít nhất trong một lọn cuộn tóc?", "o": ["Thân tóc / Chân đế (Base)", "Nửa thân tóc", "Không có", "Cuộn cực đại"], "c": 0, "raw": "Câu 410: Cái gì xác định tính di động ít nhất trong một lọn cuộn tóc?\nA. Thân tóc / Chân đế (Base)\nB. Nửa thân tóc\nC. Không có\nD. Cuộn cực đại\nĐáp án đúng: A\n\n", "cat": "styling", "sec": "3. Tạo kiểu tóc"}, {"n": 411, "q": "Thuật ngữ trượt (Slithering) được sử dụng để ám chỉ quá trình:", "o": ["Cuốn tóc", "Làm mỏng tóc (Thinning)", "Làm gợn sóng tóc bằng ngón tay", "Cắt đuôi tóc xoăn"], "c": 1, "raw": "Câu 411: Thuật ngữ trượt (Slithering) được sử dụng để ám chỉ quá trình:\nA. Cuốn tóc\nB. Làm mỏng tóc (Thinning)\nC. Làm gợn sóng tóc bằng ngón tay\nD. Cắt đuôi tóc xoăn\nĐáp án đúng: B\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 412, "q": "Khuôn mặt hình trái xoan, chiều ngang sẽ đi qua đâu?", "o": ["Xương gò má", "Xương thái dương", "Xương hốc mắt"], "c": 0, "raw": "Câu 412: Khuôn mặt hình trái xoan, chiều ngang sẽ đi qua đâu?\nA. Xương gò má\nB. Xương thái dương\nC. Xương hốc mắt\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 413, "q": "Việc đầu tiên mà nhân viên thẩm mỹ nên quan tâm là:", "o": ["Sự bảo vệ cho khách hàng", "Thời gian", "Tiền thưởng từ khách hàng", "Tiền thù lao"], "c": 0, "raw": "Câu 413: Việc đầu tiên mà nhân viên thẩm mỹ nên quan tâm là:\nA. Sự bảo vệ cho khách hàng\nB. Thời gian\nC. Tiền thưởng từ khách hàng\nD. Tiền thù lao\nĐáp án đúng: A\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 414, "q": "Không làm dịch vụ nào cho khách hàng bị viêm khớp?", "o": ["Cắt da tay", "Massage nhẹ", "Massage mạnh / Bẻ khớp gắt", "Không nhận dịch vụ"], "c": 2, "raw": "Câu 414: Không làm dịch vụ nào cho khách hàng bị viêm khớp?\nA. Cắt da tay\nB. Massage nhẹ\nC. Massage mạnh / Bẻ khớp gắt\nD. Không nhận dịch vụ\nĐáp án đúng: C\n\n", "cat": "skincare", "sec": "7. Chăm sóc da"}, {"n": 415, "q": "Kiểm tra nhiệt độ bàn là ép nhiệt (dụng cụ nhiệt) sẽ được thực hiện như thế nào?", "o": ["Lụa", "Bàn tay", "Khăn giấy", "Làm trực tiếp"], "c": 2, "raw": "Câu 415: Kiểm tra nhiệt độ bàn là ép nhiệt (dụng cụ nhiệt) sẽ được thực hiện như thế nào?\nA. Lụa\nB. Bàn tay\nC. Khăn giấy\nD. Làm trực tiếp\nĐáp án đúng: C\n\n", "cat": "styling", "sec": "3. Tạo kiểu tóc"}, {"n": 416, "q": "Triệu chứng mà có thể cảm nhận như ngứa hoặc đau:", "o": ["Chủ quan (Subjective symptom)", "Khách quan (Objective symptom)", "Vết thương", "Vết nứt"], "c": 0, "raw": "Câu 416: Triệu chứng mà có thể cảm nhận như ngứa hoặc đau:\nA. Chủ quan (Subjective symptom)\nB. Khách quan (Objective symptom)\nC. Vết thương\nD. Vết nứt\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 417, "q": "Môn học về tóc và bệnh của tóc:", "o": ["Trichology (Mao học / Khoa học nghiên cứu về tóc)", "Biology (Sinh học)", "Dermatology (Da liễu học)", "Cosmetology (Thẩm mỹ học)"], "c": 0, "raw": "Câu 417: Môn học về tóc và bệnh của tóc:\nA. Trichology (Mao học / Khoa học nghiên cứu về tóc)\nB. Biology (Sinh học)\nC. Dermatology (Da liễu học)\nD. Cosmetology (Thẩm mỹ học)\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 418, "q": "Độ pH bằng 9 có tính kiềm (Alkaline) hơn pH 7 là bao nhiêu lần?", "o": ["10", "50", "100", "500"], "c": 2, "raw": "Câu 418: Độ pH bằng 9 có tính kiềm (Alkaline) hơn pH 7 là bao nhiêu lần?\nA. 10\nB. 50\nC. 100\nD. 500\nĐáp án đúng: C\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 419, "q": "Độ pH của xà bông có Acid xếp loại từ:", "o": ["1.3", "2.5", "3.7", "4.5 – 5.5"], "c": 3, "raw": "Câu 419: Độ pH của xà bông có Acid xếp loại từ:\nA. 1.3\nB. 2.5\nC. 3.7\nD. 4.5 – 5.5\nĐáp án đúng: D\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 420, "q": "Tác dụng của hóa chất duỗi tóc là làm cho tóc:", "o": ["Cứng và săn chắc", "Thẳng và mềm", "Mềm và trương nở (Softens and swells)", "Mềm và thẳng"], "c": 2, "raw": "Câu 420: Tác dụng của hóa chất duỗi tóc là làm cho tóc:\nA. Cứng và săn chắc\nB. Thẳng và mềm\nC. Mềm và trương nở (Softens and swells)\nD. Mềm và thẳng\nĐáp án đúng: C\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 421, "q": "Trước và sau khi phục vụ khách hàng thì cần rửa tay bằng nước ấm và xà phòng trong thời gian", "o": ["10 giây", "20 giây", "30 giây", "40 giây"], "c": 1, "raw": "Câu 421: Trước và sau khi phục vụ khách hàng thì cần rửa tay bằng nước ấm và xà phòng trong thời gian\nA. 10 giây\nB. 20 giây\nC. 30 giây\nD. 40 giây\nĐáp án đúng: B\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 422, "q": "Nhiệt độ ngâm chân sẽ không quá:", "o": ["100°F", "104°F (khoảng 40°C)", "140°F", "165°F"], "c": 1, "raw": "Câu 422: Nhiệt độ ngâm chân sẽ không quá:\nA. 100°F\nB. 104°F (khoảng 40°C)\nC. 140°F\nD. 165°F\nĐáp án đúng: B\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 423, "q": "Dung dịch Acetone được biết là chất hòa tan có tên gọi:", "o": ["Dung môi (Solvent)", "Thuốc tẩy rửa", "Dung hòa", "Thuốc giặt"], "c": 0, "raw": "Câu 423: Dung dịch Acetone được biết là chất hòa tan có tên gọi:\nA. Dung môi (Solvent)\nB. Thuốc tẩy rửa\nC. Dung hòa\nD. Thuốc giặt\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 424, "q": "Khi vi khuẩn ở thời kỳ nghỉ ngơi (không hoạt động) sẽ được biết là:", "o": ["Bào tử (Spores)", "Vi khuẩn", "Gián phân", "Nhị phân"], "c": 0, "raw": "Câu 424: Khi vi khuẩn ở thời kỳ nghỉ ngơi (không hoạt động) sẽ được biết là:\nA. Bào tử (Spores)\nB. Vi khuẩn\nC. Gián phân\nD. Nhị phân\nĐáp án đúng: A\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}], "outline": {"safety": ["A. Quy trình kiểm soát nhiễm khuẩn nơi làm việc", "1. Bệnh truyền nhiễm, tác nhân gây bệnh và phòng ngừa lây nhiễm", "• Contagious / Communicable disease: Bệnh truyền nhiễm lây từ người sang người.", "• Local infection: Nhiễm trùng khu trú.", "• Parasite: Ký sinh trùng; ví dụ điển hình là chấy rận (head lice).", "• Immunity: Miễn dịch gồm 2 loại: tự nhiên và nhân tạo.", "• HIV: Human Immunodeficiency Virus.", "• HBV: Hepatitis B Virus.", "• TB: Tuberculosis.", "• Chấy rận hoặc nấm da/nấm móng: từ chối dịch vụ; khi cần khuyên khách đi khám bác sĩ.", "• Ống thông gió/máy hút mùi giúp giảm lượng khí độc và bụi hít phải trong salon.", "2. Các phương pháp và quy trình làm sạch và khử trùng", "• Cleaning / Sanitizing: Làm sạch bằng xà phòng và nước ấm; là bước đầu tiên để chất khử trùng hoạt động hiệu quả.", "• Disinfection: Khử trùng bề mặt không thấm/không sống; loại bỏ hầu hết vi sinh vật nhưng không diệt bào tử; không dùng trực tiếp trên da.", "• Sterilization: Tiệt trùng bằng Autoclave, dùng nhiệt + nước/hơi/áp suất; diệt tất cả vi sinh vật kể cả bào tử.", "• Decontamination: Khử nhiễm - loại bỏ chất bẩn/mầm bệnh như máu, dịch trên bề mặt/dụng cụ.", "• Antiseptic: Chất sát trùng dùng trên da, làm chậm sự phát triển vi khuẩn; không thay thế khử trùng dụng cụ.", "• Aseptic: Kỹ thuật vô trùng/duy trì môi trường không có mầm bệnh.", "a. Dụng cụ bị nhiễm bẩn", "• Dụng cụ dơ để trong thùng riêng có nắp và dán nhãn “Soiled”.", "• Kềm cắt da/kềm cắt móng và dụng cụ dùng lại phải được làm sạch/khử trùng sau mỗi khách.", "• Dụng cụ dính máu phải xử lý theo quy trình phơi nhiễm; vật dụng dính máu bỏ vào 2 túi nylon và dán nhãn.", "b. Máy móc và thiết bị", "• Không ngâm đồ điện trong dung dịch khử trùng.", "• Thiết bị phải được sử dụng và bảo trì theo hướng dẫn của nhà sản xuất.", "c. Khu vực làm việc hằng ngày", "• Bề mặt làm việc cần được làm sạch/khử trùng theo quy trình salon; Household bleach có thể được xem là chất khử trùng.", "3. Các cấp độ khử trùng: làm sạch → khử khuẩn → tiệt trùng", "• Thứ tự 3 bước: Làm sạch → Khử trùng → Tiệt trùng.", "• Chất khử trùng salon có thể diệt vi khuẩn, virus và nấm nhưng không diệt bào tử.", "• Tiệt trùng là mức cao nhất; Autoclave diệt được tất cả vi sinh vật kể cả bào tử.", "4. Xử lý sự cố phơi nhiễm", "• Khi thợ hoặc khách chảy máu: Ngừng dịch vụ → rửa tay bằng xà phòng và nước ấm → đeo găng tay → sát khuẩn/khử nhiễm đúng cách → bỏ vật dụng dính máu vào 2 túi nylon, dán nhãn → khử trùng khu vực/dụng cụ → viết báo cáo sự cố.", "• OSHA: Cơ quan quản lý sức khỏe và an toàn cho người lao động.", "• CDC: Centers for Disease Control and Prevention; chịu trách nhiệm về các biện pháp phòng ngừa tiêu chuẩn.", "• PPE: Personal Protective Equipment - đồ bảo hộ cá nhân.", "5. Các sản phẩm dùng để làm sạch và khử trùng", "• QUATS: Quaternary Ammonium Compound - chất khử trùng phổ biến trong salon; thay dung dịch mỗi ngày hoặc khi bẩn/vẩn đục; dụng cụ phải được làm sạch trước khi ngâm. Nếu dính da, rửa bằng xà phòng và nước ấm.", "• Household bleach: Thuốc tẩy gia dụng; được xem là một loại chất khử trùng.", "• Chất khử trùng dùng trong salon phải được EPA phê duyệt; thời gian ngâm theo đúng hướng dẫn của nhà sản xuất.", "6. Ghi nhãn và bảo quản dụng cụ, thiết bị đã được làm sạch và khử trùng", "• Dụng cụ sạch sau khử trùng/tiệt trùng phải bảo quản trong hộp/thùng sạch có nắp đậy.", "• Thùng khử trùng phải đủ lớn để ngâm chìm hoàn toàn dụng cụ.", "7. Vật dụng dùng một lần và dùng nhiều lần", "• Disposable / Single-use: Vật liệu xốp/dùng một lần; dùng xong phải hủy, không tái sử dụng/khử trùng.", "• Không ngâm vật liệu có lỗ/thấm hút như vải, bông trong dung dịch khử trùng.", "• Dụng cụ dùng nhiều lần phải được làm sạch và khử trùng sau mỗi khách.", "B. Tuân thủ các biện pháp phòng ngừa an toàn tại nơi làm việc", "1. Các quy trình để duy trì điều kiện làm việc an toàn", "• Thực hiện đúng hướng dẫn của nhà sản xuất; duy trì khu vực làm việc sạch, có thông gió và phân loại dụng cụ sạch/dơ rõ ràng.", "3. Sử dụng thiết bị an toàn và các quy trình bảo trì", "• Không ngâm đồ điện; thiết bị nhiệt phải được kiểm soát nhiệt và tránh tiếp xúc gây bỏng da đầu/da khách.", "4. Ghi nhãn và bảo quản vật liệu và hóa chất", "• Dụng cụ dơ dán nhãn “Soiled”; hóa chất và vật liệu dùng theo hướng dẫn của nhà sản xuất.", "• Không dùng vật liệu kim loại để pha/đựng hóa chất khử trùng hoặc hóa chất uốn/duỗi.", "5. Bảng dữ liệu an toàn (SDS) và các vật liệu/chất bị cấm", "• SDS / MSDS: Bảng dữ liệu an toàn sản phẩm/hóa chất; cho biết thành phần, mối nguy hiểm, xử lý, bảo quản và sơ cứu khi tiếp xúc. Không có ngày hết hạn và thông tin bao bì. Lấy từ nhà sản xuất/nhà phân phối và phải luôn có tại nơi làm việc.", "• MMA (Methyl Methacrylate): Chất bị cấm sử dụng; Liquid MMA bị FDA cấm trong sản phẩm làm móng bột.", "• EMA: Ethyl Methacrylate.", "6. Các quy định an toàn liên bang", "• OSHA: Quản lý sức khỏe và an toàn người lao động.", "• EPA: Quản lý hóa chất, bảo vệ môi trường và phê duyệt chất khử trùng; thuộc Chính phủ liên bang.", "• FDA: Cơ quan quản lý thực phẩm và dược phẩm.", "7. Xác định các phản ứng bất lợi đối với hóa chất", "• Thử phản ứng dị ứng (Patch/PD test), chống chỉ định và dừng/thay đổi dịch vụ khi có nguy cơ.", "8. Rào chắn bảo vệ và tấm che cho khách hàng", "• Khi nhuộm tóc, dùng choàng nylon không thấm nước và 2 khăn.", "• Khi dùng đèn soi da, che mắt khách bằng 2 miếng cotton/miếng vải; khoảng 2 × 2 inch.", "9. Thông gió đúng cách", "• Ống thông gió/máy hút mùi trong salon giúp giảm khí độc và bụi hít phải; khu vực làm móng cần kiểm soát bụi mịn.", "C. Thuật ngữ sản phẩm & hướng dẫn", "• Manufacturer: nhà sản xuất.", "• Manufacturer direction: hướng dẫn/chỉ dẫn của nhà sản xuất.", "• OTC: sản phẩm bán không cần toa thuốc."], "consult": ["A. Tư vấn khách hàng", "1. Tiếp nhận thông tin khách hàng và mẫu đơn đồng ý để xác định chống chỉ định", "• Intake Form / Consultation Card: Mẫu nhập thông tin và tiền sử khách hàng, điền trước khi làm dịch vụ.", "• Release Form: Mẫu khách hàng ký trước dịch vụ để ghi nhận rủi ro/giải trừ trách nhiệm.", "• Trước bất kỳ dịch vụ nào: tham vấn/tư vấn khách để hiểu nhu cầu và phát hiện chống chỉ định có thể xảy ra.", "• Hồ sơ khách hàng phải được lập chính xác và lưu kèm các mẫu đơn đã ký trước dịch vụ.", "2. Từ chối hoặc thay đổi dịch vụ dựa trên chống chỉ định", "• Chấy rận, nấm da/nấm móng hoặc vảy nến nặng: không thực hiện dịch vụ; khuyên khách đi khám khi cần.", "• Khách dùng Accutane: không wax; nếu cần tẩy lông chỉ dùng nhíp.", "• Khách dùng thuốc loãng máu: tránh các dịch vụ có nguy cơ cắt da/chảy máu.", "3. Khuyến nghị khách hàng tìm kiếm tư vấn y tế", "• Khách có mụn trứng cá: nên khuyên gặp bác sĩ tư vấn điều trị trước khi làm dịch vụ.", "• Khách nghi ngờ nấm hoặc có tình trạng da/móng bất thường: dừng hoặc từ chối dịch vụ và khuyên đi khám khi cần.", "• Đạo đức nghề nghiệp: không tiết lộ thông tin khách hàng với đồng nghiệp; nếu sắp chuyển salon, thông báo cho khách trước một khoảng thời gian thích hợp.", "B. Tóc, da và móng", "1. Cấu trúc tóc, da và móng", "Tóc", "• Cuticle: Lớp biểu bì ngoài cùng; nước thấm vào trước tiên; cần mở để hóa chất thấm vào tóc.", "• Cortex: Lớp vỏ/trung bì; quyết định độ đàn hồi, độ chắc; phần lớn phản ứng uốn/duỗi/nhuộm xảy ra ở đây.", "• Medulla: Lớp tủy trong cùng.", "• Keratin / Protein: Thành phần cấu trúc cốt lõi của tóc; khoảng 95% sợi tóc.", "• COHNS: Carbon, Oxygen, Hydrogen, Nitrogen, Sulfur.", "• Disulfide bond (S-S): Liên kết lưu huỳnh kép; bị phá vỡ/tái tạo khi uốn, duỗi.", "• Hydrogen bond: Liên kết bị phá vỡ khi tạo kiểu tóc còn ẩm; tính chất tạm thời.", "• PH tóc khỏe mạnh: khoảng 4.5-5.5, hơi acid. Tóc ướt khỏe có thể kéo giãn thêm khoảng 50%.", "• Thời kỳ mọc tóc: khoảng 3-5 năm.", "Da", "• Biểu bì (Epidermis) gồm 5 lớp từ ngoài vào trong: Corneum → Lucidum → Granulosum → Spinosum → Germinativum/Basale.", "• Sebum: Dầu tự nhiên của da.", "• Sebaceous gland: Tuyến dầu nằm ở Dermis.", "• Sweat gland: Tuyến mồ hôi nằm ở Dermis.", "• Melanin: là yếu tố tạo sắc tố cho da/tóc.", "• PH da khỏe mạnh khoảng 4.5-5.5; da khô do tuyến dầu hoạt động yếu, da dầu thường có lỗ chân lông to.", "• Lòng bàn tay và lòng bàn chân không có lông; da là bộ phận lớn nhất trên cơ thể người.", "Móng", "• Keratin: Thành phần chính cấu tạo móng.", "• Hyponychium: Da dưới đầu móng, hàng rào bảo vệ ngăn vi khuẩn xâm nhập.", "• Eponychium: Lớp da bảo vệ liềm móng.", "• Nail fold: Nếp da bao quanh hai bên móng.", "2. Phân tích tóc, da và móng", "Phân tích tóc", "• Porosity: Độ thẩm thấu/độ xốp - khả năng tóc hút ẩm.", "• Tóc porous / xốp cao: Thấm hút nhanh; brittle, khô, dễ gãy, cuticle nhô lên.", "• Tóc xốp thấp: Ít thấm hóa chất và khó hấp thu sản phẩm hơn.", "• Elasticity: Độ đàn hồi; được kiểm tra trước các dịch vụ hóa chất.", "• Canities: Tóc bạc.", "• Tóc nhuộm thường xốp và thấm nhanh; tóc xốp lên màu nhanh.", "• Tóc khô, giòn: sản phẩm pH quá cao hoặc dùng quá nhiều chất tẩy.", "Phân tích da", "• Da khô: tuyến bã nhờn hoạt động yếu. Da dầu: tuyến dầu hoạt động mạnh, lỗ chân lông to.", "• Da sậm màu thường có xu hướng nhiều dầu hơn; da sáng màu dễ biểu hiện dấu hiệu lão hóa sớm hơn.", "• Hypertrichosis: Chứng rậm lông.", "Phân tích móng", "• Trước dịch vụ móng phải kiểm tra móng và da xung quanh; nếu nghi ngờ bệnh hoặc nấm thì không tiếp tục dịch vụ.", "3. Lựa chọn dịch vụ phù hợp dựa trên tình trạng tóc, da và móng", "• Tóc xốp/đã qua hóa chất: cần cân nhắc độ thẩm thấu và độ đàn hồi trước dịch vụ hóa chất.", "• Da khô phù hợp các sản phẩm giữ ẩm; Clay mask dùng cho da dầu và không dùng cho da khô/rất khô.", "• Móng yếu/giòn cần thao tác nhẹ; Eggshell nail dùng dũa mịn.", "C. Phản ứng phụ, bệnh lý và chống chỉ định", "1. Quy trình xét nghiệm phản ứng dị ứng (PD / Patch Test)", "• PD / Patch Test có hai cách hỏi trong bộ đề: thử dị ứng sau tai hoặc nếp gấp khuỷu tay trước 24-48 giờ; hoặc dùng để kiểm tra độ mạnh của thuốc và thời gian xử lý.", "2. Các tình trạng và rối loạn tóc và da đầu", "• Alopecia Areata: Rụng tóc từng vùng/mảng.", "• Tóc xoăn tự nhiên có xu hướng mọc không cùng chiều.", "• Tóc mai: không có hắc tố và không có lõi.", "3. Các bệnh và rối loạn về da", "• Asteatosis: Da khô do giảm tiết bã nhờn; có thể khô ráp, nứt nẻ.", "• Psoriasis: Vảy nến; da khô, bong tróc, mảng đỏ có vảy bạc.", "• Callus / Keratoma: Da chai do ma sát nhiều lần.", "• Boil: Mụn nhọt do nang lông bị nhiễm khuẩn.", "• Pustule: Mụn có mủ/chất lỏng bên trong.", "• Cyst: U nang - cục u bất thường chứa nước/dịch bên trong.", "• Da bị trầy xước có thể để lại sẹo; có thể có bọng nước tùy mức độ.", "• Bài tiết mồ hôi không đủ: giảm tiết mồ hôi. Chất thơm (fragrance): là thành phần gây nhiều nhạy cảm trên da.", "4. Các bệnh và rối loạn về móng", "• Nail pterygium: Da/màng thịt mọc lấn lên bề mặt móng.", "• Beau’s line: Rãnh/sọc ngang trên móng.", "• Bruised nail: Móng bầm, tụ máu dưới nền móng.", "• Eggshell nail: Móng mỏng, trắng, mềm, dễ gãy; dùng dũa mịn.", "• Brittle nail: Móng giòn, dễ gãy; có thể liên quan đến chất tẩy hoặc di truyền; chăm sóc bằng hot oil.", "• Hang nail / Agnail: Xước măng rô quanh móng.", "6. Chống chỉ định đối với dịch vụ làm móng tay và móng chân", "• Khách dùng thuốc loãng máu: tránh dịch vụ có nguy cơ cắt da/chảy máu.", "• Nấm móng hoặc dấu hiệu bệnh truyền nhiễm: từ chối dịch vụ.", "• Khách tiểu đường khi làm móng: không cắt da/cuticle; được đẩy nhẹ cuticle.", "7. Chống chỉ định đối với các dịch vụ nối móng", "• Nấm móng/tổn thương hoặc dấu hiệu nhiễm trùng: không thực hiện dịch vụ.", "D. Dầu gội, dầu xả & nước", "• Dầu gội: thành phần chính là nước và Surfactant (chất hoạt động bề mặt).", "• Dầu gội tốt / Acid Balanced: pH 4.5-5.5; giúp tóc sau hóa chất bớt khô và hỗ trợ đóng lớp biểu bì.", "• Clarifying shampoo: chứa chất chelating, giúp loại kim loại và tạp chất bám trên tóc; có thể dùng định kỳ/hàng tuần theo nhu cầu.", "• Moisturizing shampoo: hỗ trợ giữ ẩm, tăng độ mềm và đàn hồi của tóc.", "• Medicated shampoo: dầu gội trị gàu.", "• Neutralizing shampoo: dùng sau dịch vụ duỗi để đưa pH tóc và da đầu về gần mức bình thường.", "• Conditioner: giúp giữ ẩm và làm mềm tóc.", "• Detangling rinse: thuốc xả giúp tóc trơn mượt và giảm rối.", "• Humectant: chất hút/giữ ẩm, giúp duy trì nước cho tóc và da.", "• Soft water: ít khoáng chất, tạo nhiều bọt; tốt hơn cho tóc.", "• Hard water: nhiều khoáng chất/tạp chất, ít bọt; không tốt cho tóc. Nước phèn thuộc nhóm nước cứng.", "• Tóc khỏe: mềm và linh hoạt."], "styling": ["A. Các quy trình tạo kiểu tóc", "1. Quy trình tạo kiểu tóc xoăn", "a. Gắn tóc nối, bảo dưỡng và tháo gỡ tóc nối", "• Fusion / Bonding: Nối tóc dùng nhiệt và dụng cụ chuyên biệt.", "• Bonding method: Gắn tóc rời bằng chất kết dính/keo.", "• Hair weave: Nối tóc trong đó phần gốc các sợi được đan xen.", "b. Tóc xoăn chặt", "• Khi cắt/kiểm soát tóc quăn, dùng lực/tension tối thiểu hoặc vừa phải.", "c. Tết tóc", "• Rope braid: Kiểu bện dây thừng - 2 sợi xoắn vào nhau.", "2. Quy trình nối tóc, thay thế tóc và làm đẹp tóc", "• Synthetic hair: Không chịu nhiệt độ cao.", "• Tóc giả bằng tóc thật: khi dùng nhiệt nên dùng mức thấp.", "• Bandana: dùng để bọc/giữ tóc giả.", "• Kiểm tra tóc giả: dùng wind test để đánh giá độ tự nhiên.", "• Cắt tóc giả: mục tiêu là làm tóc trông tự nhiên/thực tế hơn.", "• Mũi khâu quấn quanh kim 2 lần: khâu khóa đôi.", "• Tóc giả Ấn Độ thường có dạng gợn sóng.", "3. Quy trình sấy tóc", "• Chải/gỡ tóc rối bằng lược răng thưa; bắt đầu từ ngọn tóc, vùng sau/gáy.", "• Khi sấy: dùng lược nhựa cứng; Flat brush dùng để làm phẳng tóc.", "• Máy sấy phải di chuyển để tránh làm da đầu/tóc quá nóng hoặc bỏng.", "• Diffuser: Khuếch tán luồng khí khi sấy, giúp sấy nhanh và kiểm soát vùng tóc.", "4. Quy trình uốn nhiệt", "• Marcel iron: Kẹp uốn kim loại truyền thống dùng để tạo Marcel wave; phải kiểm soát nhiệt để tránh làm bỏng tóc và da đầu.", "• Electric curling iron: Máy uốn điện, tự làm nóng và có nút chỉnh nhiệt.", "B. Dụng cụ tạo kiểu tóc", "1. Phòng ngừa khi sử dụng dụng cụ tạo kiểu bằng nhiệt", "• Lược kim loại truyền và giữ nhiệt; không nên dùng gần da đầu khi sấy/ép nóng.", "• Dụng cụ nhiệt phải tránh làm bỏng da đầu; máy sấy cần di chuyển liên tục.", "• Tóc giả tổng hợp không chịu nhiệt cao; tóc giả từ tóc thật dùng nhiệt thấp.", "C. Sản phẩm & bảo vệ khi tạo kiểu", "• Thermal protector: dùng để bảo vệ tóc trước khi sử dụng dụng cụ nhiệt.", "• Tóc bông xù/khó kiểm soát có thể dùng dầu dưỡng hoặc leave-in conditioner để làm mềm và kiểm soát xù.", "• Khi sấy tóc phải hướng luồng khí ra khỏi da đầu và di chuyển máy sấy để tránh quá nóng.", "• Không dùng lược kim loại sát da đầu khi tạo kiểu nhiệt vì kim loại truyền và giữ nhiệt.", "• Chải/gỡ tóc rối bằng lược răng thưa, bắt đầu từ ngọn rồi tiến dần lên."], "haircut": ["A. Các quy trình cắt tóc", "1. Các bước cắt tóc cho các loại tóc khác nhau", "Góc cắt và hình dáng", "• Blunt cut / One-length / 0°: Kiểu Bob/cắt ngang, không tạo tầng; cắt dưới ngón tay, giữ trọng lượng tóc. palm-to-palm và cổ tay thẳng.", "• 45° / Graduated: Tạo tầng thấp, có độ dốc; kiểu ngắn ở gáy, dài dần lên.", "• 90° / Uniform layer: Tạo tầng đồng lớp, độ phồng cao, các phần tóc cắt đồng đều.", "• 180° / Long layer: Tầng cao/cắt lộn ngược; tạo nhiều độ phồng ở đỉnh và vẫn giữ độ dài phần đuôi.", "• Taper: Kiểu vuốt thon có độ dốc, phù hợp nhiều dáng đầu.", "• Stationary guideline: Đường chuẩn không di động.", "• Traveling guideline: Đường chuẩn di động; dùng để tạo layer/đồng lớp.", "• Guideline: Tép tóc có chiều dài làm chuẩn để cắt các phần khác.", "• Đường cắt chu vi bên ngoài thể hiện trọng lượng (weight) của tóc.", "• Muốn tăng cảm giác độ dày: Blunt cut. Muốn giảm độ dày: dùng Thinning shears.", "• Over-direction: Kỹ thuật chuyển hướng tóc để điều chỉnh trọng lượng và hình dáng tóc.", "Texture và hoàn thiện", "• Thinning shears: Làm mỏng/lấy bớt độ dày, thêm chuyển động và độ mềm mại.", "• Texturizing shears: Lấy bớt độ dày, tạo cảm giác mềm mại.", "• Free-hand slicing / sliding: Kỹ thuật trượt tạo sự mềm mại cho đuôi tóc.", "• Razor: Dùng khi tóc ướt; tạo đuôi tóc mềm mại, tự nhiên.", "• Shears: cắt bằng kéo thực hiện trên tóc khô.", "• Clipper: Tạo đường viền sắc nét; kiểu ngắn gáy, dài dần lên.", "• Trimmer: Tạo đường nét sắc ở tai/gáy, lấy tóc thừa quanh viền.", "• Cross-check: Kiểm tra độ cân bằng sau khi cắt.", "• Beveled: chỉ cắt ở phần đuôi tóc.", "• Point cutting / thinning: Dùng để làm mềm đuôi tóc.", "• Trước khi cắt: chia tóc thành 4-5 phần để dễ kiểm soát.", "• Tóc khô cứng: không cắt quá ngắn ở đỉnh đầu. Tóc quăn: dùng lực/tension tối thiểu hoặc vừa phải.", "B. An toàn dụng cụ và thiết bị", "1. Sử dụng an toàn kéo, dao cạo, tông đơ và máy tỉa", "• Palm the shears: cầm kéo và lược trong cùng một tay/lòng bàn tay.", "• Ngón cái vào lỗ kéo di động và di chuyển nhiều nhất; ngón áp út vào lỗ cố định.", "• Đút ngón cái quá sâu: làm độ mở kéo ít đi.", "• Cầm kéo dựng đứng: giúp tóc không bị mất kiểm soát.", "• Dao cạo dùng trên tóc ướt. Tông đơ/trimmer dùng tạo đường viền và vùng tai/gáy.", "C. Kỹ thuật bổ sung", "• Free-hand sliding / slicing: kỹ thuật trượt kéo để làm mềm và tạo chuyển động cho đuôi tóc.", "• Trim / edge: giảm khối lượng và làm mềm/blend đường cắt.", "• Hairline phía trước có thể chia tách theo hình tam giác khi cần kiểm soát phần tóc trước.", "• Nếu hai lưỡi kéo đặt bằng nhau không đúng kỹ thuật, đường cắt có thể không đều.", "• Cross-check: kiểm tra lại tóc sau cắt theo hướng khác để đánh giá độ cân bằng."], "color": ["A. Áp dụng", "1. Hướng dẫn sử dụng hóa chất nhuộm tóc cho mọi loại tóc", "• Temporary: Phủ ngoài Cuticle, không cần Developer, tồn tại khoảng 1 lần gội.", "• Semi-permanent: Không cần Developer; thấm nhẹ vào tóc, phai dần sau khoảng 4-6 lần gội và không phủ tóc bạc hoàn toàn.", "• Demi-permanent: Dùng Developer nồng độ thấp (10 volume), giữ lâu hơn Semi khoảng 4-6 tuần; deposit màu, không lift; phủ tóc bạc tốt hơn Semi.", "• Permanent color: Dùng Developer (Hydrogen Peroxide) với Ammonia hoặc chất thay thế; vừa nâng sáng vừa đưa màu vào tóc và có thể phủ tóc bạc hoàn toàn.", "• Developer / H₂O₂: Chất xúc tác/phát triển màu; cũng dùng trong làm sáng tóc.", "• Tint back: Nhuộm trở lại gần màu nguyên thủy.", "• Toner: Dùng sau khi tẩy để làm đều/trung hòa màu.", "• Filler: Cân bằng độ thẩm thấu của tóc để hỗ trợ màu đều.", "2. Mục đích và quy trình của việc kiểm tra sợi tóc", "• Strand test: thử một lọn tóc để kiểm tra màu/thời gian xử lý trước khi xả toàn bộ.", "3. Chuẩn bị tóc và da đầu", "• Virgin color: bắt đầu ở giữa thân tóc/phần khó thấm, cách da đầu khoảng 1/2 inch; sau đó mới xử lý chân/ngọn theo quy trình.", "• Virgin bleach: cách da đầu khoảng 1/2 inch.", "• Retouch: chỉ bôi phần tóc mới mọc; không chồng lên phần đã nhuộm/tẩy để tránh hư tổn/gãy tóc.", "B. Sử dụng hóa chất và sản phẩm an toàn", "1. Pha hóa chất tóc và các biện pháp an toàn", "• Thuốc nhuộm có thể được chứa và bôi bằng chai nhựa phù hợp.", "• Bảo hộ khi nhuộm: choàng nylon không thấm nước và dùng 2 khăn.", "2. Quy trình áp dụng và sử dụng thuốc nhuộm an toàn", "• Tóc đã qua xử lý hóa chất/tóc xốp thấm nhanh; cần đánh giá porosity và tình trạng tóc trước khi dùng hóa chất.", "• Metallic dye: có thể cho màu đục/ánh kim; không nên xử lý uốn/duỗi trên tóc này.", "3. Quy trình sử dụng an toàn các sản phẩm tẩy sáng tóc", "• Tẩy/làm sáng sử dụng Developer (Hydrogen Peroxide). Retouch không chồng lên phần tóc đã tẩy để tránh gãy.", "• Double process: tẩy/làm sáng + toner/trung hòa.", "• Foiling: bọc tóc trong giấy bạc. Balayage: tẩy/làm sáng tự do, không cần giấy bạc.", "4. Lý thuyết màu sắc, công thức pha chế và sản phẩm", "• Primary colors: Đỏ, Vàng, Xanh dương.", "• Secondary colors: Cam, Xanh lá, Tím - pha từ 2 màu cơ bản.", "• Tertiary colors: pha 1 màu cơ bản với 1 màu thứ cấp liền kề, ví dụ đỏ-cam, vàng-cam, vàng-lục, xanh dương-lá, xanh dương-tím, đỏ-tím.", "• Complementary colors: hai màu đối diện nhau trên bánh xe màu; dùng trung hòa tông màu không mong muốn.", "• Eumelanin: sắc tố nâu/đen. Pheomelanin: sắc tố đỏ/vàng.", "C. Màu bổ sung", "• Ba màu cơ bản: Đỏ - Vàng - Xanh dương.", "• Ba màu thứ cấp: Cam - Xanh lá - Tím.", "• Màu bổ sung (Complementary) là các màu đối diện nhau trên bánh xe màu: Đỏ ↔ Xanh lá, Vàng ↔ Tím, Xanh dương ↔ Cam.", "• Màu bổ sung dùng để trung hòa tông màu không mong muốn."], "chemical": ["A. Tóc nguyên thủy", "1. Sản phẩm an toàn để sử dụng và loại bỏ cho tóc tự nhiên", "• Alkaline / Cold Wave: Ammonium Thioglycolate (Thio), pH khoảng 9.0-9.6.", "• Acid Perm: GMTG (Glyceryl Monothioglycolate), pH khoảng 4.5-7.", "• Sodium / Lye Relaxer: Sodium Hydroxide (NaOH), kiềm mạnh.", "• No-lye / Ammonium relaxer: Ammonium Thioglycolate (ATG).", "• No-base relaxer: Loại thuốc duỗi không cần bôi kem bảo vệ da đầu.", "• Lithium / Potassium relaxer: Thuốc duỗi không chứa Sodium.", "• Neutralizer: Dừng tác dụng thuốc uốn/duỗi mềm, tái tạo liên kết Disulfide và làm cứng lọn tóc sau uốn.", "• Preliminary test curl: thử phản ứng thuốc uốn và thời gian xử lý.", "• Trước khi uốn/duỗi: kiểm tra Porosity & Elasticity.", "• Kích thước ống cuốn quyết định độ xoăn; 2½ vòng cuốn được ghi là đủ.", "• Bookends wrap/giấy đôi phải phủ qua đuôi tóc để tránh Fishhook.", "• Sau khi xả thuốc uốn bằng nước ấm, Blot dry từng ống trước Neutralizer; nước đọng làm loãng Neutralizer.", "B. Tóc đã qua xử lý hóa chất", "1. Sản phẩm an toàn để sử dụng và loại bỏ cho tóc đã qua xử lý hóa chất", "• Retouch: chỉ làm phần tóc mới mọc, không chồng thuốc lên phần tóc đã xử lý.", "• Khi bôi thuốc duỗi: bắt đầu ở phần khó thấm nhất, thường là giữa thân tóc.", "• Tóc xốp, xù: khi uốn/duỗi phải giữ hóa chất cách da đầu một khoảng an toàn.", "• Tóc có Metallic dye: cần nhận biết và khử kim loại bằng Clarifying shampoo trước; không thực hiện uốn/duỗi/tẩy nếu tóc vẫn còn kim loại.", "C. An toàn hóa chất, sản phẩm và kết quả", "1. Đánh giá kết quả quá trình xử lý hóa chất trên tóc", "• Preliminary test curl dùng để đánh giá phản ứng thuốc uốn và thời gian xử lý; Porosity & Elasticity được kiểm tra trước dịch vụ.", "2. Sử dụng an toàn các sản phẩm tạo kiểu tóc bằng hóa chất", "• Sodium Hydroxide: không gội trước khi duỗi; bổ sung nêu mục đích là tránh làm trầy xước/kích ứng da đầu.", "• Ammonium Thioglycolate relaxer: có thể gội nhẹ trước khi duỗi.", "• Lược dùng khi duỗi: lược nhựa cứng; tránh lược kim loại vì giữ nhiệt.", "3. Lưu ý khi uốn tóc bằng hóa chất", "• Mảnh thun khi uốn giúp giảm nguy cơ gãy tóc.", "• Xả tóc: bắt đầu bằng nước ấm để hỗ trợ xả thuốc/trung hòa, sau đó chuyển sang nước mát khi đã xả sạch.", "D. Kỹ thuật & dịch vụ liên quan", "• Chemical straightening: dùng hóa chất để chuyển tóc xoăn thành thẳng.", "• Reformation service: duỗi nhẹ rồi uốn lại với lọn lớn hơn để tái tạo dạng lọn.", "• Piggyback wrap: kỹ thuật dùng khi tóc dài và khó kiểm soát trên một ống cuốn đơn.", "• LYE = Sodium; Sodium Hydroxide = NaOH / LYE.", "• Sau khi xả thuốc uốn, phải blot dry/lau thấm ráo từng ống cuốn trước khi bôi Neutralizer để tránh làm loãng thuốc trung hòa."], "skincare": ["A. Mát xa", "1. Các động tác mát xa mặt an toàn", "• Effleurage: Vuốt nhẹ, thư giãn.", "• Tapotement: Vỗ/tát/gõ, có tác dụng kích thích.", "• Friction: Chà/xoa bóp, ấn với chuyển động nhịp nhàng.", "• Pétrissage: Nhào/bóp.", "• Vibration: Rung bằng cơ thể, vai và đầu ngón tay để tạo hiệu ứng nhanh.", "• Hướng massage tổng quát: Insertion → Origin.", "• Không massage vùng có mụn trứng cá, da trầy xước; tránh massage với khách cao huyết áp và vùng dưới đầu gối.", "• Người có vấn đề viêm khớp/xương/gân: không bấm huyệt/ấn mạnh, massage nhẹ nhàng.", "2. Các động tác mát xa an toàn khi làm móng tay và móng chân", "• Khách cao huyết áp: không massage. Khách có bệnh/tình trạng chống chỉ định cần điều chỉnh hoặc ngừng dịch vụ.", "B. Chuẩn bị, sản phẩm và dịch vụ", "1. Chuẩn bị cho khách hàng các dịch vụ chăm sóc da", "• Khi dùng đèn soi da/magnifying lamp: che mắt khách bằng 2 miếng cotton/miếng vải khoảng 2 × 2 inch.", "• Khách có mụn trứng cá: nên khuyên gặp bác sĩ tư vấn trước dịch vụ.", "2. Sử dụng các sản phẩm chăm sóc da khác nhau", "• Steamer: Làm mềm bã nhờn, giúp da thông thoáng, hỗ trợ sản phẩm thẩm thấu, tuần hoàn máu; cung cấp thêm oxy cho da. Đặt cách mặt khoảng 14-18 inch.", "• Clay mask: Dùng cho da dầu, lấy tạp chất dưới nang lông/se lỗ chân lông; không dùng cho da khô/rất khô.", "• Paraffin mask: Giữ ẩm cho da khô, giúp sản phẩm thẩm thấu sâu; không dùng cho khách cao huyết áp hoặc tiểu đường.", "• Honey mask: Giúp tăng cảm giác mềm và đàn hồi cho da.", "• Astringent: Kem/nước se da; cân bằng pH và se khít lỗ chân lông.", "• Da dễ kích ứng: không dùng thuốc sát trùng; dùng toner.", "C. An toàn chăm sóc da", "1. Quy trình an toàn để làm sạch da mặt", "• Steamer đặt cách mặt khoảng 14-18 inch; bảo vệ mắt khi dùng đèn/máy soi.", "2. Tẩy tế bào chết bằng hóa chất và cơ học", "• Sau peel, da có thể sáng hơn và thay đổi kết cấu bề mặt.", "3. Ứng dụng an toàn dụng cụ, máy móc và thiết bị chăm sóc da", "• Máy xông hơi và đèn soi da phải dùng đúng khoảng cách và bảo vệ mắt khách.", "5. Sản phẩm an toàn khi sử dụng và ứng dụng cho mọi loại da", "• Da khô: ưu tiên giữ ẩm; Clay mask không dùng cho da khô/rất khô; Paraffin không dùng cho cao huyết áp/tiểu đường.", "• Kem chống nắng: SPF tối thiểu 15, thoa 15 phút trước khi ra ngoài.", "6. Cách loại bỏ vết chai an toàn", "• Callus / Keratoma: Da chai do ma sát nhiều lần; có thể dùng Foot file để làm mỏng vùng chai.", "D. Thành phần & dạng sản phẩm", "• O/W (Oil in Water): dầu trong nước.", "• W/O (Water in Oil): nước trong dầu.", "• Mask nói chung có tác dụng se da.", "• Fragrance là thành phần dễ gây nhạy cảm ở một số loại da."], "lash_brow": ["A. An toàn cho lông mi và lông mày", "1. Quy trình gắn và tháo mi giả an toàn", "• Trước khi gắn mi giả: đo và cắt theo khung mắt.", "• Dụng cụ gắn mi giả: nhíp nhỏ.", "• Mascara wand: Dùng một lần rồi bỏ.", "Kiến thức vùng mắt và chân mày", "• Điểm cao nhất của lông mày: đo theo góc ngoài của mống mắt (iris).", "• Với mắt rộng, điều chỉnh dáng lông mày để cân bằng khoảng cách mắt.", "• Bông đánh mắt/mút makeup: dùng một lần. Chì kẻ mắt/môi: chuốt/làm sạch trước và sau khi dùng.", "• Eyeshadow tạo chiều sâu/làm sáng mắt; Concealer che bọng mắt/quầng thâm."], "waxing": ["A. An toàn và phương pháp triệt lông", "1. Triệt lông tạm thời bằng kem tẩy, sáp và đường", "• Depilatory: Phương pháp rụng lông tạm thời bằng hóa chất (chứa muối thioglycolate kiềm) làm tan rã liên kết keratin của sợi lông tại bề mặt da.", "• Waxing: Tẩy lông tận gốc nang lông (Epilation); thời gian mọc lại kéo dài từ 4 đến 6 tuần.", "• Sáp mềm (Soft / Strip wax): Dùng cho các vùng diện tích rộng (chân, tay, lưng); cần miết vải/giấy wax chuyên dụng lên sáp để giật.", "• Sáp cứng (Hard / Stripless wax): Bôi lớp sáp dày trực tiếp lên da, tự nguội đông đặc lại và giật dứt khoát không cần vải; rất êm dịu cho vùng nhạy cảm (mặt, mép, lông mày, nách, bikini).", "• Quy tắc thao tác sáp: Bôi sáp CÙNG CHIỀU lông mọc; giật sáp dứt khoát NGƯỢC CHIỀU lông mọc.", "• Kỹ thuật căng da: Một tay kéo căng bề mặt da (Taut skin), tay kia giật dải sáp dứt khoát song song sát mặt da để giảm đau và chống bầm tím rách da.", "• Kiểm tra nhiệt độ sáp: Bắt buộc thử độ nóng sáp lên mặt trong cổ tay hoặc cẳng tay của người thợ trước khi thoa lên khách.", "• Chăm sóc sau khi wax: Thoa dầu tẩy sáp cặn, bôi lotion/gel làm dịu (Aloe vera, Witch hazel, Soothing lotion) để giảm đỏ rát và se khít nang lông.", "• Thử dị ứng sáp (Patch test): Thử phản ứng sáp trên một vùng da nhỏ của khách trước 7 đến 10 phút.", "• Sugaring: Triệt lông bằng hỗn hợp đường tự nhiên dẻo; hoàn toàn tan trong nước ấm, dễ làm sạch và ít gây kích ứng da hơn sáp.", "2. Triệt lông an toàn bằng nhíp và chỉ", "• Tweezing (Nhổ lông bằng nhíp): Phương pháp nhổ tỉa các sợi lông thừa, định hình dáng lông mày; kéo căng da và kẹp nhổ dứt khoát theo chiều lông mọc.", "• Threading (Dùng chỉ xoắn): Kỹ thuật dùng sợi chỉ cotton 100% cuộn xoắn lại để cuộn và nhổ các sợi lông từ gốc; rất nhẹ nhàng cho da nhạy cảm vùng mặt.", "3. Triệt lông vĩnh viễn và giảm vĩnh viễn", "• Electrolysis (Điện phân): Phương pháp triệt lông vĩnh viễn duy nhất được FDA công nhận; dùng kim điện cực siêu nhỏ phá hủy tế bào mầm nang lông.", "• 3 kỹ thuật điện phân: Galvanic (điện giải phân hủy hóa học), Thermolysis (nhiệt cao tần làm đông tụ), và Blend (kết hợp cả hai).", "• Laser & IPL (Intense Pulsed Light): Triệt lông giảm vĩnh viễn bằng xung ánh sáng nhắm chọn lọc vào sắc tố Melanin trong nang lông.", "B. Kiểm soát nhiễm khuẩn và vệ sinh trong triệt lông", "• Nguyên tắc Không nhúng lại (No Double Dipping): Tuyệt đối KHÔNG nhúng lại que lấy sáp đã chạm vào da khách vào nồi sáp; mỗi lần lấy sáp bắt buộc dùng một que gỗ mới (Single-use spatula).", "• Bảo hộ cá nhân: Người thợ bắt buộc phải mang găng tay dùng một lần (Disposable gloves) trong suốt quá trình phục vụ triệt lông.", "• Khử trùng dụng cụ: Nhíp kim loại phải rửa sạch bằng xà phòng + nước, ngâm ngập hoàn toàn trong dung dịch khử trùng EPA hoặc hấp Autoclave giữa mỗi khách hàng.", "• Quy trình phơi nhiễm máu: Khi bị trầy da rướm máu do nhổ lông/wax, lập tức ngừng thao tác, sát khuẩn da (Antiseptic), băng kín, bỏ rác vào túi Biohazard 2 lớp.", "C. Chống chỉ định đối với dịch vụ triệt lông", "• Thuốc Accutane (Isotretinoin): Khách uống Accutane trong vòng 6 tháng TUYỆT ĐỐI KHÔNG ĐƯỢC WAX (nguy cơ lột rách cả mảng biểu bì da); chỉ dùng nhíp tỉa nhẹ.", "• Thuốc thoa làm mỏng da: Đang dùng Retin-A, Renova, Differin, AHA/BHA nồng độ cao: không wax trên vùng da đang điều trị.", "• Tổn thương bề mặt da: Tuyệt đối KHÔNG wax lên: nốt ruồi có lông, mụn cóc, vết thương hở, da cháy nắng hoặc đang viêm đỏ.", "• Bệnh nhân tiểu đường / Dùng thuốc loãng máu: Tránh dịch vụ wax có nguy cơ rách da, chảy máu khó đông hoặc lâu lành vết thương.", "• Lông mọc ngược (Ingrown hairs): Nếu vùng da có lông mọc ngược bị viêm mưng mủ (Folliculitis), nên từ chối dịch vụ và khuyên khách đi khám bác sĩ.", "• Khách cạo lông chân: Lông quá ngắn dưới 1/4 inch sáp không bám được; vết xước cạo lông làm tăng nguy cơ nhiễm trùng."], "nails": ["A. Giải phẫu và cấu trúc sinh lý của móng", "1. Các thành phần giải phẫu chính của móng tự nhiên", "• Onyx (Móng tự nhiên): Là phần phụ của da, cấu tạo chủ yếu từ chất sừng cứng Keratin; độ ẩm của móng khỏe mạnh từ 15% đến 25%.", "• Matrix (Mầm móng / Gốc móng): Nơi sản sinh các tế bào sừng để tạo ra phiến móng; chứa mạch máu và dây thần kinh; tổn thương vĩnh viễn matrix sẽ làm móng ngừng mọc hoặc biến dạng vĩnh viễn.", "• Lunula (Liềm móng): Vùng màu trắng hình bán nguyệt nhìn thấy được ở gốc móng, là phần nhìn thấy được lộ ra của mầm móng Matrix.", "• Nail Plate (Phiến móng / Thân móng): Lớp sừng cứng trong suốt gồm khoảng 100 lớp tế bào chết xếp chồng lên nhau, bảo vệ ngón tay ngón chân.", "• Nail Bed (Nền móng / Đệm móng): Lớp da sống nâng đỡ phiến móng; chứa nhiều mạch máu (tạo sắc hồng cho móng) và dây thần kinh cảm giác.", "• Bed Epithelium (Biểu mô nền móng): Lớp mô mỏng gắn kết phiến móng với nền móng, dẫn hướng cho móng trượt thẳng về phía trước.", "• Cuticle (Biểu bì móng chết): Lớp màng tế bào sừng chết không màu bám dính từ underside của eponychium lên phiến móng; có chức năng niêm phong chống vi khuẩn; chỉ đẩy nhẹ hoặc tỉa phần xơ chết.", "• Eponychium (Da viền sống ở gốc móng): Phần mô da sống che phủ liềm móng; TUYỆT ĐỐI KHÔNG ĐƯỢC CẮT BỎ EPONYCHIUM vì sẽ gây chảy máu, đau đớn và nhiễm trùng.", "• Hyponychium (Lớp da sống dưới đầu móng): Nằm dưới bờ tự do của móng, bảo vệ ngăn vi khuẩn xâm nhập vào nền móng; cắt phạm vào sẽ gây đau buốt dữ dội và chảy máu.", "• Free Edge (Bờ tự do / Đầu móng): Phần phiến móng nhô dài ra ngoài đầu ngón tay hoặc ngón chân.", "• Nail Folds / Sidewalls (Nếp móng / Tường móng): Nếp da bao bọc bảo vệ và dẫn hướng hai bên cạnh móng.", "2. Sự tăng trưởng và phát triển của móng", "• Tốc độ mọc trung bình: 1/10 đến 1/8 inch (khoảng 2.5 - 3.7 mm) mỗi tháng; ngón giữa mọc nhanh nhất, ngón cái mọc chậm nhất; mọc nhanh nhất vào mùa hè.", "• Thời gian thay mới phiến móng: Móng tay mất 4 đến 6 tháng để mọc lại hoàn toàn từ gốc ra ngọn; móng chân mất 9 đến 12 (thậm chí 18) tháng.", "B. Bệnh lý và các rối loạn về móng", "1. Rối loạn móng được phép phục vụ nhẹ nhàng", "• Beau's lines: Các rãnh ngang trên mặt móng, do cơ thể từng trải qua cơn bạo bệnh nặng hoặc chấn thương làm ngừng trệ tạm thời sự sinh trưởng của matrix.", "• Bruised nails (Móng bầm tím): Xuất huyết tụ máu dưới nền móng do va đập chấn thương.", "• Eggshell nails (Móng vỏ trứng): Móng mỏng, trắng ngà, rất dẻo và cong cụp; do thiếu chất dinh dưỡng hoặc di truyền.", "• Hangnail / Agnail (Xước măng rô): Rách nếp da sống quanh viền móng; dùng kềm tỉa sạch phần da chết, khuyên dùng dịch vụ dầu nóng (Hot oil manicure) và cuticle oil.", "• Leukonychia: Các đốm trắng nhỏ trên móng do chấn thương nhẹ vào matrix; sẽ tự trôi ra đầu móng khi móng dài.", "• Melanonychia: Dải sắc tố melanin sẫm màu chạy dọc móng.", "• Onychophagy: Thói quen cắn móng tay mãn tính; có thể phục vụ làm móng sạch sẽ hoặc đắp móng giúp bỏ tật cắn móng.", "• Onychorrhexis: Móng giòn, có rãnh dọc, dễ tưa nứt đầu móng; khắc phục bằng ngâm dầu nóng (Hot oil) và dưỡng ẩm.", "• Nail Pterygium (Mộng thịt móng): Da sống viền móng bị dính chặt bất thường và bò phủ lên phiến móng do bỏng/chấn thương; tuyệt đối không dùng kềm cạo cắt nạo mộng thịt.", "2. Bệnh lý móng TUYỆT ĐỐI TỪ CHỐI DỊCH VỤ", "• Onychosis / Onychopathy: Thuật ngữ y khoa chỉ chung các bệnh lý về móng.", "• Onychia: Viêm nhiễm mưng mủ ở mầm móng Matrix.", "• Onychocryptosis (Móng mọc đâm vào thịt / Ingrown nail): Khóe móng đâm vào mô mềm; nếu viêm đỏ sưng mủ từ chối dịch vụ, chuyển bác sĩ.", "• Onycholysis: Phiến móng bị bong tách rời khỏi nền móng (bắt đầu từ bờ tự do lùi về phía gốc móng).", "• Onychomadesis: Phiến móng bị bong tách hoàn toàn từ gốc móng rồi rụng mất.", "• Paronychia: Viêm nhiễm khuẩn sưng đỏ mưng mủ ở các nếp da quanh móng (thường do vi khuẩn Staphylococcus/Streptococcus); rất dễ lây lan.", "• Tinea Pedis (Nấm chân / Athlete's foot): Nhiễm nấm ngứa tróc vảy ở kẽ ngón và lòng bàn chân.", "• Onychomycosis (Nấm móng / Tinea Unguium): Móng dày sừng ố vàng, biến màu đục, giòn xốp mủn; từ chối phục vụ.", "• Pseudomonas Aeruginosa: Nhiễm trùng trực khuẩn mủ xanh đổi màu từ vàng -> lục nhạt -> đen/nâu do ẩm kẹt dưới móng nối bị hở (Lifting).", "C. Dịch vụ chăm sóc móng tay và chân", "1. Quy trình Manicure và các thao tác kỹ thuật cơ bản", "• Trình tự Manicure cơ bản: Khử trùng tay -> Chùi nước sơn cũ -> Dũa định hình dáng móng -> Ngâm chén nước ấm mềm da -> Đẩy cuticle và tỉa da xơ chết -> Làm sạch mặt móng -> Mát-xa bàn tay cẳng tay -> Khử dầu móng -> Sơn 4 lớp (Base coat, 2 lớp Color, Top coat).", "• Kỹ thuật dũa móng tự nhiên: Dũa từ góc móng ngoài lướt vào giữa tâm (Corner to Center); tuyệt đối KHÔNG dũa qua lại như cưa gỗ (Sawing motion) vì làm nóng móng và gây nứt tách lớp móng.", "• 5 hình dáng móng: Móng vuông (Square) bền chắc nhất chịu lực tốt nhất; Móng nhọn (Pointed) yếu nhất rất dễ gãy; Squoval (vuông bầu); Tròn (Round); Bầu dục (Oval).", "• Base coat: Sơn lót giúp kết dính nước sơn màu và chống ố vàng móng thật; Top coat: Sơn bóng bảo vệ chống bong tróc trầy xước.", "• Que gỗ cam (Orange wood stick): Dụng cụ đa năng dùng 1 lần để đẩy da, quấn bông chùi viền sơn lem, chấm đính phụ kiện.", "2. Quy trình Pedicure và an toàn cho bồn ngâm chân", "• Cắt móng chân chuẩn xác: Bấm thẳng một đường ngang (Straight across), dũa mịn nhẹ hai góc ngoài; TUYỆT ĐỐI KHÔNG CẮT KHOÉT SÂU KHÓE MÓNG để phòng tránh móng mọc đâm vào thịt (Ingrown nail).", "• Cây dũa chân (Foot file / Callus paddle): Dùng chà mịn và giảm bớt mảng da chai sần (Callus) ở gót chân; cấm dùng dao cạo (Credo blade).", "• Nhiệt độ bồn ngâm chân Pedicure: Không bao giờ được vượt quá 104°F (40°C).", "• Khách hàng mắc bệnh tiểu đường: TUYỆT ĐỐI KHÔNG DÙNG KỀM CẮT DA HOẶC DAO GỌT CHAI trên chân khách tiểu đường vì giảm tuần hoàn cảm giác, vết thương hở dễ dẫn đến hoại tử.", "• Khách hàng cạo lông chân: Không cạo lông chân trong vòng 24-48 tiếng trước khi làm Pedicure để tránh vi khuẩn bồn ngâm xâm nhập gây áp-xe da.", "• Khử trùng bồn Pedicure: Giữa mỗi khách xả nước, cọ xà phòng, bơm nước sạch hòa hóa chất EPA sục tuần hoàn ít nhất 10 phút, xả và lau khô; định kỳ vệ sinh lưới lọc qua đêm.", "D. Móng nhân tạo và hóa chất chuyên dụng", "1. Móng bột Acrylic (Liquid & Powder)", "• Thành phần: Monomer Liquid (chất lỏng đơn phân) + Polymer Powder (bột chứa chất khơi mào BPO) kết hợp tạo nên phản ứng đông cứng trùng hợp (Polymerization).", "• MMA (Methyl Methacrylate): Hóa chất bị FDA nghiêm cấm trong ngành đắp móng vì gây tổn thương nặng móng thật, xé rách nền móng, khó tháo gỡ và gây dị ứng nặng.", "• EMA (Ethyl Methacrylate): Hóa chất an toàn, hợp pháp được phép sử dụng trong salon.", "• Primer: Chất tạo liên kết kết dính giữa móng thật và móng bột; Acid primer (Methacrylic acid) tính acid cao dễ gây bỏng da viền móng; Non-acid primer dịu nhẹ hơn.", "• Dehydrator: Chất khử dầu và hút ẩm tạm thời trên móng thật trước khi đắp bột để chống hở móng (Lifting).", "• Cọ đắp bột: Cọ lông chồn tự nhiên (Sable hair / Kolinsky) tốt nhất vì giữ monomer đều và đàn hồi tốt.", "• Tháo móng bột an toàn: Ngâm đầu móng trong Acetone nguyên chất để làm tan mềm bột rồi gạt bỏ; TUYỆT ĐỐI KHÔNG DÙNG KỀM NẠY/CẬY MÓNG GIẢ vì làm rách nát móng thật.", "2. Sơn gel và Gel đắp móng (Light-cured Gel)", "• Đèn quang trùng hợp (UV/LED Lamp): Phát bước sóng ánh sáng kích hoạt chất khơi mào quang học (Photoinitiator) làm cứng đông đặc lớp gel (Curing).", "• Inhibition layer: Lớp màng dính nhờn cặn trên bề mặt gel sau khi hơ đèn; dùng miếng gạc không xơ tẩm Cồn (Alcohol) hoặc dung dịch chuyên dụng để lau sạch hoàn thiện.", "3. Móng Tip và Móng dán/vá (Tips & Wraps)", "• Gắn móng Tip: Điểm dừng (Stop point/Well) ôm khít bờ tự do; thao tác Stop, Rock, Hold (Dừng, Lăn áp sát, Giữ cố định 5-10 giây).", "• Nail wrap (Móng vải/lụa): Dùng lụa (Silk), lanh (Linen), sợi thủy tinh (Fiberglass) hoặc giấy cùng keo resin để vá móng nứt gãy hoặc gia cố móng mỏng yếu.", "E. An toàn hóa chất trong Nail salon", "• Acetone: Dung môi hòa tan bay hơi nhanh, cực kỳ dễ cháy (Flammable); bảo quản tránh xa nguồn nhiệt và tia lửa điện.", "• Non-acetone remover: Dung dịch tẩy sơn không chứa acetone (chứa Ethyl acetate); dùng lau nước sơn trên móng bột/móng tip mà không làm tan chảy móng nhân tạo.", "• Thông gió & Thùng rác: Bàn làm việc phải có máy hút bụi hút mùi lọc than hoạt tính; rác dính acetone/monomer bỏ thùng rác kim loại có nắp đậy tự động đóng kín để phòng cháy nổ và ngăn phát tán hơi độc."]}, "cats": {"safety": "1. An toàn và kiểm soát lây nhiễm", "consult": "2. Tư vấn khách hàng & phân tích tóc, da, móng", "styling": "3. Tạo kiểu tóc", "haircut": "4. Cắt tóc", "color": "5. Nhuộm tóc", "chemical": "6. Dịch vụ tạo kiểu tóc bằng hóa chất", "skincare": "7. Chăm sóc da", "lash_brow": "8. Lông mi và lông mày", "waxing": "9. Triệt lông", "nails": "10. Chăm sóc móng"}, "weights": {"safety": 30, "consult": 19, "styling": 2, "haircut": 3, "color": 10, "chemical": 12, "skincare": 4, "lash_brow": 4, "waxing": 8, "nails": 8}}, "bank_112": {"questions": [{"n": 1, "q": "Xoa bóp kích thích có lợi vì sao?", "o": ["Tăng sự tuần của hoàn máu", "Làm cho tóc mọc", "Giữ cho da đầu sạch", "Ngăn ngừa sự rụng tóc"], "c": 0, "raw": "Câu 1: Xoa bóp kích thích có lợi vì sao?\nA. Tăng sự tuần của hoàn máu\nB. Làm cho tóc mọc\nC. Giữ cho da đầu sạch\nD. Ngăn ngừa sự rụng tóc\nĐáp án đúng: A\n\n", "cat": "skincare", "sec": "7. Chăm sóc da"}, {"n": 2, "q": "Cái gì xác định tính di động ít nhất của một lọn tóc?", "o": ["Thân tóc đầy", "Nửa thân tóc", "Không có", "Cuộn cực đại"], "c": 0, "raw": "Câu 2: Cái gì xác định tính di động ít nhất của một lọn tóc?\nA. Thân tóc đầy\nB. Nửa thân tóc\nC. Không có\nD. Cuộn cực đại\nĐáp án đúng: A\n\n", "cat": "styling", "sec": "3. Tạo kiểu tóc"}, {"n": 3, "q": "Thuật ngữ trượt để sử dụng để ám chỉ quá trình?", "o": ["Cuộn tóc", "Mỏng tóc", "Làm gợn sóng tóc bằng ngón tay", "Cắt đứt tóc quăn"], "c": 1, "raw": "Câu 3: Thuật ngữ trượt để sử dụng để ám chỉ quá trình?\nA. Cuộn tóc\nB. Mỏng tóc\nC. Làm gợn sóng tóc bằng ngón tay\nD. Cắt đứt tóc quăn\nĐáp án đúng: B\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 4, "q": "Loại nào sau đây là phần chính của tóc?", "o": ["Hair bulb (bầu)", "Hair Follicle (nang)", "Hair root (chân tóc)", "Medulla (tuỷ)"], "c": 2, "raw": "Câu 4: Loại nào sau đây là phần chính của tóc?\nA. Hair bulb (bầu)\nB. Hair Follicle (nang)\nC. Hair root (chân tóc)\nD. Medulla (tuỷ /* Multi-answer support: q.c can be a single index (number) or an array of indices */
function correctSet(q){ return Array.isArray(q.c) ? q.c.slice().sort((a,b)=>a-b) : [q.c]; }
function isMultiAnswer(q){ return Array.isArray(q.c) && q.c.length>1; }
function toArr(x){ if(x===undefined||x===null) return []; return Array.isArray(x)?x.slice():[x]; }
function arraysEqual(a,b){
  if(a.length!==b.length) return false;
  const sa=[...a].sort((x,y)=>x-y), sb=[...b].sort((x,y)=>x-y);
  return sa.every((v,i)=>v===sb[i]);
}
function isAnswerCorrect(q, chosen){ return arraysEqual(toArr(chosen), correctSet(q)); }

function utf8ToBase64(str){
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (match, p1) => String.fromCharCode('0x' + p1)));
}
function base64ToUtf8(str){
  return decodeURIComponent(atob(str).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
}

function showToast(msg, type='info'){

        data[k] = safeGetItem(k);
      }
    }
  }catch(e){}
  const accs = getAccounts();
  const currentAcc = (activeUser && accs[activeUser.key]) ? accs[activeUser.key] : null;
  data[LS_AUTH_USERNAME] = activeUser ? activeUser.username : 'Học viên';
  return {
    version: 3,
    appName: 'on-thi-tham-my',
    timestamp: new Date().toISOString(),
    user: activeUser ? activeUser.username : 'Học viên',
    account: currentAcc,

    data

function importAllData(payload){
  if(!payload || !payload.data) throw new Error('Dữ liệu không hợp lệ');
  let count = 0;
  for(const [k, v] of Object.entries(payload.data)){
    try{
      safeSetItem(k, v);
      count++;
    }catch(e){}
  }
  if(payload.cloudSyncId){
    safeSetItem('cosmo_cloud_sync_id', payload.cloudSyncId);
  }
  // Restore account if present
  if(payload.account && payload.account.username){
    const accs = getAccounts();
    const k = payload.account.key || payload.account.username.toLocaleLowerCase('vi-VN');
    accs[k] = payload.account;
    saveAccounts(accs);
    activeUser = { username: payload.account.username, key: k };
    safeSetItem(LS_AUTH_CURRENT_USER, k);
    safeSetItem(LS_AUTH_USERNAME, payload.account.username);
  } else if(payload.user){
    const k = payload.user.toLocaleLowerCase('vi-VN');
    activeUser = { username: payload.user, key: k };
    safeSetItem(LS_AUTH_CURRENT_USER, k);
    safeSetItem(LS_AUTH_USERNAME, payload.user);
  }
  updateAccountUi();
  route();
  return count;
}

async function cloudPush(quiet=false){
  const payload = exportAllData();
  let syncId = safeGetItem('cosmo_cloud_sync_id');
  updateCloudBadge('syncing');
  try{
    const bodyObj = {
      name: 'cosmo_study_' + (activeUser ? activeUser.key : 'default'),
      data: payload
    };
    if(!syncId){
      const res = await fetch('https://api.restful-api.dev/objects', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(bodyObj)
      });
      if(res.ok){
        const json = await res.json();
        syncId = json.id;
        safeSetItem('cosmo_cloud_sync_id', syncId);
        updateCloudBadge('synced');
        if(!quiet) showToast('Đã lưu tiến độ lên đám mây thành công!', 'success');
        return { success: true, id: syncId };
      }
    } else {
      const res = await fetch(`https://api.restful-api.dev/objects/${syncId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(bodyObj)
      });
      if(res.ok){
        updateCloudBadge('synced');
        if(!quiet) showToast('Đã cập nhật tiến độ lên đám mây!', 'success');
        return { success: true, id: syncId };
      }
    }
    updateCloudBadge('offline');
    if(!quiet) showToast('Máy chủ đám mây không phản hồi.', 'error');
    return { success: false, error: 'Request failed' };
  }catch(e){
    updateCloudBadge('offline');
    if(!quiet) showToast('Không thể kết nối đám mây (kiểm tra mạng).', 'error');
    return { success: false, error: e.message };
  }
}

async function cloudPull(specifiedId, inputPassword=null, quiet=false){
  const syncId = specifiedId || safeGetItem('cosmo_cloud_sync_id');
  if(!syncId){
    if(!quiet) showToast('Vui lòng nhập Mã đồng bộ đám mây.', 'error');
    return { success: false, error: 'Chưa có Mã đồng bộ' };
  }
  updateCloudBadge('syncing');
  try{
    const res = await fetch(`https://api.restful-api.dev/objects/${syncId}`);
    if(res.ok){
      const json = await res.json();
      if(json && json.data && json.data.data){
        // Password protection check
        const targetAcc = json.data.account;
        if(targetAcc && targetAcc.passwordHash){
          const pHash = inputPassword ? await hashPassword(inputPassword) : null;
          const currentAcc = (activeUser && getAccounts()[activeUser.key]) ? getAccounts()[activeUser.key] : null;
          const isSameUser = currentAcc && currentAcc.passwordHash === targetAcc.passwordHash && currentAcc.key === (targetAcc.key || targetAcc.username.toLowerCase());
          
          if(!isSameUser && (!pHash || pHash !== targetAcc.passwordHash)){
            updateCloudBadge('offline');
            return {
              success: false,
              needPassword: true,
              targetUser: targetAcc.username,
              error: `Tài khoản "${targetAcc.username}" được bảo vệ bằng mật khẩu. Vui lòng nhập đúng mật khẩu để tải về.`
            };
          }
        }
        const count = importAllData(json.data);
        safeSetItem('cosmo_cloud_sync_id', syncId);
        updateCloudBadge('synced');
        if(!quiet) showToast(`Đã tải về thành công ${count} mục tiến độ học tập cho "${json.data.user || 'Học viên'}"!`, 'success');
        return { success: true, id: syncId, user: json.data.user };
      }
    }
    updateCloudBadge('offline');
    if(!quiet) showToast('Không tìm thấy dữ liệu ứng với Mã đồng bộ này.', 'error');
    return { success: false, error: 'Not found' };
  }catch(e){
    updateCloudBadge('offline');
    if(!quiet) showToast('Lỗi tải dữ liệu từ đám mây.', 'error');
    return { success: false, error: e.message };
  }
}

/* ============================================================
   ACCOUNT & PASSWORD SECURITY ENGINE
   ============================================================ */
async function hashPassword(pwd, salt='cosmo_stateboard_salt_2026'){
  const str = `${salt}:${(pwd||'').trim()}`;
  if(window.crypto && window.crypto.subtle){
    try{
      const buf = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }catch(e){}
  }
  let h1 = 0xdeadbeef, h2 = 0x41c64e6d;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 'h_' + (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
}

async function loginAccount(username, password){
  const uname = (username||'').trim();
  const pwd = (password||'').trim();
  if(!uname) return { success: false, error: 'Vui lòng nhập Tên đăng nhập.' };
  if(!pwd) return { success: false, error: 'Vui lòng nhập Mật khẩu / Mã PIN.' };

  const key = uname.toLocaleLowerCase('vi-VN');
  const accs = getAccounts();
  const acc = accs[key];
  if(!acc){
    return { success: false, notFound: true, username: uname, error: `Tài khoản "${uname}" chưa có trên thiết bị này.` };
  }

  const pHash = await hashPassword(pwd);
  if(acc.passwordHash && acc.passwordHash !== pHash){
    return { success: false, error: 'Mật khẩu không chính xác! Vui lòng thử lại.' };
  }

  acc.lastLogin = new Date().toISOString();
  accs[key] = acc;
  saveAccounts(accs);

  activeUser = { username: acc.username, key, hasPassword: !!acc.passwordHash };
  safeSetItem(LS_AUTH_CURRENT_USER, key);
  safeSetItem(LS_AUTH_USERNAME, acc.username);

  updateAccountUi();
  route();
  showToast(`Chào mừng ${acc.username} đã đăng nhập!`, 'success');
  return { success: true, user: activeUser };
}

async function registerAccount(username, password, confirmPassword){
  const uname = (username||'').trim().replace(/\s+/g,' ');
  const pwd = (password||'').trim();
  if(!uname || uname.length < 2){
    return { success: false, error: 'Tên đăng nhập cần có ít nhất 2 ký tự.' };
  }
  if(uname.length > 30){
    return { success: false, error: 'Tên đăng nhập tối đa 30 ký tự.' };
  }
  if(!pwd || pwd.length < 3){
    return { success: false, error: 'Mật khẩu cần tối thiểu 3 ký tự (chữ hoặc số PIN).' };
  }
  if(confirmPassword !== undefined && pwd !== confirmPassword.trim()){
    return { success: false, error: 'Mật khẩu xác nhận không khớp.' };
  }

  const key = uname.toLocaleLowerCase('vi-VN');
  const accs = getAccounts();
  if(accs[key]){
    return { success: false, error: `Tên đăng nhập "${uname}" đã có người sử dụng. Nếu đây là bạn, hãy bấm Đăng nhập. Nếu không, vui lòng chọn tên khác (ví dụ: ${uname}2, ${uname}_nails).` };
  }

  const pHash = await hashPassword(pwd);
  const newAcc = {
    username: uname,
    key,
    passwordHash: pHash,
    createdAt: new Date().toISOString(),
    lastLogin: new Date().toISOString()
  };
  accs[key] = newAcc;
  saveAccounts(accs);

  // Migrate legacy guest data if this is the first registered account
  if(Object.keys(accs).length === 1){
    try{
      const bankScoped = [LS_PROGRESS, LS_HISTORY, LS_ACTIVE_EXAM, LS_FLASH, LS_LASTSTUDY];
      ['bank_424', 'bank_112', 'bank_619', 'bank_100'].forEach(bId => {
        bankScoped.forEach(k => {
          const oldVal = safeGetItem(`${k}__${bId}`) || safeGetItem(`${k}__${bId}__default`) || safeGetItem(`${k}__${bId}____guest`);
          if(oldVal && !safeGetItem(`${k}__${bId}__${key}`)){
            safeSetItem(`${k}__${bId}__${key}`, oldVal);
          }
        });
      });
    }catch(e){}
  }

  activeUser = { username: uname, key, hasPassword: true };
  safeSetItem(LS_AUTH_CURRENT_USER, key);
  safeSetItem(LS_AUTH_USERNAME, uname);

  updateAccountUi();
  route();
  showToast(`Đã tạo tài khoản "${uname}" thành công!`, 'success');
  return { success: true, user: activeUser };
}

async function changePassword(oldPwd, newPwd, confirmPwd){
  if(isGuestUser()) return { success: false, error: 'Vui lòng đăng nhập trước khi đổi mật khẩu.' };
  const accs = getAccounts();
  const acc = accs[activeUser.key];
  if(!acc) return { success: false, error: 'Không tìm thấy tài khoản.' };

  const oldHash = await hashPassword((oldPwd||'').trim());
  if(acc.passwordHash && acc.passwordHash !== oldHash){
    return { success: false, error: 'Mật khẩu hiện tại không chính xác.' };
  }
  if(!newPwd || newPwd.trim().length < 3){
    return { success: false, error: 'Mật khẩu mới tối thiểu 3 ký tự.' };
  }
  if(newPwd.trim() !== confirmPwd.trim()){
    return { success: false, error: 'Mật khẩu xác nhận không khớp.' };
  }

  acc.passwordHash = await hashPassword(newPwd.trim());
  accs[activeUser.key] = acc;
  saveAccounts(accs);
  showToast('Đã đổi mật khẩu thành công!', 'success');
  return { success: true };
}

            : 'Tạo tên đăng nhập và mật khẩu riêng (mỗi học viên một tên riêng biệt, không bị trùng lẫn bài làm).'}
        </p>

        <div style="display:flex;gap:6px;background:rgba(36,34,41,.06);padding:4px;border-radius:10px;margin-bottom:16px;">

          <button id="modalTabRegister" class="btn btn-sm ${currentTab==='register'?'btn-primary':'btn-ghost'}" style="flex:1;justify-content:center;border-radius:8px;">📝 Đăng ký mới</button>

            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              ${accList.map(a => `<button class="chip btn-sm q-acc-chip" data-user="${escapeHtml(a.username)}" style="padding:4px 10px;font-size:12px;cursor:pointer;">👤 ${escapeHtml(a.username)}</button>`).join('')}
            </div>
          </div>
        ` : ''}

        <form id="loginForm" onsubmit="return false;" style="display:flex;flex-direction:column;gap:12px;">
          <div>
            <label style="font-size:12.5px;font-weight:600;display:block;margin-bottom:4px;color:var(--ink);">Tên đăng nhập (Username)</label>
            <input id="loginUnameInput" type="text" maxlength="30" value="${escapeHtml(prefillUser)}" placeholder="Ví dụ: trina, trinh2026, hoang_nail..." style="width:100%;padding:9px 12px;border:1px solid var(--card-line);border-radius:8px;font-size:14px;" autocomplete="username" required>
            <div style="font-size:11px;color:var(--ink-soft);margin-top:3px;">Viết liền hoặc gạch dưới. Mỗi học viên cần 1 tên đăng nhập riêng biệt.</div>
          </div>

          <div>
            <label style="font-size:12.5px;font-weight:600;display:block;margin-bottom:4px;color:var(--ink);">Mật khẩu / Mã PIN</label>
            <div style="position:relative;display:flex;align-items:center;">

              <button type="button" id="loginTogglePwdBtn" style="position:absolute;right:8px;background:none;border:none;cursor:pointer;font-size:15px;padding:4px;" title="Hiện/Ẩn mật khẩu">👁️</button>

          ` : ''}

    const syncBox = overlay.querySelector('#directSyncBox');
    const openSyncBtn = overlay.querySelector('#openDirectSyncBtn');
    if(openSyncBtn){
      openSyncBtn.onclick = ()=>{

    const applySyncBtn = overlay.querySelector('#applyDirectSyncBtn');

          raw = raw.split('import_sync=')[1].split('&')[0];
        }
        try{
          const payload = JSON.parse(base64ToUtf8(raw));
          const count = importAllData(payload);
          showToast(`✓ Đã nạp thành công tài khoản "${payload.user}" cùng toàn bộ bài học!`, 'success');
          close();
          if(onDone) onDone(activeUser);
        }catch(e){
          if(!raw.includes('{') && raw.length > 5){
            const res = await cloudPull(raw, null, false);
            if(res.success){
              close();
              if(onDone) onDone(activeUser);
              return;
            }
          }
          alert('Dữ liệu không hợp lệ: ' + e.message);
        }
      };
    }

    overlay.querySelector('#modalTabLogin').onclick = ()=>{

    overlay.querySelector('#loginForm').onsubmit = async ()=>{
      const uname = overlay.querySelector('#loginUnameInput').value;
      const pwd = overlay.querySelector('#loginPwdInput').value;

      const submitBtn = overlay.querySelector('#loginSubmitBtn');
      msgEl.style.color = '#DC2626';
      msgEl.textContent = '';
      submitBtn.disabled = true;

      try{
        if(currentTab === 'login'){
          const res = await loginAccount(uname, pwd);
          if(res.success){
            msgEl.style.color = '#16A34A';
            msgEl.textContent = '✓ Đăng nhập thành công!';
            setTimeout(()=>{
              close();
              if(onDone) onDone(res.user);
            }, 400);
          } else if(res.notFound){
            msgEl.innerHTML = `
              <div style="background:#FFFBEB;border:1px solid #FCD34D;border-radius:8px;padding:12px;margin-top:8px;font-size:12.5px;color:#92400E;line-height:1.45;">

                <div>Vì đây là thiết bị mới, bạn có thể chọn 1 trong 2 cách:</div>
                <div style="margin-top:8px;display:flex;flex-direction:column;gap:6px;">
                  <button type="button" class="btn btn-sm btn-primary" id="btnQuickRegThis" style="background:#D97706;border-color:#D97706;font-size:11.5px;padding:6px 10px;justify-content:center;">
                    ✨ 1. Bấm vào đây để tạo "${escapeHtml(uname)}" trên máy này
                  </button>
                  <button type="button" class="btn btn-sm btn-ghost" id="btnQuickPasteSync" style="background:#fff;border-color:#FCD34D;font-size:11.5px;padding:6px 10px;justify-content:center;">
                    📥 2. Dán link hoặc mã đồng bộ từ máy tính sang
                  </button>
                </div>
                <div id="quickSyncPasteArea" style="display:none;margin-top:8px;">
                  <textarea id="modalQuickSyncInput" placeholder="Dán link đồng bộ hoặc mã dữ liệu từ máy tính vào đây..." style="width:100%;height:55px;padding:6px;font-size:11px;border:1px solid #FCD34D;border-radius:6px;font-family:monospace;"></textarea>
                  <div style="display:flex;justify-content:flex-end;margin-top:4px;">
                    <button type="button" class="btn btn-sm btn-primary" id="modalApplyQuickSyncBtn" style="background:#16A34A;border-color:#16A34A;font-size:11.5px;padding:4px 10px;">Áp dụng & Vào học</button>
                  </div>
                </div>
              </div>
            `;
            const btnReg = msgEl.querySelector('#btnQuickRegThis');
            if(btnReg){
              btnReg.onclick = async ()=>{
                const r = await registerAccount(uname, pwd);
                if(r.success){
                  msgEl.style.color = '#16A34A';
                  msgEl.textContent = '✓ Đã tạo tài khoản thành công!';
                  setTimeout(()=>{ close(); if(onDone) onDone(r.user); }, 400);
                } else {
                  msgEl.style.color = '#DC2626';
                  msgEl.textContent = r.error;
                }
              };
            }
            const btnPaste = msgEl.querySelector('#btnQuickPasteSync');
            if(btnPaste){
              btnPaste.onclick = ()=>{
                const area = msgEl.querySelector('#quickSyncPasteArea');
                area.style.display = area.style.display === 'none' ? 'block' : 'none';
              };
            }
            const btnApply = msgEl.querySelector('#modalApplyQuickSyncBtn');
            if(btnApply){
              btnApply.onclick = ()=>{
                let raw = (msgEl.querySelector('#modalQuickSyncInput').value||'').trim();
                if(!raw){ alert('Vui lòng dán link hoặc mã đồng bộ.'); return; }
                if(raw.includes('import_sync=')){
                  raw = raw.split('import_sync=')[1].split('&')[0];
                }
                try{
                  const payload = JSON.parse(base64ToUtf8(raw));
                  const count = importAllData(payload);
                  msgEl.style.color = '#16A34A';
                  msgEl.textContent = `✓ Đã nạp thành công tài khoản "${payload.user}" cùng ${count} mục bài học!`;
                  setTimeout(()=>{ close(); if(onDone) onDone(activeUser); }, 500);
                }catch(e){
                  alert('Mã hoặc link không hợp lệ: ' + e.message);
                }
              };
            }
          } else {
            msgEl.textContent = res.error;
          }
        } else {
          const confirmPwd = overlay.querySelector('#loginConfirmPwdInput').value;
          const res = await registerAccount(uname, pwd, confirmPwd);
          if(res.success){
            msgEl.style.color = '#16A34A';
            msgEl.textContent = '✓ Đã tạo tài khoản thành công!';
            setTimeout(()=>{
              close();
              if(onDone) onDone(res.user);
            }, 400);
          } else {
            msgEl.textContent = res.error;
          }
        }
      }catch(err){
        msgEl.textContent = 'Lỗi xử lý: ' + err.message;
      }finally{
        submitBtn.disabled = false;
      }
    };
  }

  renderModalContent();
  document.body.appendChild(overlay);
  setTimeout(()=>{
    const input = overlay.querySelector('#loginUnameInput');
    if(input) input.focus();
  }, 100);
}

/* ---------------------------- mastery / stats ---------------------------- */
function categoryMastery(cat){
  const list = Q_BY_CAT[cat] || [];
  const p = getProgress();
  let sum=0, attempted=0;
  list.forEach(q=>{
    const rec=p[q.n];
    if(rec && rec.last!==null){ attempted++; if(rec.last===1) sum+=1; }
  });
  return { mastery: list.length? sum/list.length : 0, attempted, total:list.length,
           accuracyOfAttempted: attempted? sum/attempted : null };
}

function overallCoverage(){
  const p = getProgress();
  let attempted=0;
  QUESTIONS.forEach(q=>{ if(p[q.n] && p[q.n].last!==null) attempted++; });
  return TOTAL_Q ? attempted/TOTAL_Q : 0;
}

function weightedReadiness(){
  let total=0;
  CAT_ORDER.forEach(cat=>{
    total += (WEIGHTS[cat]/100) * categoryMastery(cat).mastery;
  });
  return total; // 0..1
}

function readinessScore(){
  const base = weightedReadiness();
  const hist = getHistory().filter(h=>h.submitted);
  if(hist.length===0) return base;
  const recent = hist.slice(-3);
  const avgExam = recent.reduce((s,h)=>s+(h.scoredCorrect!==undefined?h.scoredCorrect/(h.scoredTotal||100):h.correctCount/h.total),0)/recent.length;
  return base*0.45 + avgExam*0.55;
}

function catTag(cat){

}
function fmtPct(x){ return Math.round(x*100)+'%'; }
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function weightedPick(list, n, preferWeak){
  if(list.length <= n) return shuffle(list);
  if(!preferWeak) return shuffle(list).slice(0,n);
  const p = getProgress();
  const scored = list.map(q=>{
    const rec = p[q.n];
    let w = 1.0;
    if(!rec || rec.last===null) w = 2.0;
    else if(rec.last===0) w = 3.5;
    else if(rec.w > rec.c) w = 2.5;
    else w = 0.5;
    return {q, w};
  });
  const picked = [];
  const pool = scored.slice();
  while(picked.length < n && pool.length){
    const totalW = pool.reduce((s,x)=>s+x.w, 0);
    let r = Math.random() * totalW;
    let chosenIdx = 0;
    for(let i=0;i<pool.length;i++){
      r -= pool[i].w;
      if(r <= 0){ chosenIdx = i; break; }
    }
    picked.push(pool[chosenIdx].q);
    pool.splice(chosenIdx, 1);
  }
  return picked;
}

function verdictInfo(){
  const score = readinessScore();
  const cov = overallCoverage();
  const weak = CAT_ORDER.filter(c => categoryMastery(c).mastery < 0.65);
  const cfg = getActiveBankConfig();

  if(cov < 0.35){
    return {level:'warn', title:`Mới bắt đầu ôn tập (${cfg.shortName})`,
      body:`Bạn đã luyện qua ${fmtPct(cov)} ngân hàng câu hỏi (${TOTAL_Q} câu). Hãy vào mục "Học bài" để làm quen toàn bộ nội dung theo từng chủ đề trước khi luyện tập tính điểm.`};
  }
  if(score >= 0.85 && weak.length===0){
    return {level:'good', title:'Bạn đã sẵn sàng đi thi! 🎉',
      body:`Điểm sẵn sàng ước tính ${fmtPct(score)}, vượt mốc đậu 70%. Duy trì phong độ bằng vài bài thi thử trước ngày thi để làm quen thời gian 2 tiếng.`};
  }
  if(score >= 0.70){
    return {level:'warn', title:'Khá tốt — còn vài lỗ hổng nhỏ',
      body:`Điểm sẵn sàng ${fmtPct(score)}. Tập trung ôn thêm: ${weak.map(c=>CATS[c]).join(', ') || 'không có chủ đề yếu rõ rệt'} rồi làm 1 bài thi thử để xác nhận.`};
  }
  return {level:'bad', title:'Cần luyện tập thêm nhiều',
    body:`Điểm sẵn sàng hiện tại ${fmtPct(score)}, dưới mốc đậu 70%. Ưu tiên các chủ đề chiếm điểm cao nhất: ${weak.slice(0,3).map(c=>CATS[c]).join(', ')}.`};
}

/* ============================================================
   SIGNATURE WHEEL
   ============================================================ */
function polar(cx,cy,r,angDeg){
  const rad=(angDeg-90)*Math.PI/180;
  return {x:cx+r*Math.cos(rad), y:cy+r*Math.sin(rad)};
}
function donutSegPath(cx,cy,rInner,rOuter,a0,a1){
  const p0=polar(cx,cy,rOuter,a0), p1=polar(cx,cy,rOuter,a1);
  const p2=polar(cx,cy,rInner,a1), p3=polar(cx,cy,rInner,a0);
  const large = (a1-a0) > 180 ? 1 : 0;
  return `M ${p0.x} ${p0.y} A ${rOuter} ${rOuter} 0 ${large} 1 ${p1.x} ${p1.y}
          L ${p2.x} ${p2.y} A ${rInner} ${rInner} 0 ${large} 0 ${p3.x} ${p3.y} Z`;
}
function renderWheel(){
  const size=220, cx=size/2, cy=size/2, rInner=34, rOuter=104;
  let ang=0; const gap=1.6;
  let svg=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
  CAT_ORDER.forEach(cat=>{
    const sweep = WEIGHTS[cat]/100*360;
    const a0=ang+gap/2, a1=ang+sweep-gap/2;
    const mastery = categoryMastery(cat).mastery;
    const rMid = rInner + (rOuter-rInner)*Math.max(mastery,0.04);
    svg += `<path d="${donutSegPath(cx,cy,rInner,rOuter,a0,a1)}" fill="${accentHex(cat)}" opacity="0.16"></path>`;
    svg += `<path d="${donutSegPath(cx,cy,rInner,rMid,a0,a1)}" fill="${accentHex(cat)}" data-cat="${cat}" class="wheel-seg" style="cursor:pointer"></path>`;
    ang += sweep;
  });
  svg += `</svg>`;
  const score = readinessScore();
  const legend = CAT_ORDER.map(cat=>{
    const m = categoryMastery(cat);
    return `<button class="legend-item" data-cat="${cat}">
      <span class="legend-dot" style="background:${accentHex(cat)}"></span>
      <span class="legend-name">${CATS[cat]} <span style="color:var(--ink-soft);font-weight:400">(${WEIGHTS[cat]}%)</span></span>
      <span class="legend-pct">${fmtPct(m.mastery)}</span>
    </button>`;
  }).join('');
  return `
    <div class="wheel-wrap">
      <div style="position:relative;flex:0 0 auto;">
        ${svg}
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;">
          <div class="readiness-num">${Math.round(score*100)}<sup>%</sup></div>
          <div style="font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;">Sẵn sàng</div>
        </div>
      </div>
      <div class="legend">${legend}</div>
    </div>`;
}
function bindWheelEvents(container){
  if(!container) return;
  container.querySelectorAll('.wheel-seg, .legend-item').forEach(el=>{

}

function renderFlashcard(body){
  const st = transient.study;
  if(st.idx >= st.deck.length) st.idx = 0;
  const q = st.deck[st.idx];
  const revealed = transient.flashRevealed===q.n;
  const selected = transient.flashSelected || [];
  const multi = isMultiAnswer(q);
  const cset = correctSet(q);

  body.innerHTML = `
    <div class="qcounter">Thẻ ${st.idx+1} / ${st.deck.length}</div>
    <div class="progress-track"><div class="progress-fill" style="width:${(st.idx/st.deck.length)*100}%"></div></div>
    ${multi ? '<div style="font-size:12px;color:var(--ink-soft);margin-bottom:6px;">Câu này có nhiều hơn 1 đáp án đúng — chọn tất cả đáp án đúng.</div>' : ''}
    <div class="card flashcard" style="box-shadow:none;">
      ${catTag(q.cat)}
      <p class="q-text">${escapeHtml(q.q)}</p>
      ${q.o.map((opt,i)=>{
        let cls='option';
        if(revealed){
          cls+=' disabled';
          if(cset.includes(i)) cls+=' correct';
          else if(selected.includes(i)) cls+=' wrong';
        } else if(selected.includes(i)){
          cls+=' selected';
        }
        return `<div class="${cls}" data-i="${i}">
          <span class="letter">${'ABCD'[i] || (i+1)}</span><span>${escapeHtml(opt)}</span>
        </div>`;
      }).join('')}
      ${revealed && q.note ? `
        <div style="margin-top:12px;padding:8px 12px;background:#FAF5E8;border-left:3px solid var(--accent-safety);border-radius:6px;font-size:13px;color:var(--ink);text-align:left;">
          💡 <strong>Ghi chú:</strong> ${escapeHtml(q.note)}
        </div>
      ` : ''}
    </div>
    ${!revealed ? `
    <div class="flash-actions">
      <button class="btn btn-primary" id="flipBtn" ${selected.length===0?'disabled':''}>Kiểm tra đáp án</button>
    </div>` : `
    <div class="flash-actions">
      <button class="btn btn-ghost" id="notYet">Chưa chắc, xem lại sau</button>
      <button class="btn btn-primary" id="knowIt">Đã thuộc ✓</button>
    </div>`}
  `;

  if(!revealed){
    body.querySelectorAll('.option').forEach(el=>{
      el.onclick=()=>{
        const i = parseInt(el.dataset.i);
        let sel = transient.flashSelected || [];
        if(multi){
          sel = sel.includes(i) ? sel.filter(x=>x!==i) : [...sel, i];
        } else {
          sel = [i];
        }
        transient.flashSelected = sel;
        renderFlashcard(body);
      };
    });
    const flipBtn = document.getElementById('flipBtn');
    if(flipBtn) flipBtn.onclick=()=>{
      if(selected.length===0) return;
      transient.flashRevealed=q.n;
      renderFlashcard(body);
    };
  } else {
    document.getElementById('notYet').onclick=()=>{ markFlash(q.n,false); nextCard(); };
    document.getElementById('knowIt').onclick=()=>{ markFlash(q.n,true); nextCard(); };
  }
  function nextCard(){
    transient.flashRevealed=null;
    transient.flashSelected=null;
    st.idx++;
    if(st.idx>=st.deck.length){ st.rebuild=true; }
    renderStudy();
  }
}

function highlightMatch(text, query){
  if(!query) return escapeHtml(text);
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if(idx===-1) return escapeHtml(text);
  const before = escapeHtml(text.slice(0, idx));
  const match = escapeHtml(text.slice(idx, idx+query.length));
  const after = escapeHtml(text.slice(idx+query.length));
  return `${before}<mark>${match}</mark>${after}`;
}

function renderOutlineItem(t, highlightQuery){
  const str = t || '';
  if(/^[A-Z]\.\s+/.test(str)){
    return `<li class="outline-sec-header">${highlightQuery ? highlightMatch(str, highlightQuery) : escapeHtml(str)}</li>`;
  }
  if(/^\d+\.\s+/.test(str)){
    return `<li class="outline-sub-header">${highlightQuery ? highlightMatch(str, highlightQuery) : escapeHtml(str)}</li>`;
  }
  if(str.startsWith('Lưu ý') || str.startsWith('Nguồn')){
    return `<li class="outline-note">⚠️ <b>${highlightQuery ? highlightMatch(str, highlightQuery) : escapeHtml(str)}</b></li>`;
  }
  let body = str;
  if(body.startsWith('•')){
    body = body.slice(1).trim();
  }
  if(body.includes(':')){
    const idx = body.indexOf(':');
    const term = body.slice(0, idx).trim();
    const def = body.slice(idx + 1);
    const renderedTerm = highlightQuery ? highlightMatch(term, highlightQuery) : escapeHtml(term);
    const renderedDef = highlightQuery ? highlightMatch(def, highlightQuery) : escapeHtml(def);
    return `<li class="outline-item">• <strong class="term-highlight">${renderedTerm}:</strong>${renderedDef}</li>`;
  }
  return `<li class="outline-item">• ${highlightQuery ? highlightMatch(body, highlightQuery) : escapeHtml(body)}</li>`;
}

function renderSummaryResults(el, query, currentCat){
  const q = (query||'').trim().toLowerCase();
  if(!q){
    if(currentCat === 'all'){
      let html = '';
      CAT_ORDER.forEach(c=>{
        const items = OUTLINE[c]||[];
        if(items.length){
          html += `<div class="section-label" style="margin-top:18px;font-size:15px;">${CATS[c]}</div>`;
          html += `<ul class="outline-list">${items.map(t=>renderOutlineItem(t)).join('')}</ul>`;
        }
      });
      el.innerHTML = html || `<div class="empty-state">Chưa có tóm tắt lý thuyết.</div>`;
      return;
    }
    const items = OUTLINE[currentCat]||[];
    el.innerHTML = items.length ? `<ul class="outline-list">${items.map(t=>renderOutlineItem(t)).join('')}</ul>`
      : `<div class="empty-state">Chưa có tóm tắt cho chủ đề này.</div>`;
    return;
  }
  let html = '';
  let total = 0;
  CAT_ORDER.forEach(c=>{
    const items = OUTLINE[c]||[];
    const matches = items.filter(t=>t.toLowerCase().includes(q));
    if(matches.length){
      total += matches.length;
      html += `<div class="section-label" style="margin-top:18px;font-size:15px;">${CATS[c]} <span style="color:var(--ink-soft);font-weight:400;">(${matches.length})</span></div>`;
      html += `<ul class="outline-list">${matches.map(t=>renderOutlineItem(t, q)).join('')}</ul>`;
    }
  });
  el.innerHTML = total ? html : `<div class="empty-state">Không tìm thấy kết quả nào cho "${escapeHtml(query)}".</div>`;
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

      }
      renderPracticeSetup();
    };
  }

  app.querySelectorAll('[data-count-btn]').forEach(b=>{
    b.addEventListener('click', ()=>{

      ps.count = val;
      renderPracticeSetup();
