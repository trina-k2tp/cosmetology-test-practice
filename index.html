c từ gốc móng (biểu bì) rãnh kéo xuống 2 bên mặt bên của móng", "Phần đầu ngón tay", "Cục xương gồ lên ở mu bàn tay", "Lớp sừng dưới đầu móng"], "c": 0, "raw": "Câu 100: \"Side wall\" (Tường móng) là bộ phận nào trên tay?\nA. Lớp da dọc từ gốc móng (biểu bì) rãnh kéo xuống 2 bên mặt bên của móng\nB. Phần đầu ngón tay\nC. Cục xương gồ lên ở mu bàn tay\nD. Lớp sừng dưới đầu móng\nĐáp án đúng: A\n\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 101, "q": "Gỡ móng bột (Acrylic nail) ĐÚNG CÁCH là làm thế nào?", "o": ["Ngâm vào dung dịch Acetone cho bột tan ra mềm dần, sau đó dùng que gỗ hoặc cây đẩy biểu bì gạt nhẹ (Tuyệt đối KHÔNG được nạy/cạy móng lên bằng kềm)", "Dùng kềm bấm đứt móng rồi xé ra", "Dùng dũa sắt chà mạnh cho đến khi thấy móng thật", "Ngâm vào nước nóng 1 tiếng"], "c": 0, "raw": "Câu 101: Gỡ móng bột (Acrylic nail) ĐÚNG CÁCH là làm thế nào?\nA. Ngâm vào dung dịch Acetone cho bột tan ra mềm dần, sau đó dùng que gỗ hoặc cây đẩy biểu bì gạt nhẹ (Tuyệt đối KHÔNG được nạy/cạy móng lên bằng kềm)\nB. Dùng kềm bấm đứt móng rồi xé ra\nC. Dùng dũa sắt chà mạnh cho đến khi thấy móng thật\nD. Ngâm vào nước nóng 1 tiếng\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 102, "q": "Khi gắn móng tip (Móng giả nối dài), bạn đặt móng như thế nào?", "o": ["Đặt từ từ trượt lên vị trí rãnh chặn (Stop, Rock, Hold - Giữ 5-10 giây), keo phải phủ đầy từ mép rãnh này qua mép kia của đầu móng", "Đặt đè lên toàn bộ móng thật", "Đặt vuông góc 90 độ", "Chỉ chấm keo 1 điểm ở giữa"], "c": 0, "raw": "Câu 102: Khi gắn móng tip (Móng giả nối dài), bạn đặt móng như thế nào?\nA. Đặt từ từ trượt lên vị trí rãnh chặn (Stop, Rock, Hold - Giữ 5-10 giây), keo phải phủ đầy từ mép rãnh này qua mép kia của đầu móng\nB. Đặt đè lên toàn bộ móng thật\nC. Đặt vuông góc 90 độ\nD. Chỉ chấm keo 1 điểm ở giữa\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 103, "q": "Tại sao trước khi bôi thuốc Trung hòa (Neutralizer) trong dịch vụ uốn tóc, cần thấm thật khô nước trên các lô cuốn (Towel blot)?", "o": ["Nếu tóc còn nhiều nước sẽ làm loãng thuốc trung hòa, khiến tóc không tái tạo được liên kết, lọn tóc sẽ bị duỗi ra (không xoăn chặt)", "Để làm mát da đầu", "Để tiết kiệm thuốc", "Để tóc có màu sáng hơn"], "c": 0, "raw": "Câu 103: Tại sao trước khi bôi thuốc Trung hòa (Neutralizer) trong dịch vụ uốn tóc, cần thấm thật khô nước trên các lô cuốn (Towel blot)?\nA. Nếu tóc còn nhiều nước sẽ làm loãng thuốc trung hòa, khiến tóc không tái tạo được liên kết, lọn tóc sẽ bị duỗi ra (không xoăn chặt)\nB. Để làm mát da đầu\nC. Để tiết kiệm thuốc\nD. Để tóc có màu sáng hơn\nĐáp án đúng: A\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 104, "q": "Kem lót trang điểm/Che khuyết điểm (Concealer) thường dùng để làm gì?", "o": ["Che bọng mắt, quầng thâm, và các khiếm khuyết trên da", "Làm bóng môi", "Vẽ viền lông mày", "Đánh phấn má hồng"], "c": 0, "raw": "Câu 104: Kem lót trang điểm/Che khuyết điểm (Concealer) thường dùng để làm gì?\nA. Che bọng mắt, quầng thâm, và các khiếm khuyết trên da\nB. Làm bóng môi\nC. Vẽ viền lông mày\nD. Đánh phấn má hồng\nĐáp án đúng: A\n\n", "cat": "lash_brow", "sec": "8. Lông mi và lông mày"}, {"n": 105, "q": "Làm thế nào để tránh tình trạng dung dịch khử trùng (Quats) bị nhiễm bẩn (Cloudy/Vẩn đục)?", "o": ["Phải rửa vệ sinh dụng cụ bằng xà bông và nước sạch sẽ TRƯỚC KHI cho vào bồn ngâm khử trùng", "Pha thêm nhiều nước", "Đổ thêm cồn vào", "Đun sôi dung dịch"], "c": 0, "raw": "Câu 105: Làm thế nào để tránh tình trạng dung dịch khử trùng (Quats) bị nhiễm bẩn (Cloudy/Vẩn đục)?\nA. Phải rửa vệ sinh dụng cụ bằng xà bông và nước sạch sẽ TRƯỚC KHI cho vào bồn ngâm khử trùng\nB. Pha thêm nhiều nước\nC. Đổ thêm cồn vào\nD. Đun sôi dung dịch\nĐáp án đúng: A\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 106, "q": "Cắt loại bỏ bớt trọng lượng tóc (làm mỏng) thực hiện trên nền tóc nào là tốt nhất?", "o": ["Cắt trên TÓC KHÔ (để thấy rõ độ phồng và độ rủ tự nhiên của tóc)", "Cắt trên tóc ướt sũng", "Cắt trên tóc đang ngâm thuốc nhuộm", "Cắt trên tóc mới uốn xong chưa xả"], "c": 0, "raw": "Câu 106: Cắt loại bỏ bớt trọng lượng tóc (làm mỏng) thực hiện trên nền tóc nào là tốt nhất?\nA. Cắt trên TÓC KHÔ (để thấy rõ độ phồng và độ rủ tự nhiên của tóc)\nB. Cắt trên tóc ướt sũng\nC. Cắt trên tóc đang ngâm thuốc nhuộm\nD. Cắt trên tóc mới uốn xong chưa xả\nĐáp án đúng: A\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 107, "q": "Dầu gội có chứa chất \"Chelating\" dùng để làm gì?", "o": ["Dùng để phá vỡ và khử các khoáng chất/kim loại tích tụ trên tóc (Clarifying)", "Dùng để làm tóc mọc nhanh", "Dùng làm dầu gội khô", "Dùng trị rụng tóc"], "c": 0, "raw": "Câu 107: Dầu gội có chứa chất \"Chelating\" dùng để làm gì?\nA. Dùng để phá vỡ và khử các khoáng chất/kim loại tích tụ trên tóc (Clarifying)\nB. Dùng để làm tóc mọc nhanh\nC. Dùng làm dầu gội khô\nD. Dùng trị rụng tóc\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 108, "q": "Khi nhổ lông hoặc tẩy lông mày, người thợ có thể sử dụng dụng cụ gì để tạm thời nhổ đi các sợi lông ngoài ý muốn?", "o": ["Nhíp (Tweezers)", "Tông đơ", "Kéo cắt tóc", "Kềm bấm móng"], "c": 0, "raw": "Câu 108: Khi nhổ lông hoặc tẩy lông mày, người thợ có thể sử dụng dụng cụ gì để tạm thời nhổ đi các sợi lông ngoài ý muốn?\nA. Nhíp (Tweezers)\nB. Tông đơ\nC. Kéo cắt tóc\nD. Kềm bấm móng\nĐáp án đúng: A\n\n", "cat": "waxing", "sec": "9. Triệt lông"}, {"n": 109, "q": "Mức độ cắt tóc 90 độ (Uniform/Tầng đồng lớp) có tạo ra kiểu dáng như thế nào?", "o": ["Tạo ra kiểu tóc có tầng đồng đều, tất cả các sợi tóc đều có chiều dài bằng nhau so với da đầu (Layer)", "Tạo kiểu tóc cạo gáy", "Tạo kiểu Bob ngang cằm", "Tạo kiểu rớt dài 1 bên"], "c": 0, "raw": "Câu 109: Mức độ cắt tóc 90 độ (Uniform/Tầng đồng lớp) có tạo ra kiểu dáng như thế nào?\nA. Tạo ra kiểu tóc có tầng đồng đều, tất cả các sợi tóc đều có chiều dài bằng nhau so với da đầu (Layer)\nB. Tạo kiểu tóc cạo gáy\nC. Tạo kiểu Bob ngang cằm\nD. Tạo kiểu rớt dài 1 bên\nĐáp án đúng: A\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 110, "q": "Bệnh vảy gàu (Dandruff) nguyên nhân chủ yếu do đâu?", "o": ["Do một loại nấm trên da đầu (Pityrosporum ovale / Malassezia)", "Do dùng máy sấy quá nóng", "Do gội đầu hằng ngày", "Do uốn tóc nhiều"], "c": 0, "raw": "Câu 110: Bệnh vảy gàu (Dandruff) nguyên nhân chủ yếu do đâu?\nA. Do một loại nấm trên da đầu (Pityrosporum ovale / Malassezia)\nB. Do dùng máy sấy quá nóng\nC. Do gội đầu hằng ngày\nD. Do uốn tóc nhiều\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 111, "q": "Hai màu nằm đối diện nhau trên Bánh xe màu (Color wheel) được gọi là gì?", "o": ["Màu trung tính / Màu bổ sung (Complementary colors). Khi trộn chúng sẽ triệt tiêu/trung hòa lẫn nhau (vd: Vàng khử Tím, Đỏ khử Xanh lá, Cam khử Xanh dương)", "Màu thứ cấp (Secondary)", "Màu cơ bản (Primary)", "Màu ấm (Warm)"], "c": 0, "raw": "Câu 111: Hai màu nằm đối diện nhau trên Bánh xe màu (Color wheel) được gọi là gì?\nA. Màu trung tính / Màu bổ sung (Complementary colors). Khi trộn chúng sẽ triệt tiêu/trung hòa lẫn nhau (vd: Vàng khử Tím, Đỏ khử Xanh lá, Cam khử Xanh dương)\nB. Màu thứ cấp (Secondary)\nC. Màu cơ bản (Primary)\nD. Màu ấm (Warm)\nĐáp án đúng: A\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 112, "q": "Temporary color (Màu nhuộm tạm thời) có đặc điểm gì?", "o": ["Là màu sắc tạm thời, phân tử màu lớn chỉ bám ngoài biểu bì, sẽ bị rửa trôi chỉ sau 1 lần gội đầu", "Cần phải pha với Oxy (Developer)", "Thấm sâu vào lớp tủy tóc", "Tồn tại được 1 tháng"], "c": 0, "raw": "Câu 112: Temporary color (Màu nhuộm tạm thời) có đặc điểm gì?\nA. Là màu sắc tạm thời, phân tử màu lớn chỉ bám ngoài biểu bì, sẽ bị rửa trôi chỉ sau 1 lần gội đầu\nB. Cần phải pha với Oxy (Developer)\nC. Thấm sâu vào lớp tủy tóc\nD. Tồn tại được 1 tháng\nĐáp án đúng: A\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 113, "q": "Tóc có xu hướng mọc ngược lại chiều hướng tự nhiên thường là loại tóc gì?", "o": ["Tóc quăn / xoăn tít (Curly/Coily) hoặc vùng có xoáy rối (Cowlick)", "Tóc tẩy", "Tóc thẳng đuột", "Tóc đã ép phồng"], "c": 0, "raw": "Câu 113: Tóc có xu hướng mọc ngược lại chiều hướng tự nhiên thường là loại tóc gì?\nA. Tóc quăn / xoăn tít (Curly/Coily) hoặc vùng có xoáy rối (Cowlick)\nB. Tóc tẩy\nC. Tóc thẳng đuột\nD. Tóc đã ép phồng\nĐáp án đúng: A\n\n", "cat": "styling", "sec": "3. Tạo kiểu tóc"}, {"n": 114, "q": "Trải màu nhuộm lên tóc giả (Tóc tổng hợp) có khác biệt gì?", "o": ["Bảng màu cho tóc tổng hợp được định sẵn (khoảng 70 màu của nhà sản xuất). KHÔNG DÙNG màu nhuộm oxi hóa của tóc người lên tóc tổng hợp", "Nhuộm y như tóc thật", "Chỉ cần dùng thuốc tẩy", "Tóc tổng hợp không có màu"], "c": 0, "raw": "Câu 114: Trải màu nhuộm lên tóc giả (Tóc tổng hợp) có khác biệt gì?\nA. Bảng màu cho tóc tổng hợp được định sẵn (khoảng 70 màu của nhà sản xuất). KHÔNG DÙNG màu nhuộm oxi hóa của tóc người lên tóc tổng hợp\nB. Nhuộm y như tóc thật\nC. Chỉ cần dùng thuốc tẩy\nD. Tóc tổng hợp không có màu\nĐáp án đúng: A\n\n", "cat": "styling", "sec": "3. Tạo kiểu tóc"}, {"n": 115, "q": "Trong tạo kiểu/đính tóc giả, \"Khâu khóa đôi\" (Double-lock stitch) là gì?", "o": ["Một mũi khâu mà sợi chỉ được quấn xung quanh kim 2 lần để khóa chặt mép dệt, tránh tuột", "Cột 2 chùm tóc lại với nhau", "Dán băng keo 2 mặt", "Khâu bằng kim băng"], "c": 0, "raw": "Câu 115: Trong tạo kiểu/đính tóc giả, \"Khâu khóa đôi\" (Double-lock stitch) là gì?\nA. Một mũi khâu mà sợi chỉ được quấn xung quanh kim 2 lần để khóa chặt mép dệt, tránh tuột\nB. Cột 2 chùm tóc lại với nhau\nC. Dán băng keo 2 mặt\nD. Khâu bằng kim băng\nĐáp án đúng: A\n\n", "cat": "styling", "sec": "3. Tạo kiểu tóc"}, {"n": 116, "q": "Phương pháp liên kết nối tóc dài (Fusion / Bonding) sử dụng vật liệu gì?", "o": ["Dùng keo kết dính (Adhesive) và máy nhiệt để làm chảy keo nối lọn tóc giả vào tóc thật", "Dùng ghim cài", "Dùng nam châm", "Dùng dây thun"], "c": 0, "raw": "Câu 116: Phương pháp liên kết nối tóc dài (Fusion / Bonding) sử dụng vật liệu gì?\nA. Dùng keo kết dính (Adhesive) và máy nhiệt để làm chảy keo nối lọn tóc giả vào tóc thật\nB. Dùng ghim cài\nC. Dùng nam châm\nD. Dùng dây thun\nĐáp án đúng: A\n\n", "cat": "styling", "sec": "3. Tạo kiểu tóc"}, {"n": 117, "q": "Khử trùng dụng cụ trong thời gian bao lâu để đảm bảo tiêu diệt vi khuẩn theo chuẩn EPA?", "o": ["Ngâm ngập dung dịch trong thời gian quy định theo hướng dẫn của nhà sản xuất (Manufacturer's direction) - Thường là 10 phút.", "1 giây", "1 giờ", "Qua đêm"], "c": 0, "raw": "Câu 117: Khử trùng dụng cụ trong thời gian bao lâu để đảm bảo tiêu diệt vi khuẩn theo chuẩn EPA?\nA. Ngâm ngập dung dịch trong thời gian quy định theo hướng dẫn của nhà sản xuất (Manufacturer's direction) - Thường là 10 phút.\nB. 1 giây\nC. 1 giờ\nD. Qua đêm\nĐáp án đúng: A\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 118, "q": "Trước khi cắt/tạo kiểu cho móng, để tránh bị bụi móng tay vô mắt thợ nên làm gì?", "o": ["Đeo kính an toàn (Safety glasses)", "Nắm mắt lại", "Cắt móng trong bồn nước", "Không cần làm gì"], "c": 0, "raw": "Câu 118: Trước khi cắt/tạo kiểu cho móng, để tránh bị bụi móng tay vô mắt thợ nên làm gì?\nA. Đeo kính an toàn (Safety glasses)\nB. Nắm mắt lại\nC. Cắt móng trong bồn nước\nD. Không cần làm gì\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 119, "q": "Màu nhuộm nào KHÔNG cần pha trộn với dung dịch phát triển (Developer/H2O2)?", "o": ["Màu Bán vĩnh viễn (Semi-permanent) và Màu tạm thời (Temporary)", "Màu Vĩnh viễn (Permanent)", "Bột tẩy (Lightener)", "Màu Demi-permanent"], "c": 0, "raw": "Câu 119: Màu nhuộm nào KHÔNG cần pha trộn với dung dịch phát triển (Developer/H2O2)?\nA. Màu Bán vĩnh viễn (Semi-permanent) và Màu tạm thời (Temporary)\nB. Màu Vĩnh viễn (Permanent)\nC. Bột tẩy (Lightener)\nD. Màu Demi-permanent\nĐáp án đúng: A\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 120, "q": "Thời kỳ mọc tóc (Anagen / Giai đoạn phát triển) diễn ra trong bao lâu?", "o": ["Kéo dài từ 3 năm tới 5 năm", "1 tháng", "10 năm", "1 ngày"], "c": 0, "raw": "Câu 120: Thời kỳ mọc tóc (Anagen / Giai đoạn phát triển) diễn ra trong bao lâu?\nA. Kéo dài từ 3 năm tới 5 năm\nB. 1 tháng\nC. 10 năm\nD. 1 ngày\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 121, "q": "Trước khi bắt đầu làm móng tay (Manicure), ngâm tay khách vào nước ấm xà phòng để làm gì?", "o": ["Làm mềm da biểu bì (Cuticle) và các tế bào chết quanh móng để dễ đẩy/cắt", "Làm cho lớp sơn bong ra", "Để khách rửa tay cho sạch mồ hôi", "Làm mềm móng để dễ bẻ cong"], "c": 0, "raw": "Câu 121: Trước khi bắt đầu làm móng tay (Manicure), ngâm tay khách vào nước ấm xà phòng để làm gì?\nA. Làm mềm da biểu bì (Cuticle) và các tế bào chết quanh móng để dễ đẩy/cắt\nB. Làm cho lớp sơn bong ra\nC. Để khách rửa tay cho sạch mồ hôi\nD. Làm mềm móng để dễ bẻ cong\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 122, "q": "Lớp da mỏng châm (phủ) trên móng, cản trở việc sơn móng được gọi là gì?", "o": ["Nail Pterygium (Màng thịt móng tay) hoặc Cuticle dư thừa bò lên nền móng", "Hyponychium", "Matrix", "Lunula"], "c": 0, "raw": "Câu 122: Lớp da mỏng châm (phủ) trên móng, cản trở việc sơn móng được gọi là gì?\nA. Nail Pterygium (Màng thịt móng tay) hoặc Cuticle dư thừa bò lên nền móng\nB. Hyponychium\nC. Matrix\nD. Lunula\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 123, "q": "Nếu khách bị trầy xước và bọng nước sau dịch vụ thì có thể là do nguyên nhân gì?", "o": ["Dị ứng hóa chất, bỏng nhiệt độ sáp wax hoặc dùng dũa ma sát quá mạnh", "Khách uống ít nước", "Do dùng kem dưỡng ẩm", "Do không massage"], "c": 0, "raw": "Câu 123: Nếu khách bị trầy xước và bọng nước sau dịch vụ thì có thể là do nguyên nhân gì?\nA. Dị ứng hóa chất, bỏng nhiệt độ sáp wax hoặc dùng dũa ma sát quá mạnh\nB. Khách uống ít nước\nC. Do dùng kem dưỡng ẩm\nD. Do không massage\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 124, "q": "Đánh giá móng trước khi phục vụ (Nail Analysis) nhằm mục đích gì?", "o": ["Kiểm tra xem móng có khỏe mạnh không, có bị nấm, nhiễm trùng hay có bệnh lý cần từ chối phục vụ không", "Để đoán tuổi khách", "Để tính giá tiền cao hơn", "Xem móng có phải móng giả không"], "c": 0, "raw": "Câu 124: Đánh giá móng trước khi phục vụ (Nail Analysis) nhằm mục đích gì?\nA. Kiểm tra xem móng có khỏe mạnh không, có bị nấm, nhiễm trùng hay có bệnh lý cần từ chối phục vụ không\nB. Để đoán tuổi khách\nC. Để tính giá tiền cao hơn\nD. Xem móng có phải móng giả không\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 125, "q": "Nếu muốn tạo độ phồng tối đa ở chân tóc khi sấy (Volume base), bạn nâng lược chải tóc ở góc độ nào?", "o": ["Nâng tóc kéo ngược lên góc 180 độ so với da đầu (Overdirection)", "Chải ép thẳng tóc xuống 0 độ", "Cắt phần ngọn tóc", "Sấy lạnh"], "c": 0, "raw": "Câu 125: Nếu muốn tạo độ phồng tối đa ở chân tóc khi sấy (Volume base), bạn nâng lược chải tóc ở góc độ nào?\nA. Nâng tóc kéo ngược lên góc 180 độ so với da đầu (Overdirection)\nB. Chải ép thẳng tóc xuống 0 độ\nC. Cắt phần ngọn tóc\nD. Sấy lạnh\nĐáp án đúng: A\n\n", "cat": "styling", "sec": "3. Tạo kiểu tóc"}, {"n": 126, "q": "Tại sao khi bôi thuốc uốn (Perm solution), thợ thẩm mỹ nên tránh làm dây thuốc ra vùng da cổ và mặt khách?", "o": ["Hóa chất kiềm trong thuốc uốn có thể gây kích ứng, đỏ da, phỏng hóa chất. (Cần bôi kem nền bảo vệ - base cream/petroleum - và kẹp bông gòn quanh viền tóc)", "Làm cho lông mặt bị xoăn", "Gây sạm nám da", "Làm khách bị ngộp thở"], "c": 0, "raw": "Câu 126: Tại sao khi bôi thuốc uốn (Perm solution), thợ thẩm mỹ nên tránh làm dây thuốc ra vùng da cổ và mặt khách?\nA. Hóa chất kiềm trong thuốc uốn có thể gây kích ứng, đỏ da, phỏng hóa chất. (Cần bôi kem nền bảo vệ - base cream/petroleum - và kẹp bông gòn quanh viền tóc)\nB. Làm cho lông mặt bị xoăn\nC. Gây sạm nám da\nD. Làm khách bị ngộp thở\nĐáp án đúng: A\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 127, "q": "Bệnh sùi mào gà/Mụn cóc (Warts/Verruca) gây ra do vi khuẩn hay virus?", "o": ["Gây ra do Virus (HPV). Cực kỳ dễ lây lan, thợ phải từ chối dịch vụ nếu thấy nốt sùi ở bàn tay/chân.", "Gây ra do nấm men", "Do cơ địa dị ứng", "Do cháy nắng"], "c": 0, "raw": "Câu 127: Bệnh sùi mào gà/Mụn cóc (Warts/Verruca) gây ra do vi khuẩn hay virus?\nA. Gây ra do Virus (HPV). Cực kỳ dễ lây lan, thợ phải từ chối dịch vụ nếu thấy nốt sùi ở bàn tay/chân.\nB. Gây ra do nấm men\nC. Do cơ địa dị ứng\nD. Do cháy nắng\nĐáp án đúng: A\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 128, "q": "Lớp tủy tóc (Medulla) nằm ở đâu và có chức năng gì?", "o": ["Là lớp lõi trong cùng của sợi tóc. Thường không có chức năng quan trọng và tóc mỏng, mịn thường thiếu lớp này", "Lớp biểu bì bọc ngoài", "Lớp chứa sắc tố melanin", "Lớp tạo độ xoăn cho tóc"], "c": 0, "raw": "Câu 128: Lớp tủy tóc (Medulla) nằm ở đâu và có chức năng gì?\nA. Là lớp lõi trong cùng của sợi tóc. Thường không có chức năng quan trọng và tóc mỏng, mịn thường thiếu lớp này\nB. Lớp biểu bì bọc ngoài\nC. Lớp chứa sắc tố melanin\nD. Lớp tạo độ xoăn cho tóc\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 129, "q": "Nếu khách muốn tóc bớt phồng (giảm trọng lượng), thợ nên cắt bằng kỹ thuật gì?", "o": ["Dùng kéo tỉa mỏng (Thinning shears) cắt ở phần thân tóc/ngọn tóc", "Cắt ngang tạo đường thẳng", "Cạo sát da đầu", "Uốn xù"], "c": 0, "raw": "Câu 129: Nếu khách muốn tóc bớt phồng (giảm trọng lượng), thợ nên cắt bằng kỹ thuật gì?\nA. Dùng kéo tỉa mỏng (Thinning shears) cắt ở phần thân tóc/ngọn tóc\nB. Cắt ngang tạo đường thẳng\nC. Cạo sát da đầu\nD. Uốn xù\nĐáp án đúng: A\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 130, "q": "Để thử độ dị ứng của sáp wax (Waxing) trên da khách, thời gian thử nghiệm là bao lâu?", "o": ["7 tới 10 phút", "24 tới 48 tiếng", "1 tiếng", "24 phút"], "c": 0, "raw": "Câu 130: Để thử độ dị ứng của sáp wax (Waxing) trên da khách, thời gian thử nghiệm là bao lâu?\nA. 7 tới 10 phút\nB. 24 tới 48 tiếng\nC. 1 tiếng\nD. 24 phút\nĐáp án đúng: A\n\n", "cat": "waxing", "sec": "9. Triệt lông"}, {"n": 131, "q": "Khi thử độ dị ứng của thuốc nhuộm tóc (PD test / Patch test), thời gian yêu cầu là bao lâu?", "o": ["24 đến 48 tiếng", "5 đến 10 phút", "1 giờ", "12 tiếng"], "c": 0, "raw": "Câu 131: Khi thử độ dị ứng của thuốc nhuộm tóc (PD test / Patch test), thời gian yêu cầu là bao lâu?\nA. 24 đến 48 tiếng\nB. 5 đến 10 phút\nC. 1 giờ\nD. 12 tiếng\nĐáp án đúng: A\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 132, "q": "Nước được sử dụng trong salon chia làm 2 loại. Loại nước nào có ít khoáng chất, tạo nhiều bọt và tốt cho tóc?", "o": ["Nước mềm (Soft water)", "Nước cứng / Nước phèn (Hard water)", "Nước cất", "Nước muối"], "c": 0, "raw": "Câu 132: Nước được sử dụng trong salon chia làm 2 loại. Loại nước nào có ít khoáng chất, tạo nhiều bọt và tốt cho tóc?\nA. Nước mềm (Soft water)\nB. Nước cứng / Nước phèn (Hard water)\nC. Nước cất\nD. Nước muối\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 133, "q": "Miếng bông gòn che mắt (hình cánh bướm) dùng trong chăm sóc da mặt được xếp với kích cỡ bao nhiêu?", "o": ["2 inch x 2 inch", "1 inch x 1 inch", "3 inch x 3 inch", "4 inch x 4 inch"], "c": 0, "raw": "Câu 133: Miếng bông gòn che mắt (hình cánh bướm) dùng trong chăm sóc da mặt được xếp với kích cỡ bao nhiêu?\nA. 2 inch x 2 inch\nB. 1 inch x 1 inch\nC. 3 inch x 3 inch\nD. 4 inch x 4 inch\nĐáp án đúng: A\n\n", "cat": "skincare", "sec": "7. Chăm sóc da"}, {"n": 134, "q": "Khoảng cách an toàn khi sử dụng máy xông hơi mặt (Steamer) là bao nhiêu?", "o": ["14 - 18 inches", "5 - 10 inches", "20 - 25 inches", "Sát vào mặt khách"], "c": 0, "raw": "Câu 134: Khoảng cách an toàn khi sử dụng máy xông hơi mặt (Steamer) là bao nhiêu?\nA. 14 - 18 inches\nB. 5 - 10 inches\nC. 20 - 25 inches\nD. Sát vào mặt khách\nĐáp án đúng: A\n\n", "cat": "skincare", "sec": "7. Chăm sóc da"}, {"n": 135, "q": "Phương pháp tẩy lông nào được công nhận là triệt lông vĩnh viễn?", "o": ["Điện phân (Electrolysis)", "Sáp nóng (Hot wax)", "Nhíp nhổ (Tweezing)", "Hóa chất rụng lông (Depilatory)"], "c": 0, "raw": "Câu 135: Phương pháp tẩy lông nào được công nhận là triệt lông vĩnh viễn?\nA. Điện phân (Electrolysis)\nB. Sáp nóng (Hot wax)\nC. Nhíp nhổ (Tweezing)\nD. Hóa chất rụng lông (Depilatory)\nĐáp án đúng: A\n\n", "cat": "waxing", "sec": "9. Triệt lông"}, {"n": 136, "q": "Hóa chất làm rụng lông tạm thời (thường thoa lên da để làm tan sợi lông) có tên kỹ thuật là gì?", "o": ["Depilatory", "Astringent", "Antiseptic", "Epilator"], "c": 0, "raw": "Câu 136: Hóa chất làm rụng lông tạm thời (thường thoa lên da để làm tan sợi lông) có tên kỹ thuật là gì?\nA. Depilatory\nB. Astringent\nC. Antiseptic\nD. Epilator\nĐáp án đúng: A\n\n", "cat": "waxing", "sec": "9. Triệt lông"}, {"n": 137, "q": "Khi làm dịch vụ tẩy lông, KHÔNG ĐƯỢC thực hiện thao tác wax trên vùng da nào?", "o": ["Trên nốt ruồi có lông, da bị mụn đang xài Accutane, hoặc da trầy xước", "Trên cánh tay", "Trên nách", "Trên cẳng chân"], "c": 0, "raw": "Câu 137: Khi làm dịch vụ tẩy lông, KHÔNG ĐƯỢC thực hiện thao tác wax trên vùng da nào?\nA. Trên nốt ruồi có lông, da bị mụn đang xài Accutane, hoặc da trầy xước\nB. Trên cánh tay\nC. Trên nách\nD. Trên cẳng chân\nĐáp án đúng: A\n\n", "cat": "waxing", "sec": "9. Triệt lông"}, {"n": 138, "q": "Khi cắt kéo, ngón tay nào của người thợ di chuyển nhiều nhất?", "o": ["Ngón cái (Thumb)", "Ngón trỏ", "Ngón giữa", "Ngón áp út (Ring finger)"], "c": 0, "raw": "Câu 138: Khi cắt kéo, ngón tay nào của người thợ di chuyển nhiều nhất?\nA. Ngón cái (Thumb)\nB. Ngón trỏ\nC. Ngón giữa\nD. Ngón áp út (Ring finger)\nĐáp án đúng: A\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 139, "q": "Bảng Dữ liệu An toàn Sản phẩm (SDS / MSDS) cung cấp mọi thông tin về sản phẩm hóa chất NGOẠI TRỪ thông tin nào?", "o": ["Ngày hết hạn của sản phẩm (Expiration date) và bao bì sản phẩm", "Thành phần nguy hiểm", "Cách sơ cứu khi phơi nhiễm", "Tên nhà sản xuất"], "c": 0, "raw": "Câu 139: Bảng Dữ liệu An toàn Sản phẩm (SDS / MSDS) cung cấp mọi thông tin về sản phẩm hóa chất NGOẠI TRỪ thông tin nào?\nA. Ngày hết hạn của sản phẩm (Expiration date) và bao bì sản phẩm\nB. Thành phần nguy hiểm\nC. Cách sơ cứu khi phơi nhiễm\nD. Tên nhà sản xuất\nĐáp án đúng: A\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 140, "q": "Móng có vệt rãnh sọc ngang trên mặt móng được gọi là gì?", "o": ["Beau's line", "Hangnail (Agnail)", "Bruised nail (Móng bầm)", "Eggshell nail"], "c": 0, "raw": "Câu 140: Móng có vệt rãnh sọc ngang trên mặt móng được gọi là gì?\nA. Beau's line\nB. Hangnail (Agnail)\nC. Bruised nail (Móng bầm)\nD. Eggshell nail\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 141, "q": "Móng có hiện tượng bầm tím, tụ máu dưới nền móng là do nguyên nhân gì?", "o": ["Do tổn thương nền móng (Bruised nail)", "Do nấm móng", "Do thiếu vitamin", "Do sơn móng quá nhiều"], "c": 0, "raw": "Câu 141: Móng có hiện tượng bầm tím, tụ máu dưới nền móng là do nguyên nhân gì?\nA. Do tổn thương nền móng (Bruised nail)\nB. Do nấm móng\nC. Do thiếu vitamin\nD. Do sơn móng quá nhiều\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 142, "q": "Thuốc tẩy gia dụng (Household bleach) được xếp vào loại chất gì trong salon?", "o": ["Là một loại chất khử trùng (Disinfectant) có thể sử dụng", "Là chất dưỡng ẩm", "Là thuốc nhuộm tóc", "Là nước xả vải"], "c": 0, "raw": "Câu 142: Thuốc tẩy gia dụng (Household bleach) được xếp vào loại chất gì trong salon?\nA. Là một loại chất khử trùng (Disinfectant) có thể sử dụng\nB. Là chất dưỡng ẩm\nC. Là thuốc nhuộm tóc\nD. Là nước xả vải\nĐáp án đúng: A\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 14 n": 147, "q": "Móng tay và móng chân mọc nhanh nhất vào mùa nào trong năm?", "o": ["Mùa hè", "Mùa đông", "Mùa thu", "Mùa xuân"], "c": 0, "raw": "Câu 147: Móng tay và móng chân mọc nhanh nhất vào mùa nào trong năm?\nA. Mùa hè\nB. Mùa đông\nC. Mùa thu\nD. Mùa xuân\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 148, "q": "Dầu gội đầu (Shampoo) thường có độ pH nằm trong khoảng nào để an toàn cho tóc thông thường?", "o": ["Từ 4.5 đến 5.5", "Từ 7.0 đến 8.0", "Từ 9.0 đến 10.0", "Từ 3.0 đến 4.0"], "c": 0, "raw": "Câu 148: Dầu gội đầu (Shampoo) thường có độ pH nằm trong khoảng nào để an toàn cho tóc thông thường?\nA. Từ 4.5 đến 5.5\nB. Từ 7.0 đến 8.0\nC. Từ 9.0 đến 10.0\nD. Từ 3.0 đến 4.0\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 149, "q": "Kem se da (Astringent / Toner) có công dụng chính là gì sau khi nhổ lông hoặc rửa mặt?", "o": ["Cân bằng độ pH cho da và se khít lỗ chân lông", "Tẩy trang", "Trị mụn bọc", "Làm trắng da tức thì"], "c": 0, "raw": "Câu 149: Kem se da (Astringent / Toner) có công dụng chính là gì sau khi nhổ lông hoặc rửa mặt?\nA. Cân bằng độ pH cho da và se khít lỗ chân lông\nB. Tẩy trang\nC. Trị mụn bọc\nD. Làm trắng da tức thì\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 150, "q": "Khử trùng tông đơ (Clipper) đúng chuẩn thì bước ĐẦU TIÊN là gì?", "o": ["Lấy chổi quét sạch hết tóc con/vụn tóc dính trên máy (Làm sạch cơ học trước khi dùng thuốc khử trùng)", "Xịt thẳng dung dịch Quats vào", "Rửa máy dưới vòi nước", "Tháo lưỡi dao ra ngâm hóa chất"], "c": 0, "raw": "Câu 150: Khử trùng tông đơ (Clipper) đúng chuẩn thì bước ĐẦU TIÊN là gì?\nA. Lấy chổi quét sạch hết tóc con/vụn tóc dính trên máy (Làm sạch cơ học trước khi dùng thuốc khử trùng)\nB. Xịt thẳng dung dịch Quats vào\nC. Rửa máy dưới vòi nước\nD. Tháo lưỡi dao ra ngâm hóa chất\nĐáp án đúng: A\n\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 151, "q": "Khi đắp mặt nạ bằng sáp (Paraffin mask), người thợ dùng dụng cụ gì để bôi lên da khách?", "o": ["Cây cọ / bàn chải (Brush)", "Tay không", "Miếng bọt biển", "Bông tẩy trang"], "c": 0, "raw": "Câu 151: Khi đắp mặt nạ bằng sáp (Paraffin mask), người thợ dùng dụng cụ gì để bôi lên da khách?\nA. Cây cọ / bàn chải (Brush)\nB. Tay không\nC. Miếng bọt biển\nD. Bông tẩy trang\nĐáp án đúng: A\n\n", "cat": "skincare", "sec": "7. Chăm sóc da"}, {"n": 152, "q": "Nếu khoảng cách 2 mắt của khách quá rộng, thợ trang điểm nên kẻ lông mày như thế nào để cân đối?", "o": ["Kẻ mở rộng lông mày về phía góc trong của mắt (gần sống mũi hơn)", "Cạo bớt phần đầu lông mày", "Kẻ đuôi lông mày thật dài", "Kẻ lông mày hình dấu mũ"], "c": 0, "raw": "Câu 152: Nếu khoảng cách 2 mắt của khách quá rộng, thợ trang điểm nên kẻ lông mày như thế nào để cân đối?\nA. Kẻ mở rộng lông mày về phía góc trong của mắt (gần sống mũi hơn)\nB. Cạo bớt phần đầu lông mày\nC. Kẻ đuôi lông mày thật dài\nD. Kẻ lông mày hình dấu mũ\nĐáp án đúng: A\n\n", "cat": "lash_brow", "sec": "8. Lông mi và lông mày"}, {"n": 153, "q": "Bệnh loãng máu (Thinning blood) có ảnh hưởng đến dịch vụ nào trong thẩm mỹ viện?", "o": ["Ảnh hưởng đến tẩy lông (Waxing/Nhổ) vì dễ gây chảy máu khó cầm", "Ảnh hưởng đến cắt tóc", "Ảnh hưởng đến sơn móng tay", "Ảnh hưởng đến sấy tóc"], "c": 0, "raw": "Câu 153: Bệnh loãng máu (Thinning blood) có ảnh hưởng đến dịch vụ nào trong thẩm mỹ viện?\nA. Ảnh hưởng đến tẩy lông (Waxing/Nhổ) vì dễ gây chảy máu khó cầm\nB. Ảnh hưởng đến cắt tóc\nC. Ảnh hưởng đến sơn móng tay\nD. Ảnh hưởng đến sấy tóc\nĐáp án đúng: A\n\n", "cat": "waxing", "sec": "9. Triệt lông"}, {"n": 154, "q": "Dũa móng tự nhiên ĐÚNG CÁCH là dũa theo hướng nào để móng không bị chẻ?", "o": ["Dũa từ ngoài góc móng (corner) hướng vào vị trí trung tâm (center). Tuyệt đối không dũa qua lại hình răng cưa.", "Dũa chà xát qua lại liên tục", "Dũa từ giữa ra 2 cạnh", "Chà mạnh mặt móng bằng dũa sắt"], "c": 0, "raw": "Câu 154: Dũa móng tự nhiên ĐÚNG CÁCH là dũa theo hướng nào để móng không bị chẻ?\nA. Dũa từ ngoài góc móng (corner) hướng vào vị trí trung tâm (center). Tuyệt đối không dũa qua lại hình răng cưa.\nB. Dũa chà xát qua lại liên tục\nC. Dũa từ giữa ra 2 cạnh\nD. Chà mạnh mặt móng bằng dũa sắt\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 155, "q": "Khi lấy kem dưỡng hoặc sản phẩm từ hũ (Jar), bắt buộc phải dùng dụng cụ gì?", "o": ["Que gỗ cam (Orange wood stick), dụng cụ dùng 1 lần hoặc miếng xốp vô trùng (Tuyệt đối không dùng tay)", "Ngón tay sạch", "Cán lược", "Cọ trang điểm cũ"], "c": 0, "raw": "Câu 155: Khi lấy kem dưỡng hoặc sản phẩm từ hũ (Jar), bắt buộc phải dùng dụng cụ gì?\nA. Que gỗ cam (Orange wood stick), dụng cụ dùng 1 lần hoặc miếng xốp vô trùng (Tuyệt đối không dùng tay)\nB. Ngón tay sạch\nC. Cán lược\nD. Cọ trang điểm cũ\nĐáp án đúng: A\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 156, "q": "Để khách hàng không phải phàn nàn hay hỏi quá nhiều trong quá trình phục vụ, người thợ nên làm gì đầu tiên?", "o": ["Tư vấn khách hàng kỹ lưỡng trước khi bắt đầu dịch vụ (Consultation)", "Bật nhạc to để át tiếng ồn", "Yêu cầu khách giữ im lặng", "Làm thật nhanh"], "c": 0, "raw": "Câu 156: Để khách hàng không phải phàn nàn hay hỏi quá nhiều trong quá trình phục vụ, người thợ nên làm gì đầu tiên?\nA. Tư vấn khách hàng kỹ lưỡng trước khi bắt đầu dịch vụ (Consultation)\nB. Bật nhạc to để át tiếng ồn\nC. Yêu cầu khách giữ im lặng\nD. Làm thật nhanh\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 157, "q": "Loại cọ đắp bột móng tay (Acrylic) tốt nhất được làm từ chất liệu gì?", "o": ["Lông chồn (Sable brush)", "Lông nilon tổng hợp", "Sợi bông", "Lông cừu"], "c": 0, "raw": "Câu 157: Loại cọ đắp bột móng tay (Acrylic) tốt nhất được làm từ chất liệu gì?\nA. Lông chồn (Sable brush)\nB. Lông nilon tổng hợp\nC. Sợi bông\nD. Lông cừu\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 158, "q": "Dịch vụ ngâm \"Dầu nóng\" (Hot oil manicure) được khuyên dùng để điều trị tình trạng nào?", "o": ["Trị xước măng rô (Hangnails / Agnails), móng giòn, móng khô dễ gãy", "Trị nấm móng (Nail fungus)", "Dùng để phá sơn Gel", "Làm trắng móng bị ố vàng"], "c": 0, "raw": "Câu 158: Dịch vụ ngâm \"Dầu nóng\" (Hot oil manicure) được khuyên dùng để điều trị tình trạng nào?\nA. Trị xước măng rô (Hangnails / Agnails), móng giòn, móng khô dễ gãy\nB. Trị nấm móng (Nail fungus)\nC. Dùng để phá sơn Gel\nD. Làm trắng móng bị ố vàng\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 159, "q": "Lược nào là lựa chọn tốt nhất để chải gỡ rối cho mái tóc ướt?", "o": ["Lược răng thưa (Wide-tooth comb)", "Lược chải mượt (Paddle brush)", "Lược kim loại", "Lược tròn sấy phồng"], "c": 0, "raw": "Câu 159: Lược nào là lựa chọn tốt nhất để chải gỡ rối cho mái tóc ướt?\nA. Lược răng thưa (Wide-tooth comb)\nB. Lược chải mượt (Paddle brush)\nC. Lược kim loại\nD. Lược tròn sấy phồng\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 160, "q": "Khi dùng máy thổi tóc / sấy khô, để làm khô nhanh hoặc kéo mượt tóc, người thợ nên dùng loại lược nào?", "o": ["Lược mái chèo / Lược bằng phẳng (Paddle brush)", "Lược răng khít", "Lược uốn nhiệt", "Lược đuôi chuột"], "c": 0, "raw": "Câu 160: Khi dùng máy thổi tóc / sấy khô, để làm khô nhanh hoặc kéo mượt tóc, người thợ nên dùng loại lược nào?\nA. Lược mái chèo / Lược bằng phẳng (Paddle brush)\nB. Lược răng khít\nC. Lược uốn nhiệt\nD. Lược đuôi chuột\nĐáp án đúng: A\n\n", "cat": "styling", "sec": "3. Tạo kiểu tóc"}, {"n": 161, "q": "Trong quy trình điện di Galvanic (Galvanic current) nhằm hóa lỏng bã nhờn, điện cực dương (Positive electrode) được đặt ở đâu?", "o": ["Đưa cho khách hàng cầm trên tay", "Thợ thẩm mỹ cầm sát vào mặt khách", "Đặt dưới lưng khách", "Gắn vào máy xông hơi"], "c": 0, "raw": "Câu 161: Trong quy trình điện di Galvanic (Galvanic current) nhằm hóa lỏng bã nhờn, điện cực dương (Positive electrode) được đặt ở đâu?\nA. Đưa cho khách hàng cầm trên tay\nB. Thợ thẩm mỹ cầm sát vào mặt khách\nC. Đặt dưới lưng khách\nD. Gắn vào máy xông hơi\nĐáp án đúng: A\n\n", "cat": "skincare", "sec": "7. Chăm sóc da"}, {"n": 162, "q": "Điểm cong cao nhất của lông mày (Arch) chuẩn xác nhất được xác định tại vị trí nào?", "o": ["Nằm ở mép ngoài / góc ngoài của mống mắt (Iris)", "Ở ngay đầu chân mày", "Bằng với đuôi mắt", "Ở giữa sống mũi"], "c": 0, "raw": "Câu 162: Điểm cong cao nhất của lông mày (Arch) chuẩn xác nhất được xác định tại vị trí nào?\nA. Nằm ở mép ngoài / góc ngoài của mống mắt (Iris)\nB. Ở ngay đầu chân mày\nC. Bằng với đuôi mắt\nD. Ở giữa sống mũi\nĐáp án đúng: A\n\n", "cat": "lash_brow", "sec": "8. Lông mi và lông mày"}, {"n": 163, "q": "Khi sử dụng đèn phóng đại / đèn khuếch tán (Magnifying lamp) để soi da, thợ thẩm mỹ PHẢI làm gì để bảo vệ khách?", "o": ["Dùng miếng vải / miếng bông (Eye pads) bịt kín che mắt khách hàng", "Đeo kính râm cho khách", "Yêu cầu khách tự nhắm mắt", "Tắt hết đèn trong phòng"], "c": 0, "raw": "Câu 163: Khi sử dụng đèn phóng đại / đèn khuếch tán (Magnifying lamp) để soi da, thợ thẩm mỹ PHẢI làm gì để bảo vệ khách?\nA. Dùng miếng vải / miếng bông (Eye pads) bịt kín che mắt khách hàng\nB. Đeo kính râm cho khách\nC. Yêu cầu khách tự nhắm mắt\nD. Tắt hết đèn trong phòng\nĐáp án đúng: A\n\n", "cat": "skincare", "sec": "7. Chăm sóc da"}, {"n": 164, "q": "Kỹ thuật cắt tóc \"Palm-to-palm\" là gì?", "o": ["Cắt với 2 lòng bàn tay úp vào nhau", "Cắt phía trên ngón tay", "Cắt bằng máy kẹp", "Trượt kéo tự do"], "c": 0, "raw": "Câu 164: Kỹ thuật cắt tóc \"Palm-to-palm\" là gì?\nA. Cắt với 2 lòng bàn tay úp vào nhau\nB. Cắt phía trên ngón tay\nC. Cắt bằng máy kẹp\nD. Trượt kéo tự do\nĐáp án đúng: A\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 165, "q": "Để bù đắp (che khuyết điểm) cho một khách hàng có chiếc cổ dài, khi thiết kế kiểu tóc người thợ nên làm gì?", "o": ["Giữ lại phần tóc dài phủ xuống cổ (Neck compensation)", "Cạo sát gáy", "Cắt kiểu Bob tém sát mang tai", "Búi tóc củ tỏi lên cao đỉnh đầu"], "c": 0, "raw": "Câu 165: Để bù đắp (che khuyết điểm) cho một khách hàng có chiếc cổ dài, khi thiết kế kiểu tóc người thợ nên làm gì?\nA. Giữ lại phần tóc dài phủ xuống cổ (Neck compensation)\nB. Cạo sát gáy\nC. Cắt kiểu Bob tém sát mang tai\nD. Búi tóc củ tỏi lên cao đỉnh đầu\nĐáp án đúng: A\n\n", "cat": "styling", "sec": "3. Tạo kiểu tóc"}, {"n": 166, "q": "Khi dũa móng, tại sao người thợ phải nhấc cây dũa lên liên tục mà không được dũa miết liên tục tại một điểm?", "o": ["Để tránh tạo ra ma sát gây cảm giác bị phỏng/nóng rát cho mặt móng của khách", "Để dũa không bị mòn", "Để bụi móng rơi xuống", "Để tiết kiệm thời gian"], "c": 0, "raw": "Câu 166: Khi dũa móng, tại sao người thợ phải nhấc cây dũa lên liên tục mà không được dũa miết liên tục tại một điểm?\nA. Để tránh tạo ra ma sát gây cảm giác bị phỏng/nóng rát cho mặt móng của khách\nB. Để dũa không bị mòn\nC. Để bụi móng rơi xuống\nD. Để tiết kiệm thời gian\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 167, "q": "Cây Phỉ (Witch Hazel) được sử dụng trong chăm sóc da với công dụng gì?", "o": ["Chống lão hóa, làm sạch da, dưỡng ẩm da và khử mùi hôi dưới cánh tay", "Lột lớp sừng da chết", "Tẩy tế bào chết vật lý", "Làm tan mỡ mặt"], "c": 0, "raw": "Câu 167: Cây Phỉ (Witch Hazel) được sử dụng trong chăm sóc da với công dụng gì?\nA. Chống lão hóa, làm sạch da, dưỡng ẩm da và khử mùi hôi dưới cánh tay\nB. Lột lớp sừng da chết\nC. Tẩy tế bào chết vật lý\nD. Làm tan mỡ mặt\nĐáp án đúng: A\n\n", "cat": "skincare", "sec": "7. Chăm sóc da"}, {"n": 168, "q": "Trong khi pha trộn các loại hóa chất (nhuộm, tẩy, uốn) theo đúng hướng dẫn của nhà sản xuất, dụng cụ bắt buộc phải có là gì?", "o": ["Cân / Dụng cụ đo lường chính xác", "Đũa kim loại", "Máy xay sinh tố", "Bát thủy tinh trong suốt"], "c": 0, "raw": "Câu 168: Trong khi pha trộn các loại hóa chất (nhuộm, tẩy, uốn) theo đúng hướng dẫn của nhà sản xuất, dụng cụ bắt buộc phải có là gì?\nA. Cân / Dụng cụ đo lường chính xác\nB. Đũa kim loại\nC. Máy xay sinh tố\nD. Bát thủy tinh trong suốt\nĐáp án đúng: A\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 169, "q": "Khi thực hiện thao tác cắt tóc, bộ phận nào của người thợ phải làm việc nhiều nhất?", "o": ["Bàn tay cầm kéo", "Ngón tay trỏ giữ lược", "Cổ tay trái", "Bả vai"], "c": 0, "raw": "Câu 169: Khi thực hiện thao tác cắt tóc, bộ phận nào của người thợ phải làm việc nhiều nhất?\nA. Bàn tay cầm kéo\nB. Ngón tay trỏ giữ lược\nC. Cổ tay trái\nD. Bả vai\nĐáp án đúng: A\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 170, "q": "Trên bánh xe màu sắc, màu Vàng (Yellow) thuộc nhóm màu nào?", "o": ["Nhóm màu cơ bản (Primary color)", "Nhóm màu thứ cấp (Secondary color)", "Nhóm màu bổ sung (Complementary color)", "Nhóm màu lạnh"], "c": 0, "raw": "Câu 170: Trên bánh xe màu sắc, màu Vàng (Yellow) thuộc nhóm màu nào?\nA. Nhóm màu cơ bản (Primary color)\nB. Nhóm màu thứ cấp (Secondary color)\nC. Nhóm màu bổ sung (Complementary color)\nD. Nhóm màu lạnh\nĐáp án đúng: A\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 171, "q": "Phấn mắt (Eye shadow) khi trang điểm có công dụng hiệu ứng thị giác như thế nào?", "o": ["Làm cho mắt bóng, sáng và nổi bật hơn", "Làm mắt trông nhỏ lại", "Che quầng thâm", "Thay thế cho chì kẻ mày"], "c": 0, "raw": "Câu 171: Phấn mắt (Eye shadow) khi trang điểm có công dụng hiệu ứng thị giác như thế nào?\nA. Làm cho mắt bóng, sáng và nổi bật hơn\nB. Làm mắt trông nhỏ lại\nC. Che quầng thâm\nD. Thay thế cho chì kẻ mày\nĐáp án đúng: A\n\n", "cat": "lash_brow", "sec": "8. Lông mi và lông mày"}, {"n": 172, "q": "Mụn ruồi có lông trên cơ thể khách hàng cần được xử lý như thế nào?", "o": ["Không bao giờ được dùng sáp wax để tẩy lông trên nốt ruồi (chỉ được dùng nhíp hoặc cắt tỉa)", "Dùng sáp nóng lột thật mạnh", "Dùng kem tẩy lông hóa học", "Dùng dao lam cạo sát da"], "c": 0, "raw": "Câu 172: Mụn ruồi có lông trên cơ thể khách hàng cần được xử lý như thế nào?\nA. Không bao giờ được dùng sáp wax để tẩy lông trên nốt ruồi (chỉ được dùng nhíp hoặc cắt tỉa)\nB. Dùng sáp nóng lột thật mạnh\nC. Dùng kem tẩy lông hóa học\nD. Dùng dao lam cạo sát da\nĐáp án đúng: A\n\n", "cat": "waxing", "sec": "9. Triệt lông"}, {"n": 173, "q": "Bệnh vảy nến (Psoriasis) trên da có dấu hiệu nhận biết như thế nào?", "o": ["Bệnh có triệu chứng xuất hiện nhiều mảng da đỏ, khô bong tróc, có vảy dày và óng ánh bạc", "Nổi mụn nước có mủ vàng", "Da ngứa ngáy và sưng tấy tím bầm", "Lỗ chân lông nở to và đổ nhiều dầu"], "c": 0, "raw": "Câu 173: Bệnh vảy nến (Psoriasis) trên da có dấu hiệu nhận biết như thế nào?\nA. Bệnh có triệu chứng xuất hiện nhiều mảng da đỏ, khô bong tróc, có vảy dày và óng ánh bạc\nB. Nổi mụn nước có mủ vàng\nC. Da ngứa ngáy và sưng tấy tím bầm\nD. Lỗ chân lông nở to và đổ nhiều dầu\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 174, "q": "Các điểm tham chiếu (Reference points) trên đầu khách hàng được sử dụng để làm gì trong kỹ thuật cắt tóc?", "o": ["Dùng làm điểm chuẩn để lấy tóc, giúp thiết kế kiểu tóc cân bằng và đối xứng", "Để đính kẹp tăm", "Để đo nhiệt độ da đầu", "Để chia thuốc nhuộm"], "c": 0, "raw": "Câu 174: Các điểm tham chiếu (Reference points) trên đầu khách hàng được sử dụng để làm gì trong kỹ thuật cắt tóc?\nA. Dùng làm điểm chuẩn để lấy tóc, giúp thiết kế kiểu tóc cân bằng và đối xứng\nB. Để đính kẹp tăm\nC. Để đo nhiệt độ da đầu\nD. Để chia thuốc nhuộm\nĐáp án đúng: A\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 175, "q": "Trong kiểm tra tóc giả, thử nghiệm bằng gió (Wind test) nhằm mục đích gì?", "o": ["Đánh giá độ tự nhiên và độ thực tế của tóc giả khi chuyển động", "Thử xem tóc giả có bay hay không", "Thử độ ẩm của sợi tóc giả", "Làm khô keo dán tóc giả"], "c": 0, "raw": "Câu 175: Trong kiểm tra tóc giả, thử nghiệm bằng gió (Wind test) nhằm mục đích gì?\nA. Đánh giá độ tự nhiên và độ thực tế của tóc giả khi chuyển động\nB. Thử xem tóc giả có bay hay không\nC. Thử độ ẩm của sợi tóc giả\nD. Làm khô keo dán tóc giả\nĐáp án đúng: A\n\n", "cat": "styling", "sec": "3. Tạo kiểu tóc"}, {"n": 176, "q": "Độ pH của da và tóc tự nhiên nằm chính xác trong khoảng nào?", "o": ["4.5 – 5.5", "6.5 – 7.5", "3.0 – 4.0", "8.0 – 9.0"], "c": 0, "raw": "Câu 176: Độ pH của da và tóc tự nhiên nằm chính xác trong khoảng nào?\nA. 4.5 – 5.5\nB. 6.5 – 7.5\nC. 3.0 – 4.0\nD. 8.0 – 9.0\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 177, "q": "Để tránh tạo vết chia tách không mong muốn ở đường viền tóc mặt trước (Hairline), khi chia tóc nên chia theo hình dạng nào?", "o": ["Hình tam giác", "Hình vuông", "Hình tròn", "Hình chữ nhật"], "c": 0, "raw": "Câu 177: Để tránh tạo vết chia tách không mong muốn ở đường viền tóc mặt trước (Hairline), khi chia tóc nên chia theo hình dạng nào?\nA. Hình tam giác\nB. Hình vuông\nC. Hình tròn\nD. Hình chữ nhật\nĐáp án đúng: A\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 178, "q": "Để kiểm tra đỉnh đầu khi cắt tóc cân bằng, người thợ cần dựa vào yếu tố nào?", "o": ["Các điểm tham chiếu / Điểm nối (Reference points)", "Tai của khách", "Sống mũi", "Cằm của khách"], "c": 0, "raw": "Câu 178: Để kiểm tra đỉnh đầu khi cắt tóc cân bằng, người thợ cần dựa vào yếu tố nào?\nA. Các điểm tham chiếu / Điểm nối (Reference points)\nB. Tai của khách\nC. Sống mũi\nD. Cằm của khách\nĐáp án đúng: A\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 179, "q": "Khi thực hiện dịch vụ uốn tóc cho tóc rất dài, kỹ thuật quấn 2 ống lô trên cùng một tép tóc được gọi là gì?", "o": ["Piggyback wrap", "Bookend wrap", "Spiral wrap", "Flat wrap"], "c": 0, "raw": "Câu 179: Khi thực hiện dịch vụ uốn tóc cho tóc rất dài, kỹ thuật quấn 2 ống lô trên cùng một tép tóc được gọi là gì?\nA. Piggyback wrap\nB. Bookend wrap\nC. Spiral wrap\nD. Flat wrap\nĐáp án đúng: A\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 180, "q": "Tóc ướt tự nhiên (chưa bị hư tổn nặng) có khả năng kéo giãn đàn hồi tối đa khoảng bao nhiêu % chiều dài mà không bị đứt?", "o": ["Khoảng 50%", "10%", "20%", "80%"], "c": 0, "raw": "Câu 180: Tóc ướt tự nhiên (chưa bị hư tổn nặng) có khả năng kéo giãn đàn hồi tối đa khoảng bao nhiêu % chiều dài mà không bị đứt?\nA. Khoảng 50%\nB. 10%\nC. 20%\nD. 80%\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 181, "q": "Bao nhiêu vòng cuốn trên thanh uốn (lô cuốn) là tiêu chuẩn tối thiểu để tạo thành một lọn sóng hoàn chỉnh?", "o": ["2 vòng rưỡi (2 ½ turns)", "1 vòng", "4 vòng", "Nửa vòng"], "c": 0, "raw": "Câu 181: Bao nhiêu vòng cuốn trên thanh uốn (lô cuốn) là tiêu chuẩn tối thiểu để tạo thành một lọn sóng hoàn chỉnh?\nA. 2 vòng rưỡi (2 ½ turns)\nB. 1 vòng\nC. 4 vòng\nD. Nửa vòng\nĐáp án đúng: A\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 182, "q": "Màu cơ bản (Primary colors) gồm những màu nào sau đây?", "o": ["Vàng, Đỏ, Xanh lam (Yellow, Red, Blue)", "Cam, Tím, Xanh lá", "Trắng, Đen, Xám", "Nâu, Vàng, Cam"], "c": 0, "raw": "Câu 182: Màu cơ bản (Primary colors) gồm những màu nào sau đây?\nA. Vàng, Đỏ, Xanh lam (Yellow, Red, Blue)\nB. Cam, Tím, Xanh lá\nC. Trắng, Đen, Xám\nD. Nâu, Vàng, Cam\nĐáp án đúng: A\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 183, "q": "Màu thứ cấp (Secondary colors) được tạo thành do:", "o": ["Pha trộn 2 màu cơ bản với tỷ lệ bằng nhau (Cam, Xanh lá, Tím)", "Pha màu cơ bản với màu trắng", "Pha màu đen với màu đỏ", "Trộn 3 màu cơ bản lại với nhau"], "c": 0, "raw": "Câu 183: Màu thứ cấp (Secondary colors) được tạo thành do:\nA. Pha trộn 2 màu cơ bản với tỷ lệ bằng nhau (Cam, Xanh lá, Tím)\nB. Pha màu cơ bản với màu trắng\nC. Pha màu đen với màu đỏ\nD. Trộn 3 màu cơ bản lại với nhau\nĐáp án đúng: A\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 184, "q": "Liên kết hóa học nào trong tóc bị phá vỡ tạm thời bởi nước/độ ẩm và nhiệt độ, sau đó tái tạo khi tóc khô hoặc nguội?", "o": ["Hydrogen bond (Liên kết Hydro)", "Disulfide bond (Liên kết lưu huỳnh)", "Peptide bond", "Salt bond (Liên kết muối)"], "c": 0, "raw": "Câu 184: Liên kết hóa học nào trong tóc bị phá vỡ tạm thời bởi nước/độ ẩm và nhiệt độ, sau đó tái tạo khi tóc khô hoặc nguội?\nA. Hydrogen bond (Liên kết Hydro)\nB. Disulfide bond (Liên kết lưu huỳnh)\nC. Peptide bond\nD. Salt bond (Liên kết muối)\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 185, "q": "Loại tóc nào có khả năng phản xạ ánh sáng tốt nhất (trông bóng mượt nhất)?", "o": ["Tóc thẳng dài", "Tóc xoăn xù bông", "Tóc tém", "Tóc uốn lọn nhỏ"], "c": 0, "raw": "Câu 185: Loại tóc nào có khả năng phản xạ ánh sáng tốt nhất (trông bóng mượt nhất)?\nA. Tóc thẳng dài\nB. Tóc xoăn xù bông\nC. Tóc tém\nD. Tóc uốn lọn nhỏ\nĐáp án đúng: A\n\n", "cat": "styling", "sec": "3. Tạo kiểu tóc"}, {"n": 186, "q": "Để bảo vệ da khỏi bị lão hóa sớm bởi ánh nắng mặt trời, nên thoa kem chống nắng có chỉ số SPF tối thiểu là bao nhiêu và trước khi ra ngoài bao lâu?", "o": ["Tối thiểu SPF 15, thoa trước khi ra ngoài 15 phút", "SPF 5, thoa trước 5 phút", "SPF 50, thoa trước 2 tiếng", "Thoa khi đã ra ngoài nắng"], "c": 0, "raw": "Câu 186: Để bảo vệ da khỏi bị lão hóa sớm bởi ánh nắng mặt trời, nên thoa kem chống nắng có chỉ số SPF tối thiểu là bao nhiêu và trước khi ra ngoài bao lâu?\nA. Tối thiểu SPF 15, thoa trước khi ra ngoài 15 phút\nB. SPF 5, thoa trước 5 phút\nC. SPF 50, thoa trước 2 tiếng\nD. Thoa khi đã ra ngoài nắng\nĐáp án đúng: A\n\n", "cat": "skincare", "sec": "7. Chăm sóc da"}, {"n": 187, "q": "Dụng cụ nào sau đây được xem là dụng cụ đa năng (Multi-use tool) phổ biến trong làm móng?", "o": ["Cây que gỗ cam (Orange wood stick)", "Dũa giấy xài 1 lần", "Miếng bông gòn", "Giấy bạc"], "c": 0, "raw": "Câu 187: Dụng cụ nào sau đây được xem là dụng cụ đa năng (Multi-use tool) phổ biến trong làm móng?\nA. Cây que gỗ cam (Orange wood stick)\nB. Dũa gi affin nóng?\nA. Bệnh đau đầu\nB. Bệnh cao huyết áp (High blood pressure) hoặc bệnh tiểu đường\nC. Da bị sạm nắng\nD. Tóc bị khô xơ\nĐáp án đúng: B\n\n", "cat": "skincare", "sec": "7. Chăm sóc da"}, {"n": 244, "q": "Khi nhuộm tẩy sáng màu tóc nguyên thủy, khoảng cách bôi thuốc chuẩn cách da đầu là bao nhiêu?", "o": ["Bôi dính sát da đầu", "Cách da đầu 1/2 inch", "Cách da đầu 3 inch", "Chỉ bôi ở ngọn tóc"], "c": 1, "raw": "Câu 244: Khi nhuộm tẩy sáng màu tóc nguyên thủy, khoảng cách bôi thuốc chuẩn cách da đầu là bao nhiêu?\nA. Bôi dính sát da đầu\nB. Cách da đầu 1/2 inch\nC. Cách da đầu 3 inch\nD. Chỉ bôi ở ngọn tóc\nĐáp án đúng: B\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 245, "q": "Trước khi bôi thuốc duỗi tóc Sodium Hydroxide, người thợ tuyệt đối TRÁNH thao tác nào?", "o": ["Đeo găng tay", "Choàng khăn cho khách", "Chải đầu quá mạnh tay làm trầy xước da đầu", "Bôi kem nền bảo vệ"], "c": 2, "raw": "Câu 245: Trước khi bôi thuốc duỗi tóc Sodium Hydroxide, người thợ tuyệt đối TRÁNH thao tác nào?\nA. Đeo găng tay\nB. Choàng khăn cho khách\nC. Chải đầu quá mạnh tay làm trầy xước da đầu\nD. Bôi kem nền bảo vệ\nĐáp án đúng: C\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 246, "q": "Liên kết lưu huỳnh kép (Disulfide bond) trong sợi tóc khi bị phá hủy bởi thuốc duỗi Hydroxide (Sodium) sẽ như thế nào?", "o": ["Tự hàn gắn sau 24 giờ", "Không bao giờ được tái tạo lại", "Phục hồi khi dùng dầu xả", "Trở nên xoăn tít hơn"], "c": 1, "raw": "Câu 246: Liên kết lưu huỳnh kép (Disulfide bond) trong sợi tóc khi bị phá hủy bởi thuốc duỗi Hydroxide (Sodium) sẽ như thế nào?\nA. Tự hàn gắn sau 24 giờ\nB. Không bao giờ được tái tạo lại\nC. Phục hồi khi dùng dầu xả\nD. Trở nên xoăn tít hơn\nĐáp án đúng: B\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 247, "q": "Quá trình nhuộm màu đưa mái tóc trở lại màu sắc nguyên thủy ban đầu được gọi là gì?", "o": ["Balayage", "Highlighting", "Tint back", "Foiling"], "c": 2, "raw": "Câu 247: Quá trình nhuộm màu đưa mái tóc trở lại màu sắc nguyên thủy ban đầu được gọi là gì?\nA. Balayage\nB. Highlighting\nC. Tint back\nD. Foiling\nĐáp án đúng: C\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 248, "q": "Trước khi tiến hành uốn tóc, người thợ cần làm những bài thử nghiệm nào trên tóc?", "o": ["Thử nghiệm độ xốp (Porosity) và độ đàn hồi (Elasticity)", "Thử nghiệm màu nhuộm", "Thử nghiệm độ bắt lửa", "Thử nghiệm cạo da đầu"], "c": 0, "raw": "Câu 248: Trước khi tiến hành uốn tóc, người thợ cần làm những bài thử nghiệm nào trên tóc?\nA. Thử nghiệm độ xốp (Porosity) và độ đàn hồi (Elasticity)\nB. Thử nghiệm màu nhuộm\nC. Thử nghiệm độ bắt lửa\nD. Thử nghiệm cạo da đầu\nĐáp án đúng: A\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 249, "q": "Khái niệm \"Decontamination\" (Khử nhiễm) có nghĩa là gì?", "o": ["Đốt bỏ toàn bộ đồ nghề", "Quá trình làm sạch và loại bỏ các chất bẩn, mầm bệnh truyền nhiễm bám trên bề mặt", "Bôi cồn lên tóc", "Dùng quạt thổi bụi"], "c": 1, "raw": "Câu 249: Khái niệm \"Decontamination\" (Khử nhiễm) có nghĩa là gì?\nA. Đốt bỏ toàn bộ đồ nghề\nB. Quá trình làm sạch và loại bỏ các chất bẩn, mầm bệnh truyền nhiễm bám trên bề mặt\nC. Bôi cồn lên tóc\nD. Dùng quạt thổi bụi\nĐáp án đúng: B\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 250, "q": "Khi pha chế hoặc ngâm hóa chất khử trùng, người thợ phải trang bị thiết bị an toàn nào?", "o": ["Đeo tạp dề vải thường", "Đeo kính bảo hộ mắt và đeo bao tay bảo vệ", "Đeo khẩu trang vải mỏng", "Đi chân trần"], "c": 1, "raw": "Câu 250: Khi pha chế hoặc ngâm hóa chất khử trùng, người thợ phải trang bị thiết bị an toàn nào?\nA. Đeo tạp dề vải thường\nB. Đeo kính bảo hộ mắt và đeo bao tay bảo vệ\nC. Đeo khẩu trang vải mỏng\nD. Đi chân trần\nĐáp án đúng: B\n\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 251, "q": "Primer trong dịch vụ đắp móng bột acrylic đóng vai trò gì?", "o": ["Sơn bóng móng", "Nước  test curl) nhằm mục đích gì?", "o": ["Kiểm tra xem khách có thích mùi thuốc không", "Xem phản ứng của hóa chất uốn trên tóc và xác định thời gian xử lý chính xác", "Kiểm tra độ bóng của tóc", "Kiểm tra nhiệt độ phòng"], "c": 1, "raw": "Câu 255: Thử nghiệm uốn lọn sơ bộ (Preliminary test curl) nhằm mục đích gì?\nA. Kiểm tra xem khách có thích mùi thuốc không\nB. Xem phản ứng của hóa chất uốn trên tóc và xác định thời gian xử lý chính xác\nC. Kiểm tra độ bóng của tóc\nD. Kiểm tra nhiệt độ phòng\nĐáp án đúng: B\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 256, "q": "Cắt tóc theo đường ngang (Horizontal line) sẽ tạo ra hiệu ứng gì?", "o": ["Tạo độ tầng cao", "Tạo trọng lượng, độ dày và cảm giác đầy đặn cho mái tóc", "Làm tóc mỏng bớt đi", "Tạo sự chuyển động sole"], "c": 1, "raw": "Câu 256: Cắt tóc theo đường ngang (Horizontal line) sẽ tạo ra hiệu ứng gì?\nA. Tạo độ tầng cao\nB. Tạo trọng lượng, độ dày và cảm giác đầy đặn cho mái tóc\nC. Làm tóc mỏng bớt đi\nD. Tạo sự chuyển động sole\nĐáp án đúng: B\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 257, "q": "Lớp da từ biểu bì kéo xuống hai bên rãnh móng được gọi là gì?", "o": ["Tường móng (Sidewall)", "Thân móng", "Đầu móng tự do", "Màng sừng dưới móng"], "c": 0, "raw": "Câu 257: Lớp da từ biểu bì kéo xuống hai bên rãnh móng được gọi là gì?\nA. Tường móng (Sidewall)\nB. Thân móng\nC. Đầu móng tự do\nD. Màng sừng dưới móng\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 258, "q": "Bệnh nhân mắc bệnh tiểu đường khi làm dịch vụ móng chân (Pedicure) thì người thợ KHÔNG ĐƯỢC làm gì?", "o": ["Dùng kềm bấm cắt da quanh móng hoặc dùng dao gọt chai", "Rửa chân bằng nước ấm", "Sơn móng màu bóng", "Dũa móng nhẹ nhàng"], "c": 0, "raw": "Câu 258: Bệnh nhân mắc bệnh tiểu đường khi làm dịch vụ móng chân (Pedicure) thì người thợ KHÔNG ĐƯỢC làm gì?\nA. Dùng kềm bấm cắt da quanh móng hoặc dùng dao gọt chai\nB. Rửa chân bằng nước ấm\nC. Sơn móng màu bóng\nD. Dũa móng nhẹ nhàng\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 259, "q": "Để bảo vệ tóc trước nguy cơ nhiễm khuẩn, các sản phẩm hũ kem, sáp trong salon bắt buộc phải:", "o": ["Mở nắp cho thông thoáng", "Luôn đậy kín nắp sau khi dùng", "Để gần cửa sổ", "Pha thêm nước lạnh"], "c": 1, "raw": "Câu 259: Để bảo vệ tóc trước nguy cơ nhiễm khuẩn, các sản phẩm hũ kem, sáp trong salon bắt buộc phải:\nA. Mở nắp cho thông thoáng\nB. Luôn đậy kín nắp sau khi dùng\nC. Để gần cửa sổ\nD. Pha thêm nước lạnh\nĐáp án đúng: B\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 260, "q": "Dụng cụ nào không được phép dùng khi thao tác duỗi tóc bằng nhiệt nóng?", "o": ["Lược cao su cứng", "Lược làm bằng kim loại (vì hấp thụ nhiệt gây bỏng tóc)", "Lược chịu nhiệt", "Kẹp mỏ vịt bằng nhựa"], "c": 1, "raw": "Câu 260: Dụng cụ nào không được phép dùng khi thao tác duỗi tóc bằng nhiệt nóng?\nA. Lược cao su cứng\nB. Lược làm bằng kim loại (vì hấp thụ nhiệt gây bỏng tóc)\nC. Lược chịu nhiệt\nD. Kẹp mỏ vịt bằng nhựa\nĐáp án đúng: B\n\n", "cat": "styling", "sec": "3. Tạo kiểu tóc"}, {"n": 261, "q": "Để lấy kem dưỡng hoặc sáp từ trong hũ ra một cách hợp vệ sinh, người thợ dùng:", "o": ["Ngón tay sạch", "Dụng cụ không xốp đã được làm sạch khử trùng (hoặc que gỗ dùng một lần)", "Miếng bông mút ẩm đã qua sử dụng", "Cán lược đuôi nhọn"], "c": 1, "raw": "Câu 261: Để lấy kem dưỡng hoặc sáp từ trong hũ ra một cách hợp vệ sinh, người thợ dùng:\nA. Ngón tay sạch\nB. Dụng cụ không xốp đã được làm sạch khử trùng (hoặc que gỗ dùng một lần)\nC. Miếng bông mút ẩm đã qua sử dụng\nD. Cán lược đuôi nhọn\nĐáp án đúng: B\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 262, "q": "Cắt tóc ở góc độ 180 độ mang lại kết quả kiểu tóc nào?", "o": ["Kiểu tóc một chiều dài bằng nhau", "Kiểu tóc tầng dài (Long layer haircut), tầng cao phồng ở đỉnh và dài ở đuôi", "Kiểu tóc tém nam", "Kiểu tóc cắt úp 45 độ"], "c": 1, "raw": "Câu 262: Cắt tóc ở góc độ 180 độ mang lại kết quả kiểu tóc nào?\nA. Kiểu tóc một chiều dài bằng nhau\nB. Kiểu tóc tầng dài (Long layer haircut), tầng cao phồng ở đỉnh và dài ở đuôi\nC. Kiểu tóc tém nam\nD. Kiểu tóc cắt úp 45 độ\nĐáp án đúng: B\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 263, "q": "Tại sao cơ thể con người có khả năng tự kháng lại và tiêu diệt các vi khuẩn xâm nhập?", "o": ["Nhờ vào nhiệt độ cơ thể", "Nhờ có hệ thống miễn dịch (Immunity)", "Nhờ tuyến mồ hôi", "Nhờ lớp tế bào chết"], "c": 1, "raw": "Câu 263: Tại sao cơ thể con người có khả năng tự kháng lại và tiêu diệt các vi khuẩn xâm nhập?\nA. Nhờ vào nhiệt độ cơ thể\nB. Nhờ có hệ thống miễn dịch (Immunity)\nC. Nhờ tuyến mồ hôi\nD. Nhờ lớp tế bào chết\nĐáp án đúng: B\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 264, "q": "Khi hóa chất khử trùng vô tình dính vào da tay của thợ, bước xử lý ngay là gì?", "o": ["Bôi cồn lên tay", "Rửa sạch tay ngay lập tức bằng xà phòng và nước ấm", "Dùng khăn khô lau sạch", "Thoa kem dưỡng ẩm đè lên"], "c": 1, "raw": "Câu 264: Khi hóa chất khử trùng vô tình dính vào da tay của thợ, bước xử lý ngay là gì?\nA. Bôi cồn lên tay\nB. Rửa sạch tay ngay lập tức bằng xà phòng và nước ấm\nC. Dùng khăn khô lau sạch\nD. Thoa kem dưỡng ẩm đè lên\nĐáp án đúng: B\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 265, "q": "Màu tạm thời (Temporary color) tồn tại trên sợi tóc trong bao lâu?", "o": ["Vĩnh viễn", "Trong 4 đến 6 tuần", "Chỉ tồn tại cho đến lần gội đầu tiếp theo (1 lần gội)", "Trong 6 tháng"], "c": 2, "raw": "Câu 265: Màu tạm thời (Temporary color) tồn tại trên sợi tóc trong bao lâu?\nA. Vĩnh viễn\nB. Trong 4 đến 6 tuần\nC. Chỉ tồn tại cho đến lần gội đầu tiếp theo (1 lần gội)\nD. Trong 6 tháng\nĐáp án đúng: C\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 266, "q": "Thao tác dũa móng chân chuẩn xác để ngăn móng mọc đâm vào thịt là gì?", "o": ["Dũa tròn hai khóe", "Dũa ngang bằng và phẳng đầu móng (Straight across)", "Dũa nhọn hình tam giác", "Khoét sâu vào góc móng"], "c": 1, "raw": "Câu 266: Thao tác dũa móng chân chuẩn xác để ngăn móng mọc đâm vào thịt là gì?\nA. Dũa tròn hai khóe\nB. Dũa ngang bằng và phẳng đầu móng (Straight across)\nC. Dũa nhọn hình tam giác\nD. Khoét sâu vào góc móng\nĐáp án đúng: B\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 267, "q": "Tại sao tuyệt đối KHÔNG được để tóc còn ẩm ướt khi dùng máy kẹp ép nhiệt?", "o": ["Tóc sẽ bị bốc khói, sôi nước trong thân tóc và cháy gãy sợi tóc", "Máy kẹp sẽ bị mất nhiệt", "Tóc sẽ bị xoăn tít lại", "Làm thuốc nhuộm bị bay màu"], "c": 0, "raw": "Câu 267: Tại sao tuyệt đối KHÔNG được để tóc còn ẩm ướt khi dùng máy kẹp ép nhiệt?\nA. Tóc sẽ bị bốc khói, sôi nước trong thân tóc và cháy gãy sợi tóc\nB. Máy kẹp sẽ bị mất nhiệt\nC. Tóc sẽ bị xoăn tít lại\nD. Làm thuốc nhuộm bị bay màu\nĐáp án đúng: A\n\n", "cat": "styling", "sec": "3. Tạo kiểu tóc"}, {"n": 268, "q": "Cách nhanh và chuẩn nhất để kiểm tra sợi tóc là tóc thật hay tóc tổng hợp là:", "o": ["Ngâm vào nước", "Đốt bằng que diêm (Tóc thật cháy từ từ có mùi khét tóc; tóc nhân tạo quéo cục, xì khói nhanh)", "Kéo giãn bằng tay", "Nhuộm thử màu"], "c": 1, "raw": "Câu 268: Cách nhanh và chuẩn nhất để kiểm tra sợi tóc là tóc thật hay tóc tổng hợp là:\nA. Ngâm vào nước\nB. Đốt bằng que diêm (Tóc thật cháy từ từ có mùi khét tóc; tóc nhân tạo quéo cục, xì khói nhanh)\nC. Kéo giãn bằng tay\nD. Nhuộm thử màu\nĐáp án đúng: B\n\n", "cat": "styling", "sec": "3. Tạo kiểu tóc"}, {"n": 269, "q": "Khi dùng nhiệt tạo kiểu trên mái tóc giả làm từ tóc thật của người, người thợ nên:", "o": ["Dùng nhiệt độ tối đa", "Cài đặt mức nhiệt độ thấp đến trung bình", "Xịt nước sũng tóc khi là", "Kẹp giữ nhiệt tại một chỗ trong 1 phút"], "c": 1, "raw": "Câu 269: Khi dùng nhiệt tạo kiểu trên mái tóc giả làm từ tóc thật của người, người thợ nên:\nA. Dùng nhiệt độ tối đa\nB. Cài đặt mức nhiệt độ thấp đến trung bình\nC. Xịt nước sũng tóc khi là\nD. Kẹp giữ nhiệt tại một chỗ trong 1 phút\nĐáp án đúng: B\n\n", "cat": "styling",  "haircut", "sec": "4. Cắt tóc"}, {"n": 282, "q": "Để triệt tiêu sắc vàng không mong muốn khi tẩy tóc, người thợ dùng màu bổ sung nào?", "o": ["Màu đỏ", "Màu xanh lá", "Màu tím (Violet)", "Màu cam"], "c": 2, "raw": "Câu 282: Để triệt tiêu sắc vàng không mong muốn khi tẩy tóc, người thợ dùng màu bổ sung nào?\nA. Màu đỏ\nB. Màu xanh lá\nC. Màu tím (Violet)\nD. Màu cam\nĐáp án đúng: C\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 283, "q": "Dòng điện Galvanic trong chăm sóc da được ứng dụng nhằm mục đích gì?", "o": ["Làm cháy lông mặt", "Làm mềm và hóa lỏng các chất bã nhờn tích tụ sâu trong lỗ chân lông (Desincrustation)", "Làm tê liệt cơ mặt", "Nhuộm da nâu"], "c": 1, "raw": "Câu 283: Dòng điện Galvanic trong chăm sóc da được ứng dụng nhằm mục đích gì?\nA. Làm cháy lông mặt\nB. Làm mềm và hóa lỏng các chất bã nhờn tích tụ sâu trong lỗ chân lông (Desincrustation)\nC. Làm tê liệt cơ mặt\nD. Nhuộm da nâu\nĐáp án đúng: B\n\n", "cat": "skincare", "sec": "7. Chăm sóc da"}, {"n": 284, "q": "Cây chổi quét mascara dùng trong trang điểm khách hàng phải được xử lý như thế nào?", "o": ["Rửa sạch bằng nước rồi dùng tiếp", "Ngâm dung dịch Quats", "Dùng một lần duy nhất rồi vứt bỏ (Disposable)", "Dùng chung cho cả tuần"], "c": 2, "raw": "Câu 284: Cây chổi quét mascara dùng trong trang điểm khách hàng phải được xử lý như thế nào?\nA. Rửa sạch bằng nước rồi dùng tiếp\nB. Ngâm dung dịch Quats\nC. Dùng một lần duy nhất rồi vứt bỏ (Disposable)\nD. Dùng chung cho cả tuần\nĐáp án đúng: C\n\n", "cat": "lash_brow", "sec": "8. Lông mi và lông mày"}, {"n": 285, "q": "Kỹ thuật chia tóc thành các mảng hình tam giác ở đường viền trán (Hairline) nhằm mục đích gì?", "o": ["Ngăn ngừa việc tạo thành các vệt chia tách tóc lộ da đầu ở mặt trước", "Làm tóc nhanh dài hơn", "Giúp dễ nhuộm màu đen", "Cắt tóc ngắn hơn"], "c": 0, "raw": "Câu 285: Kỹ thuật chia tóc thành các mảng hình tam giác ở đường viền trán (Hairline) nhằm mục đích gì?\nA. Ngăn ngừa việc tạo thành các vệt chia tách tóc lộ da đầu ở  móng chân (Pedicure)?\nA. Móng chân có sơn màu đậm\nB. Vùng da quanh móng có vết thương hở, lở loét hoặc nhiễm nấm\nC. Gót chân bị chai sần\nD. Khách hàng đi bộ nhiều\nĐáp án đúng: B\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 290, "q": "Mảng da đầu xuất hiện các vảy màu vàng nhờn dính là biểu hiện của tình trạng gì?", "o": ["Tóc bình thường", "Viêm da tiết bã / Nhiễm nấm nặng (cần khuyên khách đi bác sĩ)", "Tóc bị khô do thiếu nước", "Tác dụng phụ của máy sấy"], "c": 1, "raw": "Câu 290: Mảng da đầu xuất hiện các vảy màu vàng nhờn dính là biểu hiện của tình trạng gì?\nA. Tóc bình thường\nB. Viêm da tiết bã / Nhiễm nấm nặng (cần khuyên khách đi bác sĩ)\nC. Tóc bị khô do thiếu nước\nD. Tác dụng phụ của máy sấy\nĐáp án đúng: B\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 291, "q": "Khi cạo râu hoặc cạo viền bằng dao cạo cán gập, ngón tay út của người thợ đặt ở vị trí nào?", "o": ["Đặt trên sống lưng lưỡi dao", "Đặt cố định ở đuôi cán dao (Tang)", "Đặt vào mặt da của khách", "Giấu trong lòng bàn tay"], "c": 1, "raw": "Câu 291: Khi cạo râu hoặc cạo viền bằng dao cạo cán gập, ngón tay út của người thợ đặt ở vị trí nào?\nA. Đặt trên sống lưng lưỡi dao\nB. Đặt cố định ở đuôi cán dao (Tang)\nC. Đặt vào mặt da của khách\nD. Giấu trong lòng bàn tay\nĐáp án đúng: B\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 292, "q": "Cắt tóc bằng tông đơ đẩy từ dưới lên thường tạo ra kiểu dáng tương đồng với góc độ nào?", "o": ["Góc 0 độ", "Tương tự như kiểu cắt tầng thấp 45 độ (Graduation)", "Góc 90 độ đồng lớp", "Góc 180 độ lộn ngược"], "c": 1, "raw": "Câu 292: Cắt tóc bằng tông đơ đẩy từ dưới lên thường tạo ra kiểu dáng tương đồng với góc độ nào?\nA. Góc 0 độ\nB. Tương tự như kiểu cắt tầng thấp 45 độ (Graduation)\nC. Góc 90 độ đồng lớp\nD. Góc 180 độ lộn ngược\nĐáp án đúng: B\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 293, "q": "Tóc tơ mảnh (Vellus hair / Tóc mai) có đặc điểm sinh học nào sau đây?", "o": ["Chứa rất nhiều hạt hắc tố đậm màu", "Không có hạt hắc tố rõ rệt và thường không chứa lớp lõi tủy (Medulla)", "Rất khó uốn xoăn", "Chiếm 90% trọng lượng tóc"], "c": 1, "raw": "Câu 293: Tóc tơ mảnh (Vellus hair / Tóc mai) có đặc điểm sinh học nào sau đây?\nA. Chứa rất nhiều hạt hắc tố đậm màu\nB. Không có hạt hắc tố rõ rệt và thường không chứa lớp lõi tủy (Medulla)\nC. Rất khó uốn xoăn\nD. Chiếm 90% trọng lượng tóc\nĐáp án đúng: B\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 294, "q": "Những vị trí nào trên cơ thể con người hoàn toàn KHÔNG CÓ sự xuất hiện của nang lông?", "o": ["Da đầu và vành tai", "Lòng bàn tay và lòng bàn chân", "Cẳng chân và cánh tay", "Lưng và ngực"], "c": 1, "raw": "Câu 294: Những vị trí nào trên cơ thể con người hoàn toàn KHÔNG CÓ sự xuất hiện của nang lông?\nA. Da đầu và vành tai\nB. Lòng bàn tay và lòng bàn chân\nC. Cẳng chân và cánh tay\nD. Lưng và ngực\nĐáp án đúng: B\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 295, "q": "Kỹ thuật uốn tóc \"Piggyback wrap\" (cuốn cõng) được chỉ định sử dụng cho trường hợp nào?", "o": ["Tóc quá ngắn khó cuốn", "Mái tóc quá dài (dùng 2 thanh cuốn trên một tép tóc để phân bổ đều sóng)", "Tóc bị cháy do tẩy", "Tóc uốn lạnh thông thường"], "c": 1, "raw": "Câu 295: Kỹ thuật uốn tóc \"Piggyback wrap\" (cuốn cõng) được chỉ định sử dụng cho trường hợp nào?\nA. Tóc quá ngắn khó cuốn\nB. Mái tóc quá dài (dùng 2 thanh cuốn trên một tép tóc để phân bổ đều sóng)\nC. Tóc bị cháy do tẩy\nD. Tóc uốn lạnh thông thường\nĐáp án đúng: B\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 296, "q": "Tóc cứng và khô xơ thì người thợ tuyệt đối KHÔNG NÊN cắt quá ngắn ở khu vực nào?", "o": ["Phần gáy dưới", "Phần đỉnh đầu (Crown) vì tóc sẽ bị dựng đứng mất kiểm soát", "Phần mang tai", "Phần tóc mái"], "c": 1, "raw": "Câu 296: Tóc cứng và khô xơ thì người thợ tuyệt đối KHÔNG NÊN cắt quá ngắn ở khu vực nào?\nA. Phần gáy dưới\nB. Phần đỉnh đầu (Crown) vì tóc sẽ bị dựng đứng mất kiểm soát\nC. Phần mang tai\nD. Phần tóc mái\nĐáp án đúng: B\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 297, "q": "Tóc đã qua xử lý hóa chất (uốn, duỗi, nhuộm) thường có đặc điểm gì so với tóc nguyên thủy?", "o": ["Đóng chặt biểu bì hơn", "Mềm hơn, có độ phồng và tăng độ xốp hút hóa chất", "Hoàn toàn mất tính đàn hồi", "Chống thấm nước tuyệt đối"], "c": 1, "raw": "Câu 297: Tóc đã qua xử lý hóa chất (uốn, duỗi, nhuộm) thường có đặc điểm gì so với tóc nguyên thủy?\nA. Đóng chặt biểu bì hơn\nB. Mềm hơn, có độ phồng và tăng độ xốp hút hóa chất\nC. Hoàn toàn mất tính đàn hồi\nD. Chống thấm nước tuyệt đối\nĐáp án đúng: B\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 298, "q": "Kỹ thuật ép tóc \"Hard press\" (Ép mạnh) khác với \"Soft press\" (Ép nhẹ) ở điểm nào?", "o": ["Chỉ dùng máy sấy lạnh", "Sử dụng nhiệt lượng cao hơn và áp lực lược ép 2 lần ở mỗi mặt lọn tóc", "Bôi sáp thơm nhiều hơn", "Cần bọc giấy bạc quanh tóc"], "c": 1, "raw": "Câu 298: Kỹ thuật ép tóc \"Hard press\" (Ép mạnh) khác với \"Soft press\" (Ép nhẹ) ở điểm nào?\nA. Chỉ dùng máy sấy lạnh\nB. Sử dụng nhiệt lượng cao hơn và áp lực lược ép 2 lần ở mỗi mặt lọn tóc\nC. Bôi sáp thơm nhiều hơn\nD. Cần bọc giấy bạc quanh tóc\nĐáp án đúng: B\n\n", "cat": "styling", "sec": "3. Tạo kiểu tóc"}, {"n": 299, "q": "Bước đầu tiên cần thực hiện trước khi tiến hành cắt tạo kiểu cho mái tóc là gì?", "o": ["Cắt ngay phần tóc gáy", "Phân chia khu vực tóc (Sectioning)", "Sấy khô kiệt bằng nhiệt độ cao", "Thoa keo tạo nếp"], "c": 1, "raw": "Câu 299: Bước đầu tiên cần thực hiện trước khi tiến hành cắt tạo kiểu cho mái tóc là gì?\nA. Cắt ngay phần tóc gáy\nB. Phân chia khu vực tóc (Sectioning)\nC. Sấy khô kiệt bằng nhiệt độ cao\nD. Thoa keo tạo nếp\nĐáp án đúng: B\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 300, "q": "Khi khách hàng muốn thay đổi hoàn toàn màu sắc mái tóc từ chân đến ngọn, người thợ nên thực hiện:", "o": ["Nhuộm dặm chân tóc", "Nhuộm toàn bộ mái tóc (All-over color application) từ thân, ngọn rồi đến chân tóc", "Chỉ gội bằng dầu gội cân bằng", "Nâng sáng vài sợi highlight"], "c": 1, "raw": "Câu 300: Khi khách hàng muốn thay đổi hoàn toàn màu sắc mái tóc từ chân đến ngọn, người thợ nên thực hiện:\nA. Nhuộm dặm chân tóc\nB. Nhuộm toàn bộ mái tóc (All-over color application) từ thân, ngọn rồi đến chân tóc\nC. Chỉ gội bằng dầu gội cân bằng\nD. Nâng sáng vài sợi highlight\nĐáp án đúng: B\n\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 301, "q": "Dụng cụ kéo cắt thẳng không có răng cưa (Cutting shears) được dùng để:", "o": ["Tỉa mỏng sợi tóc", "Cắt đứt hoàn toàn một chùm tóc theo đường cắt định hình", "Cạo sạch viền chân tóc", "Lấy đi tế bào chết"], "c": 1, "raw": "Câu 301: Dụng cụ kéo cắt thẳng không có răng cưa (Cutting shears) được dùng để:\nA. Tỉa mỏng sợi tóc\nB. Cắt đứt hoàn toàn một chùm tóc theo đường cắt định hình\nC. Cạo sạch viền chân tóc\nD. Lấy đi tế bào chết\nĐáp án đúng: B\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 302, "q": "Khi sấy tạo kiểu tóc, thao tác di chuyển máy sấy liên tục nhằm mục đích quan trọng nhất là:", "o": ["Làm khách hàng dễ chịu", "Tránh tập trung nhiệt tại một điểm gây bỏng rát da đầu và cháy tóc", "Giúp máy sấy bớt tốn điện", "Giúp tóc nhanh vào nếp cứng"], "c": 1, "raw": "Câu 302: Khi sấy tạo kiểu tóc, thao tác di chuyển máy sấy liên tục nhằm mục đích quan trọng nhất là:\nA. Làm khách hàng dễ chịu\nB. Tránh tập trung nhiệt tại một điểm gây bỏng rát da đầu và cháy tóc\nC. Giúp máy sấy bớt tốn điện\nD. Giúp tóc nhanh vào nếp cứng\nĐáp án đúng: B\n\n", "cat": "styling", "sec": "3. Tạo kiểu tóc"}, {"n": 303, "q": "Loại da nào thường có xu hướng tiết ra lượng dầu tự nhiên dồi dào nhất?", "o": ["Da trắng mỏng manh", "Da dày, da sẫm màu", "Da lão hóa", "Da bị nẻ mùa đông"], "c": 1, "raw": "Câu 303: Loại da nào thường có xu hướng tiết ra lượng dầu tự nhiên dồi dào nhất?\nA. Da trắng mỏng manh\nB. Da dày, da sẫm màu\nC. Da lão hóa\nD. Da bị nẻ mùa đông\nĐáp án đúng: B\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 304, "q": "Loại da nào có nguy cơ bị lão hóa sớm và nhạy cảm nhất dưới tác động của ánh nắng mặt trời?", "o": ["Da sẫm màu", "Da trắng mỏng, ít sắc tố", "Da dầu", "Da hỗn hợp"], "c": 1, "raw": "Câu 304: Loại da nào có nguy cơ bị lão hóa sớm và nhạy cảm nhất dưới tác động của ánh nắng mặt trời?\nA. Da sẫm màu\nB. Da trắng mỏng, ít sắc tố\nC. Da dầu\nD. Da hỗn hợp\nĐáp án đúng: B\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 305, "q": "Hiện tượng bài tiết mồ hôi không đủ hoặc giảm tiết mồ hôi có tên kỹ thuật là gì?", "o": ["Hyperhidrosis", "Anhidrosis (Giảm tiết mồ hôi)", "Bromhidrosis", "Seborrhea"], "c": 1, "raw": "Câu 305: Hiện tượng bài tiết mồ hôi không đủ hoặc giảm tiết mồ hôi có tên kỹ thuật là gì?\nA. Hyperhidrosis\nB. Anhidrosis (Giảm tiết mồ hôi)\nC. Bromhidrosis\nD. Seborrhea\nĐáp án đúng: B\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 306, "q": "Tinh chất cây Phỉ (Witch Hazel) có công dụng nổi bật nào trong chăm sóc da?", "o": ["Làm trắng da tức thì", "Làm se khít lỗ chân lông, làm dịu da, kháng viêm và giảm mùi hôi", "Lột tẩy mụn đầu đen", "Thay thế kem chống nắng"], "c": 1, "raw": "Câu 306: Tinh chất cây Phỉ (Witch Hazel) có công dụng nổi bật nào trong chăm sóc da?\nA. Làm trắng da tức thì\nB. Làm se khít lỗ chân lông, làm dịu da, kháng viêm và giảm mùi hôi\nC. Lột tẩy mụn đầu đen\nD. Thay thế kem chống nắng\nĐáp án đúng: B\n\n", "cat": "skincare", "sec": "7. Chăm sóc da"}, {"n": 307, "q": "Tình trạng tóc bạc tự nhiên do mất đi hạt sắc tố Melanin có tên kỹ thuật là gì?", "o": ["Alopecia", "Canities", "Pityriasis", "Monilethrix"], "c": 1, "raw": "Câu 307: Tình trạng tóc bạc tự nhiên do mất đi hạt sắc tố Melanin có tên kỹ thuật là gì?\nA. Alopecia\nB. Canities\nC. Pityriasis\nD. Monilethrix\nĐáp án đúng: B\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 308, "q": "Nhóm màu thứ hai (Secondary colors) trên bánh xe màu sắc bao gồm những màu nào?", "o": ["Đỏ, Vàng, Xanh dương", "Cam, Xanh lá cây, Tím", "Nâu, Trắng, Đen", "Xám, Be, Hồng"], "c": 1, "raw": "Câu 308: Nhóm màu thứ hai (Secondary colors) trên bánh xe màu sắc bao gồm những màu nào?\nA. Đỏ, Vàng, Xanh dương\nB. Cam, Xanh lá cây, Tím\nC. Nâu, Trắng, Đen\nD. Xám, Be, Hồng\nĐáp án đúng: B\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 309, "q": "Khi ép nhiệt cho mái tóc ngắn và mỏng manh, khu vực nào người thợ cần phải hết sức cẩn thận?", "o": ["Phần ngọn tóc sau gáy", "Phần viền chân tóc quanh trán và mang tai", "Phần giữa đỉnh đầu", "Phần tóc dài nhất"], "c": 1, "raw": "Câu 309: Khi ép nhiệt cho mái tóc ngắn và mỏng manh, khu vực nào người thợ cần phải hết sức cẩn thận?\nA. Phần ngọn tóc sau gáy\nB. Phần viền chân tóc quanh trán và mang tai\nC. Phần giữa đỉnh đầu\nD. Phần tóc dài nhất\nĐáp án đúng: B\n\n", "cat": "styling", "sec": "3. Tạo kiểu tóc"}, {"n": 310, "q": "Mảnh thun cố định trên ống cuốn tóc (Perm rod) phải được cài đặt như thế nào để không làm gãy tóc?", "o": ["Cài vặn xoắn nhiều vòng", "Cài phẳng thẳng trên thân ống, không bị xoắn ép chặt vào sát chân tóc", "Cài chéo góc 45 độ", "Buộc sát vào da đầu"], "c": 1, "raw": "Câu 310: Mảnh thun cố định trên ống cuốn tóc (Perm rod) phải được cài đặt như thế nào để không làm gãy tóc?\nA. Cài vặn xoắn nhiều vòng\nB. Cài phẳng thẳng trên thân ống, không bị xoắn ép chặt vào sát chân tóc\nC. Cài chéo góc 45 độ\nD. Buộc sát vào da đầu\nĐáp án đúng: B\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 311, "q": "Khi thực hiện dịch vụ nhuộm tóc cho khách, người thợ nên mặc trang phục bảo hộ làm bằng chất liệu gì?", "o": ["Vải cotton thấm hút", "Loại vải sợi tổng hợp không thấm nước / nilon chống thấm", "Áo len dệt kim", "Áo lụa mỏng"], "c": 1, "raw": "Câu 311: Khi thực hiện dịch vụ nhuộm tóc cho khách, người thợ nên mặc trang phục bảo hộ làm bằng chất liệu gì?\nA. Vải cotton thấm hút\nB. Loại vải sợi tổng hợp không thấm nước / nilon chống thấm\nC. Áo len dệt kim\nD. Áo lụa mỏng\nĐáp án đúng: B\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 312, "q": "Khi dặm màu tóc mới mọc, người thợ cần chú ý điều gì để tránh làm hư hại tóc?", "o": ["Không được để thuốc nhuộm dính vào da đầu", "Tránh bôi thuốc chồng lên phần tóc đã có màu trước đó", "Phải dùng máy sấy nóng kích nhiệt liên tục", "Phải dùng lược sắt chải mạnh"], "c": 1, "raw": "Câu 312: Khi dặm màu tóc mới mọc, người thợ cần chú ý điều gì để tránh làm hư hại tóc?\nA. Không được để thuốc nhuộm dính vào da đầu\nB. Tránh bôi thuốc chồng lên phần tóc đã có màu trước đó\nC. Phải dùng máy sấy nóng kích nhiệt liên tục\nD. Phải dùng lược sắt chải mạnh\nĐáp án đúng: B\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 313, "q": "Việc sử dụng các dụng cụ nhiệt quá nóng trên mái tóc đã từng được tẩy trắng sẽ gây ra hiện tượng gì?", "o": ["Làm tóc bóng mượt hơn", "Làm phai màu tóc nhanh chóng và làm sợi tóc khô gãy", "Làm tóc dày lên gấp đôi", "Giúp màu nhuộm bền mãi mãi"], "c": 1, "raw": "Câu 313: Việc sử dụng các dụng cụ nhiệt quá nóng trên mái tóc đã từng được tẩy trắng sẽ gây ra hiện tượng gì?\nA. Làm tóc bóng mượt hơn\nB. Làm phai màu tóc nhanh chóng và làm sợi tóc khô gãy\nC. Làm tóc dày lên gấp đôi\nD. Giúp màu nhuộm bền mãi mãi\nĐáp án đúng: B\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 314, "q": "Sản phẩm hóa chất nào sau đây có khả năng nâng sáng màu tóc lên nhiều tầng nhất?", "o": ["Dầu gội cân bằng", "Bột tẩy tóc (Bleach / Lightener)", "Thuốc nhuộm demi-permanent", "Dầu xả chuyên sâu"], "c": 1, "raw": "Câu 314: Sản phẩm hóa chất nào sau đây có khả năng nâng sáng màu tóc lên nhiều tầng nhất?\nA. Dầu gội cân bằng\nB. Bột tẩy tóc (Bleach / Lightener)\nC. Thuốc nhuộm demi-permanent\nD. Dầu xả chuyên sâu\nĐáp án đúng: B\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 315, "q": "Trong quy trình uốn tóc, miếng bông gòn bảo vệ quanh viền chân tóc cần được thay thế khi nào?", "o": ["Vào cuối ngày làm việc", "Ngay sau khi bôi thuốc uốn và miếng bông đã ướt đẫm hóa chất", "Khi xả tóc xong", "Không cần thay, giữ nguyên suốt dịch vụ"], "c": 1, "raw": "Câu 315: Trong quy trình uốn tóc, miếng bông gòn bảo vệ quanh viền chân tóc cần được thay thế khi nào?\nA. Vào cuối ngày làm việc\nB. Ngay sau khi bôi thuốc uốn và miếng bông đã ướt đẫm hóa chất\nC. Khi xả tóc xong\nD. Không cần thay, giữ nguyên suốt dịch vụ\nĐáp án đúng: B\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 316, "q": "Ba giai đoạn tuần hoàn sinh trưởng của một sợi tóc theo đúng thứ tự là gì?", "o": ["Anagen (Tăng trưởng), Catagen (Chuyển tiếp), Telogen (Nghỉ ngơi/Rụng)", "Telogen, Anagen, Catagen", "Catagen, Telogen, Anagen", "Keratin, Sebum, Melanin"], "c": 0, "raw": "Câu 316: Ba giai đoạn tuần hoàn sinh trưởng của một sợi tóc theo đúng thứ tự là gì?\nA. Anagen (Tăng trưởng), Catagen (Chuyển tiếp), Telogen (Nghỉ ngơi/Rụng)\nB. Telogen, Anagen, Catagen\nC. Catagen, Telogen, Anagen\nD. Keratin, Sebum, Melanin\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 317, "q": "Quy trình nhuộm màu kép (Double-process haircoloring) bao gồm 2 bước tuần tự nào?", "o": ["Cắt tóc sau đó sấy khô", "Tẩy sáng tóc trước (Pre-lightening), sau đó dùng màu điều chỉnh / Toner", "Uốn xoăn rồi duỗi thẳng", "Gội đầu rồi xả nước lạnh"], "c": 1, "raw": "Câu 317: Quy trình nhuộm màu kép (Double-process haircoloring) bao gồm 2 bước tuần tự nào?\nA. Cắt tóc sau đó sấy khô\nB. Tẩy sáng tóc trước (Pre-lightening), sau đó dùng màu điều chỉnh / Toner\nC. Uốn xoăn rồi duỗi thẳng\nD. Gội đầu rồi xả nước lạnh\nĐáp án đúng: B\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 318, "q": "Chất khử trùng tiêu chuẩn của salon được khuyến cáo sử dụng trên bề mặt nào?", "o": ["Trên da và tóc của khách", "Trên các bề mặt cứng, nhẵn, không có lỗ thấm hút", "Trên khăn bông thấm nước", "Trên cây dũa giấy xài , "q": "Dụng cụ nào được xem là tốt nhất để lấy sản phẩm trang điểm từ hộp chứa ra khay pha màu?", "o": ["Dùng ngón tay trỏ", "Dùng một chiếc muỗng nhựa sạch hoặc que gạt vô trùng", "Dùng cọ đã qua sử dụng", "Dùng tăm xỉa răng"], "c": 1, "raw": "Câu 322: Dụng cụ nào được xem là tốt nhất để lấy sản phẩm trang điểm từ hộp chứa ra khay pha màu?\nA. Dùng ngón tay trỏ\nB. Dùng một chiếc muỗng nhựa sạch hoặc que gạt vô trùng\nC. Dùng cọ đã qua sử dụng\nD. Dùng tăm xỉa răng\nĐáp án đúng: B\n\n", "cat": "lash_brow", "sec": "8. Lông mi và lông mày"}, {"n": 323, "q": "Nước khoáng có chứa nhiều ion Canxi và Magie, khó tạo bọt xà phòng được gọi là:", "o": ["Nước mềm", "Nước cứng / Nước phèn (Hard water)", "Nước cất", "Nước tinh khiết"], "c": 1, "raw": "Câu 323: Nước khoáng có chứa nhiều ion Canxi và Magie, khó tạo bọt xà phòng được gọi là:\nA. Nước mềm\nB. Nước cứng / Nước phèn (Hard water)\nC. Nước cất\nD. Nước tinh khiết\nĐáp án đúng: B\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 324, "q": "Dụng cụ chải tóc nào có đặc tính dẫn nhiệt và giữ nhiệt cao nhất khi dùng kèm nhiệt độ?", "o": ["Lược nhựa mềm", "Lược làm bằng kim loại", "Lược gỗ", "Lược sừng"], "c": 1, "raw": "Câu 324: Dụng cụ chải tóc nào có đặc tính dẫn nhiệt và giữ nhiệt cao nhất khi dùng kèm nhiệt độ?\nA. Lược nhựa mềm\nB. Lược làm bằng kim loại\nC. Lược gỗ\nD. Lược sừng\nĐáp án đúng: B\n\n", "cat": "styling", "sec": "3. Tạo kiểu tóc"}, {"n": 325, "q": "Dầu gội trị gàu chuyên dụng có tên kỹ thuật trong ngành tóc là gì?", "o": ["Clarifying Shampoo", "Medicated Shampoo", "Acid-balanced Shampoo", "Neutralizing Shampoo"], "c": 1, "raw": "Câu 325: Dầu gội trị gàu chuyên dụng có tên kỹ thuật trong ngành tóc là gì?\nA. Clarifying Shampoo\nB. Medicated Shampoo\nC. Acid-balanced Shampoo\nD. Neutralizing Shampoo\nĐáp án đúng: B\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 326, "q": "Thao tác dũa móng qua lại liên tục như động tác cưa gỗ sẽ
