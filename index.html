: "haircut", "sec": "4. Cắt tóc"}, {"n": 330, "q": "Dụng cụ kéo tỉa thưa (Thinning shears) tạo ra sự khác biệt gì so với kéo cắt thông thường?", "o": ["Có một lưỡi thẳng và một lưỡi có các răng cưa để tỉa mỏng tóc mà không cắt đứt toàn bộ", "Làm bằng chất liệu đồng", "Hai lưỡi đều có hình ziczac", "Không thể cắt đứt được tóc"], "c": 0, "raw": "Câu 330: Dụng cụ kéo tỉa thưa (Thinning shears) tạo ra sự khác biệt gì so với kéo cắt thông thường?\nA. Có một lưỡi thẳng và một lưỡi có các răng cưa để tỉa mỏng tóc mà không cắt đứt toàn bộ\nB. Làm bằng chất liệu đồng\nC. Hai lưỡi đều có hình ziczac\nD. Không thể cắt đứt được tóc\nĐáp án đúng: A\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 331, "q": "Thao tác đúc ngón tay cái quá sâu vào lỗ kéo cắt tóc sẽ dẫn đến hậu quả gì?", "o": ["Kéo cắt sắc bén hơn", "Giảm sự linh hoạt, hạn chế góc mở của lưỡi kéo và gây mỏi khớp tay", "Làm gãy lưỡi kéo", "Giúp cắt tóc nhanh gấp đôi"], "c": 1, "raw": "Câu 331: Thao tác đúc ngón tay cái quá sâu vào lỗ kéo cắt tóc sẽ dẫn đến hậu quả gì?\nA. Kéo cắt sắc bén hơn\nB. Giảm sự linh hoạt, hạn chế góc mở của lưỡi kéo và gây mỏi khớp tay\nC. Làm gãy lưỡi kéo\nD. Giúp cắt tóc nhanh gấp đôi\nĐáp án đúng: B\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 332, "q": "Dụng cụ dũa chân (Foot file) trong dịch vụ làm móng chân (Pedicure) được sử dụng để:", "o": ["Dũa ngắn móng chân", "Chà mịn và làm giảm các mảng da chai sần (Callus) ở gót chân", "Cắt khóe móng", "Lấy đi lớp biểu bì"], "c": 1, "raw": "Câu 332: Dụng cụ dũa chân (Foot file) trong dịch vụ làm móng chân (Pedicure) được sử dụng để:\nA. Dũa ngắn móng chân\nB. Chà mịn và làm giảm các mảng da chai sần (Callus) ở gót chân\nC. Cắt khóe móng\nD. Lấy đi lớp biểu bì\nĐáp án đúng: B\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 333, "q": "Đèn sấy Gel (UV/LED lamp) có tác dụng gì đối với cấu trúc của lớp sơn Gel?", "o": ["Tẩy sạch lớp keo dính", "Kích hoạt phản ứng quang trùng hợp làm cứng và khô hoàn toàn lớp gel", "Làm mờ màu sơn", "Làm mềm móng"], "c": 1, "raw": "Câu 333: Đèn sấy Gel (UV/LED lamp) có tác dụng gì đối với cấu trúc của lớp sơn Gel?\nA. Tẩy sạch lớp keo dính\nB. Kích hoạt phản ứng quang trùng hợp làm cứng và khô hoàn toàn lớp gel\nC. Làm mờ màu sơn\nD. Làm mềm móng\nĐáp án đúng: B\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 334, "q": "Bôi thuốc duỗi tóc kiềm cao (Relaxer) nên bôi vào khu vực nào của sợi tóc đầu tiên?", "o": ["Bôi sát vào da đầu", "Bôi vào phần tóc kháng thuốc nhất / ít thấm hóa chất nhất (thường là thân tóc phía sau gáy)", "Bôi vào ngọn tóc chẻ ngọn trước", "Bôi vào phần tóc mái mỏng"], "c": 1, "raw": "Câu 334: Bôi thuốc duỗi tóc kiềm cao (Relaxer) nên bôi vào khu vực nào của sợi tóc đầu tiên?\nA. Bôi sát vào da đầu\nB. Bôi vào phần tóc kháng thuốc nhất / ít thấm hóa chất nhất (thường là thân tóc phía sau gáy)\nC. Bôi vào ngọn tóc chẻ ngọn trước\nD. Bôi vào phần tóc mái mỏng\nĐáp án đúng: B\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 335, "q": "Khi thực hiện dịch vụ uốn tóc cho khách có tiền sử dị ứng, người thợ cần tránh:", "o": ["Dùng khăn choàng", "Để dung dịch thuốc uốn tiếp xúc trực tiếp vào da đầu và mặt của khách", "Gội đầu trước khi uốn", "Dùng lược chải tóc"], "c": 1, "raw": "Câu 335: Khi thực hiện dịch vụ uốn tóc cho khách có tiền sử dị ứng, người thợ cần tránh:\nA. Dùng khăn choàng\nB. Để dung dịch thuốc uốn tiếp xúc trực tiếp vào da đầu và mặt của khách\nC. Gội đầu trước khi uốn\nD. Dùng lược chải tóc\nĐáp án đúng: B\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 336, "q": "Dung dịch cồn (Alcohol) dùng trong quy trình làm móng Gel có tác dụng gì ở bước hoàn thiện?", "o": ["Làm tan móng giả", "Lau sạch lớp màng dính nhờn cặn sót lại (Inhibition layer) trên bề mặt gel sau khi hơ đèn", "Làm lớp gel mềm ra", "Thay thế lớp sơn lót"], "c": 1, "raw": "Câu 336: Dung dịch cồn (Alcohol) dùng trong quy trình làm móng Gel có tác dụng gì ở bước hoàn thiện?\nA. Làm tan móng giả\nB. Lau sạch lớp màng dính nhờn cặn sót lại (Inhibition layer) trên bề mặt gel sau khi hơ đèn\nC. Làm lớp gel mềm ra\nD. Thay thế lớp sơn lót\nĐáp án đúng: B\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 337, "q": "Bề mặt da khỏe mạnh tự nhiên có lớp màng bảo vệ mang tính chất gì?", "o": ["Tính kiềm mạnh", "Tính acid nhẹ (Màng acid mantle giúp chống khuẩn)", "Hoàn toàn trung tính", "Tính dầu nhờn đặc quánh"], "c": 1, "raw": "Câu 337: Bề mặt da khỏe mạnh tự nhiên có lớp màng bảo vệ mang tính chất gì?\nA. Tính kiềm mạnh\nB. Tính acid nhẹ (Màng acid mantle giúp chống khuẩn)\nC. Hoàn toàn trung tính\nD. Tính dầu nhờn đặc quánh\nĐáp án đúng: B\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 338, "q": "Sản phẩm dán mí hoặc băng keo che chắn vùng mắt khi trang điểm cần được kiểm tra để tránh:", "o": ["Làm bay màu phấn mắt", "Làm tổn thương, trầy xước lớp da mỏng manh quanh vùng mắt của khách", "Làm mi giả nhanh rụng", "Làm cay mũi"], "c": 1, "raw": "Câu 338: Sản phẩm dán mí hoặc băng keo che chắn vùng mắt khi trang điểm cần được kiểm tra để tránh:\nA. Làm bay màu phấn mắt\nB. Làm tổn thương, trầy xước lớp da mỏng manh quanh vùng mắt của khách\nC. Làm mi giả nhanh rụng\nD. Làm cay mũi\nĐáp án đúng: B\n\n", "cat": "lash_brow", "sec": "8. Lông mi và lông mày"}, {"n": 339, "q": "Cắt tóc theo kỹ thuật \"Point cutting\" (Cắt điểm bằng mũi kéo) có tác dụng gì?", "o": ["Cắt cụt đuôi tóc theo đường thẳng ngang", "Làm mềm ngọn tóc, tạo độ liên kết và loại bỏ bớt trọng lượng ở đuôi tóc", "Cắt sát da đầu", "Làm xoăn tóc tự nhiên"], "c": 1, "raw": "Câu 339: Cắt tóc theo kỹ thuật \"Point cutting\" (Cắt điểm bằng mũi kéo) có tác dụng gì?\nA. Cắt cụt đuôi tóc theo đường thẳng ngang\nB. Làm mềm ngọn tóc, tạo độ liên kết và loại bỏ bớt trọng lượng ở đuôi tóc\nC. Cắt sát da đầu\nD. Làm xoăn tóc tự nhiên\nĐáp án đúng: B\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 340, "q": "Sau khi thực hiện xong dịch vụ tẩy lông chân bằng sáp, người thợ nên bôi sản phẩm gì lên da khách?", "o": ["Cồn 90 độ", "Nước hoa có cồn", "Lotion dưỡng làm dịu mát da hoặc dầu chuyên dụng làm sạch sáp dính", "Nước nóng"], "c": 2, "raw": "Câu 340: Sau khi thực hiện xong dịch vụ tẩy lông chân bằng sáp, người thợ nên bôi sản phẩm gì lên da khách?\nA. Cồn 90 độ\nB. Nước hoa có cồn\nC. Lotion dưỡng làm dịu mát da hoặc dầu chuyên dụng làm sạch sáp dính\nD. Nước nóng\nĐáp án đúng: C\n\n", "cat": "waxing", "sec": "9. Triệt lông"}, {"n": 341, "q": "Kỹ thuật kiểm tra chéo (Cross-check) cho một mái tóc đã được cắt theo phân khu đường dọc (Vertical lines) là:", "o": ["Nâng các tép tóc theo đường chia ngang (Horizontal lines) để đối chiếu độ đều", "Dùng kéo tỉa bấm ngang", "Sấy khô kiểm tra bằng mắt", "Chải tóc hết về phía trước mặt"], "c": 0, "raw": "Câu 341: Kỹ thuật kiểm tra chéo (Cross-check) cho một mái tóc đã được cắt theo phân khu đường dọc (Vertical lines) là:\nA. Nâng các tép tóc theo đường chia ngang (Horizontal lines) để đối chiếu độ đều\nB. Dùng kéo tỉa bấm ngang\nC. Sấy khô kiểm tra bằng mắt\nD. Chải tóc hết về phía trước mặt\nĐáp án đúng: A\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 342, "q": "Sợi tóc bị mất đi lớp biểu bì bảo vệ bên ngoài (Cuticle bị hư hại hoàn toàn) sẽ có biểu hiện gì?", "o": ["Tóc bóng mượt như tơ", "Tóc trở nên xơ xác, khô ráp, rất dễ gãy đứt và mất khả năng giữ ẩm", "Tóc tự động mọc dài nhanh hơn", "Tóc đen đậm hơn"], "c": 1, "raw": "Câu 342: Sợi tóc bị mất đi lớp biểu bì bảo vệ bên ngoài (Cuticle bị hư hại hoàn toàn) sẽ có biểu hiện gì?\nA. Tóc bóng mượt như tơ\nB. Tóc trở nên xơ xác, khô ráp, rất dễ gãy đứt và mất khả năng giữ ẩm\nC. Tóc tự động mọc dài nhanh hơn\nD. Tóc đen đậm hơn\nĐáp án đúng: B\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 343, "q": "Khách hàng có tiền sử dị ứng với hóa chất làm tóc thì bước xử lý an toàn nhất của thợ là:", "o": ["Pha loãng thuốc với nước lọc", "Thực hiện bài kiểm tra dị ứng trên một vùng da nhỏ (Patch test) trước 24 đến 48 giờ", "Vẫn bôi thuốc bình thường và cho uống thuốc dị ứng", "Dùng máy sấy lạnh thổi liên tục"], "c": 1, "raw": "Câu 343: Khách hàng có tiền sử dị ứng với hóa chất làm tóc thì bước xử lý an toàn nhất của thợ là:\nA. Pha loãng thuốc với nước lọc\nB. Thực hiện bài kiểm tra dị ứng trên một vùng da nhỏ (Patch test) trước 24 đến 48 giờ\nC. Vẫn bôi thuốc bình thường và cho uống thuốc dị ứng\nD. Dùng máy sấy lạnh thổi liên tục\nĐáp án đúng: B\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 344, "q": "Dụng cụ nào sau đây bắt buộc phải được khử trùng bằng hóa chất sau mỗi một lượt khách hàng?", "o": ["Miếng bọt biển rửa mặt", "Cây que gỗ cam đẩy da chết", "Kềm bấm móng, kéo cắt tóc, lược nhựa", "Giấy vệ sinh cổ áo"], "c": 2, "raw": "Câu 344: Dụng cụ nào sau đây bắt buộc phải được khử trùng bằng hóa chất sau mỗi một lượt khách hàng?\nA. Miếng bọt biển rửa mặt\nB. Cây que gỗ cam đẩy da chết\nC. Kềm bấm móng, kéo cắt tóc, lược nhựa\nD. Giấy vệ sinh cổ áo\nĐáp án đúng: C\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 345, "q": "Động tác massage nào có tác dụng làm dịu thần kinh và thường dùng để mở đầu hoặc kết thúc một bài massage mặt?", "o": ["Vỗ tát mạnh (Tapotement)", "Vuốt nhẹ nhàng, êm dịu (Effleurage)", "Nhào bóp sâu (Petrissage)", "Rung lắc cơ thể (Vibration)"], "c": 1, "raw": "Câu 345: Động tác massage nào có tác dụng làm dịu thần kinh và thường dùng để mở đầu hoặc kết thúc một bài massage mặt?\nA. Vỗ tát mạnh (Tapotement)\nB. Vuốt nhẹ nhàng, êm dịu (Effleurage)\nC. Nhào bóp sâu (Petrissage)\nD. Rung lắc cơ thể (Vibration)\nĐáp án đúng: B\n\n", "cat": "skincare", "sec": "7. Chăm sóc da"}, {"n": 346, "q": "Sự tích tụ của các tế bào biểu bì chết kết hợp với bã nhờn khô cứng ở lỗ chân lông tạo nên:", "o": ["Mụn đầu đen (Comedone)", "Khối u ác tính", "Mụn nước mủ", "Nốt tàn nhang"], "c": 0, "raw": "Câu 346: Sự tích tụ của các tế bào biểu bì chết kết hợp với bã nhờn khô cứng ở lỗ chân lông tạo nên:\nA. Mụn đầu đen (Comedone)\nB. Khối u ác tính\nC. Mụn nước mủ\nD. Nốt tàn nhang\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 347, "q": "Tóc mọc không đều hướng ở vùng xoáy đầu (Cowlick) khi cắt cần chú ý điều gì?", "o": ["Cắt thật sát da đầu", "Để lại chiều dài tóc dài hơn một chút và không kéo quá căng khi cắt để tránh tóc bị vểnh", "Cắt bằng dao cạo thật mỏng", "Cạo trọc vùng xoáy"], "c": 1, "raw": "Câu 347: Tóc mọc không đều hướng ở vùng xoáy đầu (Cowlick) khi cắt cần chú ý điều gì?\nA. Cắt thật sát da đầu\nB. Để lại chiều dài tóc dài hơn một chút và không kéo quá căng khi cắt để tránh tóc bị vểnh\nC. Cắt bằng dao cạo thật mỏng\nD. Cạo trọc vùng xoáy\nĐáp án đúng: B\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 348, "q": "Cơ quan liên bang OSHA ban hành các quy định tại nơi làm việc nhằm mục đích tối thượng nào?", "o": ["Quản lý mức thuế kinh doanh của tiệm", "Đảm bảo an toàn và bảo vệ sức khỏe cho người lao động", "Định giá dịch vụ làm tóc", "Cấp phép lưu hành mỹ phẩm"], "c": 1, "raw": "Câu 348: Cơ quan liên bang OSHA ban hành các quy định tại nơi làm việc nhằm mục đích tối thượng nào?\nA. Quản lý mức thuế kinh doanh của tiệm\nB. Đảm bảo an toàn và bảo vệ sức khỏe cho người lao động\nC. Định giá dịch vụ làm tóc\nD. Cấp phép lưu hành mỹ phẩm\nĐáp án đúng: B\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 349, "q": "Tại sao một hóa chất khử trùng dùng trong salon phải có số đăng ký xác nhận của EPA?", "o": ["Để xác nhận sản phẩm đã được kiểm nghiệm an toàn môi trường và có hiệu quả diệt khuẩn theo chứng nhận", "Để được giảm thuế khi mua", "Để chứng minh hóa chất có thể uống được", "Để dùng thay thế xà phòng tắm"], "c": 0, "raw": "Câu 349: Tại sao một hóa chất khử trùng dùng trong salon phải có số đăng ký xác nhận của EPA?\nA. Để xác nhận sản phẩm đã được kiểm nghiệm an toàn môi trường và có hiệu quả diệt khuẩn theo chứng nhận\nB. Để được giảm thuế khi mua\nC. Để chứng minh hóa chất có thể uống được\nD. Để dùng thay thế xà phòng tắm\nĐáp án đúng: A\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 350, "q": "Bảng dữ liệu an toàn SDS (Safety Data Sheet) cung cấp đầy đủ thông tin nào sau đây?", "o": ["Giá bán lẻ của sản phẩm", "Ngày hết hạn của từng lô hàng", "Thành phần hóa chất, nguy cơ độc hại, biện pháp sơ cứu và cách bảo quản xử lý an toàn", "Doanh thu của nhà sản xuất"], "c": 2, "raw": "Câu 350: Bảng dữ liệu an toàn SDS (Safety Data Sheet) cung cấp đầy đủ thông tin nào sau đây?\nA. Giá bán lẻ của sản phẩm\nB. Ngày hết hạn của từng lô hàng\nC. Thành phần hóa chất, nguy cơ độc hại, biện pháp sơ cứu và cách bảo quản xử lý an toàn\nD. Doanh thu của nhà sản xuất\nĐáp án đúng: C\n\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 351, "q": "Khi tiếp xúc với các hóa chất uốn, duỗi, tẩy nhuộm nồng độ cao, thiết bị PPE bắt buộc bao gồm:", "o": ["Nón bảo hiểm", "Găng tay bảo vệ và kính bảo hộ mắt chuyên dụng", "Khẩu trang vải mỏng", "Áo mưa"], "c": 1, "raw": "Câu 351: Khi tiếp xúc với các hóa chất uốn, duỗi, tẩy nhuộm nồng độ cao, thiết bị PPE bắt buộc bao gồm:\nA. Nón bảo hiểm\nB. Găng tay bảo vệ và kính bảo hộ mắt chuyên dụng\nC. Khẩu trang vải mỏng\nD. Áo mưa\nĐáp án đúng: B\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 352, "q": "Tại sao FDA nghiêm cấm việc sử dụng hoạt chất MMA (Methyl Methacrylate) trong ngành đắp móng?", "o": ["Vì bột quá mềm không giữ được form", "Vì gây tổn thương nặng móng thật, độ bám quá cứng gây rách nền móng và gây dị ứng độc hại cao", "Vì giá thành quá đắt đỏ", "Vì làm móng mọc quá nhanh"], "c": 1, "raw": "Câu 352: Tại sao FDA nghiêm cấm việc sử dụng hoạt chất MMA (Methyl Methacrylate) trong ngành đắp móng?\nA. Vì bột quá mềm không giữ được form\nB. Vì gây tổn thương nặng móng thật, độ bám quá cứng gây rách nền móng và gây dị ứng độc hại cao\nC. Vì giá thành quá đắt đỏ\nD. Vì làm móng mọc quá nhanh\nĐáp án đúng: B\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 353, "q": "Monomer Liquid (ML) và Polymer Powder (PP) kết hợp lại với nhau sẽ diễn ra phản ứng gì?", "o": ["Phản ứng đông cứng trùng hợp tạo nên móng nhân tạo acrylic (Polymerization)", "Phản ứng bay hơi hoàn toàn", "Phản ứng phân hủy móng thật", "Phản ứng tạo bọt xà phòng"], "c": 0, "raw": "Câu 353: Monomer Liquid (ML) và Polymer Powder (PP) kết hợp lại với nhau sẽ diễn ra phản ứng gì?\nA. Phản ứng đông cứng trùng hợp tạo nên móng nhân tạo acrylic (Polymerization)\nB. Phản ứng bay hơi hoàn toàn\nC. Phản ứng phân hủy móng thật\nD. Phản ứng tạo bọt xà phòng\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 354, "q": "Lớp nào trong 5 lớp của biểu bì da liên tục sản sinh ra tế bào mới thông qua quá trình phân bào?", "o": ["Lớp sừng (Stratum Corneum)", "Lớp gai (Stratum Spinosum)", "Lớp mầm (Stratum Germinativum / Basale)", "Lớp hạt (Stratum Granulosum)"], "c": 2, "raw": "Câu 354: Lớp nào trong 5 lớp của biểu bì da liên tục sản sinh ra tế bào mới thông qua quá trình phân bào?\nA. Lớp sừng (Stratum Corneum)\nB. Lớp gai (Stratum Spinosum)\nC. Lớp mầm (Stratum Germinativum / Basale)\nD. Lớp hạt (Stratum Granulosum)\nĐáp án đúng: C\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 355, "q": "Tuyến bã nhờn (Sebaceous gland) bài tiết Sebum (dầu) nối liền trực tiếp vào bộ phận nào?", "o": ["Móng tay", "Nang lông / Nang tóc", "Tuyến nước bọt", "Lớp sừng ngoài cùng"], "c": 1, "raw": "Câu 355: Tuyến bã nhờn (Sebaceous gland) bài tiết Sebum (dầu) nối liền trực tiếp vào bộ phận nào?\nA. Móng tay\nB. Nang lông / Nang tóc\nC. Tuyến nước bọt\nD. Lớp sừng ngoài cùng\nĐáp án đúng: B\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 356, "q": "Keratin là một loại protein dạng sợi có vai trò cấu trúc nền tảng cho:", "o": ["Cơ bắp và mạch máu", "Tóc và móng tay móng chân", "Răng và xương", "Các hạch bạch huyết"], "c": 1, "raw": "Câu 356: Keratin là một loại protein dạng sợi có vai trò cấu trúc nền tảng cho:\nA. Cơ bắp và mạch máu\nB. Tóc và móng tay móng chân\nC. Răng và xương\nD. Các hạch bạch huyết\nĐáp án đúng: B\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 357, "q": "Lớp biểu bì sợi tóc (Cuticle) có tính chất quyết định đến yếu tố nào của sợi tóc?", "o": ["Màu sắc tự nhiên của tóc", "Độ xốp (Porosity) và khả năng hấp thụ độ ẩm, hóa chất của sợi tóc", "Độ quăn bẩm sinh", "Chiều dài tối đa của sợi tóc"], "c": 1, "raw": "Câu 357: Lớp biểu bì sợi tóc (Cuticle) có tính chất quyết định đến yếu tố nào của sợi tóc?\nA. Màu sắc tự nhiên của tóc\nB. Độ xốp (Porosity) và khả năng hấp thụ độ ẩm, hóa chất của sợi tóc\nC. Độ quăn bẩm sinh\nD. Chiều dài tối đa của sợi tóc\nĐáp án đúng: B\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 358, "q": "Lớp thân tóc (Cortex) là trung tâm của mọi dịch vụ làm tóc chuyên nghiệp vì:", "o": ["Là nơi duy nhất tiếp xúc với nước xả", "Chứa 90% trọng lượng sợi tóc, chứa sắc tố melanin và các liên kết hóa học quyết định độ đàn hồi, hình dáng tóc", "Là lớp vảy bảo vệ ngoài cùng", "Giúp tóc chống lại trọng lực"], "c": 1, "raw": "Câu 358: Lớp thân tóc (Cortex) là trung tâm của mọi dịch vụ làm tóc chuyên nghiệp vì:\nA. Là nơi duy nhất tiếp xúc với nước xả\nB. Chứa 90% trọng lượng sợi tóc, chứa sắc tố melanin và các liên kết hóa học quyết định độ đàn hồi, hình dáng tóc\nC. Là lớp vảy bảo vệ ngoài cùng\nD. Giúp tóc chống lại trọng lực\nĐáp án đúng: B\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 359, "q": "Sự khác nhau cơ bản giữa Eumelanin và Pheomelanin là gì?", "o": ["Eumelanin quyết định màu đỏ; Pheomelanin quyết định màu đen", "Eumelanin tạo sắc tố đen và nâu; Pheomelanin tạo sắc tố đỏ và vàng hoe", "Eumelanin chỉ có ở móng tay", "Cả hai đều biến mất khi sấy tóc"], "c": 1, "raw": "Câu 359: Sự khác nhau cơ bản giữa Eumelanin và Pheomelanin là gì?\nA. Eumelanin quyết định màu đỏ; Pheomelanin quyết định màu đen\nB. Eumelanin tạo sắc tố đen và nâu; Pheomelanin tạo sắc tố đỏ và vàng hoe\nC. Eumelanin chỉ có ở móng tay\nD. Cả hai đều biến mất khi sấy tóc\nĐáp án đúng: B\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 360, "q": "Cắt phạm vào lớp mô Hyponychium dưới đầu móng tự nhiên sẽ gây ra hậu quả gì?", "o": ["Làm móng mọc chậm lại", "Gây đau đớn dữ dội, chảy máu và mở đường cho vi khuẩn xâm nhập gây nhiễm trùng nền móng", "Giúp sơn móng bền hơn", "Không gây bất kỳ ảnh hưởng nào"], "c": 1, "raw": "Câu 360: Cắt phạm vào lớp mô Hyponychium dưới đầu móng tự nhiên sẽ gây ra hậu quả gì?\nA. Làm móng mọc chậm lại\nB. Gây đau đớn dữ dội, chảy máu và mở đường cho vi khuẩn xâm nhập gây nhiễm trùng nền móng\nC. Giúp sơn móng bền hơn\nD. Không gây bất kỳ ảnh hưởng nào\nĐáp án đúng: B\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 361, "q": "Lớp da Eponychium khác với màng tế bào chết Cuticle ở điểm nào?", "o": ["Eponychium là phần da sống ở gốc móng, không được phép cắt bỏ; Cuticle là lớp vảy tế bào chết bám trên thân móng có thể đẩy sạch", "Eponychium luôn bị cắt bỏ hoàn toàn", "Eponychium nằm dưới đầu móng tự do", "Cuticle chứa mạch máu"], "c": 0, "raw": "Câu 361: Lớp da Eponychium khác với màng tế bào chết Cuticle ở điểm nào?\nA. Eponychium là phần da sống ở gốc móng, không được phép cắt bỏ; Cuticle là lớp vảy tế bào chết bám trên thân móng có thể đẩy sạch\nB. Eponychium luôn bị cắt bỏ hoàn toàn\nC. Eponychium nằm dưới đầu móng tự do\nD. Cuticle chứa mạch máu\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 362, "q": "Mộng thịt móng tay (Nail Pterygium) hình thành do tình trạng nào?", "o": ["Do sơn móng màu đậm", "Da viền móng hoặc eponychium bị tổn thương dính chặt bất thường và phát triển bò chồm lên mặt móng", "Do dũa móng quá vuông", "Do thiếu canxi"], "c": 1, "raw": "Câu 362: Mộng thịt móng tay (Nail Pterygium) hình thành do tình trạng nào?\nA. Do sơn móng màu đậm\nB. Da viền móng hoặc eponychium bị tổn thương dính chặt bất thường và phát triển bò chồm lên mặt móng\nC. Do dũa móng quá vuông\nD. Do thiếu canxi\nĐáp án đúng: B\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 363, "q": "Một người thợ có vết xước măng rô (Hangnail), để đảm bảo an toàn vệ sinh khi phục vụ khách, thợ phải làm gì?", "o": ["Nhúng tay vào acetone", "Băng kín vết xước lại và luôn mang găng tay bảo hộ trong suốt quá trình phục vụ", "Cắt da sâu hơn cho hết xước", "Thoa nước sơn móng lên vết xước"], "c": 1, "raw": "Câu 363: Một người thợ có vết xước măng rô (Hangnail), để đảm bảo an toàn vệ sinh khi phục vụ khách, thợ phải làm gì?\nA. Nhúng tay vào acetone\nB. Băng kín vết xước lại và luôn mang găng tay bảo hộ trong suốt quá trình phục vụ\nC. Cắt da sâu hơn cho hết xước\nD. Thoa nước sơn móng lên vết xước\nĐáp án đúng: B\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 364, "q": "Điểm khác biệt mấu chốt giữa Mụn nhọt (Boil) và Mụn mủ (Pustule) là gì?", "o": ["Mụn nhọt là ổ nhiễm trùng sâu ở nang lông chứa mủ và đau nhức; Mụn mủ là tổn thương bề mặt biểu bì chứa dịch mủ viêm", "Mụn nhọt do virus gây ra", "Mụn mủ không bao giờ có vi khuẩn", "Cả hai đều do cháy nắng"], "c": 0, "raw": "Câu 364: Điểm khác biệt mấu chốt giữa Mụn nhọt (Boil) và Mụn mủ (Pustule) là gì?\nA. Mụn nhọt là ổ nhiễm trùng sâu ở nang lông chứa mủ và đau nhức; Mụn mủ là tổn thương bề mặt biểu bì chứa dịch mủ viêm\nB. Mụn nhọt do virus gây ra\nC. Mụn mủ không bao giờ có vi khuẩn\nD. Cả hai đều do cháy nắng\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 365, "q": "Các vết rãnh ngang trên mặt móng (Beau's lines) thường phản ánh điều gì về sức khỏe khách hàng?", "o": ["Khách hàng vừa đi bơi nhiều", "Cơ thể từng trải qua một cơn bạo bệnh nặng hoặc chấn thương làm ngừng trệ tạm thời sự phát triển của mầm móng", "Khách hàng sử dụng kem dưỡng tay quá nhiều", "Dấu hiệu của sự lão hóa thông thường"], "c": 1, "raw": "Câu 365: Các vết rãnh ngang trên mặt móng (Beau's lines) thường phản ánh điều gì về sức khỏe khách hàng?\nA. Khách hàng vừa đi bơi nhiều\nB. Cơ thể từng trải qua một cơn bạo bệnh nặng hoặc chấn thương làm ngừng trệ tạm thời sự phát triển của mầm móng\nC. Khách hàng sử dụng kem dưỡng tay quá nhiều\nD. Dấu hiệu của sự lão hóa thông thường\nĐáp án đúng: B\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 366, "q": "Tại sao salon thẩm mỹ bắt buộc phải từ chối khách hàng bị bệnh truyền nhiễm (Contagious disease)?", "o": ["Vì thợ không có thời gian", "Để ngăn ngừa sự lây nhiễm chéo cho thợ và các khách hàng khác trong môi trường dịch vụ công cộng", "Vì luật cấm người ốm ra đường", "Vì dịch vụ sẽ không có hiệu quả"], "c": 1, "raw": "Câu 366: Tại sao salon thẩm mỹ bắt buộc phải từ chối khách hàng bị bệnh truyền nhiễm (Contagious disease)?\nA. Vì thợ không có thời gian\nB. Để ngăn ngừa sự lây nhiễm chéo cho thợ và các khách hàng khác trong môi trường dịch vụ công cộng\nC. Vì luật cấm người ốm ra đường\nD. Vì dịch vụ sẽ không có hiệu quả\nĐáp án đúng: B\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 367, "q": "Nhiễm trùng khu trú (Local infection) có dấu hiệu nhận biết điển hình là gì?", "o": ["Rụng tóc toàn bộ cơ thể", "Vùng tổn thương xuất hiện một ổ sưng đỏ, nóng, đau và có chứa dịch mủ tại chỗ", "Sốt cao toàn thân hôn mê", "Da chuyển sang màu xanh"], "c": 1, "raw": "Câu 367: Nhiễm trùng khu trú (Local infection) có dấu hiệu nhận biết điển hình là gì?\nA. Rụng tóc toàn bộ cơ thể\nB. Vùng tổn thương xuất hiện một ổ sưng đỏ, nóng, đau và có chứa dịch mủ tại chỗ\nC. Sốt cao toàn thân hôn mê\nD. Da chuyển sang màu xanh\nĐáp án đúng: B\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 368, "q": "Tại sao việc khử trùng không thể thay thế hoàn toàn cho việc tiệt trùng bằng nồi hấp (Autoclave)?", "o": ["Vì hóa chất khử trùng đắt tiền hơn", "Vì hóa chất khử trùng không thể tiêu diệt được vỏ bọc bào tử cứng cáp của vi khuẩn kháng thuốc", "Vì nồi hấp làm hỏng dụng cụ kim loại", "Vì khử trùng làm đổi màu đồ nghề"], "c": 1, "raw": "Câu 368: Tại sao việc khử trùng không thể thay thế hoàn toàn cho việc tiệt trùng bằng nồi hấp (Autoclave)?\nA. Vì hóa chất khử trùng đắt tiền hơn\nB. Vì hóa chất khử trùng không thể tiêu diệt được vỏ bọc bào tử cứng cáp của vi khuẩn kháng thuốc\nC. Vì nồi hấp làm hỏng dụng cụ kim loại\nD. Vì khử trùng làm đổi màu đồ nghề\nĐáp án đúng: B\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 369, "q": "Phân biệt sự khác nhau cơ bản giữa Antiseptic và Disinfectant:", "o": ["Antiseptic dùng trên bề mặt bàn ghế; Disinfectant bôi lên da", "Antiseptic an toàn dùng trên da mô sống; Disinfectant có nồng độ độc hại cao chỉ dùng trên bề mặt dụng cụ vô tri", "Cả hai chất đều dùng để gội đầu", "Disinfectant có thể uống được"], "c": 1, "raw": "Câu 369: Phân biệt sự khác nhau cơ bản giữa Antiseptic và Disinfectant:\nA. Antiseptic dùng trên bề mặt bàn ghế; Disinfectant bôi lên da\nB. Antiseptic an toàn dùng trên da mô sống; Disinfectant có nồng độ độc hại cao chỉ dùng trên bề mặt dụng cụ vô tri\nC. Cả hai chất đều dùng để gội đầu\nD. Disinfectant có thể uống được\nĐáp án đúng: B\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 370, "q": "Khi nào một chiếc kềm cắt da (Nipper) được coi là đã khử trùng đúng chuẩn y tế?", "o": ["Khi được lau qua bằng cồn 70 độ", "Sau khi đã rửa sạch xà phòng, lau khô và ngâm chìm hoàn toàn trong dung dịch khử trùng Quats theo đúng thời gian quy định", "Khi hơ qua ngọn lửa diêm", "Khi cất vào ngăn kéo tủ"], "c": 1, "raw": "Câu 370: Khi nào một chiếc kềm cắt da (Nipper) được coi là đã khử trùng đúng chuẩn y tế?\nA. Khi được lau qua bằng cồn 70 độ\nB. Sau khi đã rửa sạch xà phòng, lau khô và ngâm chìm hoàn toàn trong dung dịch khử trùng Quats theo đúng thời gian quy định\nC. Khi hơ qua ngọn lửa diêm\nD. Khi cất vào ngăn kéo tủ\nĐáp án đúng: B\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 371, "q": "Tại sao các vật liệu có lỗ xốp xài một lần (Disposable) khi dính máu bắt buộc phải bỏ vào 2 lớp túi nilon dán nhãn?", "o": ["Để tránh rò rỉ mầm bệnh lây qua đường máu (HIV, HBV) ra môi trường xung quanh và bảo vệ người thu gom rác", "Để tiết kiệm túi rác", "Để đem đi giặt tẩy dùng lại", "Để gửi trả về cho nhà sản xuất"], "c": 0, "raw": "Câu 371: Tại sao các vật liệu có lỗ xốp xài một lần (Disposable) khi dính máu bắt buộc phải bỏ vào 2 lớp túi nilon dán nhãn?\nA. Để tránh rò rỉ mầm bệnh lây qua đường máu (HIV, HBV) ra môi trường xung quanh và bảo vệ người thu gom rác\nB. Để tiết kiệm túi rác\nC. Để đem đi giặt tẩy dùng lại\nD. Để gửi trả về cho nhà sản xuất\nĐáp án đúng: A\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 372, "q": "Tại sao việc làm sạch bằng xà phòng và nước là bước tiên quyết KHÔNG THỂ BỎ QUA trước khi khử trùng?", "o": ["Để làm dụng cụ thơm tho hơn", "Vì dầu mỡ, chất bẩn hữu cơ bám trên dụng cụ sẽ vô hiệu hóa và làm mất hoạt tính của hóa chất khử trùng", "Để làm mềm thép dụng cụ", "Vì đây là bước bắt buộc của khách hàng"], "c": 1, "raw": "Câu 372: Tại sao việc làm sạch bằng xà phòng và nước là bước tiên quyết KHÔNG THỂ BỎ QUA trước khi khử trùng?\nA. Để làm dụng cụ thơm tho hơn\nB. Vì dầu mỡ, chất bẩn hữu cơ bám trên dụng cụ sẽ vô hiệu hóa và làm mất hoạt tính của hóa chất khử trùng\nC. Để làm mềm thép dụng cụ\nD. Vì đây là bước bắt buộc của khách hàng\nĐáp án đúng: B\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 373, "q": "Hoạt chất Sodium Hydroxide (Lye) trong thuốc duỗi tóc phá hủy sợi tóc như thế nào nếu sử dụng sai kỹ thuật?", "o": ["Làm tóc mọc dài không kiểm soát", "Làm tan chảy lớp biểu bì, đứt gãy hoàn toàn chuỗi keratin và gây bỏng hóa chất nặng cho da đầu", "Làm tóc lập tức biến thành màu bạch kim", "Không gây bất kỳ tác hại nào"], "c": 1, "raw": "Câu 373: Hoạt chất Sodium Hydroxide (Lye) trong thuốc duỗi tóc phá hủy sợi tóc như thế nào nếu sử dụng sai kỹ thuật?\nA. Làm tóc mọc dài không kiểm soát\nB. Làm tan chảy lớp biểu bì, đứt gãy hoàn toàn chuỗi keratin và gây bỏng hóa chất nặng cho da đầu\nC. Làm tóc lập tức biến thành màu bạch kim\nD. Không gây bất kỳ tác hại nào\nĐáp án đúng: B\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 374, "q": "Điểm khác biệt cơ bản giữa cơ chế uốn tóc bằng thuốc Kiềm (Alkaline) và thuốc Acid là gì?", "o": ["Thuốc kiềm xử lý ở nhiệt độ phòng tạo lọn xoăn chặt; thuốc acid thường cần kích nhiệt và cho lọn sóng mềm mại hơn", "Thuốc acid làm đứt vĩnh viễn liên kết disulfide", "Thuốc kiềm có tính acid cao", "Thuốc acid luôn làm cháy da đầu"], "c": 0, "raw": "Câu 374: Điểm khác biệt cơ bản giữa cơ chế uốn tóc bằng thuốc Kiềm (Alkaline) và thuốc Acid là gì?\nA. Thuốc kiềm xử lý ở nhiệt độ phòng tạo lọn xoăn chặt; thuốc acid thường cần kích nhiệt và cho lọn sóng mềm mại hơn\nB. Thuốc acid làm đứt vĩnh viễn liên kết disulfide\nC. Thuốc kiềm có tính acid cao\nD. Thuốc acid luôn làm cháy da đầu\nĐáp án đúng: A\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 375, "q": "Vai trò sinh hóa học của Oxy già (H2O2) khi kết hợp với thuốc nhuộm tóc vĩnh viễn là gì?", "o": ["Làm mát da đầu khách", "Khuyếch tán mở biểu bì, oxy hóa làm sáng sắc tố melanin tự nhiên và kích hoạt các hạt màu nhân tạo nở to bám trong thân tóc", "Đóng chặt vảy tóc lại", "Tiêu diệt vi khuẩn trên da đầu"], "c": 1, "raw": "Câu 375: Vai trò sinh hóa học của Oxy già (H2O2) khi kết hợp với thuốc nhuộm tóc vĩnh viễn là gì?\nA. Làm mát da đầu khách\nB. Khuyếch tán mở biểu bì, oxy hóa làm sáng sắc tố melanin tự nhiên và kích hoạt các hạt màu nhân tạo nở to bám trong thân tóc\nC. Đóng chặt vảy tóc lại\nD. Tiêu diệt vi khuẩn trên da đầu\nĐáp án đúng: B\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 376, "q": "Tại sao thợ làm tóc tuyệt đối không bao giờ được bôi chồng thuốc tẩy (Overlap) lên phần tóc đã sáng màu trước đó?", "o": ["Tóc sẽ bị lên màu quá tối", "Sẽ gây ra hiện tượng đứt gãy tóc nghiêm trọng tại đường ranh giới tiếp xúc (Line of demarcation)", "Làm tóc mọc ngược vào da đầu", "Làm tốn thêm bột tẩy"], "c": 1, "raw": "Câu 376: Tại sao thợ làm tóc tuyệt đối không bao giờ được bôi chồng thuốc tẩy (Overlap) lên phần tóc đã sáng màu trước đó?\nA. Tóc sẽ bị lên màu quá tối\nB. Sẽ gây ra hiện tượng đứt gãy tóc nghiêm trọng tại đường ranh giới tiếp xúc (Line of demarcation)\nC. Làm tóc mọc ngược vào da đầu\nD. Làm tốn thêm bột tẩy\nĐáp án đúng: B\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 377, "q": "Kỹ thuật cắt tóc \"Blunt cut\" kiểm soát góc độ nâng tóc như thế nào để đạt độ rơi chuẩn xác nhất?", "o": ["Nâng tóc góc 90 độ", "Giữ tóc ở góc nâng 0 độ tự nhiên sát mặt phẳng da đầu/vai và cắt ngang bằng", "Kéo ngược tóc lên đỉnh đầu 180 độ", "Kéo tóc về phía trước mặt"], "c": 1, "raw": "Câu 377: Kỹ thuật cắt tóc \"Blunt cut\" kiểm soát góc độ nâng tóc như thế nào để đạt độ rơi chuẩn xác nhất?\nA. Nâng tóc góc 90 độ\nB. Giữ tóc ở góc nâng 0 độ tự nhiên sát mặt phẳng da đầu/vai và cắt ngang bằng\nC. Kéo ngược tóc lên đỉnh đầu 180 độ\nD. Kéo tóc về phía trước mặt\nĐáp án đúng: B\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 378, "q": "Sự khác nhau về hiệu ứng thị giác giữa góc cắt 45 độ (Graduation) và góc cắt 90 độ (Uniform Layer) là:", "o": ["Cắt 45 độ tạo sự tích lũy trọng lượng và tầng dốc thấp; cắt 90 độ loại bỏ trọng lượng tạo các lớp sole đều nhau", "Cắt 90 độ tạo kiểu tóc bằng ngang vai", "Cắt 45 độ làm tóc phồng cao nhất ở đỉnh đầu", "Cả hai góc cắt cho kết quả giống hệt nhau"], "c": 0, "raw": "Câu 378: Sự khác nhau về hiệu ứng thị giác giữa góc cắt 45 độ (Graduation) và góc cắt 90 độ (Uniform Layer) là:\nA. Cắt 45 độ tạo sự tích lũy trọng lượng và tầng dốc thấp; cắt 90 độ loại bỏ trọng lượng tạo các lớp sole đều nhau\nB. Cắt 90 độ tạo kiểu tóc bằng ngang vai\nC. Cắt 45 độ làm tóc phồng cao nhất ở đỉnh đầu\nD. Cả hai góc cắt cho kết quả giống hệt nhau\nĐáp án đúng: A\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 379, "q": "Bản chất sinh lý của bệnh vảy nến (Psoriasis) trên da là gì?", "o": ["Do nhiễm ký sinh trùng dưới da", "Do sự tăng sinh và phân bào quá mức của tế bào biểu bì diễn ra nhanh gấp nhiều lần bình thường tạo nên các mảng sừng tích tụ", "Do da bị thiếu nước trầm trọng", "Do tiếp xúc với ánh nắng mặt trời"], "c": 1, "raw": "Câu 379: Bản chất sinh lý của bệnh vảy nến (Psoriasis) trên da là gì?\nA. Do nhiễm ký sinh trùng dưới da\nB. Do sự tăng sinh và phân bào quá mức của tế bào biểu bì diễn ra nhanh gấp nhiều lần bình thường tạo nên các mảng sừng tích tụ\nC. Do da bị thiếu nước trầm trọng\nD. Do tiếp xúc với ánh nắng mặt trời\nĐáp án đúng: B\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 380, "q": "Tại sao thợ chăm sóc da không bao giờ được massage lên vùng da đang có mụn trứng cá mưng mủ?", "o": ["Vì làm khách hàng buồn ngủ", "Vì các thao tác massage cọ xát sẽ làm vỡ ổ mủ, phát tán vi khuẩn lây lan sang các vùng da lành và gây kích ứng viêm nặng hơn", "Vì kem massage làm mụn lặn mất", "Vì làm mụn chuyển thành nốt ruồi"], "c": 1, "raw": "Câu 380: Tại sao thợ chăm sóc da không bao giờ được massage lên vùng da đang có mụn trứng cá mưng mủ?\nA. Vì làm khách hàng buồn ngủ\nB. Vì các thao tác massage cọ xát sẽ làm vỡ ổ mủ, phát tán vi khuẩn lây lan sang các vùng da lành và gây kích ứng viêm nặng hơn\nC. Vì kem massage làm mụn lặn mất\nD. Vì làm mụn chuyển thành nốt ruồi\nĐáp án đúng: B\n\n", "cat": "skincare", "sec": "7. Chăm sóc da"}, {"n": 381, "q": "Tại sao bệnh nhân bị bệnh cao huyết áp nặng lại bị cấm thực hiện massage toàn diện?", "o": ["Massage làm tụt nhiệt độ cơ thể", "Các thao tác xoa bóp, kích thích cơ học làm tăng lưu lượng tuần hoàn máu đột ngột, có thể gây nguy cơ tai biến tăng huyết áp", "Massage làm da bị thâm tím", "Không gây bất kỳ nguy cơ nào"], "c": 1, "raw": "Câu 381: Tại sao bệnh nhân bị bệnh cao huyết áp nặng lại bị cấm thực hiện massage toàn diện?\nA. Massage làm tụt nhiệt độ cơ thể\nB. Các thao tác xoa bóp, kích thích cơ học làm tăng lưu lượng tuần hoàn máu đột ngột, có thể gây nguy cơ tai biến tăng huyết áp\nC. Massage làm da bị thâm tím\nD. Không gây bất kỳ nguy cơ nào\nĐáp án đúng: B\n\n", "cat": "skincare", "sec": "7. Chăm sóc da"}, {"n": 382, "q": "Khách hàng bị bệnh máu loãng (Hemophilia / Thinning blood) gặp nguy cơ rủi ro gì lớn nhất khi wax hoặc nhổ lông?", "o": ["Sợi lông mọc lại nhanh gấp đôi", "Lực giật có thể gây vỡ mao mạch dưới da, gây xuất huyết bầm tím diện rộng hoặc chảy máu chân lông không cầm được", "Làm lông đổi sang màu trắng", "Khiến da bị mất cảm giác"], "c": 1, "raw": "Câu 382: Khách hàng bị bệnh máu loãng (Hemophilia / Thinning blood) gặp nguy cơ rủi ro gì lớn nhất khi wax hoặc nhổ lông?\nA. Sợi lông mọc lại nhanh gấp đôi\nB. Lực giật có thể gây vỡ mao mạch dưới da, gây xuất huyết bầm tím diện rộng hoặc chảy máu chân lông không cầm được\nC. Làm lông đổi sang màu trắng\nD. Khiến da bị mất cảm giác\nĐáp án đúng: B\n\n", "cat": "waxing", "sec": "9. Triệt lông"}, {"n": 383, "q": "Cơ chế tác động của dầu dưỡng không xả (Leave-in conditioner) đối với mái tóc bông xù là gì?", "o": ["Phá vỡ liên kết disulfide trong tóc", "Cung cấp màng bao bọc dưỡng ẩm liên tục, khép vảy biểu bì, chống lại sự hút ẩm thất thường từ không khí gây xù tóc", "Làm sạch gàu bám trên da đầu", "Làm thay đổi màu nhuộm của tóc"], "c": 1, "raw": "Câu 383: Cơ chế tác động của dầu dưỡng không xả (Leave-in conditioner) đối với mái tóc bông xù là gì?\nA. Phá vỡ liên kết disulfide trong tóc\nB. Cung cấp màng bao bọc dưỡng ẩm liên tục, khép vảy biểu bì, chống lại sự hút ẩm thất thường từ không khí gây xù tóc\nC. Làm sạch gàu bám trên da đầu\nD. Làm thay đổi màu nhuộm của tóc\nĐáp án đúng: B\n\n", "cat": "styling", "sec": "3. Tạo kiểu tóc"}, {"n": 384, "q": "Việc thoa kem nền bảo vệ (Base cream) trước khi tra thuốc duỗi tóc kiềm cao có ý nghĩa gì?", "o": ["Giúp tóc duỗi thẳng nhanh hơn", "Tạo lớp màng dầu bảo vệ lớp biểu bì da đầu và vành tai không bị hóa chất kiềm mạnh ăn mòn gây bỏng rát", "Làm thơm tóc", "Thay thế cho bước xả tóc"], "c": 1, "raw": "Câu 384: Việc thoa kem nền bảo vệ (Base cream) trước khi tra thuốc duỗi tóc kiềm cao có ý nghĩa gì?\nA. Giúp tóc duỗi thẳng nhanh hơn\nB. Tạo lớp màng dầu bảo vệ lớp biểu bì da đầu và vành tai không bị hóa chất kiềm mạnh ăn mòn gây bỏng rát\nC. Làm thơm tóc\nD. Thay thế cho bước xả tóc\nĐáp án đúng: B\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 385, "q": "Các chất được sử dụng để trung hòa hoặc nâng cao độ pH của sản phẩm được biết là:", "o": ["Khí Amoniac", "Kiềm", "Oxy già", "Thuốc tẩy"], "c": 2, "raw": "Câu 385: Các chất được sử dụng để trung hòa hoặc nâng cao độ pH của sản phẩm được biết là:\nA. Khí Amoniac\nB. Kiềm\nC. Oxy già\nD. Thuốc tẩy\nĐáp án đúng: C\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 386, "q": "Phản ứng oxy hóa khử có nghĩa là chuyển đổi của sự oxy hóa hoặc:", "o": ["Nhiệt", "Nước", "Rượu", "Chất khử"], "c": 3, "raw": "Câu 386: Phản ứng oxy hóa khử có nghĩa là chuyển đổi của sự oxy hóa hoặc:\nA. Nhiệt\nB. Nước\nC. Rượu\nD. Chất khử\nĐáp án đúng: D\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 387, "q": "Sự đốt cháy là sự oxy hóa nhanh của chất đi cùng với:", "o": ["Lạnh và tối", "Nhiệt và ánh sáng", "Hơi khí", "Chất lỏng và khí"], "c": 3, "raw": "Câu 387: Sự đốt cháy là sự oxy hóa nhanh của chất đi cùng với:\nA. Lạnh và tối\nB. Nhiệt và ánh sáng\nC. Hơi khí\nD. Chất lỏng và khí\nĐáp án đúng: D\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 388, "q": "Màu sắc thứ nhì dùng để trung hòa màu đỏ:", "o": ["Xanh lơ", "Tím", "Xanh lục", "Vàng"], "c": 2, "raw": "Câu 388: Màu sắc thứ nhì dùng để trung hòa màu đỏ:\nA. Xanh lơ\nB. Tím\nC. Xanh lục\nD. Vàng\nĐáp án đúng: C\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 389, "q": "Để trung hòa tông màu ấm, khách hàng/thợ nghề cần phải sử dụng:", "o": ["Tông màu lạnh", "Tông vàng", "Tông tím", "Tông cam"], "c": 0, "raw": "Câu 389: Để trung hòa tông màu ấm, khách hàng/thợ nghề cần phải sử dụng:\nA. Tông màu lạnh\nB. Tông vàng\nC. Tông tím\nD. Tông cam\nĐáp án đúng: A\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 390, "q": "Trong quang phổ bước sóng dài nhất có thể nhìn thấy:", "o": ["Xanh lá", "Đỏ", "Vàng", "Xanh da trời"], "c": 1, "raw": "Câu 390: Trong quang phổ bước sóng dài nhất có thể nhìn thấy:\nA. Xanh lá\nB. Đỏ\nC. Vàng\nD. Xanh da trời\nĐáp án đúng: B\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 391, "q": "Trong hóa uốn tóc, thời gian xử lý được quyết định bởi kết cấu tóc, tính đàn hồi và:", "o": ["Độ sáng sắc màu", "Ánh sáng", "Độ thấm", "Mật độ"], "c": 2, "raw": "Câu 391: Trong hóa uốn tóc, thời gian xử lý được quyết định bởi kết cấu tóc, tính đàn hồi và:\nA. Độ sáng sắc màu\nB. Ánh sáng\nC. Độ thấm\nD. Mật độ\nĐáp án đúng: C\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 392, "q": "Khi nào nên ghi lại khi làm dịch vụ tóc:", "o": ["Mỗi tuần 1 lần", "2 tuần 1 lần", "Mỗi sáu tháng", "Tất cả thời gian khách hàng nhuộm hoặc xử lý lại"], "c": 3, "raw": "Câu 392: Khi nào nên ghi lại khi làm dịch vụ tóc:\nA. Mỗi tuần 1 lần\nB. 2 tuần 1 lần\nC. Mỗi sáu tháng\nD. Tất cả thời gian khách hàng nhuộm hoặc xử lý lại\nĐáp án đúng: D\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 393, "q": "Dây thần kinh được kích thích bởi thao tác đụng, hoặc áp lực ở vùng gần các móng tay được biết là:", "o": ["Cột sống", "Cảm giác", "Trung ương", "Tự trị"], "c": 1, "raw": "Câu 393: Dây thần kinh được kích thích bởi thao tác đụng, hoặc áp lực ở vùng gần các móng tay được biết là:\nA. Cột sống\nB. Cảm giác\nC. Trung ương\nD. Tự trị\nĐáp án đúng: B\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 394, "q": "Nếu khách hàng, nhân viên ở thẩm mỹ viện có liên quan tới vết thương hở, máu, lây nhiễm thì họ phải thực hiện khử trùng với:", "o": ["Phenol", "Giải pháp diệt được trực khuẩn lao (Tuberculocidal)", "Rượu, cồn", "Formaline"], "c": 1, "raw": "Câu 394: Nếu khách hàng, nhân viên ở thẩm mỹ viện có liên quan tới vết thương hở, máu, lây nhiễm thì họ phải thự
