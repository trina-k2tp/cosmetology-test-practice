<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>California Cosmetology State Board — Ôn thi & Thi thử</title>
<!-- App Icon & Mobile Web App Config -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="K-CUT">
<meta name="application-name" content="K-CUT">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="kcut-touch-icon.png?v=5">
<link rel="apple-touch-icon" sizes="180x180" href="kcut-touch-icon.png?v=5">
<link rel="apple-touch-icon-precomposed" href="kcut-touch-icon.png?v=5">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=5">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=5">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=5">
<link rel="manifest" href="manifest.json?v=5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500;1,600&family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --ink:#242229;
  --ink-soft:#5a5560;
  --paper:#EDE9E1;
  --card:#FBF9F5;
  --card-line:#DEDAD0;
  --accent-safety:#C08A2E;   /* vàng đất - an toàn */
  --accent-consult:#3E5C76;  /* xanh thép - tư vấn/phân tích */
  --accent-chemical:#2F6F63; /* xanh rêu - uốn duỗi hóa chất */
  --accent-color:#7C4A82;    /* tím mận - nhuộm tóc */
  --accent-waxing:#B8583F;   /* cam đất - tẩy lông */
  --accent-nails:#BD4F68;    /* hồng mận - móng */
  --accent-skincare:#6E8F63; /* xanh lá - da */
  --accent-lash:#4A4550;     /* than tím - mi/mày */
  --accent-haircut:#33707E;  /* xanh dương thép - cắt tóc */
  --accent-styling:#9C7A3F;  /* đồng - tạo kiểu */
  --good:#3F7A54;
  --bad:#B0453A;
  --warn:#C08A2E;
  --radius:14px;
  --shadow:0 1px 2px rgba(36,34,41,.06), 0 6px 20px rgba(36,34,41,.05);
  --font-display:'Newsreader', serif;
  --font-body:'Be Vietnam Pro', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{
  font-family:var(--font-display);
  font-weight:600;
  letter-spacing:-0.01em;
  color:var(--ink);
}
a{color:inherit;}
button{font-family:inherit;}
:focus-visible{outline:2.5px solid var(--ink); outline-offset:2px;}

.app-shell{
  max-width:1080px;
  margin:0 auto;
  padding:0 20px 90px;
}

/* ============ APP HEADER (NON-STICKY) ============ */
.app-header{
  display:flex; flex-direction:column; gap:10px;
  padding:14px 0 10px;
}
.brand{
  display:flex; align-items:center; gap:12px;
}
.brand-mark{
  font-family:var(--font-display); font-style:italic; font-weight:600;
  font-size:22px; color:var(--ink); line-height:1.15;
}
.brand-sub{
  font-size:12px; color:var(--ink-soft); letter-spacing:.04em; text-transform:uppercase; display:block; margin-top:2px;
}
.header-meta-row{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  width:100%; flex-wrap:wrap;
}
.countdown-chip{
  display:flex; align-items:center; gap:8px;
  background:var(--card); border:1px solid var(--card-line);
  border-radius:999px; padding:6px 14px 6px 8px;
  font-size:13px;
}
.countdown-chip .num{
  font-family:var(--font-mono); font-weight:600; font-size:16px;
  background:var(--ink); color:var(--paper); border-radius:999px;
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;
}
.countdown-chip input{
  border:none; background:transparent; font-family:inherit; font-size:12px;
  color:var(--ink-soft); width:96px;
}

/* ============ STICKY NAV (PINNED ON SCROLL) ============ */
.sticky-nav{
  position:sticky; top:0; z-index:40;
  background:var(--paper);
  margin:0 -20px; padding:4px 20px;
  border-bottom:1px solid var(--card-line);
  box-shadow:0 2px 8px rgba(36,34,41,.06);
}
@media (max-width:768px){
  .app-header{
    padding:10px 0 6px;
    gap:8px;
  }
  .brand-mark{
    font-size:17px;
  }
  .header-meta-row{
    gap:8px;
  }
  .sticky-nav{
    box-shadow:0 2px 6px rgba(36,34,41,.06);
  }
}
@media (max-width:520px){
  .app-shell{padding:0 12px 80px;}
  .sticky-nav{margin:0 -12px; padding:3px 12px;}
  .header-meta-row{gap:8px;}
  .countdown-chip{padding:4px 10px 4px 6px; font-size:12px; gap:6px;}
  .countdown-chip .num{width:26px; height:26px; font-size:14px;}
  .countdown-chip input{width:84px; font-size:11.5px;}
  .account-name{max-width:120px; font-size:12px;}
  .tab-btn{padding:6px 12px; font-size:13px;}
}

/* ============ NAV TABS ============ */
.tabs{
  display:flex; gap:4px; overflow-x:auto; padding:2px 0;
  border-bottom:none;
  scrollbar-width:none;
  flex:1 1 auto; min-width:0;
}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{
  flex:0 0 auto;
  background:none; border:none; cursor:pointer;
  padding:6px 12px; font-size:13px; font-weight:600;
  color:var(--ink-soft); border-radius:999px;
  white-space:nowrap;
  transition:background .15s, color .15s;
}
.tab-btn:hover{background:rgba(36,34,41,.06); color:var(--ink);}
.tab-btn.active{background:var(--ink); color:var(--paper);}
@media (max-width:520px){
  .tab-btn{padding:5px 10px; font-size:12.5px;}
}

#app{padding-top:12px;}

/* ============ CARD ============ */
.card{
  background:var(--card);
  border:1px solid var(--card-line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px;
}
.card + .card{margin-top:16px;}
.grid-2{display:grid; grid-template-columns:1.15fr .85fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
@media (max-width:820px){
  .grid-2{grid-template-columns:1fr;}
  .grid-3{grid-template-columns:1fr 1fr;}
}
@media (max-width:520px){
  .grid-3{grid-template-columns:1fr;}
}

.section-label{
  font-size:11.5px; text-transform:uppercase; letter-spacing:.09em;
  color:var(--ink-soft); font-weight:700; margin-bottom:6px;
}

/* ============ DASHBOARD ============ */
.hero-verdict{
  display:flex; align-items:flex-start; gap:18px; flex-wrap:wrap;
}
.verdict-badge{
  font-size:12px; font-weight:700; padding:4px 12px; border-radius:999px;
  display:inline-block; margin-bottom:10px;
}
.verdict-badge.good{background:#E1EEE3; color:var(--good);}
.verdict-badge.warn{background:#F5EAD3; color:var(--warn);}
.verdict-badge.bad{background:#F5E1DE; color:var(--bad);}
.verdict-title{font-size:26px; margin:0 0 6px;}
.verdict-body{color:var(--ink-soft); max-width:52ch; font-size:14.5px;}

.readiness-wrap{
  display:flex; align-items:center; gap:26px; flex-wrap:wrap;
}
.readiness-num{
  font-family:var(--font-display); font-size:52px; font-weight:600; line-height:1;
}
.readiness-num sup{font-size:22px; font-weight:500; color:var(--ink-soft);}

.wheel-wrap{display:flex; gap:22px; align-items:center; flex-wrap:wrap;}
.legend{display:grid; grid-template-columns:1fr 1fr; gap:6px 18px; flex:1; min-width:220px;}
.legend-item{
  display:flex; align-items:center; gap:8px; font-size:12.5px;
  cursor:pointer; padding:4px 6px; border-radius:8px; background:none; border:none;
  text-align:left; color:var(--ink); width:100%;
}
.legend-item:hover{background:rgba(36,34,41,.06);}
.legend-dot{width:9px;height:9px;border-radius:50%; flex:0 0 auto;}
.legend-name{flex:1;}
.legend-pct{font-family:var(--font-mono); font-weight:600; font-size:12px; color:var(--ink-soft);}

.weak-list{display:flex; flex-direction:column; gap:10px; margin-top:8px;}
.weak-row{display:flex; align-items:center; gap:12px;}
.weak-name{width:150px; font-size:13px; font-weight:600; flex:0 0 auto;}
.bar-track{flex:1; height:8px; border-radius:999px; background:rgba(36,34,41,.08); overflow:hidden;}
.bar-fill{height:100%; border-radius:999px;}
.weak-pct{font-family:var(--font-mono); font-size:12px; width:38px; text-align:right; color:var(--ink-soft);}

.quick-actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px;}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex; align-items:center; gap:8px;
  border-radius:10px; border:1px solid transparent;
  padding:11px 18px; font-size:14px; font-weight:600;
  cursor:pointer; transition:transform .08s, background .15s, border-color .15s;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--ink); color:var(--paper);}
.btn-primary:hover{background:#3a3742;}
.btn-ghost{background:transparent; border-color:var(--card-line); color:var(--ink);}
.btn-ghost:hover{background:rgba(36,34,41,.06);}
.btn-sm{padding:7px 12px; font-size:12.5px; border-radius:8px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

/* ============ FORM ELEMENTS ============ */
select, input[type=number], input[type=date]{
  font-family:inherit; font-size:13.5px; padding:9px 12px;
  border-radius:9px; border:1px solid var(--card-line); background:#fff; color:var(--ink);
}
label.field{display:flex; flex-direction:column; gap:5px; font-size:12.5px; color:var(--ink-soft); font-weight:600;}

.chip-select{display:flex; flex-wrap:wrap; gap:8px;}
.chip{
  border:1.5px solid var(--card-line); background:#fff; border-radius:999px;
  padding:7px 14px; font-size:12.5px; font-weight:600; cursor:pointer; color:var(--ink-soft);
}
.chip.active{border-color:var(--ink); color:var(--ink); background:#fff;}
.chip .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}

/* ============ QUIZ / STUDY CARD ============ */
.qcounter{font-family:var(--font-mono); font-size:12.5px; color:var(--ink-soft);}
.progress-track{height:5px; background:rgba(36,34,41,.08); border-radius:999px; overflow:hidden; margin:10px 0 18px;}
.progress-fill{height:100%; background:var(--ink); border-radius:999px; transition:width .25s;}

.q-cat-tag{
  display:inline-block; font-size:11px; font-weight:700; letter-spacing:.03em;
  padding:3px 10px; border-radius:999px; color:#fff; margin-bottom:12px;
}
.q-text{font-size:18px; font-weight:600; margin:0 0 18px; line-height:1.45;}

.option{
  display:flex; align-items:flex-start; gap:12px;
  border:1.5px solid var(--card-line); border-radius:11px;
  padding:13px 15px; margin-bottom:10px; cursor:pointer;
  background:#fff; font-size:14.5px; transition:border-color .12s, background .12s;
}
.option:hover{border-color:#b9b3a6;}
.option .letter{
  font-family:var(--font-mono); font-weight:700; font-size:12.5px;
  width:22px;height:22px;border-radius:50%; background:var(--paper);
  display:flex;align-items:center;justify-content:center; flex:0 0 auto;
}
.option.selected{border-color:var(--ink); background:#F3F0EA;}
.option.correct{border-color:var(--good); background:#E9F3EA;}
.option.correct .letter{background:var(--good); color:#fff;}
.option.wrong{border-color:var(--bad); background:#FAEAE8;}
.option.wrong .letter{background:var(--bad); color:#fff;}
.option.disabled{cursor:default;}
.option.disabled:hover{border-color:var(--card-line);}
.option.correct:hover, .option.wrong:hover{border-color:inherit;}

.feedback-banner{
  border-radius:11px; padding:12px 16px; font-size:13.5px; font-weight:600; margin:14px 0;
}
.feedback-banner.ok{background:#E9F3EA; color:var(--good);}
.feedback-banner.no{background:#FAEAE8; color:var(--bad);}

.quiz-footer{display:flex; justify-content:space-between; align-items:center; margin-top:16px; gap:10px; flex-wrap:wrap;}

/* ============ FLASHCARD ============ */
.flashcard{
  min-height:220px; display:flex; flex-direction:column; justify-content:center;
}
.flash-actions{display:flex; gap:10px; margin-top:20px; flex-wrap:wrap;}

/* ============ EXAM NAV GRID ============ */
.exam-layout{display:grid; grid-template-columns:1fr 240px; gap:18px;}
@media (max-width:820px){.exam-layout{grid-template-columns:1fr;}}
.nav-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:6px;}
.nav-cell{
  aspect-ratio:1; border-radius:7px; border:1.5px solid var(--card-line); background:#fff;
  font-family:var(--font-mono); font-size:11px; font-weight:600; cursor:pointer;
  display:flex; align-items:center; justify-content:center; position:relative; color:var(--ink-soft);
}
.nav-cell.answered{background:var(--ink); color:var(--paper); border-color:var(--ink);}
.nav-cell.current{outline:2.5px solid var(--accent-color); outline-offset:1px;}
.nav-cell.flag::after{
  content:''; position:absolute; top:-3px; right:-3px; width:7px;height:7px;border-radius:50%;
  background:var(--warn);
}
.timer{
  font-family:var(--font-mono); font-size:26px; font-weight:700; text-align:center;
  padding:10px; border-radius:10px; background:var(--card); border:1px solid var(--card-line);
}
.timer.low{color:var(--bad);}

/* ============ HISTORY TABLE ============ */
table.hist{width:100%; border-collapse:collapse; font-size:13.5px;}
table.hist th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); padding:8px 10px; border-bottom:1px solid var(--card-line);}
table.hist td{padding:10px 10px; border-bottom:1px solid var(--card-line);}
.pill{font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px;}
.pill.pass{background:#E1EEE3; color:var(--good);}
.pill.fail{background:#F5E1DE; color:var(--bad);}

.empty-state{
  text-align:center; padding:50px 20px; color:var(--ink-soft);
}
.empty-state .display{font-size:20px; color:var(--ink); margin-bottom:8px;}

.outline-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px;}
.outline-list li{padding:12px 14px; background:#fff; border:1px solid var(--card-line); border-radius:10px; font-size:13.5px;}
.outline-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
.outline-list li{padding:10px 14px; background:#fff; border:1px solid var(--card-line); border-radius:8px; font-size:13.5px; line-height:1.55;}
.outline-list li.outline-sec-header{
  font-weight:700; font-size:15px; color:var(--ink); background:#F3F4F6;
  border-left:4px solid var(--accent-color); margin-top:14px; margin-bottom:2px;
}
.outline-list li.outline-sub-header{
  font-weight:600; font-size:14px; color:#1E3A8A; background:#EFF6FF;
  border-left:3px solid #3B82F6; margin-top:8px;
}
.outline-list li.outline-note{
  font-size:13px; color:#92400E; background:#FEF3C7; border-left:3px solid #F59E0B;
}
.outline-list li.outline-item{
  background:#fff; border:1px solid var(--card-line);
}
.outline-list .term-highlight{
  color:var(--ink); font-weight:600;
}
.outline-list mark{background:#F3D98B; color:inherit; border-radius:3px; padding:0 2px;}

.subtabs{display:flex; gap:6px; margin-bottom:16px;}
.subtab-btn{
  background:none; border:1.5px solid var(--card-line); border-radius:999px; padding:6px 14px;
  font-size:12.5px; font-weight:600; cursor:pointer; color:var(--ink-soft);
}
.subtab-btn.active{background:var(--ink); border-color:var(--ink); color:var(--paper);}

.modal-overlay{
  position:fixed; inset:0; background:rgba(36,34,41,.45); display:flex; align-items:center; justify-content:center;
  z-index:100; padding:20px;
}
.modal{background:var(--card); border-radius:var(--radius); padding:24px; max-width:540px; width:100%; box-shadow:var(--shadow); max-height:92vh; overflow-y:auto;}
.sync-toast{
  position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:9999;
  background:#1E293B; color:#fff; padding:10px 20px; border-radius:30px; font-size:13.5px;
  box-shadow:0 10px 25px rgba(0,0,0,.2); display:flex; align-items:center; gap:8px;
  animation:toastSlideIn .25s ease-out; pointer-events:none; font-weight:500;
}
@keyframes toastSlideIn{ from{opacity:0; transform:translate(-50%, -15px);} to{opacity:1; transform:translate(-50%, 0);} }
.sync-badge{display:inline-flex; align-items:center; justify-content:center; width:8px; height:8px; border-radius:50%; margin-left:4px;}
.sync-badge.synced{background:#22C55E;}
.sync-badge.syncing{background:#EAB308; animation:pulse 1s infinite;}
.sync-badge.offline{background:#94A3B8;}
@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.4;} }
.modal h3{margin-top:0;}
.modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}

.stat-mini{text-align:center;}
.stat-mini .num{font-family:var(--font-display); font-size:30px; font-weight:600;}
.stat-mini .lbl{font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em;}

.toggle-row{display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer; user-select:none;}
.toggle-row input{width:16px;height:16px;}

::selection{background:#d8cdb0;}

.backup-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.btn-sm{padding:6px 12px !important; font-size:12px !important;}
.account-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.account-name{font-size:12px; color:var(--ink-soft); max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.login-modal{max-width:440px;}
.login-modal .field{margin-top:12px;}
.login-modal input{width:100%;}
.login-message{min-height:20px; margin:12px 0 0; font-size:12.5px; color:var(--bad);}
.login-note{font-size:12px; color:var(--ink-soft); margin:14px 0 0;}


/* ============ BANK SELECTOR & CARDS ============ */
.bank-selector-bar{
  display:flex; align-items:center; gap:8px; overflow-x:auto; padding:4px 0 6px;
  margin:2px 0 4px; border-bottom:1px dashed var(--card-line);
  scrollbar-width:none;
}
.bank-selector-bar::-webkit-scrollbar{display:none;}
.bank-bar-label{
  font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
  color:var(--ink-soft); margin-right:4px; flex-shrink:0;
}
.bank-btn{
  flex:0 0 auto; display:inline-flex; align-items:center; gap:8px;
  background:var(--card); border:1px solid var(--card-line); cursor:pointer;
  padding:6px 14px; font-size:13px; font-weight:600;
  color:var(--ink-soft); border-radius:999px;
  white-space:nowrap; transition:all .15s ease;
}
.bank-btn:hover{background:#F3EFE7; color:var(--ink); border-color:#C8C2B5;}
.bank-btn.active{background:var(--ink); color:var(--paper); border-color:var(--ink); box-shadow:0 2px 8px rgba(36,34,41,.15);}
.bank-badge{
  font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px;
  background:rgba(255,255,255,.2); color:inherit;
}
.bank-btn:not(.active) .bank-badge{
  background:#ECE7DD; color:var(--ink-soft);
}
.bank-badge-new{
  font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px;
  background:#B0453A; color:#fff; letter-spacing:.04em;
}
.bank-btn-short{display:none;}
.bank-btn-full{display:inline;}
@media (max-width:680px){
  .bank-btn-short{display:inline;}
  .bank-btn-full{display:none;}
  .bank-badge, .bank-badge-new{display:none !important;}
  .bank-bar-label{font-size:10.5px; margin-right:2px; flex-shrink:0;}
  .bank-btn{padding:5px 11px; font-size:12.5px; gap:4px;}
  .bank-selector-bar{gap:6px; flex-wrap:nowrap;}
}
.bank-cards-grid{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:16px; margin-bottom:16px;
}
@media (max-width:768px){
  .bank-cards-grid{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:16px; margin-bottom:16px;
}
}
.bank-card{
  position:relative; transition:all .2s ease; cursor:pointer;
}
.bank-card:hover{
  transform:translateY(-1px);
  box-shadow:0 4px 14px rgba(36,34,41,.09);
}
.bank-card-active{

<script id="app-data-json" type="application/json">{"bank_424": {"questions": [{"n": 1, "q": "Biểu hiện của một mái tóc khỏe mạnh và độ pH tự nhiên là gì?", "o": ["Mềm, linh hoạt, có tính acid nhẹ (pH 4.5 - 5.5)", "Tóc xốp, hút nước nhanh, có tính kiềm cao", "Khô cứng, dễ gãy, pH trung tính", "Dễ rối, nhiều dầu, pH 7.0"], "c": 0, "raw": "Câu 1: Biểu hiện của một mái tóc khỏe mạnh và độ pH tự nhiên là gì?\nA. Mềm, linh hoạt, có tính acid nhẹ (pH 4.5 - 5.5)\nB. Tóc xốp, hút nước nhanh, có tính kiềm cao\nC. Khô cứng, dễ gãy, pH trung tính\nD. Dễ rối, nhiều dầu, pH 7.0\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 2, "q": "Dầu gội cân bằng Acid (Acid balance) có tác dụng gì?", "o": ["Lấy đi hóa chất dư, đóng chặt vảy tóc, ngăn ngừa khô (tốt cho tóc nhuộm)", "Làm mở lớp biểu bì tóc để dễ ngấm thuốc tẩy", "Trị gàu và nấm da đầu", "Kích thích tóc mọc nhanh hơn"], "c": 0, "raw": "Câu 2: Dầu gội cân bằng Acid (Acid balance) có tác dụng gì?\nA. Lấy đi hóa chất dư, đóng chặt vảy tóc, ngăn ngừa khô (tốt cho tóc nhuộm)\nB. Làm mở lớp biểu bì tóc để dễ ngấm thuốc tẩy\nC. Trị gàu và nấm da đầu\nD. Kích thích tóc mọc nhanh hơn\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 3, "q": "Các góc độ cắt tóc cơ bản (0°, 45°, 90°, 180°) tương ứng tạo ra những kiểu tóc nào?", "o": ["0° (Blunt/Bob/Cắt ngang), 45° (Taper/Tầng thấp), 90° (Uniform/Tầng đồng lớp), 180° (Long layer/Cắt lộn ngược phồng ở đỉnh)", "0° (Tầng đồng lớp), 45° (Bob), 90° (Taper), 180° (Blunt)", "0° (Phồng cao), 45° (Cắt ngang), 90° (Bob), 180° (Tầng thấp)", "0° (Taper), 45° (Layer), 90° (Blunt), 180° (Bob)"], "c": 0, "raw": "Câu 3: Các góc độ cắt tóc cơ bản (0°, 45°, 90°, 180°) tương ứng tạo ra những kiểu tóc nào?\nA. 0° (Blunt/Bob/Cắt ngang), 45° (Taper/Tầng thấp), 90° (Uniform/Tầng đồng lớp), 180° (Long layer/Cắt lộn ngược phồng ở đỉnh)\nB. 0° (Tầng đồng lớp), 45° (Bob), 90° (Taper), 180° (Blunt)\nC. 0° (Phồng cao), 45° (Cắt ngang), 90° (Bob), 180° (Tầng thấp)\nD. 0° (Taper), 45° (Layer), 90° (Blunt), 180° (Bob)\nĐáp án đúng: A\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 4, "q": "Đường cắt nào dùng để tạo tầng (layer/sole) và đường cắt nào cắt cùng 1 độ dài?", "o": ["Traveling guideline (Đường chuẩn di động) tạo tầng; Stationary guideline (Đường chuẩn cố định) cắt cùng độ", "Traveling cắt ngang; Stationary tạo tầng", "Traveling cắt Bob; Stationary cắt Layer 180 độ", "Cả hai đều dùng để cắt tóc nam"], "c": 0, "raw": "Câu 4: Đường cắt nào dùng để tạo tầng (layer/sole) và đường cắt nào cắt cùng 1 độ dài?\nA. Traveling guideline (Đường chuẩn di động) tạo tầng; Stationary guideline (Đường chuẩn cố định) cắt cùng độ\nB. Traveling cắt ngang; Stationary tạo tầng\nC. Traveling cắt Bob; Stationary cắt Layer 180 độ\nD. Cả hai đều dùng để cắt tóc nam\nĐáp án đúng: A\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 5, "q": "Khi cắt tóc bằng dao cạo (Razor) để đuôi tóc mềm mại (Free hand sliding), yêu cầu về tóc là gì?", "o": ["Tóc phải thật ướt", "Tóc phải được sấy khô hoàn toàn", "Tóc phải có hóa chất uốn", "Tóc phải bôi phấn rôm"], "c": 0, "raw": "Câu 5: Khi cắt tóc bằng dao cạo (Razor) để đuôi tóc mềm mại (Free hand sliding), yêu cầu về tóc là gì?\nA. Tóc phải thật ướt\nB. Tóc phải được sấy khô hoàn toàn\nC. Tóc phải có hóa chất uốn\nD. Tóc phải bôi phấn rôm\nĐáp án đúng: A\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 6, "q": "Kéo tỉa (Thinning shears) có tác dụng chính là gì?", "o": ["Lấy đi độ dày, tỉa mỏng tóc, thêm sự chuyển động mềm mại", "Cắt ngắn phần tóc gáy", "Tạo đường viền sắc nét ở tai", "Cạo trọc đầu"], "c": 0, "raw": "Câu 6: Kéo tỉa (Thinning shears) có tác dụng chính là gì?\nA. Lấy đi độ dày, tỉa mỏng tóc, thêm sự chuyển động mềm mại\nB. Cắt ngắn phần tóc gáy\nC. Tạo đường viền sắc nét ở tai\nD. Cạo trọc đầu\nĐáp án đúng: A\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 7, "q": "Tông đơ (Clipper) và Tông đơ tạo viền (Trimmer / Edger) có công dụng gì?", "o": ["Clipper cắt tóc ngắn nhanh (ngắn ở gáy và dài dần lên đỉnh); Trimmer tạo đường viền sắc nét ở vùng tai và gáy", "Clipper dùng để tỉa mỏng tóc; Trimmer dùng để cạo râu", "Cả 2 đều dùng để cắt tóc dài ngang lưng", "Trimmer dùng để nhổ lông, Clipper dùng để sấy tóc"], "c": 0, "raw": "Câu 7: Tông đơ (Clipper) và Tông đơ tạo viền (Trimmer / Edger) có công dụng gì?\nA. Clipper cắt tóc ngắn nhanh (ngắn ở gáy và dài dần lên đỉnh); Trimmer tạo đường viền sắc nét ở vùng tai và gáy\nB. Clipper dùng để tỉa mỏng tóc; Trimmer dùng để cạo râu\nC. Cả 2 đều dùng để cắt tóc dài ngang lưng\nD. Trimmer dùng để nhổ lông, Clipper dùng để sấy tóc\nĐáp án đúng: A\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 8, "q": "Kỹ thuật cầm kéo \"Palm the shears\" (ôm gọn kéo) được thực hiện như thế nào?", "o": ["Kéo và lược cầm cùng một bàn tay (giữ kéo trong lòng bàn tay để an toàn)", "Bỏ kéo xuống bàn khi dùng lược", "Chuyền kéo sang tay trái, lược tay phải", "Cất kéo vào túi tạp dề"], "c": 0, "raw": "Câu 8: Kỹ thuật cầm kéo \"Palm the shears\" (ôm gọn kéo) được thực hiện như thế nào?\nA. Kéo và lược cầm cùng một bàn tay (giữ kéo trong lòng bàn tay để an toàn)\nB. Bỏ kéo xuống bàn khi dùng lược\nC. Chuyền kéo sang tay trái, lược tay phải\nD. Cất kéo vào túi tạp dề\nĐáp án đúng: A\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 9, "q": "Khi dùng kéo, ngón tay nào được đặt vào lỗ cố định và ngón nào ở lỗ di động?", "o": ["Ngón áp út (Ring finger) ở lỗ cố định; Ngón cái (Thumb) ở lỗ di động", "Ngón trỏ ở lỗ cố định; Ngón út ở lỗ di động", "Ngón giữa ở lỗ cố định; Ngón cái ở lỗ di động", "Ngón cái ở lỗ cố định; Ngón áp út ở lỗ di động"], "c": 0, "raw": "Câu 9: Khi dùng kéo, ngón tay nào được đặt vào lỗ cố định và ngón nào ở lỗ di động?\nA. Ngón áp út (Ring finger) ở lỗ cố định; Ngón cái (Thumb) ở lỗ di động\nB. Ngón trỏ ở lỗ cố định; Ngón út ở lỗ di động\nC. Ngón giữa ở lỗ cố định; Ngón cái ở lỗ di động\nD. Ngón cái ở lỗ cố định; Ngón áp út ở lỗ di động\nĐáp án đúng: A\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 10, "q": "Quy trình 3 bước xử lý vệ sinh an toàn trong salon theo thứ tự là gì?", "o": ["1. Làm sạch (Cleaning) -> 2. Khử trùng (Disinfection) -> 3. Tiệt trùng (Sterilization)", "1. Khử trùng -> 2. Rửa xà bông -> 3. Lau khô", "1. Tiệt trùng -> 2. Làm sạch -> 3. Khử trùng", "1. Ngâm Quats -> 2. Hấp Autoclave -> 3. Rửa tay"], "c": 0, "raw": "Câu 10: Quy trình 3 bước xử lý vệ sinh an toàn trong salon theo thứ tự là gì?\nA. 1. Làm sạch (Cleaning) -> 2. Khử trùng (Disinfection) -> 3. Tiệt trùng (Sterilization)\nB. 1. Khử trùng -> 2. Rửa xà bông -> 3. Lau khô\nC. 1. Tiệt trùng -> 2. Làm sạch -> 3. Khử trùng\nD. 1. Ngâm Quats -> 2. Hấp Autoclave -> 3. Rửa tay\nĐáp án đúng: A\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 11, "q": "Khử trùng (Disinfection) khác với Tiệt trùng (Sterilization) ở điểm nào?", "o": ["Khử trùng diệt được vi khuẩn, nấm, virus nhưng KHÔNG giết được Bào tử. Tiệt trùng (Nồi hấp Autoclave dùng nhiệt/nước) giết được cả bào tử", "Khử trùng giết được bào tử, tiệt trùng thì không", "Khử trùng dùng cho da, tiệt trùng dùng cho dụng cụ", "Cả hai phương pháp đều giống nhau hoàn toàn"], "c": 0, "raw": "Câu 11: Khử trùng (Disinfection) khác với Tiệt trùng (Sterilization) ở điểm nào?\nA. Khử trùng diệt được vi khuẩn, nấm, virus nhưng KHÔNG giết được Bào tử. Tiệt trùng (Nồi hấp Autoclave dùng nhiệt/nước) giết được cả bào tử\nB. Khử trùng giết được bào tử, tiệt trùng thì không\nC. Khử trùng dùng cho da, tiệt trùng dùng cho dụng cụ\nD. Cả hai phương pháp đều giống nhau hoàn toàn\nĐáp án đúng: A\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 12, "q": "Antiseptic là chất gì?", "o": ["Chất kháng khuẩn, sát trùng được phép sử dụng trên da, làm chậm sự phát triển của vi khuẩn", "Hóa chất chùi rửa sàn nhà", "Nước sơn móng tay", "Thuốc khử trùng mạnh cho kim loại"], "c": 0, "raw": "Câu 12: Antiseptic là chất gì?\nA. Chất kháng khuẩn, sát trùng được phép sử dụng trên da, làm chậm sự phát triển của vi khuẩn\nB. Hóa chất chùi rửa sàn nhà\nC. Nước sơn móng tay\nD. Thuốc khử trùng mạnh cho kim loại\nĐáp án đúng: A\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 13, "q": "Khi dụng cụ vô tình cắt trúng gây chảy máu cho khách (sự cố phơi nhiễm), bạn PHẢI làm gì ĐẦU TIÊN?", "o": ["Ngừng ngay dịch vụ, rửa tay và đeo găng tay, thực hiện quy trình sát khuẩn/phơi nhiễm", "Lấy khăn giấy lau máu và tiếp tục cắt", "Bôi cồn 90 độ và xịt keo tạo kiểu", "Rửa dụng cụ vào bồn ngâm chân"], "c": 0, "raw": "Câu 13: Khi dụng cụ vô tình cắt trúng gây chảy máu cho khách (sự cố phơi nhiễm), bạn PHẢI làm gì ĐẦU TIÊN?\nA. Ngừng ngay dịch vụ, rửa tay và đeo găng tay, thực hiện quy trình sát khuẩn/phơi nhiễm\nB. Lấy khăn giấy lau máu và tiếp tục cắt\nC. Bôi cồn 90 độ và xịt keo tạo kiểu\nD. Rửa dụng cụ vào bồn ngâm chân\nĐáp án đúng: A\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 14, "q": "Các vật dụng xài 1 lần (Disposable) hoặc dính máu (bông gạc, khăn) phải được xử lý thế nào?", "o": ["Vứt bỏ vào 2 túi nilon (Double bag) và dán nhãn rác thải y tế nhiễm khuẩn (Soiled)", "Giặt lại bằng xà phòng để dùng cho khách sau", "Vứt thẳng ra thùng rác công cộng ngoài đường", "Đốt ngay trong tiệm"], "c": 0, "raw": "Câu 14: Các vật dụng xài 1 lần (Disposable) hoặc dính máu (bông gạc, khăn) phải được xử lý thế nào?\nA. Vứt bỏ vào 2 túi nilon (Double bag) và dán nhãn rác thải y tế nhiễm khuẩn (Soiled)\nB. Giặt lại bằng xà phòng để dùng cho khách sau\nC. Vứt thẳng ra thùng rác công cộng ngoài đường\nD. Đốt ngay trong tiệm\nĐáp án đúng: A\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 15, "q": "Nước dung dịch khử trùng QUATS phải được thay như thế nào?", "o": ["Thay mỗi ngày hoặc khi thấy có hiện tượng váng mỡ, vẩn đục, bị dơ", "Thay 1 lần/tuần", "Thay 1 tháng 1 lần", "Không cần thay, chỉ châm thêm nước"], "c": 0, "raw": "Câu 15: Nước dung dịch khử trùng QUATS phải được thay như thế nào?\nA. Thay mỗi ngày hoặc khi thấy có hiện tượng váng mỡ, vẩn đục, bị dơ\nB. Thay 1 lần/tuần\nC. Thay 1 tháng 1 lần\nD. Không cần thay, chỉ châm thêm nước\nĐáp án đúng: A\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 16, "q": "Thành phần chính và độ pH của thuốc uốn kiềm (Alkaline) là gì?", "o": ["Ammonium Thioglycolate (ATG / Thio), pH từ 9.0 - 9.6", "GMTG, pH 4.5 - 7.0", "Sodium Hydroxide, pH 13", "H2O2, pH 3.0"], "c": 0, "raw": "Câu 16: Thành phần chính và độ pH của thuốc uốn kiềm (Alkaline) là gì?\nA. Ammonium Thioglycolate (ATG / Thio), pH từ 9.0 - 9.6\nB. GMTG, pH 4.5 - 7.0\nC. Sodium Hydroxide, pH 13\nD. H2O2, pH 3.0\nĐáp án đúng: A\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 17, "q": "Thuốc uốn Acid (True Acid) có thành phần chính và độ pH là bao nhiêu?", "o": ["GMTG, pH từ 4.5 - 7.0", "Thio, pH 9.6", "Keratin, pH trung tính", "Thuốc tẩy, pH 10"], "c": 0, "raw": "Câu 17: Thuốc uốn Acid (True Acid) có thành phần chính và độ pH là bao nhiêu?\nA. GMTG, pH từ 4.5 - 7.0\nB. Thio, pH 9.6\nC. Keratin, pH trung tính\nD. Thuốc tẩy, pH 10\nĐáp án đúng: A\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 18, "q": "Thuốc trung hòa (Neutralizer) trong dịch vụ uốn/duỗi tóc có tác dụng gì?", "o": ["Ngừng tác dụng hóa chất mềm tóc, làm cứng lọn tóc, tái tạo liên kết Lưu huỳnh kép (Disulfide bond)", "Làm mở biểu bì tóc và giãn nở sợi tóc", "Giúp màu nhuộm sáng hơn", "Tẩy sạch lớp dầu trên da đầu"], "c": 0, "raw": "Câu 18: Thuốc trung hòa (Neutralizer) trong dịch vụ uốn/duỗi tóc có tác dụng gì?\nA. Ngừng tác dụng hóa chất mềm tóc, làm cứng lọn tóc, tái tạo liên kết Lưu huỳnh kép (Disulfide bond)\nB. Làm mở biểu bì tóc và giãn nở sợi tóc\nC. Giúp màu nhuộm sáng hơn\nD. Tẩy sạch lớp dầu trên da đầu\nĐáp án đúng: A\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 19, "q": "Hóa chất duỗi tóc (Relaxer) chứa thành phần gì có độ kiềm cao nhất?", "o": ["Sodium Hydroxide (NaOH / Lye / Hydroxide Acid)", "Ammonium Thioglycolate", "Sáp Paraffin", "Hydrogen Peroxide"], "c": 0, "raw": "Câu 19: Hóa chất duỗi tóc (Relaxer) chứa thành phần gì có độ kiềm cao nhất?\nA. Sodium Hydroxide (NaOH / Lye / Hydroxide Acid)\nB. Ammonium Thioglycolate\nC. Sáp Paraffin\nD. Hydrogen Peroxide\nĐáp án đúng: A\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 20, "q": "Tóc đã nhuộm bằng muối kim loại (Metallic dye) khi gặp ánh sáng mặt trời sẽ có hiện tượng gì?", "o": ["Có màu xám mờ đục, tối hơn và có ánh kim (Tuyệt đối không được dùng hóa chất tẩy/uốn lên loại tóc này)", "Tóc phát sáng rực rỡ và phai màu nhanh", "Tóc tự động uốn xoăn lại", "Tóc chuyển sang màu bạch kim"], "c": 0, "raw": "Câu 20: Tóc đã nhuộm bằng muối kim loại (Metallic dye) khi gặp ánh sáng mặt trời sẽ có hiện tượng gì?\nA. Có màu xám mờ đục, tối hơn và có ánh kim (Tuyệt đối không được dùng hóa chất tẩy/uốn lên loại tóc này)\nB. Tóc phát sáng rực rỡ và phai màu nhanh\nC. Tóc tự động uốn xoăn lại\nD. Tóc chuyển sang màu bạch kim\nĐáp án đúng: A\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 21, "q": "Nếu hóa chất uốn/duỗi vô tình văng vào mắt khách, người thợ phải làm gì?", "o": ["Rửa (tạt) mắt bằng nước mát/nước lạnh ngay lập tức và khuyên gọi bác sĩ", "Dùng khăn bông khô chà mạnh", "Nhỏ thuốc đau mắt", "Lấy cồn lau mắt"], "c": 0, "raw": "Câu 21: Nếu hóa chất uốn/duỗi vô tình văng vào mắt khách, người thợ phải làm gì?\nA. Rửa (tạt) mắt bằng nước mát/nước lạnh ngay lập tức và khuyên gọi bác sĩ\nB. Dùng khăn bông khô chà mạnh\nC. Nhỏ thuốc đau mắt\nD. Lấy cồn lau mắt\nĐáp án đúng: A\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 22, "q": "Kỹ thuật Bookends wrap (gấp giấy uốn tóc như cuốn sách) dùng để làm gì?", "o": ["Bao bọc đuôi tóc để tránh bị gãy đuôi hoặc xoăn hình móc câu (fishhook)", "Tránh thuốc dính vào da đầu", "Giúp tóc nhanh khô khi sấy", "Thay thế cho lô cuốn nhiệt"], "c": 0, "raw": "Câu 22: Kỹ thuật Bookends wrap (gấp giấy uốn tóc như cuốn sách) dùng để làm gì?\nA. Bao bọc đuôi tóc để tránh bị gãy đuôi hoặc xoăn hình móc câu (fishhook)\nB. Tránh thuốc dính vào da đầu\nC. Giúp tóc nhanh khô khi sấy\nD. Thay thế cho lô cuốn nhiệt\nĐáp án đúng: A\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 23, "q": "Nhuộm tóc lần đầu (tóc nguyên thủy - Virgin) nên bôi thuốc từ đâu để màu lên đều?", "o": ["Bôi ở phần giữa thân tóc trước", "Bôi sát gốc/da đầu trước", "Bôi từ ngọn tóc lên", "Bôi toàn bộ cùng một lúc"], "c": 0, "raw": "Câu 23: Nhuộm tóc lần đầu (tóc nguyên thủy - Virgin) nên bôi thuốc từ đâu để màu lên đều?\nA. Bôi ở phần giữa thân tóc trước\nB. Bôi sát gốc/da đầu trước\nC. Bôi từ ngọn tóc lên\nD. Bôi toàn bộ cùng một lúc\nĐáp án đúng: A\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 24, "q": "Khi khách hàng quay lại để làm sáng chân tóc (Retouch/Tẩy gốc), thợ nên thao tác như thế nào để tránh gãy đứt tóc?", "o": ["Bôi phần tóc mới mọc, cách da đầu 1/2 inch, tuyệt đối KHÔNG bôi chồng lên phần tóc cũ đã tẩy", "Bôi thuốc từ chân tới ngọn tóc để màu đều", "Dùng lược chải mạnh tay thuốc tẩy sát da đầu", "Phải dùng thuốc duỗi trước khi tẩy"], "c": 0, "raw": "Câu 24: Khi khách hàng quay lại để làm sáng chân tóc (Retouch/Tẩy gốc), thợ nên thao tác như thế nào để tránh gãy đứt tóc?\nA. Bôi phần tóc mới mọc, cách da đầu 1/2 inch, tuyệt đối KHÔNG bôi chồng lên phần tóc cũ đã tẩy\nB. Bôi thuốc từ chân tới ngọn tóc để màu đều\nC. Dùng lược chải mạnh tay thuốc tẩy sát da đầu\nD. Phải dùng thuốc duỗi trước khi tẩy\nĐáp án đúng: A\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 25, "q": "Sự khác biệt giữa PD test (Patch test) và Strand test?", "o": ["PD test thử dị ứng da (đợi 24-48 giờ); Strand test thử mảng tóc để xem màu có đều không hoặc thử độ thấm/thời gian xử lý", "PD test dùng để uốn; Strand test dùng để cắt", "Strand test thử trên cổ tay; PD test thử trên tóc", "Cả 2 đều là kiểm tra dị ứng sáp wax"], "c": 0, "raw": "Câu 25: Sự khác biệt giữa PD test (Patch test) và Strand test?\nA. PD test thử dị ứng da (đợi 24-48 giờ); Strand test thử mảng tóc để xem màu có đều không hoặc thử độ thấm/thời gian xử lý\nB. PD test dùng để uốn; Strand test dùng để cắt\nC. Strand test thử trên cổ tay; PD test thử trên tóc\nD. Cả 2 đều là kiểm tra dị ứng sáp wax\nĐáp án đúng: A\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 26, "q": "Toner (màu nhạt) được sử dụng để làm gì?", "o": ["Dùng sau khi tẩy tóc để làm đều màu và khử sắc tố không mong muốn", "Dùng để làm tóc xoăn", "Dùng thay thế dầu xả", "Dùng để trị gàu"], "c": 0, "raw": "Câu 26: Toner (màu nhạt) được sử dụng để làm gì?\nA. Dùng sau khi tẩy tóc để làm đều màu và khử sắc tố không mong muốn\nB. Dùng để làm tóc xoăn\nC. Dùng thay thế dầu xả\nD. Dùng để trị gàu\nĐáp án đúng: A\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 27, "q": "Khi duỗi/kẹp tóc bằng máy nhiệt (Thermal iron/Flat iron), thợ KHÔNG nên dùng loại lược nào?", "o": ["Lược kim loại (vì kim loại truyền và giữ nhiệt gây phỏng/cháy)", "Lược cao su cứng", "Lược nhựa cách nhiệt", "Lược sừng"], "c": 0, "raw": "Câu 27: Khi duỗi/kẹp tóc bằng máy nhiệt (Thermal iron/Flat iron), thợ KHÔNG nên dùng loại lược nào?\nA. Lược kim loại (vì kim loại truyền và giữ nhiệt gây phỏng/cháy)\nB. Lược cao su cứng\nC. Lược nhựa cách nhiệt\nD. Lược sừng\nĐáp án đúng: A\n\n", "cat": "styling", "sec": "3. Tạo kiểu tóc"}, {"n": 28, "q": "Đặc điểm và nhược điểm của Tóc tổng hợp (Synthetic hair) là gì?", "o": ["Có 70 màu của nhà sản xuất; Nhược điểm là không chịu được nhiệt độ cao. Thử bằng cách đốt qua ngọn diêm (cháy/xì khói)", "Không thể nhuộm màu; Rất đắt tiền", "Chỉ có 3 màu cơ bản; Chịu được nhiệt độ lên đến 300 độ C", "Không cần gội rửa; Làm từ lông thú"], "c": 0, "raw": "Câu 28: Đặc điểm và nhược điểm của Tóc tổng hợp (Synthetic hair) là gì?\nA. Có 70 màu của nhà sản xuất; Nhược điểm là không chịu được nhiệt độ cao. Thử bằng cách đốt qua ngọn diêm (cháy/xì khói)\nB. Không thể nhuộm màu; Rất đắt tiền\nC. Chỉ có 3 màu cơ bản; Chịu được nhiệt độ lên đến 300 độ C\nD. Không cần gội rửa; Làm từ lông thú\nĐáp án đúng: A\n\n", "cat": "styling", "sec": "3. Tạo kiểu tóc"}, {"n": 29, "q": "Kỹ thuật nối tóc bằng nhiệt (Fusion bonding) và nối tóc dệt (Braid extension) khác nhau ra sao?", "o": ["Fusion bonding dùng nhiệt và dụng cụ đặc biệt làm chảy keo; Braid extension là bím tóc có miếng vải dệt gắn vào", "Cả hai đều dùng kẹp tăm", "Braid extension dùng keo siêu dính; Fusion dùng chỉ may", "Cả hai đều là tên gọi của tóc giả nguyên đầu (Wig)"], "c": 0, "raw": "Câu 29: Kỹ thuật nối tóc bằng nhiệt (Fusion bonding) và nối tóc dệt (Braid extension) khác nhau ra sao?\nA. Fusion bonding dùng nhiệt và dụng cụ đặc biệt làm chảy keo; Braid extension là bím tóc có miếng vải dệt gắn vào\nB. Cả hai đều dùng kẹp tăm\nC. Braid extension dùng keo siêu dính; Fusion dùng chỉ may\nD. Cả hai đều là tên gọi của tóc giả nguyên đầu (Wig)\nĐáp án đúng: A\n\n", "cat": "styling", "sec": "3. Tạo kiểu tóc"}, {"n": 30, "q": "Da khô và Da dầu có đặc điểm gì?", "o": ["Da khô do tuyến bã nhờn hoạt động yếu; Da dầu có lỗ chân lông cực kỳ to", "Da khô rất nhiều mồ hôi; Da dầu dễ bị bong tróc", "Da khô có màu đỏ; Da dầu có màu trắng", "Cả hai loại da đều không được trang điểm"], "c": 0, "raw": "Câu 30: Da khô và Da dầu có đặc điểm gì?\nA. Da khô do tuyến bã nhờn hoạt động yếu; Da dầu có lỗ chân lông cực kỳ to\nB. Da khô rất nhiều mồ hôi; Da dầu dễ bị bong tróc\nC. Da khô có màu đỏ; Da dầu có màu trắng\nD. Cả hai loại da đều không được trang điểm\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 31, "q": "Mặt nạ đất sét (Clay mask) có công dụng chính là gì?", "o": ["Hút tạp chất dưới nang lông, se khít lỗ chân lông (Không khuyên dùng cho da khô)", "Cung cấp độ ẩm mạnh mẽ cho da lão hóa", "Tẩy lông mặt", "Chữa bệnh cao huyết áp"], "c": 0, "raw": "Câu 31: Mặt nạ đất sét (Clay mask) có công dụng chính là gì?\nA. Hút tạp chất dưới nang lông, se khít lỗ chân lông (Không khuyên dùng cho da khô)\nB. Cung cấp độ ẩm mạnh mẽ cho da lão hóa\nC. Tẩy lông mặt\nD. Chữa bệnh cao huyết áp\nĐáp án đúng: A\n\n", "cat": "skincare", "sec": "7. Chăm sóc da"}, {"n": 32, "q": "Mặt nạ Paraffin thường được dùng cho loại da/tình trạng nào?", "o": ["Dùng cho da bị khô, giúp giữ ẩm, làm sản phẩm thẩm thấu sâu hơn", "Dùng cho da nhiều dầu và lỗ chân lông to", "Dùng trị mụn trứng cá viêm", "Dùng để lột mụn đầu đen"], "c": 0, "raw": "Câu 32: Mặt nạ Paraffin thường được dùng cho loại da/tình trạng nào?\nA. Dùng cho da bị khô, giúp giữ ẩm, làm sản phẩm thẩm thấu sâu hơn\nB. Dùng cho da nhiều dầu và lỗ chân lông to\nC. Dùng trị mụn trứng cá viêm\nD. Dùng để lột mụn đầu đen\nĐáp án đúng: A\n\n", "cat": "skincare", "sec": "7. Chăm sóc da"}, {"n": 33, "q": "Máy xông hơi mặt (Steamer) trong thẩm mỹ có tác dụng gì?", "o": ["Làm thông thoáng lỗ chân lông, làm mềm bã nhờn, cung cấp oxy và giúp sản phẩm thẩm thấu dễ hơn (để cách mặt 14-18 inches)", "Làm lạnh và se khít lỗ chân lông", "Khử trùng da mặt", "Lấy đi tế bào chết bằng ma sát"], "c": 0, "raw": "Câu 33: Máy xông hơi mặt (Steamer) trong thẩm mỹ có tác dụng gì?\nA. Làm thông thoáng lỗ chân lông, làm mềm bã nhờn, cung cấp oxy và giúp sản phẩm thẩm thấu dễ hơn (để cách mặt 14-18 inches)\nB. Làm lạnh và se khít lỗ chân lông\nC. Khử trùng da mặt\nD. Lấy đi tế bào chết bằng ma sát\nĐáp án đúng: A\n\n", "cat": "skincare", "sec": "7. Chăm sóc da"}, {"n": 34, "q": "Nếu khách hàng đang sử dụng thuốc Accutane (thuốc trị mụn) hoặc có nốt ruồi, TMV phải làm gì khi khách yêu cầu tẩy lông (Wax)?", "o": ["Từ chối wax (chỉ được dùng nhíp nhổ). Tuyệt đối KHÔNG tẩy lông trên nốt ruồi.", "Vẫn wax bình thường nhưng dùng sáp lạnh", "Wax mạnh tay để lột đi lớp da chết", "Thoa thuốc tẩy trắng (bleach) lên nốt ruồi"], "c": 0, "raw": "Câu 34: Nếu khách hàng đang sử dụng thuốc Accutane (thuốc trị mụn) hoặc có nốt ruồi, TMV phải làm gì khi khách yêu cầu tẩy lông (Wax)?\nA. Từ chối wax (chỉ được dùng nhíp nhổ). Tuyệt đối KHÔNG tẩy lông trên nốt ruồi.\nB. Vẫn wax bình thường nhưng dùng sáp lạnh\nC. Wax mạnh tay để lột đi lớp da chết\nD. Thoa thuốc tẩy trắng (bleach) lên nốt ruồi\nĐáp án đúng: A\n\n", "cat": "waxing", "sec": "9. Triệt lông"}, {"n": 35, "q": "Khi nhổ lông mày bằng nhíp (Tweezing), thợ phải thao tác như thế nào?", "o": ["Dùng ngón tay kéo căng da, nhổ theo hướng/chiều lông mọc", "Thả lỏng da, nhổ ngược chiều lông mọc", "Bôi thuốc tê rồi nhổ", "Nhổ thẳng góc 90 độ"], "c": 0, "raw": "Câu 35: Khi nhổ lông mày bằng nhíp (Tweezing), thợ phải thao tác như thế nào?\nA. Dùng ngón tay kéo căng da, nhổ theo hướng/chiều lông mọc\nB. Thả lỏng da, nhổ ngược chiều lông mọc\nC. Bôi thuốc tê rồi nhổ\nD. Nhổ thẳng góc 90 độ\nĐáp án đúng: A\n\n", "cat": "waxing", "sec": "9. Triệt lông"}, {"n": 36, "q": "Khi wax lông bằng sáp, quy tắc bôi sáp và giật sáp là gì?", "o": ["Bôi sáp CÙNG chiều lông mọc, giật sáp NGƯỢC chiều lông mọc (Thử độ nóng sáp trên cổ tay thợ trước)", "Bôi sáp NGƯỢC chiều lông, giật CÙNG chiều lông", "Bôi sáp và giật theo bất kỳ chiều nào cũng được", "Chỉ dùng sáp cho vùng mắt"], "c": 0, "raw": "Câu 36: Khi wax lông bằng sáp, quy tắc bôi sáp và giật sáp là gì?\nA. Bôi sáp CÙNG chiều lông mọc, giật sáp NGƯỢC chiều lông mọc (Thử độ nóng sáp trên cổ tay thợ trước)\nB. Bôi sáp NGƯỢC chiều lông, giật CÙNG chiều lông\nC. Bôi sáp và giật theo bất kỳ chiều nào cũng được\nD. Chỉ dùng sáp cho vùng mắt\nĐáp án đúng: A\n\n", "cat": "waxing", "sec": "9. Triệt lông"}, {"n": 37, "q": "Người mắc bệnh tiểu đường (Diabetes) hoặc cao huyết áp (High blood pressure) KHÔNG ĐƯỢC nhận những dịch vụ nào?", "o": ["Tiểu đường: Không được cắt da chân/chấm mụn. Cao huyết áp: Không được massage/nhận dịch vụ Paraffin nóng", "Tiểu đường: Không được cắt tóc. Cao huyết áp: Không sơn móng", "Cả 2 bệnh đều không được nhuộm tóc", "Không được dũa móng"], "c": 0, "raw": "Câu 37: Người mắc bệnh tiểu đường (Diabetes) hoặc cao huyết áp (High blood pressure) KHÔNG ĐƯỢC nhận những dịch vụ nào?\nA. Tiểu đường: Không được cắt da chân/chấm mụn. Cao huyết áp: Không được massage/nhận dịch vụ Paraffin nóng\nB. Tiểu đường: Không được cắt tóc. Cao huyết áp: Không sơn móng\nC. Cả 2 bệnh đều không được nhuộm tóc\nD. Không được dũa móng\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 38, "q": "Các động tác massage cơ bản: Nhào/Nhồi bóp (Petrissage) và Vỗ đập (Tapotement) có ý nghĩa gì?", "o": ["Tapotement tạo kích thích mạnh nhất. Động tác massage luôn đi từ điểm nối cơ (Insertion) đến gốc cơ (Origin)", "Petrissage làm lạnh da. Đi từ gốc cơ đến ngọn cơ", "Tapotement làm buồn ngủ. Vuốt bằng máy xông hơi", "Không có tác dụng sinh học"], "c": 0, "raw": "Câu 38: Các động tác massage cơ bản: Nhào/Nhồi bóp (Petrissage) và Vỗ đập (Tapotement) có ý nghĩa gì?\nA. Tapotement tạo kích thích mạnh nhất. Động tác massage luôn đi từ điểm nối cơ (Insertion) đến gốc cơ (Origin)\nB. Petrissage làm lạnh da. Đi từ gốc cơ đến ngọn cơ\nC. Tapotement làm buồn ngủ. Vuốt bằng máy xông hơi\nD. Không có tác dụng sinh học\nĐáp án đúng: A\n\n", "cat": "skincare", "sec": "7. Chăm sóc da"}, {"n": 39, "q": "Trước khi gắn mi giả bằng dải (Band lashes), bước đầu tiên thợ cần làm là gì?", "o": ["Dùng nhíp đo kích cỡ khung mắt và cắt bỏ phần mi thừa", "Bôi trực tiếp keo lên mí mắt khách", "Chuốt mascara dày", "Rửa mắt bằng cồn"], "c": 0, "raw": "Câu 39: Trước khi gắn mi giả bằng dải (Band lashes), bước đầu tiên thợ cần làm là gì?\nA. Dùng nhíp đo kích cỡ khung mắt và cắt bỏ phần mi thừa\nB. Bôi trực tiếp keo lên mí mắt khách\nC. Chuốt mascara dày\nD. Rửa mắt bằng cồn\nĐáp án đúng: A\n\n", "cat": "lash_brow", "sec": "8. Lông mi và lông mày"}, {"n": 40, "q": "Primer (Sơn lót) và Base coat có chức năng gì trong làm móng?", "o": ["Primer giúp kết dính giữa móng thật và móng giả/bột (Monomer & Polymer). Base coat giúp tránh sơn bong tróc và không làm vàng móng thật", "Tạo độ bóng như gương cho bề mặt móng", "Làm móng mọc nhanh hơn gấp đôi", "Tẩy sạch lớp sơn cũ"], "c": 0, "raw": "Câu 40: Primer (Sơn lót) và Base coat có chức năng gì trong làm móng?\nA. Primer giúp kết dính giữa móng thật và móng giả/bột (Monomer & Polymer). Base coat giúp tránh sơn bong tróc và không làm vàng móng thật\nB. Tạo độ bóng như gương cho bề mặt móng\nC. Làm móng mọc nhanh hơn gấp đôi\nD. Tẩy sạch lớp sơn cũ\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 41, "q": "Acetone được sử dụng chủ yếu để làm gì trong ngành Nail?", "o": ["Chùi sạch nước sơn cũ và ngâm tháo gỡ móng bột/tip (Tuyệt đối không dùng kềm cậy/nạy móng giả lên)", "Sơn lớp trên cùng bảo vệ móng", "Pha loãng hóa chất uốn tóc", "Trị nấm móng"], "c": 0, "raw": "Câu 41: Acetone được sử dụng chủ yếu để làm gì trong ngành Nail?\nA. Chùi sạch nước sơn cũ và ngâm tháo gỡ móng bột/tip (Tuyệt đối không dùng kềm cậy/nạy móng giả lên)\nB. Sơn lớp trên cùng bảo vệ móng\nC. Pha loãng hóa chất uốn tóc\nD. Trị nấm móng\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 42, "q": "Hình dạng móng nào được xem là yếu nhất và dễ gãy nhất?", "o": ["Móng nhọn", "Móng vuông", "Móng oval", "Móng bầu (Round)"], "c": 0, "raw": "Câu 42: Hình dạng móng nào được xem là yếu nhất và dễ gãy nhất?\nA. Móng nhọn\nB. Móng vuông\nC. Móng oval\nD. Móng bầu (Round)\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 43, "q": "Khi cắt móng chân, nên cắt theo hình dáng nào để tránh móng mọc ngược vào trong thịt (Ingrown nail)?", "o": ["Cắt thẳng một đường ngang (Straight across)", "Cắt khoét sâu vào hai khóe", "Cắt hình mũi nhọn", "Cắt xéo 45 độ"], "c": 0, "raw": "Câu 43: Khi cắt móng chân, nên cắt theo hình dáng nào để tránh móng mọc ngược vào trong thịt (Ingrown nail)?\nA. Cắt thẳng một đường ngang (Straight across)\nB. Cắt khoét sâu vào hai khóe\nC. Cắt hình mũi nhọn\nD. Cắt xéo 45 độ\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 44, "q": "Tại sao KHÔNG nên cạo lông chân ngay trước khi làm dịch vụ chăm sóc chân (Pedicure)?", "o": ["Vì dễ làm trầy xước da, tạo vết thương hở dẫn đến nguy cơ nhiễm trùng khi ngâm bồn", "Vì cạo lông làm hóa chất làm móng mất tác dụng", "Vì làm khách hàng bị nhột", "Vì lông chân giúp móng mọc nhanh hơn"], "c": 0, "raw": "Câu 44: Tại sao KHÔNG nên cạo lông chân ngay trước khi làm dịch vụ chăm sóc chân (Pedicure)?\nA. Vì dễ làm trầy xước da, tạo vết thương hở dẫn đến nguy cơ nhiễm trùng khi ngâm bồn\nB. Vì cạo lông làm hóa chất làm móng mất tác dụng\nC. Vì làm khách hàng bị nhột\nD. Vì lông chân giúp móng mọc nhanh hơn\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 45, "q": "Móng vỏ trứng (Eggshell nail) và Móng giòn (Brittle nail) là gì?", "o": ["Móng vỏ trứng mỏng, trắng, dẻo. Móng giòn dễ gãy do dùng nhiều chất tẩy hoặc di truyền (nên dùng dịch vụ dầu nóng - hot oil)", "Móng vỏ trứng rất cứng. Móng giòn rất mềm", "Móng vỏ trứng màu vàng. Móng giòn có viền đen", "Cả hai đều là tên gọi của nấm móng"], "c": 0, "raw": "Câu 45: Móng vỏ trứng (Eggshell nail) và Móng giòn (Brittle nail) là gì?\nA. Móng vỏ trứng mỏng, trắng, dẻo. Móng giòn dễ gãy do dùng nhiều chất tẩy hoặc di truyền (nên dùng dịch vụ dầu nóng - hot oil)\nB. Móng vỏ trứng rất cứng. Móng giòn rất mềm\nC. Móng vỏ trứng màu vàng. Móng giòn có viền đen\nD. Cả hai đều là tên gọi của nấm móng\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 46, "q": "Khi dùng dũa mịn hoặc đẩy da (Hyponychium) quá mạnh tay dưới đầu móng sẽ gây hậu quả gì?", "o": ["Gây nhiễm trùng, làm bầm móng và tổn thương vùng liên kết bảo vệ", "Giúp móng sạch sẽ và mọc dài hơn", "Làm cho lớp sơn bám dính tốt hơn", "Không ảnh hưởng gì"], "c": 0, "raw": "Câu 46: Khi dùng dũa mịn hoặc đẩy da (Hyponychium) quá mạnh tay dưới đầu móng sẽ gây hậu quả gì?\nA. Gây nhiễm trùng, làm bầm móng và tổn thương vùng liên kết bảo vệ\nB. Giúp móng sạch sẽ và mọc dài hơn\nC. Làm cho lớp sơn bám dính tốt hơn\nD. Không ảnh hưởng gì\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 47, "q": "Hệ thống hút thông gió trong salon (Air filter/Ventilation) có mục đích gì?", "o": ["Loại bỏ độc khí, bụi bẩn, giảm lượng hít phải khí độc cho thợ và khách", "Dùng để sấy khô móng tay", "Dùng để làm mát khách hàng thay cho quạt", "Giúp keo nối mi khô nhanh hơn"], "c": 0, "raw": "Câu 47: Hệ thống hút thông gió trong salon (Air filter/Ventilation) có mục đích gì?\nA. Loại bỏ độc khí, bụi bẩn, giảm lượng hít phải khí độc cho thợ và khách\nB. Dùng để sấy khô móng tay\nC. Dùng để làm mát khách hàng thay cho quạt\nD. Giúp keo nối mi khô nhanh hơn\nĐáp án đúng: A\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 48, "q": "Chất hoạt động bề mặt (Surfactant) là thành phần chính của sản phẩm nào?", "o": ["Dầu gội đầu (Shampoo - gồm nước và surfactant)", "Thuốc nhuộm tóc", "Sáp wax lông", "Bột đắp móng"], "c": 0, "raw": "Câu 48: Chất hoạt động bề mặt (Surfactant) là thành phần chính của sản phẩm nào?\nA. Dầu gội đầu (Shampoo - gồm nước và surfactant)\nB. Thuốc nhuộm tóc\nC. Sáp wax lông\nD. Bột đắp móng\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 49, "q": "Kéo, kềm cắt da (Nipper) là dụng cụ thuộc loại nào và xử lý ra sao sau mỗi khách hàng?", "o": ["Đồ dùng đa năng (Multi-use). Bắt buộc phải làm sạch và ngâm khử trùng sau mỗi người khách", "Vật liệu xài 1 lần (Disposable). Dùng xong vứt bỏ", "Dụng cụ điện. Chỉ cần lau bằng khăn ướt", "Đồ cá nhân của thợ. Đem về nhà rửa"], "c": 0, "raw": "Câu 49: Kéo, kềm cắt da (Nipper) là dụng cụ thuộc loại nào và xử lý ra sao sau mỗi khách hàng?\nA. Đồ dùng đa năng (Multi-use). Bắt buộc phải làm sạch và ngâm khử trùng sau mỗi người khách\nB. Vật liệu xài 1 lần (Disposable). Dùng xong vứt bỏ\nC. Dụng cụ điện. Chỉ cần lau bằng khăn ướt\nD. Đồ cá nhân của thợ. Đem về nhà rửa\nĐáp án đúng: A\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 50, "q": "Khi làm dịch vụ hóa chất (Uốn, Duỗi, Nhuộm), cần chuẩn bị choàng bảo vệ khách như thế nào?", "o": ["Dùng 2 khăn bông và 1 áo choàng bằng nhựa (nylon) để hóa chất không ngấm vào người khách", "Chỉ cần 1 áo choàng vải", "Dùng 3 khăn giấy", "Không cần choàng nếu làm cẩn thận"], "c": 0, "raw": "Câu 50: Khi làm dịch vụ hóa chất (Uốn, Duỗi, Nhuộm), cần chuẩn bị choàng bảo vệ khách như thế nào?\nA. Dùng 2 khăn bông và 1 áo choàng bằng nhựa (nylon) để hóa chất không ngấm vào người khách\nB. Chỉ cần 1 áo choàng vải\nC. Dùng 3 khăn giấy\nD. Không cần choàng nếu làm cẩn thận\nĐáp án đúng: A\n\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 51, "q": "Dầu gội nào được khuyên dùng để lấy đi hóa chất dư hoặc kim loại nặng trên tóc (do bơi lội, bụi bẩn)?", "o": ["Dầu gội làm sạch sâu / Khử kim loại (Clarifying Shampoo)", "Dầu gội trị gàu (Medicated Shampoo)", "Dầu xả khô (Detangling Rinse)", "Dầu gội cân bằng màu"], "c": 0, "raw": "Câu 51: Dầu gội nào được khuyên dùng để lấy đi hóa chất dư hoặc kim loại nặng trên tóc (do bơi lội, bụi bẩn)?\nA. Dầu gội làm sạch sâu / Khử kim loại (Clarifying Shampoo)\nB. Dầu gội trị gàu (Medicated Shampoo)\nC. Dầu xả khô (Detangling Rinse)\nD. Dầu gội cân bằng màu\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 52, "q": "Gỡ tóc rối khi tóc ướt đúng cách là làm như thế nào?", "o": ["Gỡ từ phần ngọn tóc trước dần lên chân tóc phía sau gáy", "Chải mạnh từ chân tóc sát da đầu thẳng xuống", "Sấy khô rồi mới gỡ", "Vò mạnh tóc bằng khăn lông"], "c": 0, "raw": "Câu 52: Gỡ tóc rối khi tóc ướt đúng cách là làm như thế nào?\nA. Gỡ từ phần ngọn tóc trước dần lên chân tóc phía sau gáy\nB. Chải mạnh từ chân tóc sát da đầu thẳng xuống\nC. Sấy khô rồi mới gỡ\nD. Vò mạnh tóc bằng khăn lông\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 53, "q": "Mảnh sừng nổi lên tay và chân (Callus / Cục da chai) do làm việc hoặc ma sát liên tục thì xử lý ra sao?", "o": ["Dùng dũa chân (foot file) / bàn chải để làm mịn vết chai, tình trạng này không cản trở thợ làm dịch vụ", "Dùng dao lam lam cắt phăng đi", "Khuyên khách đi phẫu thuật", "Từ chối làm móng chân"], "c": 0, "raw": "Câu 53: Mảnh sừng nổi lên tay và chân (Callus / Cục da chai) do làm việc hoặc ma sát liên tục thì xử lý ra sao?\nA. Dùng dũa chân (foot file) / bàn chải để làm mịn vết chai, tình trạng này không cản trở thợ làm dịch vụ\nB. Dùng dao lam lam cắt phăng đi\nC. Khuyên khách đi phẫu thuật\nD. Từ chối làm móng chân\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 54, "q": "Khi nhuộm tóc có thao tác \"Test thử mảng tóc\" (Strand test) nhằm mục đích gì?", "o": ["Để kiểm tra màu tóc lên có đều không, hoặc độ thấm/thời gian xử lý của thuốc", "Để kiểm tra khách có bị dị ứng da (như PD Test) không", "Để đo chiều dài của tóc", "Để làm sạch tóc"], "c": 0, "raw": "Câu 54: Khi nhuộm tóc có thao tác \"Test thử mảng tóc\" (Strand test) nhằm mục đích gì?\nA. Để kiểm tra màu tóc lên có đều không, hoặc độ thấm/thời gian xử lý của thuốc\nB. Để kiểm tra khách có bị dị ứng da (như PD Test) không\nC. Để đo chiều dài của tóc\nD. Để làm sạch tóc\nĐáp án đúng: A\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 55, "q": "Khi lỡ dính hóa chất khử trùng (Quats, chất sát khuẩn) lên da tay, người thợ nên làm gì?", "o": ["Rửa tay ngay bằng xà phòng và nước ấm", "Băng bó lại bằng gạc", "Lấy acetone chùi", "Để nguyên cho tự khô"], "c": 0, "raw": "Câu 55: Khi lỡ dính hóa chất khử trùng (Quats, chất sát khuẩn) lên da tay, người thợ nên làm gì?\nA. Rửa tay ngay bằng xà phòng và nước ấm\nB. Băng bó lại bằng gạc\nC. Lấy acetone chùi\nD. Để nguyên cho tự khô\nĐáp án đúng: A\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 56, "q": "Bệnh rụng tóc Alopecia Areata có đặc điểm gì?", "o": ["Là chứng rụng tóc từng mảng (hói từng vùng) ở cả nam giới và nữ giới", "Là bệnh nấm da đầu lây nhiễm", "Là hiện tượng gãy rụng do uốn tóc", "Là bệnh hói đầu toàn phần do lão hóa"], "c": 0, "raw": "Câu 56: Bệnh rụng tóc Alopecia Areata có đặc điểm gì?\nA. Là chứng rụng tóc từng mảng (hói từng vùng) ở cả nam giới và nữ giới\nB. Là bệnh nấm da đầu lây nhiễm\nC. Là hiện tượng gãy rụng do uốn tóc\nD. Là bệnh hói đầu toàn phần do lão hóa\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 57, "q": "Khi trang điểm (Makeup), chì kẻ (Pencil/Eyeliner) có tác dụng gì và bảo vệ bằng cách nào?", "o": ["Tạo đường nét viền sắc sảo. Cần dùng đồ chuốt (sharpener) chuốt trước và sau khi sử dụng để vệ sinh", "Làm đều màu da toàn mặt. Rửa bằng cồn", "Che khuyết điểm bọng mắt. Hấp bằng nồi Autoclave", "Tô màu môi bóng. Không cần vệ sinh"], "c": 0, "raw": "Câu 57: Khi trang điểm (Makeup), chì kẻ (Pencil/Eyeliner) có tác dụng gì và bảo vệ bằng cách nào?\nA. Tạo đường nét viền sắc sảo. Cần dùng đồ chuốt (sharpener) chuốt trước và sau khi sử dụng để vệ sinh\nB. Làm đều màu da toàn mặt. Rửa bằng cồn\nC. Che khuyết điểm bọng mắt. Hấp bằng nồi Autoclave\nD. Tô màu môi bóng. Không cần vệ sinh\nĐáp án đúng: A\n\n", "cat": "lash_brow", "sec": "8. Lông mi và lông mày"}, {"n": 58, "q": "Chất hút ẩm (Dehydrator) bôi lên móng tự nhiên trong quy trình làm móng bột có tác dụng gì?", "o": ["Lấy đi độ ẩm và lớp dầu tự nhiên, ngừa nấm nằm trên móng giúp bột bám chắc hơn", "Làm mềm lớp biểu bì cuticle", "Tạo màu trắng sáng cho đầu móng", "Giúp móng dễ tháo gỡ hơn"], "c": 0, "raw": "Câu 58: Chất hút ẩm (Dehydrator) bôi lên móng tự nhiên trong quy trình làm móng bột có tác dụng gì?\nA. Lấy đi độ ẩm và lớp dầu tự nhiên, ngừa nấm nằm trên móng giúp bột bám chắc hơn\nB. Làm mềm lớp biểu bì cuticle\nC. Tạo màu trắng sáng cho đầu móng\nD. Giúp móng dễ tháo gỡ hơn\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 59, "q": "Cấu tạo của tóc, nước thấm vào lớp nào đầu tiên và hóa chất thấm vào lớp nào để bẻ gãy liên kết?", "o": ["Nước thấm vào lớp vỏ/biểu bì (Cuticle) đầu tiên; Hóa chất ngấm vào lớp trung bì (Cortex) để phá vỡ liên kết cấu trúc", "Nước thấm vào lớp tủy (Medulla); Hóa chất ở lớp sừng", "Hóa chất nằm ở bên ngoài sợi tóc không thấm vào trong", "Cả nước và hóa chất chỉ bám ở biểu bì"], "c": 0, "raw": "Câu 59: Cấu tạo của tóc, nước thấm vào lớp nào đầu tiên và hóa chất thấm vào lớp nào để bẻ gãy liên kết?\nA. Nước thấm vào lớp vỏ/biểu bì (Cuticle) đầu tiên; Hóa chất ngấm vào lớp trung bì (Cortex) để phá vỡ liên kết cấu trúc\nB. Nước thấm vào lớp tủy (Medulla); Hóa chất ở lớp sừng\nC. Hóa chất nằm ở bên ngoài sợi tóc không thấm vào trong\nD. Cả nước và hóa chất chỉ bám ở biểu bì\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 60, "q": "Người thợ thể hiện đạo đức nghề nghiệp (Professional ethics) trong salon bằng hành động nào sau đây?", "o": ["Giữ bí mật không tiết lộ thông tin của khách hàng; Thông báo trước cho khách nếu mình sắp dời đi", "Nói xấu salon khác để kéo khách", "Dùng lại đồ dùng 1 lần (disposable) để tiết kiệm cho chủ", "Tự ý thay đổi hóa chất mà không báo với khách"], "c": 0, "raw": "Câu 60: Người thợ thể hiện đạo đức nghề nghiệp (Professional ethics) trong salon bằng hành động nào sau đây?\nA. Giữ bí mật không tiết lộ thông tin của khách hàng; Thông báo trước cho khách nếu mình sắp dời đi\nB. Nói xấu salon khác để kéo khách\nC. Dùng lại đồ dùng 1 lần (disposable) để tiết kiệm cho chủ\nD. Tự ý thay đổi hóa chất mà không báo với khách\nĐáp án đúng: A\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 61, "q": "Khi định hình móng giả (tip) trên ngón tay mà bị dài quá, người thợ dùng dụng cụ gì để cắt ngắn?", "o": ["Kéo cắt tóc chuyên dụng", "Kềm cắt da tay", "Dụng cụ cắt móng giả chuyên biệt (Tip cutter)", "Dũa sắt bản lớn"], "c": 2, "raw": "Câu 61: Khi định hình móng giả (tip) trên ngón tay mà bị dài quá, người thợ dùng dụng cụ gì để cắt ngắn?\nA. Kéo cắt tóc chuyên dụng\nB. Kềm cắt da tay\nC. Dụng cụ cắt móng giả chuyên biệt (Tip cutter)\nD. Dũa sắt bản lớn\nĐáp án đúng: C\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 62, "q": "Khi sơn Gel, sau khi đặt móng vào đèn UV/LED thì hiện tượng gì xảy ra?", "o": ["Làm cứng lại (Cure / Hardened)", "Làm bóng móng", "Làm mềm móng", "Làm tróc sơn"], "c": 0, "raw": "Câu 62: Khi sơn Gel, sau khi đặt móng vào đèn UV/LED thì hiện tượng gì xảy ra?\nA. Làm cứng lại (Cure / Hardened)\nB. Làm bóng móng\nC. Làm mềm móng\nD. Làm tróc sơn\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 63, "q": "Để bổ sung tác động làm xẹp tóc bông xù (unruly curl), bạn khuyên khách dùng gì?", "o": ["Dầu dưỡng tóc không cần xả (Leave-in conditioner)", "Dầu gội làm sạch sâu", "Keo bọt tạo kiểu (Mousse)", "Nước muối biển"], "c": 0, "raw": "Câu 63: Để bổ sung tác động làm xẹp tóc bông xù (unruly curl), bạn khuyên khách dùng gì?\nA. Dầu dưỡng tóc không cần xả (Leave-in conditioner)\nB. Dầu gội làm sạch sâu\nC. Keo bọt tạo kiểu (Mousse)\nD. Nước muối biển\nĐáp án đúng: A\n\n", "cat": "styling", "sec": "3. Tạo kiểu tóc"}, {"n": 64, "q": "Bệnh về da nào có biểu hiện đỏ, ngứa và sưng?", "o": ["Viêm da nhiễm trùng", "Vảy nến (Psoriasis)", "Nám da", "Bạch biến"], "c": 0, "raw": "Câu 64: Bệnh về da nào có biểu hiện đỏ, ngứa và sưng?\nA. Viêm da nhiễm trùng\nB. Vảy nến (Psoriasis)\nC. Nám da\nD. Bạch biến\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 65, "q": "Cách thức thử nồi hấp (Autoclave) nào được chấp nhận để kiểm tra việc tiêu diệt bào tử?", "o": ["Thử nghiệm bằng túi bào tử vi khuẩn (Spore test)", "Dùng giấy quỳ tím", "Xem bằng mắt thường", "Ngửi mùi"], "c": 0, "raw": "Câu 65: Cách thức thử nồi hấp (Autoclave) nào được chấp nhận để kiểm tra việc tiêu diệt bào tử?\nA. Thử nghiệm bằng túi bào tử vi khuẩn (Spore test)\nB. Dùng giấy quỳ tím\nC. Xem bằng mắt thường\nD. Ngửi mùi\nĐáp án đúng: A\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 66, "q": "Dịch do viêm mô tạo ra được gọi là gì?", "o": ["Mủ (Pus)", "Mồ hôi", "Bã nhờn", "Tế bào chết"], "c": 0, "raw": "Câu 66: Dịch do viêm mô tạo ra được gọi là gì?\nA. Mủ (Pus)\nB. Mồ hôi\nC. Bã nhờn\nD. Tế bào chết\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 67, "q": "Thường xuyên bảo vệ móng giúp phòng ngừa tình trạng gì?", "o": ["Nứt và giòn móng", "Vàng móng", "Móng mọc nhanh", "Móng bị nấm"], "c": 0, "raw": "Câu 67: Thường xuyên bảo vệ móng giúp phòng ngừa tình trạng gì?\nA. Nứt và giòn móng\nB. Vàng móng\nC. Móng mọc nhanh\nD. Móng bị nấm\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 68, "q": "Cắt tóc theo kiểu Blunt cut (0 độ) là cắt kiểu gì?", "o": ["Bob, không tạo tầng, cắt ngang một chiều dài, cắt bằng", "Layer nhiều lớp", "Cạo trọc", "Cắt tỉa so le đuôi"], "c": 0, "raw": "Câu 68: Cắt tóc theo kiểu Blunt cut (0 độ) là cắt kiểu gì?\nA. Bob, không tạo tầng, cắt ngang một chiều dài, cắt bằng\nB. Layer nhiều lớp\nC. Cạo trọc\nD. Cắt tỉa so le đuôi\nĐáp án đúng: A\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 69, "q": "Vi trùng trong môi trường hợp nào thì không sống được?", "o": ["Môi trường khô (Dry)", "Môi trường ẩm ướt", "Môi trường ấm", "Môi trường tối"], "c": 0, "raw": "Câu 69: Vi trùng trong môi trường hợp nào thì không sống được?\nA. Môi trường khô (Dry)\nB. Môi trường ẩm ướt\nC. Môi trường ấm\nD. Môi trường tối\nĐáp án đúng: A\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 70, "q": "Lột da bằng hóa chất (Chemical peel) nếu thực hiện đều đặn sẽ thấy da thay đổi như thế nào?", "o": ["Sáng trắng, thay đổi cấu trúc bề mặt da (Texture)", "Da trở nên đen sạm", "Da mọc nhiều lông hơn", "Da tiết nhiều dầu hơn"], "c": 0, "raw": "Câu 70: Lột da bằng hóa chất (Chemical peel) nếu thực hiện đều đặn sẽ thấy da thay đổi như thế nào?\nA. Sáng trắng, thay đổi cấu trúc bề mặt da (Texture)\nB. Da trở nên đen sạm\nC. Da mọc nhiều lông hơn\nD. Da tiết nhiều dầu hơn\nĐáp án đúng: A\n\n", "cat": "skincare", "sec": "7. Chăm sóc da"}, {"n": 71, "q": "Hành động \"hắt xì\" trong tiệm salon có thể gây ra điều gì?", "o": ["Lây lan vi khuẩn/virus qua không khí", "Làm rụng tóc", "Gây bốc mùi hóa chất", "Tăng độ ẩm"], "c": 0, "raw": "Câu 71: Hành động \"hắt xì\" trong tiệm salon có thể gây ra điều gì?\nA. Lây lan vi khuẩn/virus qua không khí\nB. Làm rụng tóc\nC. Gây bốc mùi hóa chất\nD. Tăng độ ẩm\nĐáp án đúng: A\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 72, "q": "Chất tẩy rửa sử dụng trong tiệm được quy định như thế nào?", "o": ["Phải an toàn cho da, dùng để làm sạch bề mặt", "Dùng để uống", "Chỉ dùng khử trùng dụng cụ dính máu", "Dùng thay thế dầu gội"], "c": 0, "raw": "Câu 72: Chất tẩy rửa sử dụng trong tiệm được quy định như thế nào?\nA. Phải an toàn cho da, dùng để làm sạch bề mặt\nB. Dùng để uống\nC. Chỉ dùng khử trùng dụng cụ dính máu\nD. Dùng thay thế dầu gội\nĐáp án đúng: A\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 73, "q": "Khi dùng bóng phấn (cục mút) đánh mắt, nên sử dụng như thế nào?", "o": ["Như đồ dùng xài 1 lần (Single-use), vứt đi sau khi dùng", "Giặt lại và xài cho khách khác", "Hấp trong nồi Autoclave", "Ngâm vào dung dịch Quats"], "c": 0, "raw": "Câu 73: Khi dùng bóng phấn (cục mút) đánh mắt, nên sử dụng như thế nào?\nA. Như đồ dùng xài 1 lần (Single-use), vứt đi sau khi dùng\nB. Giặt lại và xài cho khách khác\nC. Hấp trong nồi Autoclave\nD. Ngâm vào dung dịch Quats\nĐáp án đúng: A\n\n", "cat": "lash_brow", "sec": "8. Lông mi và lông mày"}, {"n": 74, "q": "Kéo giãn tóc xoăn xù bằng nhiệt ở mức độ ép nhẹ được gọi là gì?", "o": ["Soft press (Ép nhẹ 1 lần)", "Hard press (Ép mạnh 2 lần)", "Medium press", "Đánh rối"], "c": 0, "raw": "Câu 74: Kéo giãn tóc xoăn xù bằng nhiệt ở mức độ ép nhẹ được gọi là gì?\nA. Soft press (Ép nhẹ 1 lần)\nB. Hard press (Ép mạnh 2 lần)\nC. Medium press\nD. Đánh rối\nĐáp án đúng: A\n\n", "cat": "styling", "sec": "3. Tạo kiểu tóc"}, {"n": 75, "q": "Khi tóc bị khô hoặc hư tổn cần sửa chữa, nên bổ sung dưỡng chất nào?", "o": ["Cần thêm độ ẩm (Moisture / Conditioner filler)", "Cần dùng thuốc tẩy mạnh", "Cần gội đầu nước nóng", "Cần dùng keo xịt tóc cứng"], "c": 0, "raw": "Câu 75: Khi tóc bị khô hoặc hư tổn cần sửa chữa, nên bổ sung dưỡng chất nào?\nA. Cần thêm độ ẩm (Moisture / Conditioner filler)\nB. Cần dùng thuốc tẩy mạnh\nC. Cần gội đầu nước nóng\nD. Cần dùng keo xịt tóc cứng\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 76, "q": "Khi cắt tóc xoăn (curly hair), dùng lực kéo của lược (Tension) như thế nào là phù hợp?", "o": ["Căng tối thiểu (Minimal tension) để tránh tóc bị giựt ngắn lên", "Kéo cực căng", "Kéo mạnh để duỗi thẳng tóc", "Không dùng lược"], "c": 0, "raw": "Câu 76: Khi cắt tóc xoăn (curly hair), dùng lực kéo của lược (Tension) như thế nào là phù hợp?\nA. Căng tối thiểu (Minimal tension) để tránh tóc bị giựt ngắn lên\nB. Kéo cực căng\nC. Kéo mạnh để duỗi thẳng tóc\nD. Không dùng lược\nĐáp án đúng: A\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 77, "q": "Cắt tóc bằng dao cạo (Razor) để tạo độ phồng nhẹ (Beveled) nghĩa là gì?", "o": ["Chỉ cắt vát ở phần đuôi tóc", "Cắt ngang sát da đầu", "Cắt thành đường zigzag", "Cạo trọc toàn bộ"], "c": 0, "raw": "Câu 77: Cắt tóc bằng dao cạo (Razor) để tạo độ phồng nhẹ (Beveled) nghĩa là gì?\nA. Chỉ cắt vát ở phần đuôi tóc\nB. Cắt ngang sát da đầu\nC. Cắt thành đường zigzag\nD. Cạo trọc toàn bộ\nĐáp án đúng: A\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 78, "q": "Cắt tóc theo hình dạng của hộp sọ (hình dáng đầu) thì kiểu nào phù hợp?", "o": ["Cạo trọc (hoặc cắt tỉa thon gọn / taper)", "Cắt Bob dài", "Cắt layer 180 độ", "Cắt ngang vai"], "c": 0, "raw": "Câu 78: Cắt tóc theo hình dạng của hộp sọ (hình dáng đầu) thì kiểu nào phù hợp?\nA. Cạo trọc (hoặc cắt tỉa thon gọn / taper)\nB. Cắt Bob dài\nC. Cắt layer 180 độ\nD. Cắt ngang vai\nĐáp án đúng: A\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 79, "q": "Da có nếp nhăn nhám, đỏ, thô ráp hoặc bệnh vẩy cá (Ichthyosis/Asteatosis) là do tình trạng nào?", "o": ["Tuyến dầu hoạt động quá kém (Da rất khô)", "Tuyến dầu hoạt động quá mạnh", "Nhiễm nấm đồng tiền", "Bị cháy nắng"], "c": 0, "raw": "Câu 79: Da có nếp nhăn nhám, đỏ, thô ráp hoặc bệnh vẩy cá (Ichthyosis/Asteatosis) là do tình trạng nào?\nA. Tuyến dầu hoạt động quá kém (Da rất khô)\nB. Tuyến dầu hoạt động quá mạnh\nC. Nhiễm nấm đồng tiền\nD. Bị cháy nắng\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 80, "q": "Móng vô trùng (Eggshell nail) là loại móng như thế nào?", "o": ["Móng mỏng, trắng, dẻo và cong (như vỏ trứng)", "Móng dày, vàng, cứng", "Móng bị nấm xanh đen", "Móng có đốm trắng"], "c": 0, "raw": "Câu 80: Móng vô trùng (Eggshell nail) là loại móng như thế nào?\nA. Móng mỏng, trắng, dẻo và cong (như vỏ trứng)\nB. Móng dày, vàng, cứng\nC. Móng bị nấm xanh đen\nD. Móng có đốm trắng\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 81, "q": "Khi dùng máy ép tóc bằng nhiệt (Thermal iron / Flat iron), nên bôi sản phẩm gì để bảo vệ tóc?", "o": ["Thermal protector (Kem/Xịt dưỡng bảo vệ nhiệt)", "Dầu gội đầu", "Bột tẩy", "Dung dịch Quats"], "c": 0, "raw": "Câu 81: Khi dùng máy ép tóc bằng nhiệt (Thermal iron / Flat iron), nên bôi sản phẩm gì để bảo vệ tóc?\nA. Thermal protector (Kem/Xịt dưỡng bảo vệ nhiệt)\nB. Dầu gội đầu\nC. Bột tẩy\nD. Dung dịch Quats\nĐáp án đúng: A\n\n", "cat": "styling", "sec": "3. Tạo kiểu tóc"}, {"n": 82, "q": "Để bảo vệ da đầu của khách không bị phỏng khi dùng máy là tóc, người thợ nên làm gì?", "o": ["Đặt chiếc lược (nhựa cứng/chịu nhiệt) giữa da đầu và kẹp tóc", "Bôi nước đá lên da đầu", "Kẹp thật sát chân tóc", "Xịt nước vào máy ép"], "c": 0, "raw": "Câu 82: Để bảo vệ da đầu của khách không bị phỏng khi dùng máy là tóc, người thợ nên làm gì?\nA. Đặt chiếc lược (nhựa cứng/chịu nhiệt) giữa da đầu và kẹp tóc\nB. Bôi nước đá lên da đầu\nC. Kẹp thật sát chân tóc\nD. Xịt nước vào máy ép\nĐáp án đúng: A\n\n", "cat": "styling", "sec": "3. Tạo kiểu tóc"}, {"n": 83, "q": "Thùng ngâm khử trùng dụng cụ phải đáp ứng yêu cầu gì?", "o": ["Phải to đủ để dụng cụ được ngâm chìm lỉm hoàn toàn trong dung dịch và có nắp đậy kín", "Phải làm bằng thủy tinh trong suốt", "Phải mở nắp để bay mùi", "Dùng chung với thùng rác"], "c": 0, "raw": "Câu 83: Thùng ngâm khử trùng dụng cụ phải đáp ứng yêu cầu gì?\nA. Phải to đủ để dụng cụ được ngâm chìm lỉm hoàn toàn trong dung dịch và có nắp đậy kín\nB. Phải làm bằng thủy tinh trong suốt\nC. Phải mở nắp để bay mùi\nD. Dùng chung với thùng rác\nĐáp án đúng: A\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 84, "q": "Chất dưỡng ẩm (Humectant) có đặc tính gì?", "o": ["Khả năng giữ ẩm cao, thành phần chính là nước, hút ẩm từ không khí", "Làm khô tóc tức thì", "Tẩy sạch lớp sừng da", "Tạo màu cho tóc"], "c": 0, "raw": "Câu 84: Chất dưỡng ẩm (Humectant) có đặc tính gì?\nA. Khả năng giữ ẩm cao, thành phần chính là nước, hút ẩm từ không khí\nB. Làm khô tóc tức thì\nC. Tẩy sạch lớp sừng da\nD. Tạo màu cho tóc\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 85, "q": "Tránh nhiễm trùng chéo khi dùng sáp wax, người thợ cầm que sáp (spatula) nhúng như thế nào?", "o": ["Không được nhúng lại (No double dipping). Lấy sáp bằng dụng cụ dùng 1 lần.", "Nhúng lại nhiều lần để tiết kiệm", "Dùng chung một que cho nhiều khách", "Dùng tay để bôi sáp"], "c": 0, "raw": "Câu 85: Tránh nhiễm trùng chéo khi dùng sáp wax, người thợ cầm que sáp (spatula) nhúng như thế nào?\nA. Không được nhúng lại (No double dipping). Lấy sáp bằng dụng cụ dùng 1 lần.\nB. Nhúng lại nhiều lần để tiết kiệm\nC. Dùng chung một que cho nhiều khách\nD. Dùng tay để bôi sáp\nĐáp án đúng: A\n\n", "cat": "waxing", "sec": "9. Triệt lông"}, {"n": 86, "q": "Tất cả các phản ứng hóa học (Nhuộm, Uốn, Duỗi) đều xảy ra ở lớp nào của sợi tóc?", "o": ["Cortex (Lớp giữa / Trung bì)", "Cuticle (Biểu bì)", "Medulla (Tủy)", "Lớp sừng"], "c": 0, "raw": "Câu 86: Tất cả các phản ứng hóa học (Nhuộm, Uốn, Duỗi) đều xảy ra ở lớp nào của sợi tóc?\nA. Cortex (Lớp giữa / Trung bì)\nB. Cuticle (Biểu bì)\nC. Medulla (Tủy)\nD. Lớp sừng\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 87, "q": "Giữa 2 dịch vụ uốn tóc (Perm) và nhuộm màu (Color), nên thực hiện dịch vụ nào trước?", "o": ["Nên làm dịch vụ hóa chất có tính kiềm mạnh hơn trước, hoặc theo hướng dẫn. Thường Uốn tóc (Perm) trước rồi mới Nhuộm, nếu làm cùng lúc. Nhưng tài liệu gốc ghi \"COLOR TRƯỚC\"", "Cắt tóc xong mới nhuộm", "Nhuộm sau đó 1 tuần mới uốn", "Làm cùng lúc trên một bát thuốc (Đáp án đúng: A - Theo sát tài liệu PDF cung cấp)"], "c": 0, "raw": "Câu 87: Giữa 2 dịch vụ uốn tóc (Perm) và nhuộm màu (Color), nên thực hiện dịch vụ nào trước?\nA. Nên làm dịch vụ hóa chất có tính kiềm mạnh hơn trước, hoặc theo hướng dẫn. Thường Uốn tóc (Perm) trước rồi mới Nhuộm, nếu làm cùng lúc. Nhưng tài liệu gốc ghi \"COLOR TRƯỚC\"\nB. Cắt tóc xong mới nhuộm\nC. Nhuộm sau đó 1 tuần mới uốn\nD. Làm cùng lúc trên một bát thuốc (Đáp án đúng: A - Theo sát tài liệu PDF cung cấp)\nĐáp án đúng: A\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 88, "q": "Khi nhuộm để làm sáng tóc (Lightening/Tẩy), phải chừa chân tóc (cách da đầu) bao nhiêu?", "o": ["1/2 inches (khoảng 1.25 cm)", "1 inch", "Bôi sát vào da đầu", "2 inches"], "c": 0, "raw": "Câu 88: Khi nhuộm để làm sáng tóc (Lightening/Tẩy), phải chừa chân tóc (cách da đầu) bao nhiêu?\nA. 1/2 inches (khoảng 1.25 cm)\nB. 1 inch\nC. Bôi sát vào da đầu\nD. 2 inches\nĐáp án đúng: A\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 89, "q": "Trước khi làm dịch vụ duỗi tóc (Relaxer), làm sao để tránh da đầu bị ngứa/kích ứng?", "o": ["KHÔNG NÊN chải đầu mạnh (tránh làm xước da đầu) và bôi kem nền bảo vệ (Base cream)", "Gội đầu bằng nước thật nóng", "Cạo sạch vảy gàu", "Massage da đầu thật mạnh"], "c": 0, "raw": "Câu 89: Trước khi làm dịch vụ duỗi tóc (Relaxer), làm sao để tránh da đầu bị ngứa/kích ứng?\nA. KHÔNG NÊN chải đầu mạnh (tránh làm xước da đầu) và bôi kem nền bảo vệ (Base cream)\nB. Gội đầu bằng nước thật nóng\nC. Cạo sạch vảy gàu\nD. Massage da đầu thật mạnh\nĐáp án đúng: A\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 90, "q": "Dịch vụ \"Curl reforming\" (Soft curl permanent) là quá trình gì?", "o": ["Duỗi nhẹ tóc xoăn tít rồi uốn lại thành lọn xoăn to hơn (Loosen curls and reperm)", "Nhuộm tóc đen sang vàng", "Cắt ngắn phần tóc bị hỏng", "Hấp dầu phục hồi"], "c": 0, "raw": "Câu 90: Dịch vụ \"Curl reforming\" (Soft curl permanent) là quá trình gì?\nA. Duỗi nhẹ tóc xoăn tít rồi uốn lại thành lọn xoăn to hơn (Loosen curls and reperm)\nB. Nhuộm tóc đen sang vàng\nC. Cắt ngắn phần tóc bị hỏng\nD. Hấp dầu phục hồi\nĐáp án đúng: A\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 91, "q": "Lithium relaxer và Potassium relaxer được gọi chung trên thị trường là thuốc duỗi gì?", "o": ["Thuốc duỗi KHÔNG CÓ Sodium (No-Lye relaxer)", "Thuốc duỗi Acid", "Thuốc tẩy trắng tóc", "Thuốc uốn lạnh"], "c": 0, "raw": "Câu 91: Lithium relaxer và Potassium relaxer được gọi chung trên thị trường là thuốc duỗi gì?\nA. Thuốc duỗi KHÔNG CÓ Sodium (No-Lye relaxer)\nB. Thuốc duỗi Acid\nC. Thuốc tẩy trắng tóc\nD. Thuốc uốn lạnh\nĐáp án đúng: A\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 92, "q": "Nếu người thợ biết tóc khách có nhuộm muối kim loại (Metallic dye), việc đầu tiên cần làm là gì?", "o": ["Dùng dầu gội Clarifying (loại bỏ kim loại/tạp chất) hoặc từ chối làm hóa chất Uốn/Duỗi/Tẩy", "Cắt hết phần tóc đó đi", "Nhuộm đè màu đen lên", "Bôi trực tiếp thuốc uốn lên"], "c": 0, "raw": "Câu 92: Nếu người thợ biết tóc khách có nhuộm muối kim loại (Metallic dye), việc đầu tiên cần làm là gì?\nA. Dùng dầu gội Clarifying (loại bỏ kim loại/tạp chất) hoặc từ chối làm hóa chất Uốn/Duỗi/Tẩy\nB. Cắt hết phần tóc đó đi\nC. Nhuộm đè màu đen lên\nD. Bôi trực tiếp thuốc uốn lên\nĐáp án đúng: A\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 93, "q": "Thành phần chính của thuốc nhuộm tóc Vĩnh viễn (Permanent) cần kết hợp với chất nào để lên màu?", "o": ["Developer (Hydrogen Peroxide / Chất xúc tác / Chất phát triển)", "Nước cất", "Sodium Hydroxide", "Gel tạo kiểu"], "c": 0, "raw": "Câu 93: Thành phần chính của thuốc nhuộm tóc Vĩnh viễn (Permanent) cần kết hợp với chất nào để lên màu?\nA. Developer (Hydrogen Peroxide / Chất xúc tác / Chất phát triển)\nB. Nước cất\nC. Sodium Hydroxide\nD. Gel tạo kiểu\nĐáp án đúng: A\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 94, "q": "Khái niệm \"Tint back\" nghĩa là gì trong ngành tóc?", "o": ["Nhuộm màu tóc trở lại giống với màu tóc nguyên thủy tự nhiên của khách", "Nhuộm ngọn tóc màu sáng hơn chân tóc", "Tẩy tóc trắng bệch", "Nhuộm highlight 2 màu"], "c": 0, "raw": "Câu 94: Khái niệm \"Tint back\" nghĩa là gì trong ngành tóc?\nA. Nhuộm màu tóc trở lại giống với màu tóc nguyên thủy tự nhiên của khách\nB. Nhuộm ngọn tóc màu sáng hơn chân tóc\nC. Tẩy tóc trắng bệch\nD. Nhuộm highlight 2 màu\nĐáp án đúng: A\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 95, "q": "\"Cross check\" trong cắt tóc là thực hiện việc gì?", "o": ["Kiểm tra chéo độ cân bằng của mái tóc (VD: cắt dọc thì kiểm tra ngang)", "Dùng kéo răng cưa cắt đuôi tóc", "Phủ keo lên mái tóc", "Sấy tóc ngược chiều"], "c": 0, "raw": "Câu 95: \"Cross check\" trong cắt tóc là thực hiện việc gì?\nA. Kiểm tra chéo độ cân bằng của mái tóc (VD: cắt dọc thì kiểm tra ngang)\nB. Dùng kéo răng cưa cắt đuôi tóc\nC. Phủ keo lên mái tóc\nD. Sấy tóc ngược chiều\nĐáp án đúng: A\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 96, "q": "Tóc có độ xốp (Porosity) THẤP thì đặc tính của nó là gì?", "o": ["Lớp biểu bì đóng chặt, khó thấm hóa chất, tóc khỏe, khó bị bẻ gãy", "Thấm hóa chất cực nhanh, tóc mềm nhũn", "Tóc tự động rụng", "Tóc không thể cắt được"], "c": 0, "raw": "Câu 96: Tóc có độ xốp (Porosity) THẤP thì đặc tính của nó là gì?\nA. Lớp biểu bì đóng chặt, khó thấm hóa chất, tóc khỏe, khó bị bẻ gãy\nB. Thấm hóa chất cực nhanh, tóc mềm nhũn\nC. Tóc tự động rụng\nD. Tóc không thể cắt được\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 97, "q": "Tóc có độ xốp (Porosity) CAO thì đặc tính ra sao?", "o": ["Biểu bì mở rộng, thẩm thấu hóa chất cực nhanh, dễ hư tổn (Brittle, khô và dễ gãy)", "Không ăn thuốc nhuộm", "Khó thấm nước", "Tóc cực kỳ bóng mượt"], "c": 0, "raw": "Câu 97: Tóc có độ xốp (Porosity) CAO thì đặc tính ra sao?\nA. Biểu bì mở rộng, thẩm thấu hóa chất cực nhanh, dễ hư tổn (Brittle, khô và dễ gãy)\nB. Không ăn thuốc nhuộm\nC. Khó thấm nước\nD. Tóc cực kỳ bóng mượt\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 98, "q": "Trong kỹ thuật uốn tóc, kích cỡ của thanh uốn (Lô cuốn) quyết định điều gì?", "o": ["Kích cỡ của thanh uốn quyết định độ xoăn (to hay nhỏ) của lọn tóc", "Kích cỡ thanh uốn quyết định thời gian ngấm thuốc", "Thanh uốn to sẽ làm tóc nhanh dài", "Thanh uốn nhỏ làm tóc chuyển màu"], "c": 0, "raw": "Câu 98: Trong kỹ thuật uốn tóc, kích cỡ của thanh uốn (Lô cuốn) quyết định điều gì?\nA. Kích cỡ của thanh uốn quyết định độ xoăn (to hay nhỏ) của lọn tóc\nB. Kích cỡ thanh uốn quyết định thời gian ngấm thuốc\nC. Thanh uốn to sẽ làm tóc nhanh dài\nD. Thanh uốn nhỏ làm tóc chuyển màu\nĐáp án đúng: A\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 99, "q": "Cắt tóc tạo trọng lượng (Tạo độ nặng, không xếp tầng) sử dụng đường cắt nào?", "o": ["Đường ngang (Horizontal) - Blunt cut", "Đường dọc (Vertical)", "Đường chéo (Diagonal)", "Đường ziczac"], "c": 0, "raw": "Câu 99: Cắt tóc tạo trọng lượng (Tạo độ nặng, không xếp tầng) sử dụng đường cắt nào?\nA. Đường ngang (Horizontal) - Blunt cut\nB. Đường dọc (Vertical)\nC. Đường chéo (Diagonal)\nD. Đường ziczac\nĐáp án đúng: A\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 100, "q": "\"Side wall\" (Tường móng) là bộ phận nào trên tay?", "o": ["Lớp da dọ
