let examTimerHandle=null;

function renderExamRun(){
  const exam = lsGet(LS_ACTIVE_EXAM, null);
  if(!exam){ navigate('#/exam'); return; }
  if(exam.submitted){ navigate('#/exam/result'); return; }

  const remaining = exam.durationSec - Math.floor((Date.now()-exam.startTime)/1000);
  if(remaining<=0){ submitExam(exam); return; }

  if(transient.examIdx===undefined) transient.examIdx=0;
  const idx = transient.examIdx;
  const qn = exam.questions[idx];
  const q = Q_BY_NUM[qn];
  if(!q){ navigate('#/exam'); return; }

  const chosen = toArr(exam.answers[qn]);
  const flagged = exam.flagged.includes(qn);
  const multi = isMultiAnswer(q);
  const answeredCount = Object.keys(exam.answers).length;

  app.innerHTML = `
    <div class="exam-layout">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div class="qcounter">Câu ${idx+1} / ${exam.questions.length}</div>
          <button class="btn btn-sm btn-ghost" id="flagBtn">${flagged?'★ Đã đánh dấu':'☆ Đánh dấu xem lại'}</button>
        </div>
        ${catTag(q.cat)}
        ${multi ? '<div style="font-size:12px;color:var(--warn);margin-bottom:6px;">Câu này có nhiều hơn 1 đáp án đúng — chọn tất cả đáp án đúng.</div>' : ''}
        <p class="q-text">${escapeHtml(q.q)}</p>
        <div id="optsHost">
          ${q.o.map((opt,i)=>`<div class="option ${chosen.includes(i)?'selected':''}" data-i="${i}"><span class="letter">${'ABCD'[i]||(i+1)}</span><span>${escapeHtml(opt)}</span></div>`).join('')}
        </div>
        <div class="quiz-footer">
          <button class="btn btn-ghost" id="prevBtn" ${idx===0?'disabled':''}>← Câu trước</button>
          <button class="btn btn-primary" id="nextBtn" ${idx===exam.questions.length-1?'disabled':''}>Câu tiếp theo →</button>
        </div>
      </div>
      <aside class="card exam-sidebar">
        <div class="timer" id="timerDisplay">--:--</div>
        <div style="font-size:12px;color:var(--ink-soft);text-align:center;margin-top:2px;">Đã làm: ${answeredCount}/${exam.questions.length} câu</div>
        <div class="exam-palette" style="margin-top:14px;">
          ${exam.questions.map((n,i)=>{
            const isAns = exam.answers[n]!==undefined;
            const isFlg = exam.flagged.includes(n);
            const isCur = i===idx;
            let cls='pal-btn';
            if(isCur) cls+=' current';
            if(isAns) cls+=' answered';
            if(isFlg) cls+=' flagged';
            return `<button class="${cls}" data-idx="${i}">${i+1}</button>`;
          }).join('')}
        </div>
        <div class="exam-submit-wrap">
          <button class="btn btn-primary btn-sm" style="width:100%;" id="submitExamBtn">Nộp bài thi</button>
        </div>
      </aside>
    </div>
  `;

  document.getElementById('prevBtn').onclick=()=>{ if(transient.examIdx>0){ transient.examIdx--; renderExamRun(); } };
  document.getElementById('nextBtn').onclick=()=>{ if(transient.examIdx<exam.questions.length-1){ transient.examIdx++; renderExamRun(); } };
  document.getElementById('flagBtn').onclick=()=>{
    if(exam.flagged.includes(qn)){ exam.flagged = exam.flagged.filter(x=>x!==qn); }
    else { exam.flagged.push(qn); }
    lsSet(LS_ACTIVE_EXAM, exam);
    renderExamRun();
  };
  app.querySelectorAll('.exam-palette .pal-btn').forEach(btn=>{
    btn.onclick=()=>{ transient.examIdx = parseInt(btn.dataset.idx); renderExamRun(); };
  });

  app.querySelectorAll('#optsHost .option').forEach(el=>{
    el.onclick=()=>{
      const i = parseInt(el.dataset.i);
      let cur = toArr(exam.answers[qn]);
      if(multi){
        cur = cur.includes(i) ? cur.filter(x=>x!==i) : [...cur, i];
        if(cur.length) exam.answers[qn] = cur; else delete exam.answers[qn];
      } else {
        exam.answers[qn] = i;
      }
      lsSet(LS_ACTIVE_EXAM, exam);
      renderExamRun();
    };
  });

  document.getElementById('submitExamBtn').onclick=()=>confirmSubmit(exam);

  clearInterval(examTimerHandle);
  updateTimerDisplay(exam);
  examTimerHandle = setInterval(()=>{
    const still = updateTimerDisplay(exam);
    if(!still){ submitExam(exam); }
  }, 1000);
}

function updateTimerDisplay(exam){
  const el = document.getElementById('timerDisplay');
  if(!el) return false;
  const rem = exam.durationSec - Math.floor((Date.now()-exam.startTime)/1000);
  if(rem<=0){ el.textContent='00:00'; el.classList.add('urgent'); return false; }
  const m = Math.floor(rem/60);
  const s = rem%60;
  el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  if(rem<300) el.classList.add('urgent');
  return true;
}

function confirmSubmit(exam){
  const ansCount = Object.keys(exam.answers).length;
  const total = exam.questions.length;
  const msg = ansCount < total
    ? `Bạn mới trả lời ${ansCount}/${total} câu hỏi. Vẫn còn ${total-ansCount} câu chưa làm. Bạn có chắc chắn muốn nộp bài?`
    : `Bạn đã hoàn thành toàn bộ ${total} câu hỏi. Xác nhận nộp bài?`;
  if(confirm(msg)){ submitExam(exam); }
}

function submitExam(exam){
  clearInterval(examTimerHandle);
  exam.submitted=true;
  exam.endTime = Date.now();
  
  let scoredCorrect=0;
  let scoredTotal=0;
  let unscoredCorrect=0;
  let unscoredTotal=0;
  
  const byCategory={};
  CAT_ORDER.forEach(c=>byCategory[c]={correct:0,total:0});
  
  exam.questions.forEach(n=>{
    const q = Q_BY_NUM[n];
    if(!q) return;
    const isScored = exam.scoredMap ? (exam.scoredMap[n] !== false) : true;
    const chosen = exam.answers[n];
    const correct = isAnswerCorrect(q, chosen);
    if(chosen!==undefined) recordAnswer(n, correct);
    
    if(isScored){
      scoredTotal++;
      if(byCategory[q.cat]) byCategory[q.cat].total++;
      if(correct){
        scoredCorrect++;
        if(byCategory[q.cat]) byCategory[q.cat].correct++;
      }
    } else {
      unscoredTotal++;
      if(correct){
        unscoredCorrect++;
      }
    }
  });
  
  const total = exam.questions.length;
  const pass = scoredTotal > 0 ? (scoredCorrect / scoredTotal >= 0.70) : (scoredCorrect / total >= 0.70);
  
  const record = {
    id: exam.id,
    date: new Date().toISOString(),
    bankId: exam.bankId || activeBankId,
    total,
    scoredTotal,
    scoredCorrect,
    unscoredTotal,
    unscoredCorrect,
    correctCount: scoredCorrect,
    pass,
    byCategory,
    submitted: true,
    durationSec: exam.durationSec,
    timeUsedSec: Math.floor((exam.endTime-exam.startTime)/1000),
    questions: exam.questions,
    scoredMap: exam.scoredMap,
    answers: exam.answers
  };
  const hist = getHistory();
  hist.push(record);
  saveHistory(hist);
  lsSet(LS_ACTIVE_EXAM, exam);
  transient.lastExamId = record.id;
  navigate('#/exam/result');
}

        (${Math.round((record.scoredCorrect || record.correctCount)/(record.scoredTotal || record.total)*100)}%) — Tiêu chuẩn đậu: Tối thiểu 70%
      </p>
      ${(record.unscoredTotal > 0) ? `<p style="font-size:13px;color:var(--ink-soft);margin:4px 0 0;">10 câu thử nghiệm (không tính điểm): đúng ${record.unscoredCorrect}/${record.unscoredTotal} câu · Tổng điểm toàn đề: ${(record.scoredCorrect || record.correctCount) + (record.unscoredCorrect || 0)}/${record.total}</p>` : ''}
      <div class="quick-actions" style="justify-content:center;margin-top:14px;">
        <button class="btn btn-primary" id="newExam">Thi thử lại</button>
        <button class="btn btn-ghost" id="home">Về trang chủ</button>
      </div>
    </div>
    <div class="card" style="margin-top:16px;">
      <div class="section-label">Kết quả chi tiết theo chủ đề (${cfg.shortName})</div>
      <div class="weak-list" style="margin-top:10px;">
        ${CAT_ORDER.filter(c=>record.byCategory[c] && record.byCategory[c].total>0).map(c=>{
          const b = record.byCategory[c];
          const p = b.correct/b.total;
          return `<div class="weak-row">
            <div class="weak-name">${CATS[c]}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.round(p*100)}%;background:${accentHex(c)}"></div></div>
            <div class="weak-pct">${b.correct}/${b.total} (${Math.round(p*100)}%)</div>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="card" style="margin-top:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
        <div class="section-label" style="margin:0;">Xem lại đề thi</div>
        <div class="subtabs" style="margin:0;">
          <button class="subtab-btn ${transient.resultReviewFilter==='wrong'?'active':''}" data-f="wrong">Chỉ câu sai</button>
          <button class="subtab-btn ${transient.resultReviewFilter==='all'?'active':''}" data-f="all">Tất cả câu</button>
        </div>
      </div>
      <div id="reviewList" style="margin-top:14px;"></div>
    </div>
  `;
  document.getElementById('newExam').onclick=()=>navigate('#/exam');
  document.getElementById('home').onclick=()=>navigate('#/');
  app.querySelectorAll('.subtab-btn').forEach(b=>b.onclick=()=>{ transient.resultReviewFilter=b.dataset.f; renderExamResult(); });

  const list = document.getElementById('reviewList');
  const qs = record.questions.map(n=>Q_BY_NUM[n]).filter(Boolean);
  const filtered = transient.resultReviewFilter==='all' ? qs : qs.filter(q=>!isAnswerCorrect(q, record.answers[q.n]));
  list.innerHTML = filtered.length ? filtered.map((q,i)=>{
    const chosen = toArr(record.answers[q.n]);
    const cset = correctSet(q);
    return `<div style="padding:14px 0;border-bottom:1px solid var(--card-line);">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <span style="font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--ink-soft);">Câu #${q.n}</span>
        ${catTag(q.cat)}
      </div>
      <p style="font-weight:600;margin:4px 0 8px;">${escapeHtml(q.q)}</p>
      ${q.o.map((opt,oi)=>{
        let style='';
        if(cset.includes(oi)) style='color:var(--good);font-weight:600;';
        else if(chosen.includes(oi)) style='color:var(--bad);text-decoration:line-through;';
        return `<div style="font-size:13.5px;${style}">${'ABCD'[oi]||(oi+1)}. ${escapeHtml(opt)} ${cset.includes(oi)?'✓':(chosen.includes(oi)?'✗':'')}</div>`;
      }).join('')}
      ${chosen.length===0?'<div style="font-size:12px;color:var(--warn);margin-top:4px;">Bạn chưa chọn đáp án cho câu này.</div>':''}
      ${q.note ? `<div style="margin-top:8px;padding:6px 10px;background:#FAF5E8;border-left:3px solid var(--accent-safety);border-radius:4px;font-size:12.5px;">💡 ${escapeHtml(q.note)}</div>` : ''}
    </div>`;
  }).join('') : `<div class="empty-state">Không có câu nào để hiển thị.</div>`;
}

/* ============================================================
   REMINDER SETTINGS
   ============================================================ */
function renderReminderSettings(){
  const r = getReminder();
  const lastStudy = lsGet(LS_LASTSTUDY, null);
  const studiedToday = lastStudy === todayStr();
  const permState = (typeof Notification!=='undefined') ? Notification.permission : 'unsupported';

  app.innerHTML = `
    <div class="card">
      <div class="section-label">🔔 Nhắc nhở học bài</div>
      <p style="font-size:13.5px;color:var(--ink-soft);margin:8px 0 16px;">
        Đặt giờ mỗi ngày để app nhắc bạn học bài. Cách này hoạt động khi tab trình duyệt của app đang mở
        (kể cả chạy nền).
      </p>
      <div class="field" style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
        <label class="toggle-row" style="margin:0;">
          <input type="checkbox" id="remEnabled" ${r.enabled?'checked':''}> Bật nhắc nhở hằng ngày
        </label>
      </div>
      <div class="field" style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
        <label>Giờ nhắc mỗi ngày:
          <input type="time" id="remTime" value="${r.time||'20:00'}" ${!r.enabled?'disabled':''}>
        </label>
      </div>
      <div id="permNote" style="font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;"></div>
      <div class="quick-actions">
        <button class="btn btn-primary btn-sm" id="saveReminderBtn">Lưu cài đặt</button>
        <button class="btn btn-ghost btn-sm" id="testNotifyBtn">Gửi thử thông báo</button>
      </div>
    </div>
  `;

  renderPermNote();

  document.getElementById('remEnabled').onchange = (e)=>{
    document.getElementById('remTime').disabled = !e.target.checked;
  };
  document.getElementById('saveReminderBtn').onclick = async ()=>{
    const enabled = document.getElementById('remEnabled').checked;
    const time = document.getElementById('remTime').value || '20:00';
    if(enabled && typeof Notification!=='undefined' && Notification.permission==='default'){
      try{ await Notification.requestPermission(); }catch(e){}
    }
    saveReminder({enabled, time});
    renderReminderSettings();
  };
  document.getElementById('testNotifyBtn').onclick = async ()=>{
    if(typeof Notification==='undefined'){ alert('Trình duyệt không hỗ trợ Web Notification.'); return; }
    if(Notification.permission!=='granted'){
      try{ const p = await Notification.requestPermission(); if(p!=='granted') return; }catch(e){ return; }
    }
    try{
      new Notification('🔔 Giờ ôn thi Thẩm mỹ!', {
        body: 'Hôm nay bạn chưa học bài — hãy dành 10 phút làm vài câu hỏi nhé!',
        icon: ''
      });
    }catch(e){ alert('Không thể gửi thông báo: '+e.message); }
  };
}

function renderPermNote(){
  const el = document.getElementById('permNote');
  if(!el) return;
  if(typeof Notification==='undefined'){
    el.textContent = 'Trình duyệt này không hỗ trợ Web Notification.';
  } else if(Notification.permission==='granted'){
    el.textContent = '✓ Trình duyệt đã cho phép gửi thông báo.';
  } else if(Notification.permission==='denied'){
    el.textContent = '⚠️ Trình duyệt đang chặn thông báo. Hãy mở cài đặt trình duyệt để cho phép nếu bạn muốn nhận chuông nhắc.';
  } else {
    el.textContent = 'ℹ️ Trình duyệt sẽ hỏi xin quyền gửi thông báo khi bạn bật tính năng này.';
  }
}

function checkReminderTick(){
  const r = getReminder();
  if(!r.enabled) return;
  const now = new Date();
  const hm = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const today = todayStr();
  const lastStudy = lsGet(LS_LASTSTUDY, null);
  const lastNotify = lsGet(LS_LASTNOTIFY, null);

  if(lastStudy === today) return;
  if(lastNotify === today) return;
  if(hm !== r.time) return;

  lsSet(LS_LASTNOTIFY, today);
  if(typeof Notification!=='undefined' && Notification.permission==='granted'){
    try{
      new Notification('🔔 Giờ ôn thi Thẩm mỹ!', {
        body: 'Đến giờ học bài rồi! Làm nhanh 20 câu để duy trì phong độ nhé.',
        tag: 'cosmetology-study-daily'
      });
    }catch(e){}
  }
}

/* ============================================================
   HISTORY
   ============================================================ */
function renderHistory(){
  const hist = getHistory().slice().reverse();
  const p = getProgress();
  const attemptedCount = Object.keys(p).filter(n=>p[n]&&p[n].last!==null).length;
  let totalC=0, totalW=0;
  Object.values(p).forEach(rec=>{ totalC+=rec.c||0; totalW+=rec.w||0; });
  const overallAcc = (totalC+totalW)>0 ? totalC/(totalC+totalW) : 0;
  const cfg = getActiveBankConfig();

  app.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:14px;">
      <div>
        <div class="section-label">LỊCH SỬ THI & HỌC TẬP — ${cfg.name.toUpperCase()}</div>
      </div>
      <span class="bank-badge-new" style="background:${activeBankId==='bank_100'?'#B0453A':'var(--ink)'};">${cfg.badge}</span>
    </div>

    <div class="grid-3" style="margin-bottom:16px;">
      <div class="card stat-mini"><div class="num">${attemptedCount}/${TOTAL_Q}</div><div class="lbl">Câu đã luyện (${cfg.shortName})</div></div>
      <div class="card stat-mini"><div class="num">${fmtPct(overallAcc)}</div><div class="lbl">Độ chính xác chung</div></div>
      <div class="card stat-mini"><div class="num">${hist.length}</div><div class="lbl">Lần thi thử</div></div>
    </div>
    <div class="card">
      <div class="section-label">Lịch sử các lần thi thử (${cfg.shortName})</div>
      ${hist.length===0? `<div class="empty-state">Bạn chưa làm bài thi thử nào trong bộ đề này.</div>` : `
      <table class="hist">
        <thead><tr><th>Ngày</th><th>Điểm</th><th>Tỉ lệ</th><th>Kết quả</th><th></th></tr></thead>
        <tbody>
          ${hist.map(h=>`<tr>
            <td>${new Date(h.date).toLocaleString('vi-VN')}</td>
            <td>${h.scoredCorrect!==undefined?h.scoredCorrect:h.correctCount}/${h.scoredTotal||h.total}</td>
            <td>${fmtPct((h.scoredCorrect!==undefined?h.scoredCorrect:h.correctCount)/(h.scoredTotal||h.total))}</td>
            <td><span class="pill ${h.pass?'pass':'fail'}">${h.pass?'ĐẬU':'CHƯA ĐẬU'}</span></td>
            <td><button class="btn btn-sm btn-ghost" data-id="${h.id}">Xem lại</button></td>
          </tr>`).join('')}
        </tbody>
      </table>`}
    </div>
    <div class="card" style="margin-top:16px;">
      <div class="section-label">Mức độ thành thạo theo chủ đề (${cfg.shortName})</div>
      <div class="weak-list" style="margin-top:10px;">
        ${CAT_ORDER.map(c=>{
          const m = categoryMastery(c);
          return `<div class="weak-row">
            <div class="weak-name">${CATS[c]}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.round(m.mastery*100)}%;background:${accentHex(c)}"></div></div>
            <div class="weak-pct">${fmtPct(m.mastery)}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
  app.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{ transient.lastExamId=parseInt(b.dataset.id); navigate('#/exam/result'); });
}

/* ============================================================
   INIT
   ============================================================ */
async function initializeApp(){
  checkUrlSync();
  const existingCloudId = safeGetItem('cosmo_cloud_sync_id');
  if(existingCloudId){
    cloudPull(existingCloudId, true);
  }
  renderCountdown();
  renderBankSwitcher();
  route();
  checkReminderTick();
  if(!reminderIntervalStarted){ setInterval(checkReminderTick, 30000); reminderIntervalStarted=true; }

  const accBtn = document.getElementById('accountBtn');
  if(accBtn) accBtn.onclick = ()=> {
    if(isGuestUser()){
      showLoginModal('login');
    } else {
      showAuthModal();
    }
  };
  const accName = document.getElementById('accountName');
  if(accName){
    accName.style.cursor = 'pointer';
    accName.onclick = ()=> {
      if(isGuestUser()){
        showLoginModal('login');
      } else {
        showAuthModal();
      }
    };
  }
}

(async ()=>{
  await ensureSignedIn();
  await initializeApp();
})();

})();
</script>
