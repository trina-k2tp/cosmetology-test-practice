: "haircut", "sec": "4. Cắt tóc"}, {"n": 330, "q": "Dụng cụ kéo tỉa thưa (Thinning shears) tạo ra sự khác biệt gì so với kéo cắt thông thường?", "o": ["Có một lưỡi thẳng và một lưỡi có các răng cưa để tỉa mỏng tóc mà không cắt đứt toàn bộ", "Làm bằng chất liệu đồng", "Hai lưỡi đều có hình ziczac", "Không thể cắt đứt được tóc"], "c": 0, "raw": "Câu 330: Dụng cụ kéo tỉa thưa (Thinning shears) tạo ra sự khác biệt gì so với kéo cắt thông thường?\nA. Có một lưỡi thẳng và một lưỡi có các răng cưa để tỉa mỏng tóc mà không cắt đứt toàn bộ\nB. Làm bằng chất liệu đồng\nC. Hai lưỡi đều có hình ziczac\nD. Không thể cắt đứt được tóc\nĐáp án đúng: A\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 331, "q": "Thao tác đúc ngón tay cái quá sâu vào lỗ kéo cắt tóc sẽ dẫn đến hậu quả gì?", "o": ["Kéo cắt sắc bén hơn", "Giảm sự linh hoạt, hạn chế góc mở của lưỡi kéo và gây mỏi khớp tay", "Làm gãy lưỡi kéo", "Giúp cắt tóc nhanh gấp đôi"], "c": 1, "raw": "Câu 331: Thao tác đúc ngón tay cái quá sâu vào lỗ kéo cắt tóc sẽ dẫn đến hậu quả gì?\nA. Kéo cắt sắc bén hơn\nB. Giảm sự linh hoạt, hạn chế góc mở của lưỡi kéo và gây mỏi khớp tay\nC. Làm gãy lưỡi kéo\nD. Giúp cắt tóc nhanh gấp đôi\nĐáp án đúng: B\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 332, "q": "Dụng cụ dũa chân (Foot file) trong dịch vụ làm móng chân (Pedicure) được sử dụng để:", "o": ["Dũa ngắn móng chân", "Chà mịn và làm giảm các mảng da chai sần (Callus) ở gót chân", "Cắt khóe móng", "Lấy đi lớp biểu bì"], "c": 1, "raw": "Câu 332: Dụng cụ dũa chân (Foot file) trong dịch vụ làm móng chân (Pedicure) được sử dụng để:\nA. Dũa ngắn móng chân\nB. Chà mịn và làm giảm các mảng da chai sần (Callus) ở gót chân\nC. Cắt khóe móng\nD. Lấy đi lớp biểu bì\nĐáp án đúng: B\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 333, "q": "Đèn sấy Gel (UV/LED lamp) có tác dụng gì đối với cấu trúc của lớp sơn Gel?", "o": ["Tẩy sạch lớp keo dính", "Kích hoạt phản ứng quang trùng hợp làm cứng và khô hoàn toàn lớp gel", "Làm mờ màu sơn", "Làm mềm móng"], "c": 1, "raw": "Câu 333: Đèn sấy Gel (UV/LED lamp) có tác dụng gì đối với cấu trúc của lớp sơn Gel?\nA. Tẩy sạch lớp keo dính\nB. Kích hoạt phản ứng quang trùng hợp làm cứng và khô hoàn toàn lớp gel\nC. Làm mờ màu sơn\nD. Làm mềm móng\nĐáp án đúng: B\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 334, "q": "Bôi thuốc duỗi tóc kiềm cao (Relaxer) nên bôi vào khu vực nào của sợi tóc đầu tiên?", "o": ["Bôi sát vào da đầu", "Bôi vào phần tóc kháng thuốc nhất / ít thấm hóa chất nhất (thường là thân tóc phía sau gáy)", "Bôi vào ngọn tóc chẻ ngọn trước", "Bôi vào phần tóc mái mỏng"], "c": 1, "raw": "Câu 334: Bôi thuốc duỗi tóc kiềm cao (Relaxer) nên bôi vào khu vực nào của sợi tóc đầu tiên?\nA. Bôi sát vào da đầu\nB. Bôi vào phần tóc kháng thuốc nhất / ít thấm hóa chất nhất (thường là thân tóc phía sau gáy)\nC. Bôi vào ngọn tóc chẻ ngọn trước\nD. Bôi vào phần tóc mái mỏng\nĐáp án đúng: B\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 335, "q": "Khi thực hiện dịch vụ uốn tóc cho khách có tiền sử dị ứng, người thợ cần tránh:", "o": ["Dùng khăn choàng", "Để dung dịch thuốc uốn tiếp xúc trực tiếp vào da đầu và mặt của khách", "Gội đầu trước khi uốn", "Dùng lược chải tóc"], "c": 1, "raw": "Câu 335: Khi thực hiện dịch vụ uốn tóc cho khách có tiền sử dị ứng, người thợ cần tránh:\nA. Dùng khăn choàng\nB. Để dung dịch thuốc uốn tiếp xúc trực tiếp vào da đầu và mặt của khách\nC. Gội đầu trước khi uốn\nD. Dùng lược chải tóc\nĐáp án đúng: B\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 336, "q": "Dung dịch cồn (Alcohol) dùng trong quy trình làm móng Gel có tác dụng gì ở bước hoàn thiện?", "o": ["Làm tan móng giả", "Lau sạch lớp màng dính nhờn cặn sót lại (Inhibition layer) trên bề mặt gel sau khi hơ đèn", "Làm lớp gel mềm ra", "Thay thế lớp sơn lót"], "c": 1, "raw": "Câu 336: Dung dịch cồn (Alcohol) dùng trong quy trình làm móng Gel có tác dụng gì ở bước hoàn thiện?\nA. Làm tan móng giả\nB. Lau sạch lớp màng dính nhờn cặn sót lại (Inhibition layer) trên bề mặt gel sau khi hơ đèn\nC. Làm lớp gel mềm ra\nD. Thay thế lớp sơn lót\nĐáp án đúng: B\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 337, "q": "Bề mặt da khỏe mạnh tự nhiên có lớp màng bảo vệ mang tính chất gì?", "o": ["Tính kiềm mạnh", "Tính acid nhẹ (Màng acid mantle giúp chống khuẩn)", "Hoàn toàn trung tính", "Tính dầu nhờn đặc quánh"], "c": 1, "raw": "Câu 337: Bề mặt da khỏe mạnh tự nhiên có lớp màng bảo vệ mang tính chất gì?\nA. Tính kiềm mạnh\nB. Tính acid nhẹ (Màng acid mantle giúp chống khuẩn)\nC. Hoàn toàn trung tính\nD. Tính dầu nhờn đặc quánh\nĐáp án đúng: B\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 338, "q": "Sản phẩm dán mí hoặc băng keo che chắn vùng mắt khi trang điểm cần được kiểm tra để tránh:", "o": ["Làm bay màu phấn mắt", "Làm tổn thương, trầy xước lớp da mỏng manh quanh vùng mắt của khách", "Làm mi giả nhanh rụng", "Làm cay mũi"], "c": 1, "raw": "Câu 338: Sản phẩm dán mí hoặc băng keo che chắn vùng mắt khi trang điểm cần được kiểm tra để tránh:\nA. Làm bay màu phấn mắt\nB. Làm tổn thương, trầy xước lớp da mỏng manh quanh vùng mắt của khách\nC. Làm mi giả nhanh rụng\nD. Làm cay mũi\nĐáp án đúng: B\n\n", "cat": "lash_brow", "sec": "8. Lông mi và lông mày"}, {"n": 339, "q": "Cắt tóc theo kỹ thuật \"Point cutting\" (Cắt điểm bằng mũi kéo) có tác dụng gì?", "o": ["Cắt cụt đuôi tóc theo đường thẳng ngang", "Làm mềm ngọn tóc, tạo độ liên kết và loại bỏ bớt trọng lượng ở đuôi tóc", "Cắt sát da đầu", "Làm xoăn tóc tự nhiên"], "c": 1, "raw": "Câu 339: Cắt tóc theo kỹ thuật \"Point cutting\" (Cắt điểm bằng mũi kéo) có tác dụng gì?\nA. Cắt cụt đuôi tóc theo đường thẳng ngang\nB. Làm mềm ngọn tóc, tạo độ liên kết và loại bỏ bớt trọng lượng ở đuôi tóc\nC. Cắt sát da đầu\nD. Làm xoăn tóc tự nhiên\nĐáp án đúng: B\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 340, "q": "Sau khi thực hiện xong dịch vụ tẩy lông chân bằng sáp, người thợ nên bôi sản phẩm gì lên da khách?", "o": ["Cồn 90 độ", "Nước hoa có cồn", "Lotion dưỡng làm dịu mát da hoặc dầu chuyên dụng làm sạch sáp dính", "Nước nóng"], "c": 2, "raw": "Câu 340: Sau khi thực hiện xong dịch vụ tẩy lông chân bằng sáp, người thợ nên bôi sản phẩm gì lên da khách?\nA. Cồn 90 độ\nB. Nước hoa có cồn\nC. Lotion dưỡng làm dịu mát da hoặc dầu chuyên dụng làm sạch sáp dính\nD. Nước nóng\nĐáp án đúng: C\n\n", "cat": "waxing", "sec": "9. Triệt lông"}, {"n": 341, "q": "Kỹ thuật kiểm tra chéo (Cross-check) cho một mái tóc đã được cắt theo phân khu đường dọc (Vertical lines) là:", "o": ["Nâng các tép tóc theo đường chia ngang (Horizontal lines) để đối chiếu độ đều", "Dùng kéo tỉa bấm ngang", "Sấy khô kiểm tra bằng mắt", "Chải tóc hết về phía trước mặt"], "c": 0, "raw": "Câu 341: Kỹ thuật kiểm tra chéo (Cross-check) cho một mái tóc đã được cắt theo phân khu đường dọc (Vertical lines) là:\nA. Nâng các tép tóc theo đường chia ngang (Horizontal lines) để đối chiếu độ đều\nB. Dùng kéo tỉa bấm ngang\nC. Sấy khô kiểm tra bằng mắt\nD. Chải tóc hết về phía trước mặt\nĐáp án đúng: A\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 342, "q": "Sợi tóc bị mất đi lớp biểu bì bảo vệ bên ngoài (Cuticle bị hư hại hoàn toàn) sẽ có biểu hiện gì?", "o": ["Tóc bóng mượt như tơ", "Tóc trở nên xơ xác, khô ráp, rất dễ gãy đứt và mất khả năng giữ ẩm", "Tóc tự động mọc dài nhanh hơn", "Tóc đen đậm hơn"], "c": 1, "raw": "Câu 342: Sợi tóc bị mất đi lớp biểu bì bảo vệ bên ngoài (Cuticle bị hư hại hoàn toàn) sẽ có biểu hiện gì?\nA. Tóc bóng mượt như tơ\nB. Tóc trở nên xơ xác, khô ráp, rất dễ gãy đứt và mất khả năng giữ ẩm\nC. Tóc tự động mọc dài nhanh hơn\nD. Tóc đen đậm hơn\nĐáp án đúng: B\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 343, "q": "Khách hàng có tiền sử dị ứng với hóa chất làm tóc thì bước xử lý an toàn nhất của thợ là:", "o": ["Pha loãng thuốc với nước lọc", "Thực hiện bài kiểm tra dị ứng trên một vùng da nhỏ (Patch test) trước 24 đến 48 giờ", "Vẫn bôi thuốc bình thường và cho uống thuốc dị ứng", "Dùng máy sấy lạnh thổi liên tục"], "c": 1, "raw": "Câu 343: Khách hàng có tiền sử dị ứng với hóa chất làm tóc thì bước xử lý an toàn nhất của thợ là:\nA. Pha loãng thuốc với nước lọc\nB. Thực hiện bài kiểm tra dị ứng trên một vùng da nhỏ (Patch test) trước 24 đến 48 giờ\nC. Vẫn bôi thuốc bình thường và cho uống thuốc dị ứng\nD. Dùng máy sấy lạnh thổi liên tục\nĐáp án đúng: B\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 344, "q": "Dụng cụ nào sau đây bắt buộc phải được khử trùng bằng hóa chất sau mỗi một lượt khách hàng?", "o": ["Miếng bọt biển rửa mặt", "Cây que gỗ cam đẩy da chết", "Kềm bấm móng, kéo cắt tóc, lược nhựa", "Giấy vệ sinh cổ áo"], "c": 2, "raw": "Câu 344: Dụng cụ nào sau đây bắt buộc phải được khử trùng bằng hóa chất sau mỗi một lượt khách hàng?\nA. Miếng bọt biển rửa mặt\nB. Cây que gỗ cam đẩy da chết\nC. Kềm bấm móng, kéo cắt tóc, lược nhựa\nD. Giấy vệ sinh cổ áo\nĐáp án đúng: C\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 345, "q": "Động tác massage nào có tác dụng làm dịu thần kinh và thường dùng để mở đầu hoặc kết thúc một bài massage mặt?", "o": ["Vỗ tát mạnh (Tapotement)", "Vuốt nhẹ nhàng, êm dịu (Effleurage)", "Nhào bóp sâu (Petrissage)", "Rung lắc cơ thể (Vibration)"], "c": 1, "raw": "Câu 345: Động tác massage nào có tác dụng làm dịu thần kinh và thường dùng để mở đầu hoặc kết thúc một bài massage mặt?\nA. Vỗ tát mạnh (Tapotement)\nB. Vuốt nhẹ nhàng, êm dịu (Effleurage)\nC. Nhào bóp sâu (Petrissage)\nD. Rung lắc cơ thể (Vibration)\nĐáp án đúng: B\n\n", "cat": "skincare", "sec": "7. Chăm sóc da"}, {"n": 346, "q": "Sự tích tụ của các tế bào biểu bì chết kết hợp với bã nhờn khô cứng ở lỗ chân lông tạo nên:", "o": ["Mụn đầu đen (Comedone)", "Khối u ác tính", "Mụn nước mủ", "Nốt tàn nhang"], "c": 0, "raw": "Câu 346: Sự tích tụ của các tế bào biểu bì chết kết hợp với bã nhờn khô cứng ở lỗ chân lông tạo nên:\nA. Mụn đầu đen (Comedone)\nB. Khối u ác tính\nC. Mụn nước mủ\nD. Nốt tàn nhang\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 347, "q": "Tóc mọc không đều hướng ở vùng xoáy đầu (Cowlick) khi cắt cần chú ý điều gì?", "o": ["Cắt thật sát da đầu", "Để lại chiều dài tóc dài hơn một chút và không kéo quá căng khi cắt để tránh tóc bị vểnh", "Cắt bằng dao cạo thật mỏng", "Cạo trọc vùng xoáy"], "c": 1, "raw": "Câu 347: Tóc mọc không đều hướng ở vùng xoáy đầu (Cowlick) khi cắt cần chú ý điều gì?\nA. Cắt thật sát da đầu\nB. Để lại chiều dài tóc dài hơn một chút và không kéo quá căng khi cắt để tránh tóc bị vểnh\nC. Cắt bằng dao cạo thật mỏng\nD. Cạo trọc vùng xoáy\nĐáp án đúng: B\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 348, "q": "Cơ quan liên bang OSHA ban hành các quy định tại nơi làm việc nhằm mục đích tối thượng nào?", "o": ["Quản lý mức thuế kinh doanh của tiệm", "Đảm bảo an toàn và bảo vệ sức khỏe cho người lao động", "Định giá dịch vụ làm tóc", "Cấp phép lưu hành mỹ phẩm"], "c": 1, "raw": "Câu 348: Cơ quan liên bang OSHA ban hành các quy định tại nơi làm việc nhằm mục đích tối thượng nào?\nA. Quản lý mức thuế kinh doanh của tiệm\nB. Đảm bảo an toàn và bảo vệ sức khỏe cho người lao động\nC. Định giá dịch vụ làm tóc\nD. Cấp phép lưu hành mỹ phẩm\nĐáp án đúng: B\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 349, "q": "Tại sao một hóa chất khử trùng dùng trong salon phải có số đăng ký xác nhận của EPA?", "o": ["Để xác nhận sản phẩm đã được kiểm nghiệm an toàn môi trường và có hiệu quả diệt khuẩn theo chứng nhận", "Để được giảm thuế khi mua", "Để chứng minh hóa chất có thể uống được", "Để dùng thay thế xà phòng tắm"], "c": 0, "raw": "Câu 349: Tại sao một hóa chất khử trùng dùng trong salon phải có số đăng ký xác nhận của EPA?\nA. Để xác nhận sản phẩm đã được kiểm nghiệm an toàn môi trường và có hiệu quả diệt khuẩn theo chứng nhận\nB. Để được giảm thuế khi mua\nC. Để chứng minh hóa chất có thể uống được\nD. Để dùng thay thế xà phòng tắm\nĐáp án đúng: A\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 350, "q": "Bảng dữ liệu an toàn SDS (Safety Data Sheet) cung cấp đầy đủ thông tin nào sau đây?", "o": ["Giá bán lẻ của sản phẩm", "Ngày hết hạn của từng lô hàng", "Thành phần hóa chất, nguy cơ độc hại, biện pháp sơ cứu và cách bảo quản xử lý an toàn", "Doanh thu của nhà sản xuất"], "c": 2, "raw": "Câu 350: Bảng dữ liệu an toàn SDS (Safety Data Sheet) cung cấp đầy đủ thông tin nào sau đây?\nA. Giá bán lẻ của sản phẩm\nB. Ngày hết hạn của từng lô hàng\nC. Thành phần hóa chất, nguy cơ độc hại, biện pháp sơ cứu và cách bảo quản xử lý an toàn\nD. Doanh thu của nhà sản xuất\nĐáp án đúng: C\n\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 351, "q": "Khi tiếp xúc với các hóa chất uốn, duỗi, tẩy nhuộm nồng độ cao, thiết bị PPE bắt buộc bao gồm:", "o": ["Nón bảo hiểm", "Găng tay bảo vệ và kính bảo hộ mắt chuyên dụng", "Khẩu trang vải mỏng", "Áo mưa"], "c": 1, "raw": "Câu 351: Khi tiếp xúc với các hóa chất uốn, duỗi, tẩy nhuộm nồng độ cao, thiết bị PPE bắt buộc bao gồm:\nA. Nón bảo hiểm\nB. Găng tay bảo vệ và kính bảo hộ mắt chuyên dụng\nC. Khẩu trang vải mỏng\nD. Áo mưa\nĐáp án đúng: B\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 352, "q": "Tại sao FDA nghiêm cấm việc sử dụng hoạt chất MMA (Methyl Methacrylate) trong ngành đắp móng?", "o": ["Vì bột quá mềm không giữ được form", "Vì gây tổn thương nặng móng thật, độ bám quá cứng gây rách nền móng và gây dị ứng độc hại cao", "Vì giá thành quá đắt đỏ", "Vì làm móng mọc quá nhanh"], "c": 1, "raw": "Câu 352: Tại sao FDA nghiêm cấm việc sử dụng hoạt chất MMA (Methyl Methacrylate) trong ngành đắp móng?\nA. Vì bột quá mềm không giữ được form\nB. Vì gây tổn thương nặng móng thật, độ bám quá cứng gây rách nền móng và gây dị ứng độc hại cao\nC. Vì giá thành quá đắt đỏ\nD. Vì làm móng mọc quá nhanh\nĐáp án đúng: B\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 353, "q": "Monomer Liquid (ML) và Polymer Powder (PP) kết hợp lại với nhau sẽ diễn ra phản ứng gì?", "o": ["Phản ứng đông cứng trùng hợp tạo nên móng nhân tạo acrylic (Polymerization)", "Phản ứng bay hơi hoàn toàn", "Phản ứng phân hủy móng thật", "Phản ứng tạo bọt xà phòng"], "c": 0, "raw": "Câu 353: Monomer Liquid (ML) và Polymer Powder (PP) kết hợp lại với nhau sẽ diễn ra phản ứng gì?\nA. Phản ứng đông cứng trùng hợp tạo nên móng nhân tạo acrylic (Polymerization)\nB. Phản ứng bay hơi hoàn toàn\nC. Phản ứng phân hủy móng thật\nD. Phản ứng tạo bọt xà phòng\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 354, "q": "Lớp nào trong 5 lớp của biểu bì da liên tục sản sinh ra tế bào mới thông qua quá trình phân bào?", "o": ["Lớp sừng (Stratum Corneum)", "Lớp gai (Stratum Spinosum)", "Lớp mầm (Stratum Germinativum / Basale)", "Lớp hạt (Stratum Granulosum)"], "c": 2, "raw": "Câu 354: Lớp nào trong 5 lớp của biểu bì da liên tục sản sinh ra tế bào mới thông qua quá trình phân bào?\nA. Lớp sừng (Stratum Corneum)\nB. Lớp gai (Stratum Spinosum)\nC. Lớp mầm (Stratum Germinativum / Basale)\nD. Lớp hạt (Stratum Granulosum)\nĐáp án đúng: C\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 355, "q": "Tuyến bã nhờn (Sebaceous gland) bài tiết Sebum (dầu) nối liền trực tiếp vào bộ phận nào?", "o": ["Móng tay", "Nang lông / Nang tóc", "Tuyến nước bọt", "Lớp sừng ngoài cùng"], "c": 1, "raw": "Câu 355: Tuyến bã nhờn (Sebaceous gland) bài tiết Sebum (dầu) nối liền trực tiếp vào bộ phận nào?\nA. Móng tay\nB. Nang lông / Nang tóc\nC. Tuyến nước bọt\nD. Lớp sừng ngoài cùng\nĐáp án đúng: B\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 356, "q": "Keratin là một loại protein dạng sợi có vai trò cấu trúc nền tảng cho:", "o": ["Cơ bắp và mạch máu", "Tóc và móng tay móng chân", "Răng và xương", "Các hạch bạch huyết"], "c": 1, "raw": "Câu 356: Keratin là một loại protein dạng sợi có vai trò cấu trúc nền tảng cho:\nA. Cơ bắp và mạch máu\nB. Tóc và móng tay móng chân\nC. Răng và xương\nD. Các hạch bạch huyết\nĐáp án đúng: B\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 357, "q": "Lớp biểu bì sợi tóc (Cuticle) có tính chất quyết định đến yếu tố nào của sợi tóc?", "o": ["Màu sắc tự nhiên của tóc", "Độ xốp (Porosity) và khả năng hấp thụ độ ẩm, hóa chất của sợi tóc", "Độ quăn bẩm sinh", "Chiều dài tối đa của sợi tóc"], "c": 1, "raw": "Câu 357: Lớp biểu bì sợi tóc (Cuticle) có tính chất quyết định đến yếu tố nào của sợi tóc?\nA. Màu sắc tự nhiên của tóc\nB. Độ xốp (Porosity) và khả năng hấp thụ độ ẩm, hóa chất của sợi tóc\nC. Độ quăn bẩm sinh\nD. Chiều dài tối đa của sợi tóc\nĐáp án đúng: B\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 358, "q": "Lớp thân tóc (Cortex) là trung tâm của mọi dịch vụ làm tóc chuyên nghiệp vì:", "o": ["Là nơi duy nhất tiếp xúc với nước xả", "Chứa 90% trọng lượng sợi tóc, chứa sắc tố melanin và các liên kết hóa học quyết định độ đàn hồi, hình dáng tóc", "Là lớp vảy bảo vệ ngoài cùng", "Giúp tóc chống lại trọng lực"], "c": 1, "raw": "Câu 358: Lớp thân tóc (Cortex) là trung tâm của mọi dịch vụ làm tóc chuyên nghiệp vì:\nA. Là nơi duy nhất tiếp xúc với nước xả\nB. Chứa 90% trọng lượng sợi tóc, chứa sắc tố melanin và các liên kết hóa học quyết định độ đàn hồi, hình dáng tóc\nC. Là lớp vảy bảo vệ ngoài cùng\nD. Giúp tóc chống lại trọng lực\nĐáp án đúng: B\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 359, "q": "Sự khác nhau cơ bản giữa Eumelanin và Pheomelanin là gì?", "o": ["Eumelanin quyết định màu đỏ; Pheomelanin quyết định màu đen", "Eumelanin tạo sắc tố đen và nâu; Pheomelanin tạo sắc tố đỏ và vàng hoe", "Eumelanin chỉ có ở móng tay", "Cả hai đều biến mất khi sấy tóc"], "c": 1, "raw": "Câu 359: Sự khác nhau cơ bản giữa Eumelanin và Pheomelanin là gì?\nA. Eumelanin quyết định màu đỏ; Pheomelanin quyết định màu đen\nB. Eumelanin tạo sắc tố đen và nâu; Pheomelanin tạo sắc tố đỏ và vàng hoe\nC. Eumelanin chỉ có ở móng tay\nD. Cả hai đều biến mất khi sấy tóc\nĐáp án đúng: B\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 360, "q": "Cắt phạm vào lớp mô Hyponychium dưới đầu móng tự nhiên sẽ gây ra hậu quả gì?", "o": ["Làm móng mọc chậm lại", "Gây đau đớn dữ dội, chảy máu và mở đường cho vi khuẩn xâm nhập gây nhiễm trùng nền móng", "Giúp sơn móng bền hơn", "Không gây bất kỳ ảnh hưởng nào"], "c": 1, "raw": "Câu 360: Cắt phạm vào lớp mô Hyponychium dưới đầu móng tự nhiên sẽ gây ra hậu quả gì?\nA. Làm móng mọc chậm lại\nB. Gây đau đớn dữ dội, chảy máu và mở đường cho vi khuẩn xâm nhập gây nhiễm trùng nền móng\nC. Giúp sơn móng bền hơn\nD. Không gây bất kỳ ảnh hưởng nào\nĐáp án đúng: B\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 361, "q": "Lớp da Eponychium khác với màng tế bào chết Cuticle ở điểm nào?", "o": ["Eponychium là phần da sống ở gốc móng, không được phép cắt bỏ; Cuticle là lớp vảy tế bào chết bám trên thân móng có thể đẩy sạch", "Eponychium luôn bị cắt bỏ hoàn toàn", "Eponychium nằm dưới đầu móng tự do", "Cuticle chứa mạch máu"], "c": 0, "raw": "Câu 361: Lớp da Eponychium khác với màng tế bào chết Cuticle ở điểm nào?\nA. Eponychium là phần da sống ở gốc móng, không được phép cắt bỏ; Cuticle là lớp vảy tế bào chết bám trên thân móng có thể đẩy sạch\nB. Eponychium luôn bị cắt bỏ hoàn toàn\nC. Eponychium nằm dưới đầu móng tự do\nD. Cuticle chứa mạch máu\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 362, "q": "Mộng thịt móng tay (Nail Pterygium) hình thành do tình trạng nào?", "o": ["Do sơn móng màu đậm", "Da viền móng hoặc eponychium bị tổn thương dính chặt bất thường và phát triển bò chồm lên mặt móng", "Do dũa móng quá vuông", "Do thiếu canxi"], "c": 1, "raw": "Câu 362: Mộng thịt móng tay (Nail Pterygium) hình thành do tình trạng nào?\nA. Do sơn móng màu đậm\nB. Da viền móng hoặc eponychium bị tổn thương dính chặt bất thường và phát triển bò chồm lên mặt móng\nC. Do dũa móng quá vuông\nD. Do thiếu canxi\nĐáp án đúng: B\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 363, "q": "Một người thợ có vết xước măng rô (Hangnail), để đảm bảo an toàn vệ sinh khi phục vụ khách, thợ phải làm gì?", "o": ["Nhúng tay vào acetone", "Băng kín vết xước lại và luôn mang găng tay bảo hộ trong suốt quá trình phục vụ", "Cắt da sâu hơn cho hết xước", "Thoa nước sơn móng lên vết xước"], "c": 1, "raw": "Câu 363: Một người thợ có vết xước măng rô (Hangnail), để đảm bảo an toàn vệ sinh khi phục vụ khách, thợ phải làm gì?\nA. Nhúng tay vào acetone\nB. Băng kín vết xước lại và luôn mang găng tay bảo hộ trong suốt quá trình phục vụ\nC. Cắt da sâu hơn cho hết xước\nD. Thoa nước sơn móng lên vết xước\nĐáp án đúng: B\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 364, "q": "Điểm khác biệt mấu chốt giữa Mụn nhọt (Boil) và Mụn mủ (Pustule) là gì?", "o": ["Mụn nhọt là ổ nhiễm trùng sâu ở nang lông chứa mủ và đau nhức; Mụn mủ là tổn thương bề mặt biểu bì chứa dịch mủ viêm", "Mụn nhọt do virus gây ra", "Mụn mủ không bao giờ có vi khuẩn", "Cả hai đều do cháy nắng"], "c": 0, "raw": "Câu 364: Điểm khác biệt mấu chốt giữa Mụn nhọt (Boil) và Mụn mủ (Pustule) là gì?\nA. Mụn nhọt là ổ nhiễm trùng sâu ở nang lông chứa mủ và đau nhức; Mụn mủ là tổn thương bề mặt biểu bì chứa dịch mủ viêm\nB. Mụn nhọt do virus gây ra\nC. Mụn mủ không bao giờ có vi khuẩn\nD. Cả hai đều do cháy nắng\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 365, "q": "Các vết rãnh ngang trên mặt móng (Beau's lines) thường phản ánh điều gì về sức khỏe khách hàng?", "o": ["Khách hàng vừa đi bơi nhiều", "Cơ thể từng trải qua một cơn bạo bệnh nặng hoặc chấn thương làm ngừng trệ tạm thời sự phát triển của mầm móng", "Khách hàng sử dụng kem dưỡng tay quá nhiều", "Dấu hiệu của sự lão hóa thông thường"], "c": 1, "raw": "Câu 365: Các vết rãnh ngang trên mặt móng (Beau's lines) thường phản ánh điều gì về sức khỏe khách hàng?\nA. Khách hàng vừa đi bơi nhiều\nB. Cơ thể từng trải qua một cơn bạo bệnh nặng hoặc chấn thương làm ngừng trệ tạm thời sự phát triển của mầm móng\nC. Khách hàng sử dụng kem dưỡng tay quá nhiều\nD. Dấu hiệu của sự lão hóa thông thường\nĐáp án đúng: B\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 366, "q": "Tại sao salon thẩm mỹ bắt buộc phải từ chối khách hàng bị bệnh truyền nhiễm (Contagious disease)?", "o": ["Vì thợ không có thời gian", "Để ngăn ngừa sự lây nhiễm chéo cho thợ và các khách hàng khác trong môi trường dịch vụ công cộng", "Vì luật cấm người ốm ra đường", "Vì dịch vụ sẽ không có hiệu quả"], "c": 1, "raw": "Câu 366: Tại sao salon thẩm mỹ bắt buộc phải từ chối khách hàng bị bệnh truyền nhiễm (Contagious disease)?\nA. Vì thợ không có thời gian\nB. Để ngăn ngừa sự lây nhiễm chéo cho thợ và các khách hàng khác trong môi trường dịch vụ công cộng\nC. Vì luật cấm người ốm ra đường\nD. Vì dịch vụ sẽ không có hiệu quả\nĐáp án đúng: B\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 367, "q": "Nhiễm trùng khu trú (Local infection) có dấu hiệu nhận biết điển hình là gì?", "o": ["Rụng tóc toàn bộ cơ thể", "Vùng tổn thương xuất hiện một ổ sưng đỏ, nóng, đau và có chứa dịch mủ tại chỗ", "Sốt cao toàn thân hôn mê", "Da chuyển sang màu xanh"], "c": 1, "raw": "Câu 367: Nhiễm trùng khu trú (Local infection) có dấu hiệu nhận biết điển hình là gì?\nA. Rụng tóc toàn bộ cơ thể\nB. Vùng tổn thương xuất hiện một ổ sưng đỏ, nóng, đau và có chứa dịch mủ tại chỗ\nC. Sốt cao toàn thân hôn mê\nD. Da chuyển sang màu xanh\nĐáp án đúng: B\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 368, "q": "Tại sao việc khử trùng không thể thay thế hoàn toàn cho việc tiệt trùng bằng nồi hấp (Autoclave)?", "o": ["Vì hóa chất khử trùng đắt tiền hơn", "Vì hóa chất khử trùng không thể tiêu diệt được vỏ bọc bào tử cứng cáp của vi khuẩn kháng thuốc", "Vì nồi hấp làm hỏng dụng cụ kim loại", "Vì khử trùng làm đổi màu đồ nghề"], "c": 1, "raw": "Câu 368: Tại sao việc khử trùng không thể thay thế hoàn toàn cho việc tiệt trùng bằng nồi hấp (Autoclave)?\nA. Vì hóa chất khử trùng đắt tiền hơn\nB. Vì hóa chất khử trùng không thể tiêu diệt được vỏ bọc bào tử cứng cáp của vi khuẩn kháng thuốc\nC. Vì nồi hấp làm hỏng dụng cụ kim loại\nD. Vì khử trùng làm đổi màu đồ nghề\nĐáp án đúng: B\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 369, "q": "Phân biệt sự khác nhau cơ bản giữa Antiseptic và Disinfectant:", "o": ["Antiseptic dùng trên bề mặt bàn ghế; Disinfectant bôi lên da", "Antiseptic an toàn dùng trên da mô sống; Disinfectant có nồng độ độc hại cao chỉ dùng trên bề mặt dụng cụ vô tri", "Cả hai chất đều dùng để gội đầu", "Disinfectant có thể uống được"], "c": 1, "raw": "Câu 369: Phân biệt sự khác nhau cơ bản giữa Antiseptic và Disinfectant:\nA. Antiseptic dùng trên bề mặt bàn ghế; Disinfectant bôi lên da\nB. Antiseptic an toàn dùng trên da mô sống; Disinfectant có nồng độ độc hại cao chỉ dùng trên bề mặt dụng cụ vô tri\nC. Cả hai chất đều dùng để gội đầu\nD. Disinfectant có thể uống được\nĐáp án đúng: B\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 370, "q": "Khi nào một chiếc kềm cắt da (Nipper) được coi là đã khử trùng đúng chuẩn y tế?", "o": ["Khi được lau qua bằng cồn 70 độ", "Sau khi đã rửa sạch xà phòng, lau khô và ngâm chìm hoàn toàn trong dung dịch khử trùng Quats theo đúng thời gian quy định", "Khi hơ qua ngọn lửa diêm", "Khi cất vào ngăn kéo tủ"], "c": 1, "raw": "Câu 370: Khi nào một chiếc kềm cắt da (Nipper) được coi là đã khử trùng đúng chuẩn y tế?\nA. Khi được lau qua bằng cồn 70 độ\nB. Sau khi đã rửa sạch xà phòng, lau khô và ngâm chìm hoàn toàn trong dung dịch khử trùng Quats theo đúng thời gian quy định\nC. Khi hơ qua ngọn lửa diêm\nD. Khi cất vào ngăn kéo tủ\nĐáp án đúng: B\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 371, "q": "Tại sao các vật liệu có lỗ xốp xài một lần (Disposable) khi dính máu bắt buộc phải bỏ vào 2 lớp túi nilon dán nhãn?", "o": ["Để tránh rò rỉ mầm bệnh lây qua đường máu (HIV, HBV) ra môi trường xung quanh và bảo vệ người thu gom rác", "Để tiết kiệm túi rác", "Để đem đi giặt tẩy dùng lại", "Để gửi trả về cho nhà sản xuất"], "c": 0, "raw": "Câu 371: Tại sao các vật liệu có lỗ xốp xài một lần (Disposable) khi dính máu bắt buộc phải bỏ vào 2 lớp túi nilon dán nhãn?\nA. Để tránh rò rỉ mầm bệnh lây qua đường máu (HIV, HBV) ra môi trường xung quanh và bảo vệ người thu gom rác\nB. Để tiết kiệm túi rác\nC. Để đem đi giặt tẩy dùng lại\nD. Để gửi trả về cho nhà sản xuất\nĐáp án đúng: A\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 372, "q": "Tại sao việc làm sạch bằng xà phòng và nước là bước tiên quyết KHÔNG THỂ BỎ QUA trước khi khử trùng?", "o": ["Để làm dụng cụ thơm tho hơn", "Vì dầu mỡ, chất bẩn hữu cơ bám trên dụng cụ sẽ vô hiệu hóa và làm mất hoạt tính của hóa chất khử trùng", "Để làm mềm thép dụng cụ", "Vì đây là bước bắt buộc của khách hàng"], "c": 1, "raw": "Câu 372: Tại sao việc làm sạch bằng xà phòng và nước là bước tiên quyết KHÔNG THỂ BỎ QUA trước khi khử trùng?\nA. Để làm dụng cụ thơm tho hơn\nB. Vì dầu mỡ, chất bẩn hữu cơ bám trên dụng cụ sẽ vô hiệu hóa và làm mất hoạt tính của hóa chất khử trùng\nC. Để làm mềm thép dụng cụ\nD. Vì đây là bước bắt buộc của khách hàng\nĐáp án đúng: B\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 373, "q": "Hoạt chất Sodium Hydroxide (Lye) trong thuốc duỗi tóc phá hủy sợi tóc như thế nào nếu sử dụng sai kỹ thuật?", "o": ["Làm tóc mọc dài không kiểm soát", "Làm tan chảy lớp biểu bì, đứt gãy hoàn toàn chuỗi keratin và gây bỏng hóa chất nặng cho da đầu", "Làm tóc lập tức biến thành màu bạch kim", "Không gây bất kỳ tác hại nào"], "c": 1, "raw": "Câu 373: Hoạt chất Sodium Hydroxide (Lye) trong thuốc duỗi tóc phá hủy sợi tóc như thế nào nếu sử dụng sai kỹ thuật?\nA. Làm tóc mọc dài không kiểm soát\nB. Làm tan chảy lớp biểu bì, đứt gãy hoàn toàn chuỗi keratin và gây bỏng hóa chất nặng cho da đầu\nC. Làm tóc lập tức biến thành màu bạch kim\nD. Không gây bất kỳ tác hại nào\nĐáp án đúng: B\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 374, "q": "Điểm khác biệt cơ bản giữa cơ chế uốn tóc bằng thuốc Kiềm (Alkaline) và thuốc Acid là gì?", "o": ["Thuốc kiềm xử lý ở nhiệt độ phòng tạo lọn xoăn chặt; thuốc acid thường cần kích nhiệt và cho lọn sóng mềm mại hơn", "Thuốc acid làm đứt vĩnh viễn liên kết disulfide", "Thuốc kiềm có tính acid cao", "Thuốc acid luôn làm cháy da đầu"], "c": 0, "raw": "Câu 374: Điểm khác biệt cơ bản giữa cơ chế uốn tóc bằng thuốc Kiềm (Alkaline) và thuốc Acid là gì?\nA. Thuốc kiềm xử lý ở nhiệt độ phòng tạo lọn xoăn chặt; thuốc acid thường cần kích nhiệt và cho lọn sóng mềm mại hơn\nB. Thuốc acid làm đứt vĩnh viễn liên kết disulfide\nC. Thuốc kiềm có tính acid cao\nD. Thuốc acid luôn làm cháy da đầu\nĐáp án đúng: A\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 375, "q": "Vai trò sinh hóa học của Oxy già (H2O2) khi kết hợp với thuốc nhuộm tóc vĩnh viễn là gì?", "o": ["Làm mát da đầu khách", "Khuyếch tán mở biểu bì, oxy hóa làm sáng sắc tố melanin tự nhiên và kích hoạt các hạt màu nhân tạo nở to bám trong thân tóc", "Đóng chặt vảy tóc lại", "Tiêu diệt vi khuẩn trên da đầu"], "c": 1, "raw": "Câu 375: Vai trò sinh hóa học của Oxy già (H2O2) khi kết hợp với thuốc nhuộm tóc vĩnh viễn là gì?\nA. Làm mát da đầu khách\nB. Khuyếch tán mở biểu bì, oxy hóa làm sáng sắc tố melanin tự nhiên và kích hoạt các hạt màu nhân tạo nở to bám trong thân tóc\nC. Đóng chặt vảy tóc lại\nD. Tiêu diệt vi khuẩn trên da đầu\nĐáp án đúng: B\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 376, "q": "Tại sao thợ làm tóc tuyệt đối không bao giờ được bôi chồng thuốc tẩy (Overlap) lên phần tóc đã sáng màu trước đó?", "o": ["Tóc sẽ bị lên màu quá tối", "Sẽ gây ra hiện tượng đứt gãy tóc nghiêm trọng tại đường ranh giới tiếp xúc (Line of demarcation)", "Làm tóc mọc ngược vào da đầu", "Làm tốn thêm bột tẩy"], "c": 1, "raw": "Câu 376: Tại sao thợ làm tóc tuyệt đối không bao giờ được bôi chồng thuốc tẩy (Overlap) lên phần tóc đã sáng màu trước đó?\nA. Tóc sẽ bị lên màu quá tối\nB. Sẽ gây ra hiện tượng đứt gãy tóc nghiêm trọng tại đường ranh giới tiếp xúc (Line of demarcation)\nC. Làm tóc mọc ngược vào da đầu\nD. Làm tốn thêm bột tẩy\nĐáp án đúng: B\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 377, "q": "Kỹ thuật cắt tóc \"Blunt cut\" kiểm soát góc độ nâng tóc như thế nào để đạt độ rơi chuẩn xác nhất?", "o": ["Nâng tóc góc 90 độ", "Giữ tóc ở góc nâng 0 độ tự nhiên sát mặt phẳng da đầu/vai và cắt ngang bằng", "Kéo ngược tóc lên đỉnh đầu 180 độ", "Kéo tóc về phía trước mặt"], "c": 1, "raw": "Câu 377: Kỹ thuật cắt tóc \"Blunt cut\" kiểm soát góc độ nâng tóc như thế nào để đạt độ rơi chuẩn xác nhất?\nA. Nâng tóc góc 90 độ\nB. Giữ tóc ở góc nâng 0 độ tự nhiên sát mặt phẳng da đầu/vai và cắt ngang bằng\nC. Kéo ngược tóc lên đỉnh đầu 180 độ\nD. Kéo tóc về phía trước mặt\nĐáp án đúng: B\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 378, "q": "Sự khác nhau về hiệu ứng thị giác giữa góc cắt 45 độ (Graduation) và góc cắt 90 độ (Uniform Layer) là:", "o": ["Cắt 45 độ tạo sự tích lũy trọng lượng và tầng dốc thấp; cắt 90 độ loại bỏ trọng lượng tạo các lớp sole đều nhau", "Cắt 90 độ tạo kiểu tóc bằng ngang vai", "Cắt 45 độ làm tóc phồng cao nhất ở đỉnh đầu", "Cả hai góc cắt cho kết quả giống hệt nhau"], "c": 0, "raw": "Câu 378: Sự khác nhau về hiệu ứng thị giác giữa góc cắt 45 độ (Graduation) và góc cắt 90 độ (Uniform Layer) là:\nA. Cắt 45 độ tạo sự tích lũy trọng lượng và tầng dốc thấp; cắt 90 độ loại bỏ trọng lượng tạo các lớp sole đều nhau\nB. Cắt 90 độ tạo kiểu tóc bằng ngang vai\nC. Cắt 45 độ làm tóc phồng cao nhất ở đỉnh đầu\nD. Cả hai góc cắt cho kết quả giống hệt nhau\nĐáp án đúng: A\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 379, "q": "Bản chất sinh lý của bệnh vảy nến (Psoriasis) trên da là gì?", "o": ["Do nhiễm ký sinh trùng dưới da", "Do sự tăng sinh và phân bào quá mức của tế bào biểu bì diễn ra nhanh gấp nhiều lần bình thường tạo nên các mảng sừng tích tụ", "Do da bị thiếu nước trầm trọng", "Do tiếp xúc với ánh nắng mặt trời"], "c": 1, "raw": "Câu 379: Bản chất sinh lý của bệnh vảy nến (Psoriasis) trên da là gì?\nA. Do nhiễm ký sinh trùng dưới da\nB. Do sự tăng sinh và phân bào quá mức của tế bào biểu bì diễn ra nhanh gấp nhiều lần bình thường tạo nên các mảng sừng tích tụ\nC. Do da bị thiếu nước trầm trọng\nD. Do tiếp xúc với ánh nắng mặt trời\nĐáp án đúng: B\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 380, "q": "Tại sao thợ chăm sóc da không bao giờ được massage lên vùng da đang có mụn trứng cá mưng mủ?", "o": ["Vì làm khách hàng buồn ngủ", "Vì các thao tác massage cọ xát sẽ làm vỡ ổ mủ, phát tán vi khuẩn lây lan sang các vùng da lành và gây kích ứng viêm nặng hơn", "Vì kem massage làm mụn lặn mất", "Vì làm mụn chuyển thành nốt ruồi"], "c": 1, "raw": "Câu 380: Tại sao thợ chăm sóc da không bao giờ được massage lên vùng da đang có mụn trứng cá mưng mủ?\nA. Vì làm khách hàng buồn ngủ\nB. Vì các thao tác massage cọ xát sẽ làm vỡ ổ mủ, phát tán vi khuẩn lây lan sang các vùng da lành và gây kích ứng viêm nặng hơn\nC. Vì kem massage làm mụn lặn mất\nD. Vì làm mụn chuyển thành nốt ruồi\nĐáp án đúng: B\n\n", "cat": "skincare", "sec": "7. Chăm sóc da"}, {"n": 381, "q": "Tại sao bệnh nhân bị bệnh cao huyết áp nặng lại bị cấm thực hiện massage toàn diện?", "o": ["Massage làm tụt nhiệt độ cơ thể", "Các thao tác xoa bóp, kích thích cơ học làm tăng lưu lượng tuần hoàn máu đột ngột, có thể gây nguy cơ tai biến tăng huyết áp", "Massage làm da bị thâm tím", "Không gây bất kỳ nguy cơ nào"], "c": 1, "raw": "Câu 381: Tại sao bệnh nhân bị bệnh cao huyết áp nặng lại bị cấm thực hiện massage toàn diện?\nA. Massage làm tụt nhiệt độ cơ thể\nB. Các thao tác xoa bóp, kích thích cơ học làm tăng lưu lượng tuần hoàn máu đột ngột, có thể gây nguy cơ tai biến tăng huyết áp\nC. Massage làm da bị thâm tím\nD. Không gây bất kỳ nguy cơ nào\nĐáp án đúng: B\n\n", "cat": "skincare", "sec": "7. Chăm sóc da"}, {"n": 382, "q": "Khách hàng bị bệnh máu loãng (Hemophilia / Thinning blood) gặp nguy cơ rủi ro gì lớn nhất khi wax hoặc nhổ lông?", "o": ["Sợi lông mọc lại nhanh gấp đôi", "Lực giật có thể gây vỡ mao mạch dưới da, gây xuất huyết bầm tím diện rộng hoặc chảy máu chân lông không cầm được", "Làm lông đổi sang màu trắng", "Khiến da bị mất cảm giác"], "c": 1, "raw": "Câu 382: Khách hàng bị bệnh máu loãng (Hemophilia / Thinning blood) gặp nguy cơ rủi ro gì lớn nhất khi wax hoặc nhổ lông?\nA. Sợi lông mọc lại nhanh gấp đôi\nB. Lực giật có thể gây vỡ mao mạch dưới da, gây xuất huyết bầm tím diện rộng hoặc chảy máu chân lông không cầm được\nC. Làm lông đổi sang màu trắng\nD. Khiến da bị mất cảm giác\nĐáp án đúng: B\n\n", "cat": "waxing", "sec": "9. Triệt lông"}, {"n": 383, "q": "Cơ chế tác động của dầu dưỡng không xả (Leave-in conditioner) đối với mái tóc bông xù là gì?", "o": ["Phá vỡ liên kết disulfide trong tóc", "Cung cấp màng bao bọc dưỡng ẩm liên tục, khép vảy biểu bì, chống lại sự hút ẩm thất thường từ không khí gây xù tóc", "Làm sạch gàu bám trên da đầu", "Làm thay đổi màu nhuộm của tóc"], "c": 1, "raw": "Câu 383: Cơ chế tác động của dầu dưỡng không xả (Leave-in conditioner) đối với mái tóc bông xù là gì?\nA. Phá vỡ liên kết disulfide trong tóc\nB. Cung cấp màng bao bọc dưỡng ẩm liên tục, khép vảy biểu bì, chống lại sự hút ẩm thất thường từ không khí gây xù tóc\nC. Làm sạch gàu bám trên da đầu\nD. Làm thay đổi màu nhuộm của tóc\nĐáp án đúng: B\n\n", "cat": "styling", "sec": "3. Tạo kiểu tóc"}, {"n": 384, "q": "Việc thoa kem nền bảo vệ (Base cream) trước khi tra thuốc duỗi tóc kiềm cao có ý nghĩa gì?", "o": ["Giúp tóc duỗi thẳng nhanh hơn", "Tạo lớp màng dầu bảo vệ lớp biểu bì da đầu và vành tai không bị hóa chất kiềm mạnh ăn mòn gây bỏng rát", "Làm thơm tóc", "Thay thế cho bước xả tóc"], "c": 1, "raw": "Câu 384: Việc thoa kem nền bảo vệ (Base cream) trước khi tra thuốc duỗi tóc kiềm cao có ý nghĩa gì?\nA. Giúp tóc duỗi thẳng nhanh hơn\nB. Tạo lớp màng dầu bảo vệ lớp biểu bì da đầu và vành tai không bị hóa chất kiềm mạnh ăn mòn gây bỏng rát\nC. Làm thơm tóc\nD. Thay thế cho bước xả tóc\nĐáp án đúng: B\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 385, "q": "Các chất được sử dụng để trung hòa hoặc nâng cao độ pH của sản phẩm được biết là:", "o": ["Khí Amoniac", "Kiềm", "Oxy già", "Thuốc tẩy"], "c": 2, "raw": "Câu 385: Các chất được sử dụng để trung hòa hoặc nâng cao độ pH của sản phẩm được biết là:\nA. Khí Amoniac\nB. Kiềm\nC. Oxy già\nD. Thuốc tẩy\nĐáp án đúng: C\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 386, "q": "Phản ứng oxy hóa khử có nghĩa là chuyển đổi của sự oxy hóa hoặc:", "o": ["Nhiệt", "Nước", "Rượu", "Chất khử"], "c": 3, "raw": "Câu 386: Phản ứng oxy hóa khử có nghĩa là chuyển đổi của sự oxy hóa hoặc:\nA. Nhiệt\nB. Nước\nC. Rượu\nD. Chất khử\nĐáp án đúng: D\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 387, "q": "Sự đốt cháy là sự oxy hóa nhanh của chất đi cùng với:", "o": ["Lạnh và tối", "Nhiệt và ánh sáng", "Hơi khí", "Chất lỏng và khí"], "c": 3, "raw": "Câu 387: Sự đốt cháy là sự oxy hóa nhanh của chất đi cùng với:\nA. Lạnh và tối\nB. Nhiệt và ánh sáng\nC. Hơi khí\nD. Chất lỏng và khí\nĐáp án đúng: D\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 388, "q": "Màu sắc thứ nhì dùng để trung hòa màu đỏ:", "o": ["Xanh lơ", "Tím", "Xanh lục", "Vàng"], "c": 2, "raw": "Câu 388: Màu sắc thứ nhì dùng để trung hòa màu đỏ:\nA. Xanh lơ\nB. Tím\nC. Xanh lục\nD. Vàng\nĐáp án đúng: C\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 389, "q": "Để trung hòa tông màu ấm, khách hàng/thợ nghề cần phải sử dụng:", "o": ["Tông màu lạnh", "Tông vàng", "Tông tím", "Tông cam"], "c": 0, "raw": "Câu 389: Để trung hòa tông màu ấm, khách hàng/thợ nghề cần phải sử dụng:\nA. Tông màu lạnh\nB. Tông vàng\nC. Tông tím\nD. Tông cam\nĐáp án đúng: A\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 390, "q": "Trong quang phổ bước sóng dài nhất có thể nhìn thấy:", "o": ["Xanh lá", "Đỏ", "Vàng", "Xanh da trời"], "c": 1, "raw": "Câu 390: Trong quang phổ bước sóng dài nhất có thể nhìn thấy:\nA. Xanh lá\nB. Đỏ\nC. Vàng\nD. Xanh da trời\nĐáp án đúng: B\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 391, "q": "Trong hóa uốn tóc, thời gian xử lý được quyết định bởi kết cấu tóc, tính đàn hồi và:", "o": ["Độ sáng sắc màu", "Ánh sáng", "Độ thấm", "Mật độ"], "c": 2, "raw": "Câu 391: Trong hóa uốn tóc, thời gian xử lý được quyết định bởi kết cấu tóc, tính đàn hồi và:\nA. Độ sáng sắc màu\nB. Ánh sáng\nC. Độ thấm\nD. Mật độ\nĐáp án đúng: C\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 392, "q": "Khi nào nên ghi lại khi làm dịch vụ tóc:", "o": ["Mỗi tuần 1 lần", "2 tuần 1 lần", "Mỗi sáu tháng", "Tất cả thời gian khách hàng nhuộm hoặc xử lý lại"], "c": 3, "raw": "Câu 392: Khi nào nên ghi lại khi làm dịch vụ tóc:\nA. Mỗi tuần 1 lần\nB. 2 tuần 1 lần\nC. Mỗi sáu tháng\nD. Tất cả thời gian khách hàng nhuộm hoặc xử lý lại\nĐáp án đúng: D\n\n", "cat": "color", "sec": "5. Nhuộm tóc"}, {"n": 393, "q": "Dây thần kinh được kích thích bởi thao tác đụng, hoặc áp lực ở vùng gần các móng tay được biết là:", "o": ["Cột sống", "Cảm giác", "Trung ương", "Tự trị"], "c": 1, "raw": "Câu 393: Dây thần kinh được kích thích bởi thao tác đụng, hoặc áp lực ở vùng gần các móng tay được biết là:\nA. Cột sống\nB. Cảm giác\nC. Trung ương\nD. Tự trị\nĐáp án đúng: B\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 394, "q": "Nếu khách hàng, nhân viên ở thẩm mỹ viện có liên quan tới vết thương hở, máu, lây nhiễm thì họ phải thực hiện khử trùng với:", "o": ["Phenol", "Giải pháp diệt được trực khuẩn lao (Tuberculocidal)", "Rượu, cồn", "Formaline"], "c": 1, "raw": "Câu 394: Nếu khách hàng, nhân viên ở thẩm mỹ viện có liên quan tới vết thương hở, máu, lây nhiễm thì họ phải thự mắt)"], "c": 3, "raw": "Câu 405: Dùng thuốc nhuộm trên chân mày:\nA. Đẹp hơn\nB. Sáng hơn\nC. Mềm mại\nD. Bị mù (Nguy hiểm cho mắt)\nĐáp án đúng: D\n\n", "cat": "lash_brow", "sec": "8. Lông mi và lông mày"}, {"n": 406, "q": "Sau khi dùng thuốc duỗi thẳng tóc và trước khi bỏ thuốc dập, tóc phải được hoàn tất:", "o": ["Chải tóc", "Bỏ thuốc xả", "Xả nước", "Gội đầu"], "c": 2, "raw": "Câu 406: Sau khi dùng thuốc duỗi thẳng tóc và trước khi bỏ thuốc dập, tóc phải được hoàn tất:\nA. Chải tóc\nB. Bỏ thuốc xả\nC. Xả nước\nD. Gội đầu\nĐáp án đúng: C\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 407, "q": "Thời gian tối đa KTV sử dụng máy tần số cao (High frequency) trên da khách sẽ là:", "o": ["3 phút", "5 phút", "10 phút", "15 phút"], "c": 1, "raw": "Câu 407: Thời gian tối đa KTV sử dụng máy tần số cao (High frequency) trên da khách sẽ là:\nA. 3 phút\nB. 5 phút\nC. 10 phút\nD. 15 phút\nĐáp án đúng: B\n\n", "cat": "skincare", "sec": "7. Chăm sóc da"}, {"n": 408, "q": "Việc đầu tiên trong dịch vụ móng tay cơ bản:", "o": ["Làm định hình móng", "Làm mềm da tay", "Làm sạch dưới đầu móng", "Chùi nước sơn cũ"], "c": 3, "raw": "Câu 408: Việc đầu tiên trong dịch vụ móng tay cơ bản:\nA. Làm định hình móng\nB. Làm mềm da tay\nC. Làm sạch dưới đầu móng\nD. Chùi nước sơn cũ\nĐáp án đúng: D\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 409, "q": "Cục đá mài trong dịch vụ móng tay được biết là:", "o": ["1 lần sử dụng (dùng một lần rồi bỏ)", "Nhiều lần sử dụng", "Tùy theo luật salon"], "c": 0, "raw": "Câu 409: Cục đá mài trong dịch vụ móng tay được biết là:\nA. 1 lần sử dụng (dùng một lần rồi bỏ)\nB. Nhiều lần sử dụng\nC. Tùy theo luật salon\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 410, "q": "Cái gì xác định tính di động ít nhất trong một lọn cuộn tóc?", "o": ["Thân tóc / Chân đế (Base)", "Nửa thân tóc", "Không có", "Cuộn cực đại"], "c": 0, "raw": "Câu 410: Cái gì xác định tính di động ít nhất trong một lọn cuộn tóc?\nA. Thân tóc / Chân đế (Base)\nB. Nửa thân tóc\nC. Không có\nD. Cuộn cực đại\nĐáp án đúng: A\n\n", "cat": "styling", "sec": "3. Tạo kiểu tóc"}, {"n": 411, "q": "Thuật ngữ trượt (Slithering) được sử dụng để ám chỉ quá trình:", "o": ["Cuốn tóc", "Làm mỏng tóc (Thinning)", "Làm gợn sóng tóc bằng ngón tay", "Cắt đuôi tóc xoăn"], "c": 1, "raw": "Câu 411: Thuật ngữ trượt (Slithering) được sử dụng để ám chỉ quá trình:\nA. Cuốn tóc\nB. Làm mỏng tóc (Thinning)\nC. Làm gợn sóng tóc bằng ngón tay\nD. Cắt đuôi tóc xoăn\nĐáp án đúng: B\n\n", "cat": "haircut", "sec": "4. Cắt tóc"}, {"n": 412, "q": "Khuôn mặt hình trái xoan, chiều ngang sẽ đi qua đâu?", "o": ["Xương gò má", "Xương thái dương", "Xương hốc mắt"], "c": 0, "raw": "Câu 412: Khuôn mặt hình trái xoan, chiều ngang sẽ đi qua đâu?\nA. Xương gò má\nB. Xương thái dương\nC. Xương hốc mắt\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 413, "q": "Việc đầu tiên mà nhân viên thẩm mỹ nên quan tâm là:", "o": ["Sự bảo vệ cho khách hàng", "Thời gian", "Tiền thưởng từ khách hàng", "Tiền thù lao"], "c": 0, "raw": "Câu 413: Việc đầu tiên mà nhân viên thẩm mỹ nên quan tâm là:\nA. Sự bảo vệ cho khách hàng\nB. Thời gian\nC. Tiền thưởng từ khách hàng\nD. Tiền thù lao\nĐáp án đúng: A\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 414, "q": "Không làm dịch vụ nào cho khách hàng bị viêm khớp?", "o": ["Cắt da tay", "Massage nhẹ", "Massage mạnh / Bẻ khớp gắt", "Không nhận dịch vụ"], "c": 2, "raw": "Câu 414: Không làm dịch vụ nào cho khách hàng bị viêm khớp?\nA. Cắt da tay\nB. Massage nhẹ\nC. Massage mạnh / Bẻ khớp gắt\nD. Không nhận dịch vụ\nĐáp án đúng: C\n\n", "cat": "skincare", "sec": "7. Chăm sóc da"}, {"n": 415, "q": "Kiểm tra nhiệt độ bàn là ép nhiệt (dụng cụ nhiệt) sẽ được thực hiện như thế nào?", "o": ["Lụa", "Bàn tay", "Khăn giấy", "Làm trực tiếp"], "c": 2, "raw": "Câu 415: Kiểm tra nhiệt độ bàn là ép nhiệt (dụng cụ nhiệt) sẽ được thực hiện như thế nào?\nA. Lụa\nB. Bàn tay\nC. Khăn giấy\nD. Làm trực tiếp\nĐáp án đúng: C\n\n", "cat": "styling", "sec": "3. Tạo kiểu tóc"}, {"n": 416, "q": "Triệu chứng mà có thể cảm nhận như ngứa hoặc đau:", "o": ["Chủ quan (Subjective symptom)", "Khách quan (Objective symptom)", "Vết thương", "Vết nứt"], "c": 0, "raw": "Câu 416: Triệu chứng mà có thể cảm nhận như ngứa hoặc đau:\nA. Chủ quan (Subjective symptom)\nB. Khách quan (Objective symptom)\nC. Vết thương\nD. Vết nứt\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 417, "q": "Môn học về tóc và bệnh của tóc:", "o": ["Trichology (Mao học / Khoa học nghiên cứu về tóc)", "Biology (Sinh học)", "Dermatology (Da liễu học)", "Cosmetology (Thẩm mỹ học)"], "c": 0, "raw": "Câu 417: Môn học về tóc và bệnh của tóc:\nA. Trichology (Mao học / Khoa học nghiên cứu về tóc)\nB. Biology (Sinh học)\nC. Dermatology (Da liễu học)\nD. Cosmetology (Thẩm mỹ học)\nĐáp án đúng: A\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 418, "q": "Độ pH bằng 9 có tính kiềm (Alkaline) hơn pH 7 là bao nhiêu lần?", "o": ["10", "50", "100", "500"], "c": 2, "raw": "Câu 418: Độ pH bằng 9 có tính kiềm (Alkaline) hơn pH 7 là bao nhiêu lần?\nA. 10\nB. 50\nC. 100\nD. 500\nĐáp án đúng: C\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 419, "q": "Độ pH của xà bông có Acid xếp loại từ:", "o": ["1.3", "2.5", "3.7", "4.5 – 5.5"], "c": 3, "raw": "Câu 419: Độ pH của xà bông có Acid xếp loại từ:\nA. 1.3\nB. 2.5\nC. 3.7\nD. 4.5 – 5.5\nĐáp án đúng: D\n\n", "cat": "consult", "sec": "2. Tư vấn khách hàng & phân tích tóc, da, móng"}, {"n": 420, "q": "Tác dụng của hóa chất duỗi tóc là làm cho tóc:", "o": ["Cứng và săn chắc", "Thẳng và mềm", "Mềm và trương nở (Softens and swells)", "Mềm và thẳng"], "c": 2, "raw": "Câu 420: Tác dụng của hóa chất duỗi tóc là làm cho tóc:\nA. Cứng và săn chắc\nB. Thẳng và mềm\nC. Mềm và trương nở (Softens and swells)\nD. Mềm và thẳng\nĐáp án đúng: C\n\n", "cat": "chemical", "sec": "6. Dịch vụ tạo kiểu tóc bằng hóa chất"}, {"n": 421, "q": "Trước và sau khi phục vụ khách hàng thì cần rửa tay bằng nước ấm và xà phòng trong thời gian", "o": ["10 giây", "20 giây", "30 giây", "40 giây"], "c": 1, "raw": "Câu 421: Trước và sau khi phục vụ khách hàng thì cần rửa tay bằng nước ấm và xà phòng trong thời gian\nA. 10 giây\nB. 20 giây\nC. 30 giây\nD. 40 giây\nĐáp án đúng: B\n\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}, {"n": 422, "q": "Nhiệt độ ngâm chân sẽ không quá:", "o": ["100°F", "104°F (khoảng 40°C)", "140°F", "165°F"], "c": 1, "raw": "Câu 422: Nhiệt độ ngâm chân sẽ không quá:\nA. 100°F\nB. 104°F (khoảng 40°C)\nC. 140°F\nD. 165°F\nĐáp án đúng: B\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 423, "q": "Dung dịch Acetone được biết là chất hòa tan có tên gọi:", "o": ["Dung môi (Solvent)", "Thuốc tẩy rửa", "Dung hòa", "Thuốc giặt"], "c": 0, "raw": "Câu 423: Dung dịch Acetone được biết là chất hòa tan có tên gọi:\nA. Dung môi (Solvent)\nB. Thuốc tẩy rửa\nC. Dung hòa\nD. Thuốc giặt\nĐáp án đúng: A\n\n", "cat": "nails", "sec": "10. Chăm sóc móng"}, {"n": 424, "q": "Khi vi khuẩn ở thời kỳ nghỉ ngơi (không hoạt động) sẽ được biết là:", "o": ["Bào tử (Spores)", "Vi khuẩn", "Gián phân", "Nhị phân"], "c": 0, "raw": "Câu 424: Khi vi khuẩn ở thời kỳ nghỉ ngơi (không hoạt động) sẽ được biết là:\nA. Bào tử (Spores)\nB. Vi khuẩn\nC. Gián phân\nD. Nhị phân\nĐáp án đúng: A\n", "cat": "safety", "sec": "1. An toàn và kiểm soát lây nhiễm"}], "outline": {"safety": ["A. Quy trình kiểm soát nhiễm khuẩn nơi làm việc", "1. Bệnh truyền nhiễm, tác nhân gây bệnh và phòng ngừa lây nhiễm", "• Contagious / Communicable disease: Bệnh truyền nhiễm lây từ người sang người.", "• Local infection: Nhiễm trùng khu trú.", "• Parasite: Ký sinh trùng; ví dụ điển hình là chấy rận (head lice).", "• Immunity: Miễn dịch gồm 2 loại: tự nhiên và nhân tạo.", "• HIV: Human Immunodeficiency Virus.", "• HBV: Hepatitis B Virus.", "• TB: Tuberculosis.", "• Chấy rận hoặc nấm da/nấm móng: từ chối dịch vụ; khi cần khuyên khách đi khám bác sĩ.", "• Ống thông gió/máy hút mùi giúp giảm lượng khí độc và bụi hít phải trong salon.", "2. Các phương pháp và quy trình làm sạch và khử trùng", "• Cleaning / Sanitizing: Làm sạch bằng xà phòng và nước ấm; là bước đầu tiên để chất khử trùng hoạt động hiệu quả.", "• Disinfection: Khử trùng bề mặt không thấm/không sống; loại bỏ hầu hết vi sinh vật nhưng không diệt bào tử; không dùng trực tiếp trên da.", "• Sterilization: Tiệt trùng bằng Autoclave, dùng nhiệt + nước/hơi/áp suất; diệt tất cả vi sinh vật kể cả bào tử.", "• Decontamination: Khử nhiễm - loại bỏ chất bẩn/mầm bệnh như máu, dịch trên bề mặt/dụng cụ.", "• Antiseptic: Chất sát trùng dùng trên da, làm chậm sự phát triển vi khuẩn; không thay thế khử trùng dụng cụ.", "• Aseptic: Kỹ thuật vô trùng/duy trì môi trường không có mầm bệnh.", "a. Dụng cụ bị nhiễm bẩn", "• Dụng cụ dơ để trong thùng riêng có nắp và dán nhãn “Soiled”.", "• Kềm cắt da/kềm cắt móng và dụng cụ dùng lại phải được làm sạch/khử trùng sau mỗi khách.", "• Dụng cụ dính máu phải xử lý theo quy trình phơi nhiễm; vật dụng dính máu bỏ vào 2 túi nylon và dán nhãn.", "b. Máy móc và thiết bị", "• Không ngâm đồ điện trong dung dịch khử trùng.", "• Thiết bị phải được sử dụng và bảo trì theo hướng dẫn của nhà sản xuất.", "c. Khu vực làm việc hằng ngày", "• Bề mặt làm việc cần được làm sạch/khử trùng theo quy trình salon; Household bleach có thể được xem là chất khử trùng.", "3. Các cấp độ khử trùng: làm sạch → khử khuẩn → tiệt trùng", "• Thứ tự 3 bước: Làm sạch → Khử trùng → Tiệt trùng.", "• Chất khử trùng salon có thể diệt vi khuẩn, virus và nấm nhưng không diệt bào tử.", "• Tiệt trùng là mức cao nhất; Autoclave diệt được tất cả vi sinh vật kể cả bào tử.", "4. Xử lý sự cố phơi nhiễm", "• Khi thợ hoặc khách chảy máu: Ngừng dịch vụ → rửa tay bằng xà phòng và nước ấm → đeo găng tay → sát khuẩn/khử nhiễm đúng cách → bỏ vật dụng dính máu vào 2 túi nylon, dán nhãn → khử trùng khu vực/dụng cụ → viết báo cáo sự cố.", "• OSHA: Cơ quan quản lý sức khỏe và an toàn cho người lao động.", "• CDC: Centers for Disease Control and Prevention; chịu trách nhiệm về các biện pháp phòng ngừa tiêu chuẩn.", "• PPE: Personal Protective Equipment - đồ bảo hộ cá nhân.", "5. Các sản phẩm dùng để làm sạch và khử trùng", "• QUATS: Quaternary Ammonium Compound - chất khử trùng phổ biến trong salon; thay dung dịch mỗi ngày hoặc khi bẩn/vẩn đục; dụng cụ phải được làm sạch trước khi ngâm. Nếu dính da, rửa bằng xà phòng và nước ấm.", "• Household bleach: Thuốc tẩy gia dụng; được xem là một loại chất khử trùng.", "• Chất khử trùng dùng trong salon phải được EPA phê duyệt; thời gian ngâm theo đúng hướng dẫn của nhà sản xuất.", "6. Ghi nhãn và bảo quản dụng cụ, thiết bị đã được làm sạch và khử trùng", "• Dụng cụ sạch sau khử trùng/tiệt trùng phải bảo quản trong hộp/thùng sạch có nắp đậy.", "• Thùng khử trùng phải đủ lớn để ngâm chìm hoàn toàn dụng cụ.", "7. Vật dụng dùng một lần và dùng nhiều lần", "• Disposable / Single-use: Vật liệu xốp/dùng một lần; dùng xong phải hủy, không tái sử dụng/khử trùng.", "• Không ngâm vật liệu có lỗ/thấm hút như vải, bông trong dung dịch khử trùng.", "• Dụng cụ dùng nhiều lần phải được làm sạch và khử trùng sau mỗi khách.", "B. Tuân thủ các biện pháp phòng ngừa an toàn tại nơi làm việc", "1. Các quy trình để duy trì điều kiện làm việc an toàn", "• Thực hiện đúng hướng dẫn của nhà sản xuất; duy trì khu vực làm việc sạch, có thông gió và phân loại dụng cụ sạch/dơ rõ ràng.", "3. Sử dụng thiết bị an toàn và các quy trình bảo trì", "• Không ngâm đồ điện; thiết bị nhiệt phải được kiểm soát nhiệt và tránh tiếp xúc gây bỏng da đầu/da khách.", "4. Ghi nhãn và bảo quản vật liệu và hóa chất", "• Dụng cụ dơ dán nhãn “Soiled”; hóa chất và vật liệu dùng theo hướng dẫn của nhà sản xuất.", "• Không dùng vật liệu kim loại để pha/đựng hóa chất khử trùng hoặc hóa chất uốn/duỗi.", "5. Bảng dữ liệu an toàn (SDS) và các vật liệu/chất bị cấm", "• SDS / MSDS: Bảng dữ liệu an toàn sản phẩm/hóa chất; cho biết thành phần, mối nguy hiểm, xử lý, bảo quản và sơ cứu khi tiếp xúc. Không có ngày hết hạn và thông tin bao bì. Lấy từ nhà sản xuất/nhà phân phối và phải luôn có tại nơi làm việc.", "• MMA (Methyl Methacrylate): Chất bị cấm sử dụng; Liquid MMA bị FDA cấm trong sản phẩm làm móng bột.", "• EMA: Ethyl Methacrylate.", "6. Các quy định an toàn liên bang", "• OSHA: Quản lý sức khỏe và an toàn người lao động.", "• EPA: Quản lý hóa chất, bảo vệ môi trường và phê duyệt chất khử trùng; thuộc Chính phủ liên bang.", "• FDA: Cơ quan quản lý thực phẩm và dược phẩm.", "7. Xác định các phản ứng bất lợi đối với hóa chất", "• Thử phản ứng dị ứng (Patch/PD test), chống chỉ định và dừng/thay đổi dịch vụ khi có nguy cơ.", "8. Rào chắn bảo vệ và tấm che cho khách hàng", "• Khi nhuộm tóc, dùng choàng nylon không thấm nước và 2 khăn.", "• Khi dùng đèn soi da, che mắt khách bằng 2 miếng cotton/miếng vải; khoảng 2 × 2 inch.", "9. Thông gió đúng cách", "• Ống thông gió/máy hút mùi trong salon giúp giảm khí độc và bụi hít phải; khu vực làm móng cần kiểm soát bụi mịn.", "C. Thuật ngữ sản phẩm & hướng dẫn", "• Manufacturer: nhà sản xuất.", "• Manufacturer direction: hướng dẫn/chỉ dẫn của nhà sản xuất.", "• OTC: sản phẩm bán không cần toa thuốc."], "consult": ["A. Tư vấn khách hàng", "1. Tiếp nhận thông tin khách hàng và mẫu đơn đồng ý để xác định chống chỉ định", "• Intake Form / Consultation Card: Mẫu nhập thông tin và tiền sử khách hàng, điền trước khi làm dịch vụ.", "• Release Form: Mẫu khách hàng ký trước dịch vụ để ghi nhận rủi ro/giải trừ trách nhiệm.", "• Trước bất kỳ dịch vụ nào: tham vấn/tư vấn khách để hiểu nhu cầu và phát hiện chống chỉ định có thể xảy ra.", "• Hồ sơ khách hàng phải được lập chính xác và lưu kèm các mẫu đơn đã ký trước dịch vụ.", "2. Từ chối hoặc thay đổi dịch vụ dựa trên chống chỉ định", "• Chấy rận, nấm da/nấm móng hoặc vảy nến nặng: không thực hiện dịch vụ; khuyên khách đi khám khi cần.", "• Khách dùng Accutane: không wax; nếu cần tẩy lông chỉ dùng nhíp.", "• Khách dùng thuốc loãng máu: tránh các dịch vụ có nguy cơ cắt da/chảy máu.", "3. Khuyến nghị khách hàng tìm kiếm tư vấn y tế", "• Khách có mụn trứng cá: nên khuyên gặp bác sĩ tư vấn điều trị trước khi làm dịch vụ.", "• Khách nghi ngờ nấm hoặc có tình trạng da/móng bất thường: dừng hoặc từ chối dịch vụ và khuyên đi khám khi cần.", "• Đạo đức nghề nghiệp: không tiết lộ thông tin khách hàng với đồng nghiệp; nếu sắp chuyển salon, thông báo cho khách trước một khoảng thời gian thích hợp.", "B. Tóc, da và móng", "1. Cấu trúc tóc, da và móng", "Tóc", "• Cuticle: Lớp biểu bì ngoài cùng; nước thấm vào trước tiên; cần mở để hóa chất thấm vào tóc.", "• Cortex: Lớp vỏ/trung bì; quyết định độ đàn hồi, độ chắc; phần lớn phản ứng uốn/duỗi/nhuộm xảy ra ở đây.", "• Medulla: Lớp tủy trong cùng.", "• Keratin / Protein: Thành phần cấu trúc cốt lõi của tóc; khoảng 95% sợi tóc.", "• COHNS: Carbon, Oxygen, Hydrogen, Nitrogen, Sulfur.", "• Disulfide bond (S-S): Liên kết lưu huỳnh kép; bị phá vỡ/tái tạo khi uốn, duỗi.", "• Hydrogen bond: Liên kết bị phá vỡ khi tạo kiểu tóc còn ẩm; tính chất tạm thời.", "• PH tóc khỏe mạnh: khoảng 4.5-5.5, hơi acid. Tóc ướt khỏe có thể kéo giãn thêm khoảng 50%.", "• Thời kỳ mọc tóc: khoảng 3-5 năm.", "Da", "• Biểu bì (Epidermis) gồm 5 lớp từ ngoài vào trong: Corneum → Lucidum → Granulosum → Spinosum → Germinativum/Basale.", "• Sebum: Dầu tự nhiên của da.", "• Sebaceous gland: Tuyến dầu nằm ở Dermis.", "• Sweat gland: Tuyến mồ hôi nằm ở Dermis.", "• Melanin: là yếu tố tạo sắc tố cho da/tóc.", "• PH da khỏe mạnh khoảng 4.5-5.5; da khô do tuyến dầu hoạt động yếu, da dầu thường có lỗ chân lông to.", "• Lòng bàn tay và lòng bàn chân không có lông; da là bộ phận lớn nhất trên cơ thể người.", "Móng", "• Keratin: Thành phần chính cấu tạo móng.", "• Hyponychium: Da dưới đầu móng, hàng rào bảo vệ ngăn vi khuẩn xâm nhập.", "• Eponychium: Lớp da bảo vệ liềm móng.", "• Nail fold: Nếp da bao quanh hai bên móng.", "2. Phân tích tóc, da và móng", "Phân tích tóc", "• Porosity: Độ thẩm thấu/độ xốp - khả năng tóc hút ẩm.", "• Tóc porous / xốp cao: Thấm hút nhanh; brittle, khô, dễ gãy, cuticle nhô lên.", "• Tóc xốp thấp: Ít thấm hóa chất và khó hấp thu sản phẩm hơn.", "• Elasticity: Độ đàn hồi; được kiểm tra trước các dịch vụ hóa chất.", "• Canities: Tóc bạc.", "• Tóc nhuộm thường xốp và thấm nhanh; tóc xốp lên màu nhanh.", "• Tóc khô, giòn: sản phẩm pH quá cao hoặc dùng quá nhiều chất tẩy.", "Phân tích da", "• Da khô: tuyến bã nhờn hoạt động yếu. Da dầu: tuyến dầu hoạt động mạnh, lỗ chân lông to.", "• Da sậm màu thường có xu hướng nhiều dầu hơn; da sáng màu dễ biểu hiện dấu hiệu lão hóa sớm hơn.", "• Hypertrichosis: Chứng rậm lông.", "Phân tích móng", "• Trước dịch vụ móng phải kiểm tra móng và da xung quanh; nếu nghi ngờ bệnh hoặc nấm thì không tiếp tục dịch vụ.", "3. Lựa chọn dịch vụ phù hợp dựa trên tình trạng tóc, da và móng", "• Tóc xốp/đã qua hóa chất: cần cân nhắc độ thẩm thấu và độ đàn hồi trước dịch vụ hóa chất.", "• Da khô phù hợp các sản phẩm giữ ẩm; Clay mask dùng cho da dầu và không dùng cho da khô/rất khô.", "• Móng yếu/giòn cần thao tác nhẹ; Eggshell nail dùng dũa mịn.", "C. Phản ứng phụ, bệnh lý và chống chỉ định", "1. Quy trình xét nghiệm phản ứng dị ứng (PD / Patch Test)", "• PD / Patch Test có hai cách hỏi trong bộ đề: thử dị ứng sau tai hoặc nếp gấp khuỷu tay trước 24-48 giờ; hoặc dùng để kiểm tra độ mạnh của thuốc và thời gian xử lý.", "2. Các tình trạng và rối loạn tóc và da đầu", "• Alopecia Areata: Rụng tóc từng vùng/mảng.", "• Tóc xoăn tự nhiên có xu hướng mọc không cùng chiều.", "• Tóc mai: không có hắc tố và không có lõi.", "3. Các bệnh và rối loạn về da", "• Asteatosis: Da khô do giảm tiết bã nhờn; có thể khô ráp, nứt nẻ.", "• Psoriasis: Vảy nến; da khô, bong tróc, mảng đỏ có vảy bạc.", "• Callus / Keratoma: Da chai do ma sát nhiều lần.", "• Boil: Mụn nhọt do nang lông bị nhiễm khuẩn.", "• Pustule: Mụn có mủ/chất lỏng bên trong.", "• Cyst: U nang - cục u bất thường chứa nước/dịch bên trong.", "• Da bị trầy xước có thể để lại sẹo; có thể có bọng nước tùy mức độ.", "• Bài tiết mồ hôi không đủ: giảm tiết mồ hôi. Chất thơm (fragrance): là thành phần gây nhiều nhạy cảm trên da.", "4. Các bệnh và rối loạn về móng", "• Nail pterygium: Da/màng thịt mọc lấn lên bề mặt móng.", "• Beau’s line: Rãnh/sọc ngang trên móng.", "• Bruised nail: Móng bầm, tụ máu dưới nền móng.", "• Eggshell nail: Móng mỏng, trắng, mềm, dễ gãy; dùng dũa mịn.", "• Brittle nail: Móng giòn, dễ gãy; có thể liên quan đến chất tẩy hoặc di truyền; chăm sóc bằng hot oil.", "• Hang nail / Agnail: Xước măng rô quanh móng.", "6. Chống chỉ định đối với dịch vụ làm móng tay và móng chân", "• Khách dùng thuốc loãng máu: tránh dịch vụ có nguy cơ cắt da/chảy máu.", "• Nấm móng hoặc dấu hiệu bệnh truyền nhiễm: từ chối dịch vụ.", "• Khách tiểu đường khi làm móng: không cắt da/cuticle; được đẩy nhẹ cuticle.", "7. Chống chỉ định đối với các dịch vụ nối móng", "• Nấm móng/tổn thương hoặc dấu hiệu nhiễm trùng: không thực hiện dịch vụ.", "D. Dầu gội, dầu xả & nước", "• Dầu gội: thành phần chính là nước và Surfactant (chất hoạt động bề mặt).", "• Dầu gội tốt / Acid Balanced: pH 4.5-5.5; giúp tóc sau hóa chất bớt khô và hỗ trợ đóng lớp biểu bì.", "• Clarifying shampoo: chứa chất chelating, giúp loại kim loại và tạp chất bám trên tóc; có thể dùng định kỳ/hàng tuần theo nhu cầu.", "• Moisturizing shampoo: hỗ trợ giữ ẩm, tăng độ mềm và đàn hồi của tóc.", "• Medicated shampoo: dầu gội trị gàu.", "• Neutralizing shampoo: dùng sau dịch vụ duỗi để đưa pH tóc và da đầu về gần mức bình thường.", "• Conditioner: giúp giữ ẩm và làm mềm tóc.", "• Detangling rinse: thuốc xả giúp tóc trơn mượt và giảm rối.", "• Humectant: chất hút/giữ ẩm, giúp duy trì nước cho tóc và da.", "• Soft water: ít khoáng chất, tạo nhiều bọt; tốt hơn cho tóc.", "• Hard water: nhiều khoáng chất/tạp chất, ít bọt; không tốt cho tóc. Nước phèn thuộc nhóm nước cứng.", "• Tóc khỏe: mềm và linh hoạt."], "styling": ["A. Các quy trình tạo kiểu tóc", "1. Quy trình tạo kiểu tóc xoăn", "a. Gắn tóc nối, bảo dưỡng và tháo gỡ tóc nối", "• Fusion / Bonding: Nối tóc dùng nhiệt và dụng cụ chuyên biệt.", "• Bonding method: Gắn tóc rời bằng chất kết dính/keo.", "• Hair weave: Nối tóc trong đó phần gốc các sợi được đan xen.", "b. Tóc xoăn chặt", "• Khi cắt/kiểm soát tóc quăn, dùng lực/tension tối thiểu hoặc vừa phải.", "c. Tết tóc", "• Rope braid: Kiểu bện dây thừng - 2 sợi xoắn vào nhau.", "2. Quy trình nối tóc, thay thế tóc và làm đẹp tóc", "• Synthetic hair: Không chịu nhiệt độ cao.", "• Tóc giả bằng tóc thật: khi dùng nhiệt nên dùng mức thấp.", "• Bandana: dùng để bọc/giữ tóc giả.", "• Kiểm tra tóc giả: dùng wind test để đánh giá độ tự nhiên.", "• Cắt tóc giả: mục tiêu là làm tóc trông tự nhiên/thực tế hơn.", "• Mũi khâu quấn quanh kim 2 lần: khâu khóa đôi.", "• Tóc giả Ấn Độ thường có dạng gợn sóng.", "3. Quy trình sấy tóc", "• Chải/gỡ tóc rối bằng lược răng thưa; bắt đầu từ ngọn tóc, vùng sau/gáy.", "• Khi sấy: dùng lược nhựa cứng; Flat brush dùng để làm phẳng tóc.", "• Máy sấy phải di chuyển để tránh làm da đầu/tóc quá nóng hoặc bỏng.", "• Diffuser: Khuếch tán luồng khí khi sấy, giúp sấy nhanh và kiểm soát vùng tóc.", "4. Quy trình uốn nhiệt", "• Marcel iron: Kẹp uốn kim loại truyền thống dùng để tạo Marcel wave; phải kiểm soát nhiệt để tránh làm bỏng tóc và da đầu.", "• Electric curling iron: Máy uốn điện, tự làm nóng và có nút chỉnh nhiệt.", "B. Dụng cụ tạo kiểu tóc", "1. Phòng ngừa khi sử dụng dụng cụ tạo kiểu bằng nhiệt", "• Lược kim loại truyền và giữ nhiệt; không nên dùng gần da đầu khi sấy/ép nóng.", "• Dụng cụ nhiệt phải tránh làm bỏng da đầu; máy sấy cần di chuyển liên tục.", "• Tóc giả tổng hợp không chịu nhiệt cao; tóc giả từ tóc thật dùng nhiệt thấp.", "C. Sản phẩm & bảo vệ khi tạo kiểu", "• Thermal protector: dùng để bảo vệ tóc trước khi sử dụng dụng cụ nhiệt.", "• Tóc bông xù/khó kiểm soát có thể dùng dầu dưỡng hoặc leave-in conditioner để làm mềm và kiểm soát xù.", "• Khi sấy tóc phải hướng luồng khí ra khỏi da đầu và di chuyển máy sấy để tránh quá nóng.", "• Không dùng lược kim loại sát da đầu khi tạo kiểu nhiệt vì kim loại truyền và giữ nhiệt.", "• Chải/gỡ tóc rối bằng lược răng thưa, bắt đầu từ ngọn rồi tiến dần lên."], "haircut": ["A. Các quy trình cắt tóc", "1. Các bước cắt tóc cho các loại tóc khác nhau", "Góc cắt và hình dáng", "• Blunt cut / One-length / 0°: Kiểu Bob/cắt ngang, không tạo tầng; cắt dưới ngón tay, giữ trọng lượng tóc. palm-to-palm và cổ tay thẳng.", "• 45° / Graduated: Tạo tầng thấp, có độ dốc; kiểu ngắn ở gáy, dài dần lên.", "• 90° / Uniform layer: Tạo tầng đồng lớp, độ phồng cao, các phần tóc cắt đồng đều.", "• 180° / Long layer: Tầng cao/cắt lộn ngược; tạo nhiều độ phồng ở đỉnh và vẫn giữ độ dài phần đuôi.", "• Taper: Kiểu vuốt thon có độ dốc, phù hợp nhiều dáng đầu.", "• Stationary guideline: Đường chuẩn không di động.", "• Traveling guideline: Đường chuẩn di động; dùng để tạo layer/đồng lớp.", "• Guideline: Tép tóc có chiều dài làm chuẩn để cắt các phần khác.", "• Đường cắt chu vi bên ngoài thể hiện trọng lượng (weight) của tóc.", "• Muốn tăng cảm giác độ dày: Blunt cut. Muốn giảm độ dày: dùng Thinning shears.", "• Over-direction: Kỹ thuật chuyển hướng tóc để điều chỉnh trọng lượng và hình dáng tóc.", "Texture và hoàn thiện", "• Thinning shears: Làm mỏng/lấy bớt độ dày, thêm chuyển động và độ mềm mại.", "• Texturizing shears: Lấy bớt độ dày, tạo cảm giác mềm mại.", "• Free-hand slicing / sliding: Kỹ thuật trượt tạo sự mềm mại cho đuôi tóc.", "• Razor: Dùng khi tóc ướt; tạo đuôi tóc mềm mại, tự nhiên.", "• Shears: cắt bằng kéo thực hiện trên tóc khô.", "• Clipper: Tạo đường viền sắc nét; kiểu ngắn gáy, dài dần lên.", "• Trimmer: Tạo đường nét sắc ở tai/gáy, lấy tóc thừa quanh viền.", "• Cross-check: Kiểm tra độ cân bằng sau khi cắt.", "• Beveled: chỉ cắt ở phần đuôi tóc.", "• Point cutting / thinning: Dùng để làm mềm đuôi tóc.", "• Trước khi cắt: chia tóc thành 4-5 phần để dễ kiểm soát.", "• Tóc khô cứng: không cắt quá ngắn ở đỉnh đầu. Tóc quăn: dùng lực/tension tối thiểu hoặc vừa phải.", "B. An toàn dụng cụ và thiết bị", "1. Sử dụng an toàn kéo, dao cạo, tông đơ và máy tỉa", "• Palm the shears: cầm kéo và lược trong cùng một tay/lòng bàn tay.", "• Ngón cái vào lỗ kéo di động và di chuyển nhiều nhất; ngón áp út vào lỗ cố định.", "• Đút ngón cái quá sâu: làm độ mở kéo ít đi.", "• Cầm kéo dựng đứng: giúp tóc không bị mất kiểm soát.", "• Dao cạo dùng trên tóc ướt. Tông đơ/trimmer dùng tạo đường viền và vùng tai/gáy.", "C. Kỹ thuật bổ sung", "• Free-hand sliding / slicing: kỹ thuật trượt kéo để làm mềm và tạo chuyển động cho đuôi tóc.", "• Trim / edge: giảm khối lượng và làm mềm/blend đường cắt.", "• Hairline phía trước có thể chia tách theo hình tam giác khi cần kiểm soát phần tóc trước.", "• Nếu hai lưỡi kéo đặt bằng nhau không đúng kỹ thuật, đường cắt có thể không đều.", "• Cross-check: kiểm tra lại tóc sau cắt theo hướng khác để đánh giá độ cân bằng."], "color": ["A. Áp dụng", "1. Hướng dẫn sử dụng hóa chất nhuộm tóc cho mọi loại tóc", "• Temporary: Phủ ngoài Cuticle, không cần Developer, tồn tại khoảng 1 lần gội.", "• Semi-permanent: Không cần Developer; thấm nhẹ vào tóc, phai dần sau khoảng 4-6 lần gội và không phủ tóc bạc hoàn toàn.", "• Demi-permanent: Dùng Developer nồng độ thấp (10 volume), giữ lâu hơn Semi khoảng 4-6 tuần; deposit màu, không lift; phủ tóc bạc tốt hơn Semi.", "• Permanent color: Dùng Developer (Hydrogen Peroxide) với Ammonia hoặc chất thay thế; vừa nâng sáng vừa đưa màu vào tóc và có thể phủ tóc bạc hoàn toàn.", "• Developer / H₂O₂: Chất xúc tác/phát triển màu; cũng dùng trong làm sáng tóc.", "• Tint back: Nhuộm trở lại gần màu nguyên thủy.", "• Toner: Dùng sau khi tẩy để làm đều/trung hòa màu.", "• Filler: Cân bằng độ thẩm thấu của tóc để hỗ trợ màu đều.", "2. Mục đích và quy trình của việc kiểm tra sợi tóc", "• Strand test: thử một lọn tóc để kiểm tra màu/thời gian xử lý trước khi xả toàn bộ.", "3. Chuẩn bị tóc và da đầu", "• Virgin color: bắt đầu ở giữa thân tóc/phần khó thấm, cách da đầu khoảng 1/2 inch; sau đó mới xử lý chân/ngọn theo quy trình.", "• Virgin bleach: cách da đầu khoảng 1/2 inch.", "• Retouch: chỉ bôi phần tóc mới mọc; không chồng lên phần đã nhuộm/tẩy để tránh hư tổn/gãy tóc.", "B. Sử dụng hóa chất và sản phẩm an toàn", "1. Pha hóa chất tóc và các biện pháp an toàn", "• Thuốc nhuộm có thể được chứa và bôi bằng chai nhựa phù hợp.", "• Bảo hộ khi nhuộm: choàng nylon không thấm nước và dùng 2 khăn.", "2. Quy trình áp dụng và sử dụng thuốc nhuộm an toàn", "• Tóc đã qua xử lý hóa chất/tóc xốp thấm nhanh; cần đánh giá porosity và tình trạng tóc trước khi dùng hóa chất.", "• Metallic dye: có thể cho màu đục/ánh kim; không nên xử lý uốn/duỗi trên tóc này.", "3. Quy trình sử dụng an toàn các sản phẩm tẩy sáng tóc", "• Tẩy/làm sáng sử dụng Developer (Hydrogen Peroxide). Retouch không chồng lên phần tóc đã tẩy để tránh gãy.", "• Double process: tẩy/làm sáng + toner/trung hòa.", "• Foiling: bọc tóc trong giấy bạc. Balayage: tẩy/làm sáng tự do, không cần giấy bạc.", "4. Lý thuyết màu sắc, công thức pha chế và sản phẩm", "• Primary colors: Đỏ, Vàng, Xanh dương.", "• Secondary colors: Cam, Xanh lá, Tím - pha từ 2 màu cơ bản.", "• Tertiary colors: pha 1 màu cơ bản với 1 màu thứ cấp liền kề, ví dụ đỏ-cam, vàng-cam, vàng-lục, xanh dương-lá, xanh dương-tím, đỏ-tím.", "• Complementary colors: hai màu đối diện nhau trên bánh xe màu; dùng trung hòa tông màu không mong muốn.", "• Eumelanin: sắc tố nâu/đen. Pheomelanin: sắc tố đỏ/vàng.", "C. Màu bổ sung", "• Ba màu cơ bản: Đỏ - Vàng - Xanh dương.", "• Ba màu thứ cấp: Cam - Xanh lá - Tím.", "• Màu bổ sung (Complementary) là các màu đối diện nhau trên bánh xe màu: Đỏ ↔ Xanh lá, Vàng ↔ Tím, Xanh dương ↔ Cam.", "• Màu bổ sung dùng để trung hòa tông màu không mong muốn."], "chemical": ["A. Tóc nguyên thủy", "1. Sản phẩm an toàn để sử dụng và loại bỏ cho tóc tự nhiên", "• Alkaline / Cold Wave: Ammonium Thioglycolate (Thio), pH khoảng 9.0-9.6.", "• Acid Perm: GMTG (Glyceryl Monothioglycolate), pH khoảng 4.5-7.", "• Sodium / Lye Relaxer: Sodium Hydroxide (NaOH), kiềm mạnh.", "• No-lye / Ammonium relaxer: Ammonium Thioglycolate (ATG).", "• No-base relaxer: Loại thuốc duỗi không cần bôi kem bảo vệ da đầu.", "• Lithium / Potassium relaxer: Thuốc duỗi không chứa Sodium.", "• Neutralizer: Dừng tác dụng thuốc uốn/duỗi mềm, tái tạo liên kết Disulfide và làm cứng lọn tóc sau uốn.", "• Preliminary test curl: thử phản ứng thuốc uốn và thời gian xử lý.", "• Trước khi uốn/duỗi: kiểm tra Porosity & Elasticity.", "• Kích thước ống cuốn quyết định độ xoăn; 2½ vòng cuốn được ghi là đủ.", "• Bookends wrap/giấy đôi phải phủ qua đuôi tóc để tránh Fishhook.", "• Sau khi xả thuốc uốn bằng nước ấm, Blot dry từng ống trước Neutralizer; nước đọng làm loãng Neutralizer.", "B. Tóc đã qua xử lý hóa chất", "1. Sản phẩm an toàn để sử dụng và loại bỏ cho tóc đã qua xử lý hóa chất", "• Retouch: chỉ làm phần tóc mới mọc, không chồng thuốc lên phần tóc đã xử lý.", "• Khi bôi thuốc duỗi: bắt đầu ở phần khó thấm nhất, thường là giữa thân tóc.", "• Tóc xốp, xù: khi uốn/duỗi phải giữ hóa chất cách da đầu một khoảng an toàn.", "• Tóc có Metallic dye: cần nhận biết và khử kim loại bằng Clarifying shampoo trước; không thực hiện uốn/duỗi/tẩy nếu tóc vẫn còn kim loại.", "C. An toàn hóa chất, sản phẩm và kết quả", "1. Đánh giá kết quả quá trình xử lý hóa chất trên tóc", "• Preliminary test curl dùng để đánh giá phản ứng thuốc uốn và thời gian xử lý; Porosity & Elasticity được kiểm tra trước dịch vụ.", "2. Sử dụng an toàn các sản phẩm tạo kiểu tóc bằng hóa chất", "• Sodium Hydroxide: không gội trước khi duỗi; bổ sung nêu mục đích là tránh làm trầy xước/kích ứng da đầu.", "• Ammonium Thioglycolate relaxer: có thể gội nhẹ trước khi duỗi.", "• Lược dùng khi duỗi: lược nhựa cứng; tránh lược kim loại vì giữ nhiệt.", "3. Lưu ý khi uốn tóc bằng hóa chất", "• Mảnh thun khi uốn giúp giảm nguy cơ gãy tóc.", "• Xả tóc: bắt đầu bằng nước ấm để hỗ trợ xả thuốc/trung hòa, sau đó chuyển sang nước mát khi đã xả sạch.", "D. Kỹ thuật & dịch vụ liên quan", "• Chemical straightening: dùng hóa chất để chuyển tóc xoăn thành thẳng.", "• Reformation service: duỗi nhẹ rồi uốn lại với lọn lớn hơn để tái tạo dạng lọn.", "• Piggyback wrap: kỹ thuật dùng khi tóc dài và khó kiểm soát trên một ống cuốn đơn.", "• LYE = Sodium; Sodium Hydroxide = NaOH / LYE.", "• Sau khi xả thuốc uốn, phải blot dry/lau thấm ráo từng ống cuốn trước khi bôi Neutralizer để tránh làm loãng thuốc trung hòa."], "skincare": ["A. Mát xa", "1. Các động tác mát xa mặt an toàn", "• Effleurage: Vuốt nhẹ, thư giãn.", "• Tapotement: Vỗ/tát/gõ, có tác dụng kích thích.", "• Friction: Chà/xoa bóp, ấn với chuyển động nhịp nhàng.", "• Pétrissage: Nhào/bóp.", "• Vibration: Rung bằng cơ thể, vai và đầu ngón tay để tạo hiệu ứng nhanh.", "• Hướng massage tổng quát: Insertion → Origin.", "• Không massage vùng có mụn trứng cá, da trầy xước; tránh massage với khách cao huyết áp và vùng dưới đầu gối.", "• Người có vấn đề viêm khớp/xương/gân: không bấm huyệt/ấn mạnh, massage nhẹ nhàng.", "2. Các động tác mát xa an toàn khi làm móng tay và móng chân", "• Khách cao huyết áp: không massage. Khách có bệnh/tình trạng chống chỉ định cần điều chỉnh hoặc ngừng dịch vụ.", "B. Chuẩn bị, sản phẩm và dịch vụ", "1. Chuẩn bị cho khách hàng các dịch vụ chăm sóc da", "• Khi dùng đèn soi da/magnifying lamp: che mắt khách bằng 2 miếng cotton/miếng vải khoảng 2 × 2 inch.", "• Khách có mụn trứng cá: nên khuyên gặp bác sĩ tư vấn trước dịch vụ.", "2. Sử dụng các sản phẩm chăm sóc da khác nhau", "• Steamer: Làm mềm bã nhờn, giúp da thông thoáng, hỗ trợ sản phẩm thẩm thấu, tuần hoàn máu; cung cấp thêm oxy cho da. Đặt cách mặt khoảng 14-18 inch.", "• Clay mask: Dùng cho da dầu, lấy tạp chất dưới nang lông/se lỗ chân lông; không dùng cho da khô/rất khô.", "• Paraffin mask: Giữ ẩm cho da khô, giúp sản phẩm thẩm thấu sâu; không dùng cho khách cao huyết áp hoặc tiểu đường.", "• Honey mask: Giúp tăng cảm giác mềm và đàn hồi cho da.", "• Astringent: Kem/nước se da; cân bằng pH và se khít lỗ chân lông.", "• Da dễ kích ứng: không dùng thuốc sát trùng; dùng toner.", "C. An toàn chăm sóc da", "1. Quy trình an toàn để làm sạch da mặt", "• Steamer đặt cách mặt khoảng 14-18 inch; bảo vệ mắt khi dùng đèn/máy soi.", "2. Tẩy tế bào chết bằng hóa chất và cơ học", "• Sau peel, da có thể sáng hơn và thay đổi kết cấu bề mặt.", "3. Ứng dụng an toàn dụng cụ, máy móc và thiết bị chăm sóc da", "• Máy xông hơi và đèn soi da phải dùng đúng khoảng cách và bảo vệ mắt khách.", "5. Sản phẩm an toàn khi sử dụng và ứng dụng cho mọi loại da", "• Da khô: ưu tiên giữ ẩm; Clay mask không dùng cho da khô/rất khô; Paraffin không dùng cho cao huyết áp/tiểu đường.", "• Kem chống nắng: SPF tối thiểu 15, thoa 15 phút trước khi ra ngoài.", "6. Cách loại bỏ vết chai an toàn", "• Callus / Keratoma: Da chai do ma sát nhiều lần; có thể dùng Foot file để làm mỏng vùng chai.", "D. Thành phần & dạng sản phẩm", "• O/W (Oil in Water): dầu trong nước.", "• W/O (Water in Oil): nước trong dầu.", "• Mask nói chung có tác dụng se da.", "• Fragrance là thành phần dễ gây nhạy cảm ở một số loại da."], "lash_brow": ["A. An toàn cho lông mi và lông mày", "1. Quy trình gắn và tháo mi giả an toàn", "• Trước khi gắn mi giả: đo và cắt theo khung mắt.", "• Dụng cụ gắn mi giả: nhíp nhỏ.", "• Mascara wand: Dùng một lần rồi bỏ.", "Kiến thức vùng mắt và chân mày", "• Điểm cao nhất của lông mày: đo theo góc ngoài của mống mắt (iris).", "• Với mắt rộng, điều chỉnh dáng lông mày để cân bằng khoảng cách mắt.", "• Bông đánh mắt/mút makeup: dùng một lần. Chì kẻ mắt/môi: chuốt/làm sạch trước và sau khi dùng.", "• Eyeshadow tạo chiều sâu/làm sáng mắt; Concealer che bọng mắt/quầng thâm."], "waxing": ["A. An toàn và phương pháp triệt lông", "1. Triệt lông tạm thời bằng kem tẩy, sáp và đường", "• Depilatory: Phương pháp rụng lông tạm thời bằng hóa chất (chứa muối thioglycolate kiềm) làm tan rã liên kết keratin của sợi lông tại bề mặt da.", "• Waxing: Tẩy lông tận gốc nang lông (Epilation); thời gian mọc lại kéo dài từ 4 đến 6 tuần.", "• Sáp mềm (Soft / Strip wax): Dùng cho các vùng diện tích rộng (chân, tay, lưng); cần miết vải/giấy wax chuyên dụng lên sáp để giật.", "• Sáp cứng (Hard / Stripless wax): Bôi lớp sáp dày trực tiếp lên da, tự nguội đông đặc lại và giật dứt khoát không cần vải; rất êm dịu cho vùng nhạy cảm (mặt, mép, lông mày, nách, bikini).", "• Quy tắc thao tác sáp: Bôi sáp CÙNG CHIỀU lông mọc; giật sáp dứt khoát NGƯỢC CHIỀU lông mọc.", "• Kỹ thuật căng da: Một tay kéo căng bề mặt da (Taut skin), tay kia giật dải sáp dứt khoát song song sát mặt da để giảm đau và chống bầm tím rách da.", "• Kiểm tra nhiệt độ sáp: Bắt buộc thử độ nóng sáp lên mặt trong cổ tay hoặc cẳng tay của người thợ trước khi thoa lên khách.", "• Chăm sóc sau khi wax: Thoa dầu tẩy sáp cặn, bôi lotion/gel làm dịu (Aloe vera, Witch hazel, Soothing lotion) để giảm đỏ rát và se khít nang lông.", "• Thử dị ứng sáp (Patch test): Thử phản ứng sáp trên một vùng da nhỏ của khách trước 7 đến 10 phút.", "• Sugaring: Triệt lông bằng hỗn hợp đường tự nhiên dẻo; hoàn toàn tan trong nước ấm, dễ làm sạch và ít gây kích ứng da hơn sáp.", "2. Triệt lông an toàn bằng nhíp và chỉ", "• Tweezing (Nhổ lông bằng nhíp): Phương pháp nhổ tỉa các sợi lông thừa, định hình dáng lông mày; kéo căng da và kẹp nhổ dứt khoát theo chiều lông mọc.", "• Threading (Dùng chỉ xoắn): Kỹ thuật dùng sợi chỉ cotton 100% cuộn xoắn lại để cuộn và nhổ các sợi lông từ gốc; rất nhẹ nhàng cho da nhạy cảm vùng mặt.", "3. Triệt lông vĩnh viễn và giảm vĩnh viễn", "• Electrolysis (Điện phân): Phương pháp triệt lông vĩnh viễn duy nhất được FDA công nhận; dùng kim điện cực siêu nhỏ phá hủy tế bào mầm nang lông.", "• 3 kỹ thuật điện phân: Galvanic (điện giải phân hủy hóa học), Thermolysis (nhiệt cao tần làm đông tụ), và Blend (kết hợp cả hai).", "• Laser & IPL (Intense Pulsed Light): Triệt lông giảm vĩnh viễn bằng xung ánh sáng nhắm chọn lọc vào sắc tố Melanin trong nang lông.", "B. Kiểm soát nhiễm khuẩn và vệ sinh trong triệt lông", "• Nguyên tắc Không nhúng lại (No Double Dipping): Tuyệt đối KHÔNG nhúng lại que lấy sáp đã chạm vào da khách vào nồi sáp; mỗi lần lấy sáp bắt buộc dùng một que gỗ mới (Single-use spatula).", "• Bảo hộ cá nhân: Người thợ bắt buộc phải mang găng tay dùng một lần (Disposable gloves) trong suốt quá trình phục vụ triệt lông.", "• Khử trùng dụng cụ: Nhíp kim loại phải rửa sạch bằng xà phòng + nước, ngâm ngập hoàn toàn trong dung dịch khử trùng EPA hoặc hấp Autoclave giữa mỗi khách hàng.", "• Quy trình phơi nhiễm máu: Khi bị trầy da rướm máu do nhổ lông/wax, lập tức ngừng thao tác, sát khuẩn da (Antiseptic), băng kín, bỏ rác vào túi Biohazard 2 lớp.", "C. Chống chỉ định đối với dịch vụ triệt lông", "• Thuốc Accutane (Isotretinoin): Khách uống Accutane trong vòng 6 tháng TUYỆT ĐỐI KHÔNG ĐƯỢC WAX (nguy cơ lột rách cả mảng biểu bì da); chỉ dùng nhíp tỉa nhẹ.", "• Thuốc thoa làm mỏng da: Đang dùng Retin-A, Renova, Differin, AHA/BHA nồng độ cao: không wax trên vùng da đang điều trị.", "• Tổn thương bề mặt da: Tuyệt đối KHÔNG wax lên: nốt ruồi có lông, mụn cóc, vết thương hở, da cháy nắng hoặc đang viêm đỏ.", "• Bệnh nhân tiểu đường / Dùng thuốc loãng máu: Tránh dịch vụ wax có nguy cơ rách da, chảy máu khó đông hoặc lâu lành vết thương.", "• Lông mọc ngược (Ingrown hairs): Nếu vùng da có lông mọc ngược bị viêm mưng mủ (Folliculitis), nên từ chối dịch vụ và khuyên khách đi khám bác sĩ.", "• Khách cạo lông chân: Lông quá ngắn dưới 1/4 inch sáp không bám được; vết xước cạo lông làm tăng nguy cơ nhiễm trùng."], "nails": ["A. Giải phẫu và cấu trúc sinh lý của móng", "1. Các thành phần giải phẫu chính của móng tự nhiên", "• Onyx (Móng tự nhiên): Là phần phụ của da, cấu tạo chủ yếu từ chất sừng cứng Keratin; độ ẩm của móng khỏe mạnh từ 15% đến 25%.", "• Matrix (Mầm móng / Gốc móng): Nơi sản sinh các tế bào sừng để tạo ra phiến móng; chứa mạch máu và dây thần kinh; tổn thương vĩnh viễn matrix sẽ làm móng ngừng mọc hoặc biến dạng vĩnh viễn.", "• Lunula (Liềm móng): Vùng màu trắng hình bán nguyệt nhìn thấy được ở gốc móng, là phần nhìn thấy được lộ ra của mầm móng Matrix.", "• Nail Plate (Phiến móng / Thân móng): Lớp sừng cứng trong suốt gồm khoảng 100 lớp tế bào chết xếp chồng lên nhau, bảo vệ ngón tay ngón chân.", "• Nail Bed (Nền móng / Đệm móng): Lớp da sống nâng đỡ phiến móng; chứa nhiều mạch máu (tạo sắc hồng cho móng) và dây thần kinh cảm giác.", "• Bed Epithelium (Biểu mô nền móng): Lớp mô mỏng gắn kết phiến móng với nền móng, dẫn hướng cho móng trượt thẳng về phía trước.", "• Cuticle (Biểu bì móng chết): Lớp màng tế bào sừng chết không màu bám dính từ underside của eponychium lên phiến móng; có chức năng niêm phong chống vi khuẩn; chỉ đẩy nhẹ hoặc tỉa phần xơ chết.", "• Eponychium (Da viền sống ở gốc móng): Phần mô da sống che phủ liềm móng; TUYỆT ĐỐI KHÔNG ĐƯỢC CẮT BỎ EPONYCHIUM vì sẽ gây chảy máu, đau đớn và nhiễm trùng.", "• Hyponychium (Lớp da sống dưới đầu móng): Nằm dưới bờ tự do của móng, bảo vệ ngăn vi khuẩn xâm nhập vào nền móng; cắt phạm vào sẽ gây đau buốt dữ dội và chảy máu.", "• Free Edge (Bờ tự do / Đầu móng): Phần phiến móng nhô dài ra ngoài đầu ngón tay hoặc ngón chân.", "• Nail Folds / Sidewalls (Nếp móng / Tường móng): Nếp da bao bọc bảo vệ và dẫn hướng hai bên cạnh móng.", "2. Sự tăng trưởng và phát triển của móng", "• Tốc độ mọc trung bình: 1/10 đến 1/8 inch (khoảng 2.5 - 3.7 mm) mỗi tháng; ngón giữa mọc nhanh nhất, ngón cái mọc chậm nhất; mọc nhanh nhất vào mùa hè.", "• Thời gian thay mới phiến móng: Móng tay mất 4 đến 6 tháng để mọc lại hoàn toàn từ gốc ra ngọn; móng chân mất 9 đến 12 (thậm chí 18) tháng.", "B. Bệnh lý và các rối loạn về móng", "1. Rối loạn móng được phép phục vụ nhẹ nhàng", "• Beau's lines: Các rãnh ngang trên mặt móng, do cơ thể từng trải qua cơn bạo bệnh nặng hoặc chấn thương làm ngừng trệ tạm thời sự sinh trưởng của matrix.", "• Bruised nails (Móng bầm tím): Xuất huyết tụ máu dưới nền móng do va đập chấn thương.", "• Eggshell nails (Móng vỏ trứng): Móng mỏng, trắng ngà
